    { id: 'Q-DID-ADM-0054', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-09', subtema: 'Ruído', dificuldade: 2, prioridade: 'media', enunciado: 'Sobre o ruído no processo de comunicação, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É apenas o som alto do ambiente.' }, { id: 'B', texto: 'É qualquer interferência que distorça ou dificulte a compreensão da mensagem, podendo ser físico, psicológico, semântico ou cultural.' }, { id: 'C', texto: 'Só ocorre na comunicação escrita.' }, { id: 'D', texto: 'Melhora a comunicação.' }], gabarito: 'B', explicacao: { correta: 'RUÍDO é qualquer interferência que distorça a mensagem: física (som alto), psicológica (emoções), semântica (ambiguidade), cultural (diferenças).', incorretas: { A: 'Ruído não é só som.', C: 'Pode ocorrer em qualquer canal.', D: 'Ruído prejudica a comunicação.' }, conceitoCobrado: 'Ruído na comunicação.', pegadinha: 'Achar que ruído é só som.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['comunicação', 'ruído'] },
    { id: 'Q-DID-ADM-0055', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-10', subtema: 'PDCA x PODC', dificuldade: 2, prioridade: 'alta', enunciado: 'O ciclo PDCA (Plan, Do, Check, Act) está associado a:', alternativas: [{ id: 'A', texto: 'Henri Fayol, no ciclo administrativo clássico.' }, { id: 'B', texto: 'W. Edwards Deming, na melhoria contínua da qualidade.' }, { id: 'C', texto: 'Max Weber, na burocracia.' }, { id: 'D', texto: 'Frederick Taylor, na administração científica.' }], gabarito: 'B', explicacao: { correta: 'PDCA é atribuído a W. EDWARDS DEMING, voltado à melhoria contínua da qualidade.', incorretas: { A: 'Fayol formulou o PODC (Planejamento, Organização, Direção e Controle).', C: 'Weber é teórico da burocracia.', D: 'Taylor é da administração científica.' }, conceitoCobrado: 'PDCA x PODC.', pegadinha: 'Confundir PDCA com PODC.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['qualidade', 'PDCA'] },
    { id: 'Q-DID-ADM-0056', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-10', subtema: 'Ferramentas da qualidade', dificuldade: 2, prioridade: 'alta', enunciado: 'A ferramenta da qualidade que prioriza problemas com base no princípio de que 80% dos efeitos são causados por 20% das causas é:', alternativas: [{ id: 'A', texto: 'Diagrama de Ishikawa.' }, { id: 'B', texto: 'Diagrama de Pareto.' }, { id: 'C', texto: 'Histograma.' }, { id: 'D', texto: 'Gráfico de controle.' }], gabarito: 'B', explicacao: { correta: 'PARETO: prioriza problemas com base no princípio 80/20. Ajuda a focar esforços onde o impacto é maior.', incorretas: { A: 'Ishikawa identifica CAUSAS (causa e efeito).', C: 'Histograma mostra distribuição de frequências.', D: 'Gráfico de controle monitora variações ao longo do tempo.' }, conceitoCobrado: 'Ferramentas da qualidade.', pegadinha: 'Confundir Pareto com Ishikawa.', comoApareceEmConcurso: 'Alta frequência em ADM.' }, tags: ['qualidade', 'Pareto'] },
    { id: 'Q-DID-ADM-0057', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-10', subtema: 'Ferramentas da qualidade', dificuldade: 2, prioridade: 'alta', enunciado: 'Para identificar as possíveis causas de um problema, categorizando-as em máquina, método, mão de obra, material, medida e meio ambiente, usa-se:', alternativas: [{ id: 'A', texto: 'Diagrama de Pareto.' }, { id: 'B', texto: 'Diagrama de Ishikawa (causa e efeito).' }, { id: 'C', texto: 'Fluxograma.' }, { id: 'D', texto: 'Folha de verificação.' }], gabarito: 'B', explicacao: { correta: 'ISHIKAWA (causa e efeito / espinha de peixe): identifica causas de um problema nas categorias 6M (máquina, método, mão de obra, material, medida e meio ambiente).', incorretas: { A: 'Pareto prioriza; não identifica causas.', C: 'Fluxograma mapeia processos.', D: 'Folha de verificação coleta dados.' }, conceitoCobrado: 'Ferramentas da qualidade.', pegadinha: 'Confundir Ishikawa com Pareto.', comoApareceEmConcurso: 'Alta frequência em ADM.' }, tags: ['qualidade', 'Ishikawa'] },
    { id: 'Q-DID-ADM-0058', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-10', subtema: 'Foco no cliente', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a gestão da qualidade aplicada ao setor público, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Não se aplica, pois qualidade é conceito exclusivo do setor privado.' }, { id: 'B', texto: 'O cliente é o CIDADÃO, e a qualidade envolve eficiência, cortesia e resultado útil, com foco no interesse público.' }, { id: 'C', texto: 'O objetivo é o lucro.' }, { id: 'D', texto: 'Visa reduzir custos a qualquer preço.' }], gabarito: 'B', explicacao: { correta: 'No setor público, o cliente é o CIDADÃO. A qualidade envolve eficiência, cortesia, continuidade e resultado útil. O objetivo é o interesse público, não o lucro.', incorretas: { A: 'Aplica-se ao setor público.', C: 'O objetivo é o interesse público.', D: 'Não é só reduzir custos.' }, conceitoCobrado: 'Qualidade no setor público.', pegadinha: 'Achar que qualidade é só do privado.', comoApareceEmConcurso: 'Cobrado em ADM e AP.' }, tags: ['qualidade', 'cidadão'] },
    { id: 'Q-DID-ADM-0059', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-10', subtema: 'PDCA', dificuldade: 2, prioridade: 'alta', enunciado: 'São etapas do ciclo PDCA, na ordem correta:', alternativas: [{ id: 'A', texto: 'Plan, Do, Check, Act.' }, { id: 'B', texto: 'Planejar, Organizar, Dirigir, Controlar.' }, { id: 'C', texto: 'Prever, Decidir, Controlar, Avaliar.' }, { id: 'D', texto: 'Planejar, Desenvolver, Avaliar, Corrigir.' }], gabarito: 'A', explicacao: { correta: 'PDCA: PLAN (planejar), DO (executar), CHECK (verificar), ACT (agir).', incorretas: { B: 'É o PODC (Fayol).', C: 'Não é o PDCA.', D: 'Não é o PDCA.' }, conceitoCobrado: 'PDCA.', pegadinha: 'Confundir PDCA com PODC.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['qualidade', 'PDCA'] },
    { id: 'Q-DID-ADM-0060', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-10', subtema: 'Gestão por processos', dificuldade: 3, prioridade: 'media', enunciado: 'Sobre a Gestão da Qualidade Total (TQM), é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Foca apenas na inspeção final do produto.' }, { id: 'B', texto: 'Envolve toda a organização, com foco no cliente, melhoria contínua e participação de todos os setores.' }, { id: 'C', texto: 'É sinônimo de controle estatístico.' }, { id: 'D', texto: 'É aplicável somente à indústria.' }], gabarito: 'B', explicacao: { correta: 'TQM (Total Quality Management): foco no cliente, melhoria contínua e envolvimento de TODOS os setores da organização.', incorretas: { A: 'Inspeção final é a fase mais antiga da qualidade.', C: 'Controle estatístico é apenas uma etapa.', D: 'Aplica-se a todos os setores, inclusive público.' }, conceitoCobrado: 'Evolução da qualidade.', pegadinha: 'Reduzir TQM a uma técnica específica.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['qualidade', 'TQM'] },
    { id: 'Q-DID-ADM-0061', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-11', subtema: 'Gestão de estoques', dificuldade: 2, prioridade: 'alta', enunciado: 'O estoque mínimo mantido para cobrir eventuais atrasos de fornecedores ou aumentos inesperados de demanda é chamado de:', alternativas: [{ id: 'A', texto: 'Estoque máximo.' }, { id: 'B', texto: 'Estoque de segurança.' }, { id: 'C', texto: 'Ponto de pedido.' }, { id: 'D', texto: 'Estoque em trânsito.' }], gabarito: 'B', explicacao: { correta: 'ESTOQUE DE SEGURANÇA: quantidade ADICIONAL mantida para cobrir variações imprevistas (atrasos, picos de demanda).', incorretas: { A: 'Máximo é o limite superior.', C: 'Ponto de pedido é o nível que dispara nova compra.', D: 'Em trânsito é a mercadoria entre fornecedor e recebedor.' }, conceitoCobrado: 'Tipos de estoque.', pegadinha: 'Confundir estoque de segurança com ponto de pedido.', comoApareceEmConcurso: 'Cobrado em ADM e provas administrativas.' }, tags: ['materiais', 'estoques'] },
    { id: 'Q-DID-ADM-0062', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-11', subtema: 'Material de consumo x bem permanente', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre material de consumo e bem permanente, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Papel e caneta são bens permanentes, registrados no patrimônio.' }, { id: 'B', texto: 'Material de consumo é despesa de custeio; bem permanente tem vida útil superior a 2 anos e é registrado como investimento no patrimônio.' }, { id: 'C', texto: 'Não há diferença entre eles.' }, { id: 'D', texto: 'Computadores são materiais de consumo.' }], gabarito: 'B', explicacao: { correta: 'MATERIAL DE CONSUMO: despesa de CUSTEIO (uso imediato, ex.: papel, caneta). BEM PERMANENTE: vida útil superior a 2 anos, registrado como INVESTIMENTO no patrimônio (ex.: computador, cadeira).', incorretas: { A: 'Papel e caneta são de consumo.', C: 'Há diferença clara.', D: 'Computador é bem permanente.' }, conceitoCobrado: 'Classificação de materiais e bens.', pegadinha: 'Confundir custeio com investimento.', comoApareceEmConcurso: 'Cobrado em ADM e contabilidade pública.' }, tags: ['materiais', 'patrimônio'] },
    { id: 'Q-DID-ADM-0063', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-11', subtema: 'Ciclo de materiais', dificuldade: 2, prioridade: 'alta', enunciado: 'São etapas típicas do ciclo de administração de materiais:', alternativas: [{ id: 'A', texto: 'Identificação da necessidade, compra, recebimento, armazenagem, distribuição, controle e inventário.' }, { id: 'B', texto: 'Compra e venda apenas.' }, { id: 'C', texto: 'Apenas armazenagem.' }, { id: 'D', texto: 'Cadastro, transferência e baixa.' }], gabarito: 'A', explicacao: { correta: 'Ciclo completo: identificação da necessidade → compra → recebimento (conferência) → armazenagem → distribuição → controle → inventário.', incorretas: { B: 'É mais amplo que compra e venda.', C: 'Apenas armazenagem é uma das etapas.', D: 'Cadastro, transferência e baixa são etapas do controle patrimonial.' }, conceitoCobrado: 'Ciclo de materiais.', pegadinha: 'Reduzir o ciclo a uma só etapa.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['materiais'] },
    { id: 'Q-DID-ADM-0064', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-11', subtema: 'Inventário', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre o inventário de bens patrimoniais no setor público, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É vedado pela legislação.' }, { id: 'B', texto: 'Consiste no levantamento físico dos bens, comparando registros contábeis com a existência real, permitindo ajustes e baixas.' }, { id: 'C', texto: 'Aplica-se apenas a bens imóveis.' }, { id: 'D', texto: 'Dispensa a participação de comissão específica.' }], gabarito: 'B', explicacao: { correta: 'INVENTÁRIO: levantamento físico dos bens, comparando registros contábeis com a realidade, permitindo ajustes e baixa de itens inservíveis.', incorretas: { A: 'É obrigatório e previsto em lei.', C: 'Aplica-se a móveis e imóveis.', D: 'Costuma ser feito por comissão específica.' }, conceitoCobrado: 'Inventário patrimonial.', pegadinha: 'Achar que é apenas contagem.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['patrimônio', 'inventário'] },
    { id: 'Q-DID-ADM-0065', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-11', subtema: 'Gestão de estoques', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre o estoque máximo, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É o menor nível de estoque permitido.' }, { id: 'B', texto: 'É o limite superior que não deve ser ultrapassado, para evitar capital parado e desperdício.' }, { id: 'C', texto: 'É sinônimo de estoque de segurança.' }, { id: 'D', texto: 'É o mesmo que ponto de pedido.' }], gabarito: 'B', explicacao: { correta: 'ESTOQUE MÁXIMO: limite superior que não deve ser ultrapassado, evitando capital parado, obsolescência e custos desnecessários.', incorretas: { A: 'Mínimo é o limite inferior.', C: 'De segurança é reserva para imprevistos.', D: 'Ponto de pedido dispara compra.' }, conceitoCobrado: 'Tipos de estoque.', pegadinha: 'Confundir máximo com mínimo.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['materiais', 'estoques'] },
    { id: 'Q-DID-ADM-0066', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-11', subtema: 'Almoxarifado', dificuldade: 2, prioridade: 'media', enunciado: 'Sobre o almoxarifado no setor público, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É o local de guarda e controle de materiais de consumo.' }, { id: 'B', texto: 'É o local onde se guardam bens permanentes em uso.' }, { id: 'C', texto: 'É sinônimo de tesouraria.' }, { id: 'D', texto: 'Não existe no setor público.' }], gabarito: 'A', explicacao: { correta: 'ALMOXARIFADO: local de guarda e controle de MATERIAIS DE CONSUMO (papel, caneta, material de limpeza). Os bens permanentes ficam no patrimônio.', incorretas: { B: 'Bens permanentes em uso são controlados pelo patrimônio.', C: 'Tesouraria cuida de recursos financeiros.', D: 'Existe em toda organização pública.' }, conceitoCobrado: 'Almoxarifado x patrimônio.', pegadinha: 'Confundir almoxarifado com patrimônio.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['materiais', 'almoxarifado'] },
    { id: 'Q-DID-ADM-0067', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-12', subtema: 'Processo x projeto', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a diferença entre processo e projeto, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Processo é temporário e único; projeto é contínuo e repetitivo.' }, { id: 'B', texto: 'Processo é contínuo, repetitivo e padronizado; projeto é temporário, único, com início e fim definidos.' }, { id: 'C', texto: 'São sinônimos.' }, { id: 'D', texto: 'Projeto é executado diariamente, sem prazo.' }], gabarito: 'B', explicacao: { correta: 'PROCESSO: contínuo, repetitivo, padronizado (ex.: atendimento diário). PROJETO: temporário, único, com início e fim definidos (ex.: implantação de sistema).', incorretas: { A: 'Inverte.', C: 'São conceitos distintos.', D: 'Projeto tem prazo.' }, conceitoCobrado: 'Processo x projeto.', pegadinha: 'Inverter os conceitos.', comoApareceEmConcurso: 'Cobrado em ADM e projetos.' }, tags: ['processos', 'projeto'] },
    { id: 'Q-DID-ADM-0068', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-12', subtema: 'Gestão por processos', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a gestão por processos, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Vê a organização como departamentos isolados, cada um cuidando de suas atividades.' }, { id: 'B', texto: 'Vê a organização como um conjunto de fluxos que atravessam departamentos, com foco no resultado final entregue ao cliente.' }, { id: 'C', texto: 'Só se aplica ao setor privado.' }, { id: 'D', texto: 'Substitui a necessidade de indicadores.' }], gabarito: 'B', explicacao: { correta: 'Gestão POR PROCESSOS: foco no FLUXO que atravessa departamentos, buscando o resultado final entregue ao cliente.', incorretas: { A: 'Essa é a visão da gestão FUNCIONAL.', C: 'Aplica-se ao setor público também.', D: 'Indicadores são essenciais.' }, conceitoCobrado: 'Gestão por processos x funcional.', pegadinha: 'Confundir com gestão funcional.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['processos'] },
    { id: 'Q-DID-ADM-0069', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-12', subtema: 'Elementos do processo', dificuldade: 2, prioridade: 'alta', enunciado: 'Em um processo administrativo, o recurso, informação ou solicitação que inicia o fluxo para ser transformado em produto ou serviço é chamado de:', alternativas: [{ id: 'A', texto: 'Saída.' }, { id: 'B', texto: 'Indicador.' }, { id: 'C', texto: 'Entrada (input).' }, { id: 'D', texto: 'Cliente.' }], gabarito: 'C', explicacao: { correta: 'ENTRADA (input): recurso, informação ou solicitação que inicia o processo.', incorretas: { A: 'Saída (output) é o produto final.', B: 'Indicador mede desempenho.', D: 'Cliente é quem recebe a saída.' }, conceitoCobrado: 'Elementos do processo.', pegadinha: 'Confundir entrada com saída.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['processos', 'entrada'] },
    { id: 'Q-DID-ADM-0070', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-12', subtema: 'Ferramentas de mapeamento', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a notação BPMN, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É sinônimo de fluxograma simples.' }, { id: 'B', texto: 'É uma notação padronizada e detalhada para modelagem de processos, com elementos como eventos, tarefas, gateways e raias.' }, { id: 'C', texto: 'Só é usada no setor privado.' }, { id: 'D', texto: 'Substitui a necessidade de indicadores.' }], gabarito: 'B', explicacao: { correta: 'BPMN (Business Process Model and Notation): notação PADRONIZADA e detalhada para modelagem de processos, com eventos, tarefas, gateways (decisões), subprocessos e raias (swimlanes).', incorretas: { A: 'É mais detalhada que o fluxograma simples.', C: 'Usada no setor público também.', D: 'Não substitui indicadores.' }, conceitoCobrado: 'Ferramentas de mapeamento de processos.', pegadinha: 'Achar que BPMN é o mesmo que fluxograma.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['processos', 'BPMN'] },
    { id: 'Q-DID-ADM-0071', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-12', subtema: 'Tipos de processo', dificuldade: 3, prioridade: 'media', enunciado: 'São tipos de processo na gestão por processos:', alternativas: [{ id: 'A', texto: 'Apenas primários.' }, { id: 'B', texto: 'Primários (essenciais), de apoio (suportam os primários) e gerenciais (planejamento e controle).' }, { id: 'C', texto: 'Somente gerenciais.' }, { id: 'D', texto: 'Apenas de apoio.' }], gabarito: 'B', explicacao: { correta: 'Tipos: PRIMÁRIOS (essenciais, geram valor direto — ex.: atendimento), DE APOIO (suportam — ex.: compras, RH) e GERENCIAIS (planejamento e controle).', incorretas: { A: 'Reduz a um tipo.', C: 'Reduz a um tipo.', D: 'Reduz a um tipo.' }, conceitoCobrado: 'Tipos de processo.', pegadinha: 'Achar que só existe um tipo.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['processos'] },
    { id: 'Q-DID-ADM-0072', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-12', subtema: 'Indicadores de processo', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre os indicadores de processo, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Não são necessários para a gestão por processos.' }, { id: 'B', texto: 'Medem o desempenho do processo (tempo, custo, qualidade, satisfação), servindo para avaliar e melhorar continuamente.' }, { id: 'C', texto: 'São exclusivamente financeiros.' }, { id: 'D', texto: 'Só existem no setor privado.' }], gabarito: 'B', explicacao: { correta: 'Indicadores de processo: medem TEMPO, CUSTO, QUALIDADE e SATISFAÇÃO. Servem para avaliar e melhorar continuamente o processo.', incorretas: { A: 'São essenciais.', C: 'Não são só financeiros.', D: 'Existem em qualquer organização.' }, conceitoCobrado: 'Indicadores de processo.', pegadinha: 'Achar que só medem custo.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['processos', 'indicadores'] },
    { id: 'Q-DID-ADM-0073', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-13', subtema: 'Qualidade no atendimento', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre o atendimento ao público na Administração Pública, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Basta ser educado; a resolução do problema é secundária.' }, { id: 'B', texto: 'Envolve cortesia, clareza, empatia, precisão das informações e busca da resolução efetiva do problema do cidadão.' }, { id: 'C', texto: 'Deve ser seletivo, priorizando quem tem mais influência.' }, { id: 'D', texto: 'Informações sigilosas podem ser compartilhadas com qualquer parente do titular.' }], gabarito: 'B', explicacao: { correta: 'Bom atendimento combina cortesia, clareza, empatia, precisão e RESOLUÇÃO efetiva. Não basta ser educado.', incorretas: { A: 'Resolução é parte essencial.', C: 'Seletividade viola a impessoalidade.', D: 'Sigilo é dever do servidor.' }, conceitoCobrado: 'Qualidade no atendimento ao público.', pegadinha: 'Achar que cortesia sozinha resolve.', comoApareceEmConcurso: 'Cobrado em ADM e concursos administrativos.' }, tags: ['atendimento'] },
    { id: 'Q-DID-ADM-0074', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-13', subtema: 'Escuta ativa', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a escuta ativa no atendimento, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Significa captar o som da fala do cidadão, sem prestar atenção plena.' }, { id: 'B', texto: 'Significa prestar atenção plena, sem interromper, interpretando conteúdo e emoções, confirmando entendimento e respondendo com precisão.' }, { id: 'C', texto: 'É incompatível com o atendimento público.' }, { id: 'D', texto: 'É sinônimo de silêncio absoluto.' }], gabarito: 'B', explicacao: { correta: 'Escuta ATIVA: atenção plena, sem interromper, interpretando conteúdo e emoções, confirmando entendimento.', incorretas: { A: 'Ouvir sem atenção não é escuta ativa.', C: 'É essencial no atendimento.', D: 'Silêncio absoluto não é escuta ativa.' }, conceitoCobrado: 'Escuta ativa.', pegadinha: 'Confundir ouvir com escutar ativamente.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['atendimento', 'escuta'] },
    { id: 'Q-DID-ADM-0075', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-13', subtema: 'Postura profissional', dificuldade: 2, prioridade: 'alta', enunciado: 'Diante de um cidadão exaltado que reclama de um serviço, a postura adequada do servidor é:', alternativas: [{ id: 'A', texto: 'Responder no mesmo tom para impor respeito.' }, { id: 'B', texto: 'Manter a calma, ouvir com atenção, confirmar entendimento e buscar solução ou encaminhamento correto.' }, { id: 'C', texto: 'Ignorar a reclamação e atender o próximo.' }, { id: 'D', texto: 'Encerrar imediatamente o atendimento.' }], gabarito: 'B', explicacao: { correta: 'Autocontrole + escuta ativa + busca de solução. É a conduta esperada.', incorretas: { A: 'Responder no mesmo tom é inadequado.', C: 'Ignorar viola o dever de atender.', D: 'Encerrar sem resolver prejudica o cidadão.' }, conceitoCobrado: 'Postura profissional no atendimento.', pegadinha: 'Achar que responder com agressividade "impõe respeito".', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['atendimento', 'postura'] },
    { id: 'Q-DID-ADM-0076', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-13', subtema: 'Sigilo', dificuldade: 2, prioridade: 'alta', enunciado: 'Um cidadão pede informação sigilosa de outro cidadão, alegando ser parente. O servidor deve:', alternativas: [{ id: 'A', texto: 'Fornecer, pois se trata de parente.' }, { id: 'B', texto: 'Fornecer apenas parcialmente.' }, { id: 'C', texto: 'Recusar o fornecimento, pois o sigilo das informações é dever do servidor, ressalvadas hipóteses legais/judiciais.' }, { id: 'D', texto: 'Encaminhar ao setor de RH.' }], gabarito: 'C', explicacao: { correta: 'O servidor tem DEVER DE SIGILO. Só o titular ou por ordem legal/judicial pode acessar a informação.', incorretas: { A: 'Parentesco não autoriza acesso.', B: 'Não cabe fornecimento parcial.', D: 'O problema não é de RH.' }, conceitoCobrado: 'Sigilo no atendimento.', pegadinha: 'Achar que parente pode acessar.', comoApareceEmConcurso: 'Cobrado em ADM e ética.' }, tags: ['atendimento', 'sigilo'] },
    { id: 'Q-DID-ADM-0077', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-13', subtema: 'Ouvidoria', dificuldade: 2, prioridade: 'alta', enunciado: 'A ouvidoria, no serviço público, tem como função principal:', alternativas: [{ id: 'A', texto: 'Substituir o atendimento comum.' }, { id: 'B', texto: 'Ser canal específico para reclamações, denúncias, sugestões e elogios, com registro formal e encaminhamento para melhoria.' }, { id: 'C', texto: 'Apenas registrar elogios.' }, { id: 'D', texto: 'Julgar processos disciplinares.' }], gabarito: 'B', explicacao: { correta: 'OUVIDORIA: canal específico para reclamações, denúncias, sugestões e elogios, com registro e encaminhamento.', incorretas: { A: 'Não substitui o atendimento comum.', C: 'Vai além do elogio.', D: 'Não julga processos disciplinares.' }, conceitoCobrado: 'Papel da ouvidoria.', pegadinha: 'Achar que ouvidoria julga.', comoApareceEmConcurso: 'Cobrado em ADM e AP.' }, tags: ['atendimento', 'ouvidoria'] },
    { id: 'Q-DID-ADM-0078', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-13', subtema: 'Cortesia x eficiência', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a diferença entre cortesia e eficiência no atendimento, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'São a mesma coisa.' }, { id: 'B', texto: 'Cortesia é tratar com educação (comportamento); eficiência é resolver o problema de forma ágil e correta (resultado).' }, { id: 'C', texto: 'Eficiência é apenas ser rápido.' }, { id: 'D', texto: 'Cortesia substitui a eficiência.' }], gabarito: 'B', explicacao: { correta: 'CORTESIA = comportamento (educação, respeito). EFICIÊNCIA = resultado (agilidade e correção na solução). O ideal combina os dois.', incorretas: { A: 'São distintos.', C: 'Eficiência envolve também correção, não só velocidade.', D: 'Uma não substitui a outra.' }, conceitoCobrado: 'Cortesia x eficiência.', pegadinha: 'Achar que educado basta.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['atendimento'] },
    { id: 'Q-DID-AP-0009', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-01', subtema: 'Sentidos de Administração Pública', dificuldade: 2, prioridade: 'alta', enunciado: 'Em sentido amplo (subjetivo/formal), a Administração Pública compreende:', alternativas: [{ id: 'A', texto: 'Somente os órgãos do Poder Executivo.' }, { id: 'B', texto: 'Apenas a função administrativa exercida pelo Estado.' }, { id: 'C', texto: 'O conjunto de órgãos e entidades de todos os Poderes, no desempenho de funções administrativas.' }, { id: 'D', texto: 'Exclusivamente o Legislativo e o Judiciário.' }], gabarito: 'C', explicacao: { correta: 'Sentido AMPLO (subjetivo/formal/orgânico): todos os órgãos e entidades dos três Poderes, no exercício de função administrativa.', incorretas: { A: 'Exclui os demais Poderes.', B: 'Refere-se ao sentido estrito.', D: 'Reduz indevidamente.' }, conceitoCobrado: 'Sentidos de Administração Pública.', pegadinha: 'Confundir sentido amplo com estrito.', comoApareceEmConcurso: 'Cobrado em AP e DA.' }, tags: ['AP', 'conceito'] },
    { id: 'Q-DID-AP-0010', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-01', subtema: 'Regime jurídico-administrativo', dificuldade: 3, prioridade: 'alta', enunciado: 'A desapropriação de imóvel particular para construção de hospital público, com indenização prévia, exemplifica o princípio da:', alternativas: [{ id: 'A', texto: 'Indisponibilidade do interesse público.' }, { id: 'B', texto: 'Supremacia do interesse público.' }, { id: 'C', texto: 'Autotutela.' }, { id: 'D', texto: 'Eficiência.' }], gabarito: 'B', explicacao: { correta: 'SUPREMACIA do interesse público: prevalece sobre o privado. A desapropriação é exemplo clássico (art. 5º, XXIV, CF).', incorretas: { A: 'Indisponibilidade: o administrador não pode renunciar.', C: 'Autotutela: controle dos próprios atos.', D: 'Eficiência: resultado útil.' }, conceitoCobrado: 'Pilares do regime jurídico-administrativo.', pegadinha: 'Confundir supremacia com indisponibilidade.', comoApareceEmConcurso: 'Cobrado em AP e DA.' }, tags: ['AP', 'regime'] },
    { id: 'Q-DID-AP-0011', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-01', subtema: 'Campo de atuação', dificuldade: 2, prioridade: 'alta', enunciado: 'O Estado, quando atua como PODER PÚBLICO (imperium), age:', alternativas: [{ id: 'A', texto: 'Como se fosse um particular, sem prerrogativas.' }, { id: 'B', texto: 'Com prerrogativas de poder de império, como no poder de polícia e na desapropriação.' }, { id: 'C', texto: 'Somente como regulador da economia.' }, { id: 'D', texto: 'Sem qualquer prerrogativa legal.' }], gabarito: 'B', explicacao: { correta: 'Quando atua como PODER PÚBLICO, o Estado exerce prerrogativas de império — poder de polícia, desapropriação, autotutela.', incorretas: { A: 'O Estado tem prerrogativas que particulares não têm.', C: 'O campo de atuação é mais amplo.', D: 'As prerrogativas decorrem da lei.' }, conceitoCobrado: 'Campo de atuação do Estado.', pegadinha: 'Achar que o Estado age como particular.', comoApareceEmConcurso: 'Cobrado em AP.' }, tags: ['AP', 'campo'] },
    { id: 'Q-DID-AP-0012', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-01', subtema: 'AP x DA', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a relação entre Administração Pública (AP) e Direito Administrativo (DA), é correto afirmar que:', alternativas: [{ id: 'A', texto: 'São sinônimos.' }, { id: 'B', texto: 'AP é a atividade administrativa exercida pelo Estado; DA é o ramo do direito que regula essa atividade.' }, { id: 'C', texto: 'DA é a atividade; AP é o ramo jurídico.' }, { id: 'D', texto: 'AP existe apenas no Executivo.' }], gabarito: 'B', explicacao: { correta: 'AP = ATIVIDADE. DA = RAMO DO DIREITO. Não são sinônimos.', incorretas: { A: 'Não são sinônimos.', C: 'Inverte.', D: 'AP inclui os três Poderes em sentido amplo.' }, conceitoCobrado: 'AP x DA.', pegadinha: 'Tratar como sinônimos.', comoApareceEmConcurso: 'Cobrado em AP e DA.' }, tags: ['AP', 'conceito'] },
    { id: 'Q-DID-AP-0013', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-01', subtema: 'Função administrativa', dificuldade: 2, prioridade: 'alta', enunciado: 'O Poder Judiciário exerce função administrativa?', alternativas: [{ id: 'A', texto: 'Não, jamais.' }, { id: 'B', texto: 'Sim, de forma atípica, quando, por exemplo, contrata servidores, compra material ou gerencia seus órgãos.' }, { id: 'C', texto: 'Somente em ano eleitoral.' }, { id: 'D', texto: 'Só o Executivo exerce função administrativa.' }], gabarito: 'B', explicacao: { correta: 'Os três Poderes exercem função administrativa ATIPICAMENTE quando gerem seus órgãos, contratam, compram, etc.', incorretas: { A: 'Exerce atipicamente.', C: 'Independe de ano eleitoral.', D: 'Todos os Poderes exercem função administrativa atipicamente.' }, conceitoCobrado: 'Função administrativa atípica.', pegadinha: 'Achar que só o Executivo tem função administrativa.', comoApareceEmConcurso: 'Cobrado em AP.' }, tags: ['AP', 'função'] },
    { id: 'Q-DID-AP-0014', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-03', subtema: 'Princípios expressos', dificuldade: 2, prioridade: 'alta', enunciado: 'Assinale a alternativa que apresenta corretamente os princípios expressos no caput do art. 37 da CF:', alternativas: [{ id: 'A', texto: 'Legalidade, imparcialidade, moralidade, transparência e eficiência.' }, { id: 'B', texto: 'Legalidade, impessoalidade, moralidade, publicidade e eficiência.' }, { id: 'C', texto: 'Razoabilidade, proporcionalidade, moralidade, publicidade e eficiência.' }, { id: 'D', texto: 'Legalidade, impessoalidade, motivação, publicidade e economicidade.' }], gabarito: 'B', explicacao: { correta: 'LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência.', incorretas: { A: 'Imparcialidade não é princípio expresso; transparência também não está no art. 37.', C: 'Razoabilidade e proporcionalidade são IMPLÍCITOS.', D: 'Motivação é implícita.' }, conceitoCobrado: 'LIMPE.', pegadinha: 'Trocar por termos parecidos.', comoApareceEmConcurso: 'Toda prova cobra LIMPE.' }, tags: ['AP', 'LIMPE'] },
    { id: 'Q-DID-AP-0015', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-03', subtema: 'Legalidade', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre o princípio da legalidade na Administração Pública, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'O administrador pode fazer tudo que a lei não proíbe, tal como o particular.' }, { id: 'B', texto: 'A Administração só pode atuar conforme autorização ou determinação legal (legalidade estrita).' }, { id: 'C', texto: 'A legalidade veda atos discricionários.' }, { id: 'D', texto: 'A legalidade administrativa é idêntica à autonomia privada.' }], gabarito: 'B', explicacao: { correta: 'Legalidade ESTRITA: Administração só faz o que a lei autoriza ou determina.', incorretas: { A: 'Descreve a legalidade do PARTICULAR.', C: 'Legalidade não veda discricionariedade.', D: 'É o oposto da autonomia privada.' }, conceitoCobrado: 'Legalidade administrativa x do particular.', pegadinha: '"Fazer o que a lei não proíbe" é ERRADO para a Administração.', comoApareceEmConcurso: 'Alta frequência em AP e DA.' }, tags: ['AP', 'legalidade'] },
    { id: 'Q-DID-AP-0016', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-03', subtema: 'Eficiência', dificuldade: 2, prioridade: 'alta', enunciado: 'O princípio da eficiência foi inserido no caput do art. 37 da CF pela:', alternativas: [{ id: 'A', texto: 'EC 45/2004 (Reforma do Judiciário).' }, { id: 'B', texto: 'EC 19/1998 (Reforma Gerencial).' }, { id: 'C', texto: 'EC 1/1992.' }, { id: 'D', texto: 'Constituição Federal de 1988 original.' }], gabarito: 'B', explicacao: { correta: 'EC 19/1998 (Reforma Gerencial) inseriu a eficiência no caput do art. 37.', incorretas: { A: 'EC 45/2004 tratou do Judiciário.', C: 'EC 1/1992 tratou de outras matérias.', D: 'A CF/88 original listava só 4 princípios.' }, conceitoCobrado: 'Marco legal da eficiência.', pegadinha: 'Confundir EC 19/1998 com EC 45/2004.', comoApareceEmConcurso: 'Clássica em AP e DA.' }, tags: ['AP', 'eficiência'] },
    { id: 'Q-DID-AP-0017', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-03', subtema: 'Impessoalidade', dificuldade: 2, prioridade: 'alta', enunciado: 'Um prefeito afixa outdoors com sua foto e nome ao lado de obras municipais, pagos com verba pública. Essa conduta viola frontalmente o princípio da:', alternativas: [{ id: 'A', texto: 'Legalidade.' }, { id: 'B', texto: 'Impessoalidade.' }, { id: 'C', texto: 'Publicidade.' }, { id: 'D', texto: 'Continuidade.' }], gabarito: 'B', explicacao: { correta: 'Art. 37, §1º, CF veda promoção pessoal. Violação direta da IMPESSOALIDADE.', incorretas: { A: 'Há irregularidade, mas o núcleo é impessoalidade.', C: 'Publicidade não promove o agente.', D: 'Não é o foco.' }, conceitoCobrado: 'Impessoalidade.', pegadinha: 'Trocar por publicidade.', comoApareceEmConcurso: 'Situações práticas com outdoors.' }, tags: ['AP', 'impessoalidade'] },
    { id: 'Q-DID-AP-0018', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-04', subtema: 'Composição da Administração Indireta', dificuldade: 2, prioridade: 'alta', enunciado: 'Integram a Administração Pública Indireta:', alternativas: [{ id: 'A', texto: 'Ministérios e secretarias.' }, { id: 'B', texto: 'Autarquias, fundações públicas, empresas públicas e sociedades de economia mista.' }, { id: 'C', texto: 'Tribunais de Contas e Ministério Público.' }, { id: 'D', texto: 'Presidência da República e Congresso Nacional.' }], gabarito: 'B', explicacao: { correta: 'Administração INDIRETA: autarquias, fundações, empresas públicas e sociedades de economia mista — todas com personalidade jurídica própria.', incorretas: { A: 'Ministérios e secretarias são órgãos da Direta.', C: 'TC e MP são órgãos independentes.', D: 'São órgãos da cúpula.' }, conceitoCobrado: 'Composição da Administração Indireta.', pegadinha: 'Confundir órgão com entidade.', comoApareceEmConcurso: 'Alta frequência em AP e DA.' }, tags: ['AP', 'indireta'] },
    { id: 'Q-DID-AP-0019', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-04', subtema: 'Empresa pública x SEM', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre empresa pública e sociedade de economia mista, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Ambas têm capital 100% público.' }, { id: 'B', texto: 'Empresa pública: capital 100% público, qualquer forma societária. SEM: capital misto com maioria pública, obrigatoriamente S.A.' }, { id: 'C', texto: 'Empresa pública é sempre S.A.' }, { id: 'D', texto: 'SEM tem capital 100% privado.' }], gabarito: 'B', explicacao: { correta: 'EMPRESA PÚBLICA: capital 100% público, qualquer forma (Ltda., S.A.). SEM: capital MISTO com maioria pública, obrigatoriamente S.A.', incorretas: { A: 'SEM tem capital misto.', C: 'Empresa pública não precisa ser S.A.', D: 'SEM tem maioria pública.' }, conceitoCobrado: 'Empresa pública x SEM.', pegadinha: 'Confundir as duas.', comoApareceEmConcurso: 'Cobrado em AP e DA.' }, tags: ['AP', 'empresas'] },
    { id: 'Q-DID-AP-0020', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-04', subtema: 'Criação de entidades', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a criação de entidades da Administração Indireta, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Todas são criadas por decreto.' }, { id: 'B', texto: 'Autarquias e fundações públicas são CRIADAS por lei específica; empresas públicas e SEM são AUTORIZADAS por lei específica.' }, { id: 'C', texto: 'Podem ser criadas sem lei.' }, { id: 'D', texto: 'Só as autarquias dependem de lei.' }], gabarito: 'B', explicacao: { correta: 'Autarquias e fundações: CRIADAS por lei específica. Empresas públicas e SEM: AUTORIZADAS por lei (a personalidade surge com o registro).', incorretas: { A: 'Não é por decreto.', C: 'Exigem lei.', D: 'Todas dependem de lei.' }, conceitoCobrado: 'Criação x autorização por lei.', pegadinha: 'Confundir criada com autorizada.', comoApareceEmConcurso: 'Cobrado em DA e AP.' }, tags: ['AP', 'criação'] },
    { id: 'Q-DID-AP-0021', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-04', subtema: 'Órgão x entidade', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre os órgãos públicos, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Têm personalidade jurídica própria e capacidade contratual.' }, { id: 'B', texto: 'Não têm personalidade jurídica própria; integram a Administração Direta e não contratam em nome próprio.' }, { id: 'C', texto: 'Integram a Administração Indireta.' }, { id: 'D', texto: 'São sempre criados por lei.' }], gabarito: 'B', explicacao: { correta: 'Órgãos NÃO têm personalidade jurídica própria. Integram a Direta. Quem contrata é a pessoa jurídica (União, Estado, Município).', incorretas: { A: 'Órgãos não têm personalidade.', C: 'Integram a Direta.', D: 'Podem ser criados por lei ou decreto.' }, conceitoCobrado: 'Órgão x entidade.', pegadinha: 'Achar que órgão tem personalidade.', comoApareceEmConcurso: 'Cobrado em AP e DA.' }, tags: ['AP', 'órgão'] },
    { id: 'Q-DID-AP-0022', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-05', subtema: 'Órgão x entidade', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a diferença entre órgão e entidade, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Órgão tem personalidade jurídica própria; entidade não tem.' }, { id: 'B', texto: 'Órgão é unidade interna sem personalidade jurídica; entidade é pessoa jurídica com personalidade própria (autarquias, fundações, empresas públicas e SEM).' }, { id: 'C', texto: 'São sinônimos.' }, { id: 'D', texto: 'Órgão pode contratar em nome próprio.' }], gabarito: 'B', explicacao: { correta: 'ÓRGÃO: unidade interna sem personalidade. ENTIDADE: pessoa jurídica com personalidade própria.', incorretas: { A: 'Inverte.', C: 'São conceitos distintos.', D: 'Órgão não contrata em nome próprio.' }, conceitoCobrado: 'Órgão x entidade.', pegadinha: 'Inverter os conceitos.', comoApareceEmConcurso: 'Alta frequência em AP e DA.' }, tags: ['AP', 'órgão'] },
    { id: 'Q-DID-AP-0023', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-05', subtema: 'Classificação dos órgãos', dificuldade: 2, prioridade: 'alta', enunciado: 'Quanto à posição estatal, os órgãos que ocupam a cúpula dos Poderes, sem subordinação hierárquica a outro órgão, são classificados como:', alternativas: [{ id: 'A', texto: 'Autônomos.' }, { id: 'B', texto: 'Independentes.' }, { id: 'C', texto: 'Superiores.' }, { id: 'D', texto: 'Subalternos.' }], gabarito: 'B', explicacao: { correta: 'Órgãos INDEPENDENTES: cúpula dos Poderes, sem subordinação (Presidência, Congresso, STF).', incorretas: { A: 'Autônomos: subordinados à cúpula, com autonomia (ministérios).', C: 'Superiores: com poder de decisão, subordinados a um autônomo.', D: 'Subalternos: execução.' }, conceitoCobrado: 'Classificação dos órgãos.', pegadinha: 'Confundir independente com autônomo.', comoApareceEmConcurso: 'Cobrado em AP e DA.' }, tags: ['AP', 'órgãos'] },
    { id: 'Q-DID-AP-0024', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-05', subtema: 'Capacidade processual', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a capacidade processual dos órgãos públicos, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Todos os órgãos têm capacidade processual plena.' }, { id: 'B', texto: 'Em regra, os órgãos não têm capacidade processual; excepcionalmente, órgãos independentes e autônomos podem impetrar mandado de segurança em defesa de suas prerrogativas institucionais.' }, { id: 'C', texto: 'Nenhum órgão pode ir a juízo, nunca.' }, { id: 'D', texto: 'Só o Poder Judiciário pode processar órgãos.' }], gabarito: 'B', explicacao: { correta: 'Regra: órgãos não têm capacidade processual. EXCEÇÃO: órgãos independentes e autônomos podem impetrar MANDADO DE SEGURANÇA em defesa de suas prerrogativas.', incorretas: { A: 'Não é plena.', C: 'Há exceção.', D: 'Não procede.' }, conceitoCobrado: 'Capacidade processual de órgãos.', pegadinha: 'Achar que órgãos nunca podem ir a juízo.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['AP', 'capacidade'] },
    { id: 'Q-DID-AP-0025', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-05', subtema: 'Classificação dos órgãos', dificuldade: 3, prioridade: 'media', enunciado: 'Sobre a classificação dos órgãos quanto à estrutura e atuação, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Quanto à estrutura: simples (um centro de competência) ou compostos (vários órgãos). Quanto à atuação: singulares (um titular) ou colegiados (vários titulares).' }, { id: 'B', texto: 'Todos os órgãos são simples e singulares.' }, { id: 'C', texto: 'Não há classificação quanto à estrutura.' }, { id: 'D', texto: 'Todos os órgãos são colegiados.' }], gabarito: 'A', explicacao: { correta: 'Quanto à ESTRUTURA: simples (ex.: Presidência) x compostos (ex.: Ministério). Quanto à ATUAÇÃO: singulares (um titular) x colegiados (vários titulares, ex.: Tribunais).', incorretas: { B: 'Há variedade.', C: 'Há classificação.', D: 'Nem todos são colegiados.' }, conceitoCobrado: 'Classificação dos órgãos.', pegadinha: 'Achar que toda classificação é só posição estatal.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['AP', 'órgãos'] },
    { id: 'Q-DID-AP-0026', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-05', subtema: 'Órgãos colegiados', dificuldade: 2, prioridade: 'media', enunciado: 'Um Tribunal, formado por vários ministros que decidem em conjunto, é classificado quanto à atuação como órgão:', alternativas: [{ id: 'A', texto: 'Singular.' }, { id: 'B', texto: 'Colegiado.' }, { id: 'C', texto: 'Subalterno.' }, { id: 'D', texto: 'Simples.' }], gabarito: 'B', explicacao: { correta: 'Órgão COLEGIADO: vários titulares decidem em conjunto (Tribunais, Conselhos).', incorretas: { A: 'Singular: um único titular.', C: 'Subalterno é classificação de posição estatal.', D: 'Simples é classificação de estrutura.' }, conceitoCobrado: 'Classificação dos órgãos quanto à atuação.', pegadinha: 'Confundir colegiado com composto.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['AP', 'órgãos'] },
    { id: 'Q-DID-AP-0027', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-05', subtema: 'Administração Direta', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a Administração Direta, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É composta por entidades com personalidade jurídica própria.' }, { id: 'B', texto: 'É composta por órgãos internos dos Poderes, sem personalidade jurídica própria, ligados diretamente ao poder central.' }, { id: 'C', texto: 'Integra a Administração Indireta.' }, { id: 'D', texto: 'Só existe no Poder Executivo.' }], gabarito: 'B', explicacao: { correta: 'Administração DIRETA: órgãos internos dos Poderes, sem personalidade própria (ministérios, secretarias).', incorretas: { A: 'Quem tem personalidade é a entidade.', C: 'É a Direta.', D: 'Existe nos três Poderes.' }, conceitoCobrado: 'Administração Direta.', pegadinha: 'Confundir com Indireta.', comoApareceEmConcurso: 'Alta frequência.' }, tags: ['AP', 'direta'] },
    { id: 'Q-DID-DA-0015', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-01', subtema: 'Fontes do Direito Administrativo', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre as fontes do Direito Administrativo, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'A lei é a única fonte.' }, { id: 'B', texto: 'A lei é fonte PRIMÁRIA; doutrina, jurisprudência, princípios gerais e costumes são fontes SECUNDÁRIAS.' }, { id: 'C', texto: 'A jurisprudência é fonte primária.' }, { id: 'D', texto: 'A doutrina é fonte primária.' }], gabarito: 'B', explicacao: { correta: 'LEI = fonte PRIMÁRIA. Doutrina, jurisprudência, princípios gerais e costumes = SECUNDÁRIAS.', incorretas: { A: 'Há outras fontes.', C: 'Jurisprudência é secundária.', D: 'Doutrina é secundária.' }, conceitoCobrado: 'Fontes do DA.', pegadinha: 'Achar que doutrina é primária.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'fontes'] },
    { id: 'Q-DID-DA-0016', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-01', subtema: 'Objeto do DA', dificuldade: 2, prioridade: 'alta', enunciado: 'O objeto do Direito Administrativo compreende:', alternativas: [{ id: 'A', texto: 'Apenas as relações entre particulares.' }, { id: 'B', texto: 'A Administração Pública, seus órgãos, entidades e agentes, e a atividade administrativa (atos, contratos, licitações, poder de polícia, serviços públicos, responsabilidade e controle).' }, { id: 'C', texto: 'Apenas a atividade legislativa.' }, { id: 'D', texto: 'Somente os contratos privados.' }], gabarito: 'B', explicacao: { correta: 'O DA estuda a Administração Pública e sua atividade (atos, contratos, licitações, poder de polícia, serviços, responsabilidade, controle).', incorretas: { A: 'Relações privadas são objeto do Direito Civil.', C: 'A atividade legislativa é do Direito Constitucional.', D: 'Contratos privados são do Direito Civil.' }, conceitoCobrado: 'Objeto do DA.', pegadinha: 'Reduzir a apenas uma matéria.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'objeto'] },
    { id: 'Q-DID-DA-0017', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-01', subtema: 'Regime jurídico-administrativo', dificuldade: 3, prioridade: 'alta', enunciado: 'São os dois pilares do regime jurídico-administrativo:', alternativas: [{ id: 'A', texto: 'Legalidade e moralidade.' }, { id: 'B', texto: 'Supremacia do interesse público e indisponibilidade do interesse público.' }, { id: 'C', texto: 'Publicidade e eficiência.' }, { id: 'D', texto: 'Razoabilidade e proporcionalidade.' }], gabarito: 'B', explicacao: { correta: 'Os dois pilares são: SUPREMACIA do interesse público e INDISPONIBILIDADE do interesse público.', incorretas: { A: 'São princípios expressos (LIMPE), não os pilares do regime.', C: 'Também são princípios expressos.', D: 'São princípios implícitos.' }, conceitoCobrado: 'Pilares do regime jurídico-administrativo.', pegadinha: 'Confundir com LIMPE.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'regime'] },
    { id: 'Q-DID-DA-0018', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-01', subtema: 'Base legal do DA', dificuldade: 2, prioridade: 'media', enunciado: 'São normas-base do Direito Administrativo brasileiro:', alternativas: [{ id: 'A', texto: 'Apenas a CF/88.' }, { id: 'B', texto: 'CF/88 (arts. 37 a 41), Lei 8.112/1990, Lei 9.784/1999, Lei 14.133/2021, Lei 8.429/1992.' }, { id: 'C', texto: 'Apenas o Código Civil.' }, { id: 'D', texto: 'Apenas o Código Penal.' }], gabarito: 'B', explicacao: { correta: 'Base do DA: CF/88 (arts. 37 a 41), Lei 8.112/1990 (servidores), Lei 9.784/1999 (processo administrativo), Lei 14.133/2021 (licitações), Lei 8.429/1992 (improbidade).', incorretas: { A: 'Vai além da CF.', C: 'Código Civil não é base principal.', D: 'Código Penal é de outra esfera.' }, conceitoCobrado: 'Base legal do DA.', pegadinha: 'Reduzir a uma só lei.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'legislação'] },
    { id: 'Q-DID-DA-0019', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-01', subtema: 'DA x Direito Privado', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a diferença entre Direito Administrativo e Direito Privado, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'São sinônimos.' }, { id: 'B', texto: 'O DA é regido por normas de direito PÚBLICO, com prerrogativas do Estado (supremacia) e restrições (indisponibilidade); o Direito Privado é regido pela autonomia da vontade, com igualdade formal entre as partes.' }, { id: 'C', texto: 'O DA é um ramo do Direito Privado.' }, { id: 'D', texto: 'O Direito Privado prevalece sobre o DA.' }], gabarito: 'B', explicacao: { correta: 'DA = direito PÚBLICO, com prerrogativas e restrições. Direito Privado = autonomia da vontade, igualdade formal.', incorretas: { A: 'Não são sinônimos.', C: 'DA é ramo do Direito Público.', D: 'Não há prevalência.' }, conceitoCobrado: 'DA x Direito Privado.', pegadinha: 'Achar que DA é privado.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'direito público'] },
    { id: 'Q-DID-DA-0020', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-03', subtema: 'Desconcentração x descentralização', dificuldade: 2, prioridade: 'alta', enunciado: 'A criação de uma delegacia regional de um órgão público federal, subordinada ao órgão central, é exemplo de:', alternativas: [{ id: 'A', texto: 'Descentralização por outorga.' }, { id: 'B', texto: 'Descentralização por delegação.' }, { id: 'C', texto: 'Desconcentração administrativa.' }, { id: 'D', texto: 'Criação de entidade da Administração Indireta.' }], gabarito: 'C', explicacao: { correta: 'DESCONCENTRAÇÃO: distribuição interna de competências DENTRO da mesma pessoa jurídica. Delegacia regional é órgão do ministério, sem CNPJ próprio.', incorretas: { A: 'Descentralização por outorga cria nova pessoa jurídica.', B: 'Delegação a particular (concessão/permissão).', D: 'Não há entidade nova.' }, conceitoCobrado: 'Desconcentração x descentralização.', pegadinha: 'Confundir órgão com entidade.', comoApareceEmConcurso: 'Clássica em DA.' }, tags: ['DA', 'desconcentração'] },
    { id: 'Q-DID-DA-0021', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-03', subtema: 'Outorga x delegação', dificuldade: 3, prioridade: 'alta', enunciado: 'A concessão de serviço público a uma empresa privada é exemplo de:', alternativas: [{ id: 'A', texto: 'Descentralização por outorga.' }, { id: 'B', texto: 'Descentralização por delegação.' }, { id: 'C', texto: 'Desconcentração administrativa.' }, { id: 'D', texto: 'Centralização.' }], gabarito: 'B', explicacao: { correta: 'DELEGAÇÃO: o Estado transfere apenas a EXECUÇÃO a um particular, mantendo a titularidade do serviço.', incorretas: { A: 'Outorga transfere titularidade + execução a entidade pública.', C: 'Desconcentração é dentro da mesma pessoa jurídica.', D: 'Centralização é o oposto.' }, conceitoCobrado: 'Outorga x delegação.', pegadinha: 'Confundir concessão com outorga.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'delegação'] },
    { id: 'Q-DID-DA-0022', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-03', subtema: 'Órgãos x entidades', dificuldade: 2, prioridade: 'alta', enunciado: 'Uma secretaria municipal de saúde é classificada como:', alternativas: [{ id: 'A', texto: 'Entidade da Administração Indireta.' }, { id: 'B', texto: 'Órgão da Administração Direta.' }, { id: 'C', texto: 'Autarquia municipal.' }, { id: 'D', texto: 'Empresa pública.' }], gabarito: 'B', explicacao: { correta: 'Secretaria é ÓRGÃO da Administração DIRETA — sem personalidade jurídica própria.', incorretas: { A: 'Entidade tem personalidade própria.', C: 'Autarquia é entidade da Indireta.', D: 'Empresa pública é entidade da Indireta.' }, conceitoCobrado: 'Órgão x entidade.', pegadinha: 'Confundir com entidade.', comoApareceEmConcurso: 'Cobrado em DA e AP.' }, tags: ['DA', 'órgão'] },
    { id: 'Q-DID-DA-0023', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-03', subtema: 'Administração Direta x Indireta', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a Administração Direta e a Indireta, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Ambas são compostas por órgãos sem personalidade jurídica.' }, { id: 'B', texto: 'A Direta é composta por órgãos sem personalidade; a Indireta, por entidades com personalidade jurídica própria.' }, { id: 'C', texto: 'A Indireta é composta por órgãos.' }, { id: 'D', texto: 'Ambas são compostas por entidades.' }], gabarito: 'B', explicacao: { correta: 'DIRETA: órgãos sem personalidade. INDIRETA: entidades com personalidade própria.', incorretas: { A: 'Só a Direta tem órgãos.', C: 'Indireta tem entidades.', D: 'Direta tem órgãos, não entidades.' }, conceitoCobrado: 'Direta x Indireta.', pegadinha: 'Confundir órgão com entidade.', comoApareceEmConcurso: 'Alta frequência.' }, tags: ['DA', 'administração'] },
    { id: 'Q-DID-DA-0024', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-03', subtema: 'Criação de órgãos x entidades', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a criação de órgãos e entidades, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Órgãos são criados por lei; entidades por decreto.' }, { id: 'B', texto: 'Órgãos podem ser criados por lei ou decreto, conforme o caso; autarquias e fundações públicas são CRIADAS por lei específica; empresas públicas e SEM são AUTORIZADAS por lei.' }, { id: 'C', texto: 'Nada depende de lei.' }, { id: 'D', texto: 'Somente órgãos dependem de lei.' }], gabarito: 'B', explicacao: { correta: 'Órgãos: lei ou decreto, conforme o caso. Autarquias e fundações: CRIADAS por lei. Empresas públicas e SEM: AUTORIZADAS por lei.', incorretas: { A: 'Inverte parcialmente.', C: 'Dependem de lei.', D: 'Entidades também dependem de lei.' }, conceitoCobrado: 'Criação de órgãos e entidades.', pegadinha: 'Confundir criada com autorizada.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'criação'] },
    { id: 'Q-DID-DA-0025', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-04', subtema: 'Cargo x emprego', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre cargo e emprego público, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Cargo público é ocupado por empregado celetista; emprego é ocupado por servidor estatutário.' }, { id: 'B', texto: 'Cargo público: criado por lei, ocupado por servidor ESTATUTÁRIO. Emprego público: ocupado por empregado CELETISTA.' }, { id: 'C', texto: 'São sinônimos.' }, { id: 'D', texto: 'Cargo em comissão exige concurso.' }], gabarito: 'B', explicacao: { correta: 'Cargo = criado por lei, servidor ESTATUTÁRIO. Emprego = empregado CELETISTA (CLT).', incorretas: { A: 'Inverte.', C: 'Não são sinônimos.', D: 'Cargo em comissão é de livre nomeação, sem concurso.' }, conceitoCobrado: 'Cargo x emprego.', pegadinha: 'Confundir regime estatutário e celetista.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'agentes'] },
    { id: 'Q-DID-DA-0026', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-04', subtema: 'Agentes públicos', dificuldade: 2, prioridade: 'alta', enunciado: 'São espécies de agentes públicos:', alternativas: [{ id: 'A', texto: 'Apenas servidores efetivos.' }, { id: 'B', texto: 'Agentes políticos, servidores públicos, empregados públicos, temporários, honoríficos e delegados.' }, { id: 'C', texto: 'Somente agentes políticos.' }, { id: 'D', texto: 'Apenas empregados celetistas.' }], gabarito: 'B', explicacao: { correta: 'Agentes públicos é GÊNERO: políticos, servidores (efetivos e em comissão), empregados públicos, temporários, honoríficos e delegados.', incorretas: { A: 'Vai muito além.', C: 'É uma espécie.', D: 'É uma espécie.' }, conceitoCobrado: 'Espécies de agentes públicos.', pegadinha: 'Reduzir a servidor.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'agentes'] },
    { id: 'Q-DID-DA-0027', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-04', subtema: 'Cargo em comissão', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre o cargo em comissão, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Exige aprovação prévia em concurso público.' }, { id: 'B', texto: 'É de livre nomeação e exoneração, destinado a funções de direção, chefia e assessoramento, sem exigência de concurso.' }, { id: 'C', texto: 'É sinônimo de cargo efetivo.' }, { id: 'D', texto: 'Só existe no Poder Legislativo.' }], gabarito: 'B', explicacao: { correta: 'Cargo em comissão: LIVRE nomeação e exoneração. Destinado a direção, chefia e assessoramento. Não exige concurso.', incorretas: { A: 'Não exige concurso.', C: 'É diferente do efetivo.', D: 'Existe nos três Poderes.' }, conceitoCobrado: 'Cargo em comissão.', pegadinha: 'Achar que exige concurso.', comoApareceEmConcurso: 'Cobrado em DA e AP.' }, tags: ['DA', 'agentes'] },
    { id: 'Q-DID-DA-0028', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-04', subtema: 'Responsabilidade do servidor', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre as responsabilidades civil, penal e administrativa do servidor, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'São mutuamente excludentes.' }, { id: 'B', texto: 'São independentes e CUMULATIVAS: o servidor pode responder simultaneamente nas três esferas.' }, { id: 'C', texto: 'Só existe a administrativa.' }, { id: 'D', texto: 'A absolvição penal sempre afasta a punição administrativa.' }], gabarito: 'B', explicacao: { correta: 'As três esferas são INDEPENDENTES e CUMULATIVAS. Absolvição penal, em regra, não afasta automaticamente a punição administrativa.', incorretas: { A: 'Não são excludentes.', C: 'Há três esferas.', D: 'Não afasta automaticamente.' }, conceitoCobrado: 'Responsabilidade do servidor.', pegadinha: 'Achar que uma exclui a outra.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'responsabilidade'] },
    { id: 'Q-DID-DA-0029', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-04', subtema: 'Estabilidade', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a estabilidade do servidor público, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É adquirida imediatamente com a posse.' }, { id: 'B', texto: 'É adquirida após 3 anos de efetivo exercício (art. 41, CF), dependendo de aprovação em avaliação especial de desempenho.' }, { id: 'C', texto: 'Nunca é adquirida.' }, { id: 'D', texto: 'Só existe no Poder Judiciário.' }], gabarito: 'B', explicacao: { correta: 'Estabilidade: 3 anos de efetivo exercício (art. 41, CF) + avaliação especial de desempenho. Vale para cargos efetivos.', incorretas: { A: 'Só após estágio probatório.', C: 'Existe.', D: 'Aplica-se a todos os Poderes.' }, conceitoCobrado: 'Estabilidade.', pegadinha: 'Achar que é imediata.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'estabilidade'] },
    { id: 'Q-DID-DA-0030', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-05', subtema: 'Poder de polícia', dificuldade: 2, prioridade: 'alta', enunciado: 'A Vigilância Sanitária interdita um restaurante que vendia alimentos vencidos. O poder administrativo exercido é:', alternativas: [{ id: 'A', texto: 'Poder disciplinar.' }, { id: 'B', texto: 'Poder hierárquico.' }, { id: 'C', texto: 'Poder de polícia.' }, { id: 'D', texto: 'Poder regulamentar.' }], gabarito: 'C', explicacao: { correta: 'Poder de POLÍCIA: condiciona e limita atividade econômica (restaurante) em favor do interesse público (saúde coletiva), atingindo PARTICULAR.', incorretas: { A: 'Disciplinar atinge servidores.', B: 'Hierárquico é relação superior-subordinado.', D: 'Regulamentar edita decretos.' }, conceitoCobrado: 'Poder de polícia.', pegadinha: 'Confundir com disciplinar.', comoApareceEmConcurso: 'Alta frequência em DA.' }, tags: ['DA', 'poder de polícia'] },
    { id: 'Q-DID-DA-0031', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-05', subtema: 'Poder disciplinar', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre o poder disciplinar, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Atinge particulares em geral, como o poder de polícia.' }, { id: 'B', texto: 'Apura infrações funcionais e aplica sanções a SERVIDORES e a particulares com vínculo específico (ex.: concessionárias).' }, { id: 'C', texto: 'Só se aplica a agentes políticos.' }, { id: 'D', texto: 'Não existe no serviço público.' }], gabarito: 'B', explicacao: { correta: 'Poder DISCIPLINAR: apura infrações funcionais e pune servidores e particulares com vínculo específico (concessionárias).', incorretas: { A: 'Isso é poder de polícia.', C: 'Aplica-se a servidores e vínculos específicos.', D: 'Existe amplamente.' }, conceitoCobrado: 'Poder disciplinar x poder de polícia.', pegadinha: 'Confundir os dois poderes.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'poder disciplinar'] },
    { id: 'Q-DID-DA-0032', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-05', subtema: 'Abuso de poder', dificuldade: 3, prioridade: 'alta', enunciado: 'Um fiscal aplica multa para retaliar denúncia feita contra ele. Tinha competência para multar, mas usou a prerrogativa com finalidade pessoal. Isso configura:', alternativas: [{ id: 'A', texto: 'Excesso de poder.' }, { id: 'B', texto: 'Desvio de finalidade.' }, { id: 'C', texto: 'Uso regular do poder.' }, { id: 'D', texto: 'Poder vinculado.' }], gabarito: 'B', explicacao: { correta: 'DESVIO DE FINALIDADE: a autoridade atua DENTRO da competência, mas com finalidade diferente do interesse público.', incorretas: { A: 'Excesso seria fora da competência.', C: 'Não é regular.', D: 'Não é questão de vinculação.' }, conceitoCobrado: 'Abuso de poder.', pegadinha: 'Confundir desvio com excesso.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'abuso'] },
    { id: 'Q-DID-DA-0033', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-05', subtema: 'Poder vinculado x discricionário', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre os poderes vinculado e discricionário, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Atos vinculados podem ser revogados por conveniência.' }, { id: 'B', texto: 'Atos discricionários têm mérito administrativo e podem ser revogados; atos vinculados não podem ser revogados.' }, { id: 'C', texto: 'Ambos podem ser revogados.' }, { id: 'D', texto: 'Discricionariedade é sinônimo de arbitrariedade.' }], gabarito: 'B', explicacao: { correta: 'Só atos DISCRICIONÁRIOS podem ser revogados. Atos VINCULADOS não podem ser revogados (só anulados se ilegais).', incorretas: { A: 'Vinculados não se revogam.', C: 'Só discricionários.', D: 'Discricionariedade é legal; arbitrariedade é ilegal.' }, conceitoCobrado: 'Vinculado x discricionário.', pegadinha: 'Confundir discricionariedade com arbitrariedade.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'poderes'] },
    { id: 'Q-DID-DA-0034', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-06', subtema: 'Atributos do ato', dificuldade: 2, prioridade: 'alta', enunciado: 'São atributos do ato administrativo (PATI):', alternativas: [{ id: 'A', texto: 'Presunção de legitimidade, autoexecutoriedade, tipicidade e imperatividade.' }, { id: 'B', texto: 'Legalidade, moralidade e impessoalidade.' }, { id: 'C', texto: 'Anulação, revogação e convalidação.' }, { id: 'D', texto: 'Competência, finalidade e forma.' }], gabarito: 'A', explicacao: { correta: 'Atributos do ato administrativo (PATI): Presunção de legitimidade, Autoexecutoriedade, Tipicidade e Imperatividade.', incorretas: { B: 'São princípios da Administração.', C: 'Formas de extinção/retificação.', D: 'São elementos (COFOMOB).' }, conceitoCobrado: 'Atributos x elementos.', pegadinha: 'Confundir atributos com elementos.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'atos'] },
    { id: 'Q-DID-DA-0035', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-06', subtema: 'Elementos do ato', dificuldade: 2, prioridade: 'alta', enunciado: 'São elementos (requisitos de validade) do ato administrativo (COFOMOB):', alternativas: [{ id: 'A', texto: 'Presunção, autoexecutoriedade, tipicidade, imperatividade e legalidade.' }, { id: 'B', texto: 'Competência, Finalidade, Forma, Motivo e Objeto.' }, { id: 'C', texto: 'Anulação, revogação e convalidação.' }, { id: 'D', texto: 'Legalidade, impessoalidade, moralidade, publicidade e eficiência.' }], gabarito: 'B', explicacao: { correta: 'Elementos do ato (COFOMOB): Competência, Finalidade, Forma, Motivo e Objeto. Se faltar um, o ato é inválido.', incorretas: { A: 'Atributos são PATI.', C: 'Formas de extinção.', D: 'São princípios (LIMPE).' }, conceitoCobrado: 'Elementos do ato.', pegadinha: 'Confundir com atributos.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'atos'] },
    { id: 'Q-DID-DA-0036', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-06', subtema: 'Anulação x revogação', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre anulação e revogação do ato administrativo, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Anulação é por conveniência; revogação, por ilegalidade.' }, { id: 'B', texto: 'Anulação: ilegalidade, efeitos EX TUNC (retroage). Revogação: conveniência e oportunidade, efeitos EX NUNC (não retroage).' }, { id: 'C', texto: 'Ambas só podem ser feitas pelo Judiciário.' }, { id: 'D', texto: 'Revogação é possível para atos vinculados e discricionários.' }], gabarito: 'B', explicacao: { correta: 'Anulação: ilegalidade, EX TUNC. Revogação: mérito, EX NUNC.', incorretas: { A: 'Inverte.', C: 'A Administração pode anular e revogar (Súmula 473/STF).', D: 'Atos VINCULADOS não podem ser revogados.' }, conceitoCobrado: 'Anulação x revogação.', pegadinha: 'Inverter ex tunc e ex nunc.', comoApareceEmConcurso: 'Alta frequência em DA.' }, tags: ['DA', 'anulação', 'revogação'] },
    { id: 'Q-DID-DA-0037', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-06', subtema: 'Convalidação', dificuldade: 3, prioridade: 'média', enunciado: 'Sobre a convalidação do ato administrativo, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Corrige qualquer vício, mesmo os insanáveis.' }, { id: 'B', texto: 'Corrige vícios SANÁVEIS (competência e forma, em regra), quando não houver prejuízo ao interesse público nem a terceiros.' }, { id: 'C', texto: 'É sinônimo de revogação.' }, { id: 'D', texto: 'Só pode ser feita pelo Judiciário.' }], gabarito: 'B', explicacao: { correta: 'CONVALIDAÇÃO: corrige vícios SANÁVEIS (competência e forma, em regra), sem prejuízo ao interesse público nem a terceiros. Pode ser feita pela própria Administração.', incorretas: { A: 'Só corrige vícios sanáveis.', C: 'É diferente de revogação.', D: 'Feita pela Administração.' }, conceitoCobrado: 'Convalidação.', pegadinha: 'Achar que corrige qualquer vício.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'convalidação'] },
    { id: 'Q-DID-DA-0038', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-07', subtema: 'Formas de prestação', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre as formas de delegação de serviços públicos, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'A concessão é ato administrativo precário e discricionário.' }, { id: 'B', texto: 'A permissão é contrato administrativo por prazo determinado.' }, { id: 'C', texto: 'A concessão é contrato administrativo, por prazo determinado, precedido de licitação; a permissão é ato administrativo, unilateral, discricionário e precário, também precedido de licitação.' }, { id: 'D', texto: 'A autorização exige licitação prévia e prazo determinado.' }], gabarito: 'C', explicacao: { correta: 'CONCESSÃO: contrato administrativo, prazo determinado, licitação. PERMISSÃO: ato administrativo, discricionário, precário, com licitação. AUTORIZAÇÃO: ato unilateral, precário, SEM licitação.', incorretas: { A: 'Concessão é contrato.', B: 'Permissão é ato administrativo.', D: 'Autorização não exige licitação.' }, conceitoCobrado: 'Concessão, permissão e autorização.', pegadinha: 'Confundir as três formas.', comoApareceEmConcurso: 'Alta frequência em DA.' }, tags: ['DA', 'serviços'] },
    { id: 'Q-DID-DA-0039', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-07', subtema: 'Continuidade', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a continuidade do serviço público, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É absoluta e nunca pode ser interrompida.' }, { id: 'B', texto: 'Não é absoluta: admite exceções legais, como razões técnicas, segurança das instalações e inadimplemento do usuário.' }, { id: 'C', texto: 'Só pode ser interrompida por ordem judicial.' }, { id: 'D', texto: 'Não existe como princípio.' }], gabarito: 'B', explicacao: { correta: 'A continuidade é princípio, mas NÃO é absoluta. Admite exceções: razões técnicas, segurança das instalações e inadimplemento do usuário (após aviso prévio).', incorretas: { A: 'Admite exceções.', C: 'Há exceções legais.', D: 'É princípio clássico.' }, conceitoCobrado: 'Continuidade do serviço público.', pegadinha: 'Achar que é absoluta.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'serviços'] },
    { id: 'Q-DID-DA-0040', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-07', subtema: 'Princípios do serviço público', dificuldade: 2, prioridade: 'alta', enunciado: 'O princípio que determina que o serviço público deve ser prestado a todos, sem discriminação ou privilégios, é o da:', alternativas: [{ id: 'A', texto: 'Continuidade.' }, { id: 'B', texto: 'Generalidade (ou universalidade).' }, { id: 'C', texto: 'Modicidade tarifária.' }, { id: 'D', texto: 'Cortesia.' }], gabarito: 'B', explicacao: { correta: 'GENERALIDADE (ou universalidade): o serviço deve atender a todos, sem discriminação.', incorretas: { A: 'Continuidade: não pode parar.', C: 'Modicidade: tarifa acessível.', D: 'Cortesia: tratamento educado.' }, conceitoCobrado: 'Princípios do serviço público.', pegadinha: 'Confundir generalidade com continuidade.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'serviços'] },
    { id: 'Q-DID-DA-0041', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-07', subtema: 'Formas de prestação', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a autorização de serviço público, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É contrato administrativo por prazo determinado, com licitação.' }, { id: 'B', texto: 'É ato unilateral, discricionário e precário, sem licitação, para serviços de pequeno porte ou emergenciais.' }, { id: 'C', texto: 'É sinônimo de concessão.' }, { id: 'D', texto: 'Exige sempre prazo superior a 10 anos.' }], gabarito: 'B', explicacao: { correta: 'AUTORIZAÇÃO: ato unilateral, discricionário, precário, SEM licitação, para serviços de pequeno porte ou emergenciais (ex.: banca de jornal).', incorretas: { A: 'Isso é a concessão.', C: 'Diferente da concessão.', D: 'Não tem prazo fixo.' }, conceitoCobrado: 'Autorização de serviço público.', pegadinha: 'Confundir com concessão.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'serviços'] },
    { id: 'Q-DID-DA-0042', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-07', subtema: 'Modicidade tarifária', dificuldade: 3, prioridade: 'média', enunciado: 'Sobre a modicidade tarifária, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Impede qualquer reajuste ou revisão de tarifas.' }, { id: 'B', texto: 'Exige que as tarifas sejam acessíveis, admitindo reajustes e revisões conforme contrato e lei.' }, { id: 'C', texto: 'Só se aplica ao setor privado.' }, { id: 'D', texto: 'É sinônimo de gratuidade.' }], gabarito: 'B', explicacao: { correta: 'MODICIDADE TARIFÁRIA: tarifas acessíveis ao usuário, com possibilidade de reajuste e revisão conforme contrato e lei.', incorretas: { A: 'Admite reajustes.', C: 'Aplica-se aos serviços públicos.', D: 'Não é gratuidade — é acessibilidade.' }, conceitoCobrado: 'Modicidade tarifária.', pegadinha: 'Confundir com gratuidade.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'serviços'] },
    { id: 'Q-DID-DA-0043', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-07', subtema: 'Prestação direta e indireta', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a prestação de serviços públicos, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Só pode ser direta, pelo próprio Estado.' }, { id: 'B', texto: 'Pode ser direta (órgãos), indireta por outorga (entidades) ou por delegação (concessão e permissão).' }, { id: 'C', texto: 'Só pode ser indireta.' }, { id: 'D', texto: 'Particulares nunca prestam serviços públicos.' }], gabarito: 'B', explicacao: { correta: 'Prestação: DIRETA (órgãos), INDIRETA por OUTORGA (entidades) ou por DELEGAÇÃO (concessão e permissão).', incorretas: { A: 'Há várias formas.', C: 'Há várias formas.', D: 'Particulares podem prestar por delegação.' }, conceitoCobrado: 'Formas de prestação de serviços públicos.', pegadinha: 'Reduzir a uma forma.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'serviços'] },
    { id: 'Q-DID-DA-0044', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-08', subtema: 'Pregão', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre o pregão na Lei 14.133/2021, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É usado exclusivamente para obras.' }, { id: 'B', texto: 'É obrigatório para aquisição de bens e contratação de serviços COMUNS.' }, { id: 'C', texto: 'Substituiu a concorrência.' }, { id: 'D', texto: 'Não admite forma eletrônica.' }], gabarito: 'B', explicacao: { correta: 'PREGÃO: obrigatório para bens e serviços COMUNS (objetivamente definíveis no edital). Admite forma eletrônica (preferencial).', incorretas: { A: 'Não é exclusivo para obras.', C: 'Não substituiu a concorrência.', D: 'Admite forma eletrônica.' }, conceitoCobrado: 'Pregão na Lei 14.133/2021.', pegadinha: 'Achar que é só para obras.', comoApareceEmConcurso: 'Cobrado em DA pós-2021.' }, tags: ['DA', 'licitação', 'pregão'] },
    { id: 'Q-DID-DA-0045', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-08', subtema: 'Contratação direta', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a contratação direta, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Dispensa decorre da impossibilidade de competição; inexigibilidade, da conveniência.' }, { id: 'B', texto: 'Inexigibilidade decorre da impossibilidade de competição; dispensa é hipótese legal mesmo com competição possível.' }, { id: 'C', texto: 'São sinônimos.' }, { id: 'D', texto: 'Dispensa é vedada pela Lei 14.133/2021.' }], gabarito: 'B', explicacao: { correta: 'INEXIGIBILIDADE: impossibilidade de competição (fornecedor exclusivo, artista consagrado). DISPENSA: hipóteses legais, com competição possível.', incorretas: { A: 'Inverte.', C: 'Não são sinônimos.', D: 'A Lei 14.133 prevê dispensa.' }, conceitoCobrado: 'Dispensa x inexigibilidade.', pegadinha: 'Trocar os conceitos.', comoApareceEmConcurso: 'Alta frequência em DA.' }, tags: ['DA', 'licitação'] },
    { id: 'Q-DID-DA-0046', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-08', subtema: 'Sanções', dificuldade: 2, prioridade: 'média', enunciado: 'São sanções previstas na Lei 14.133/2021:', alternativas: [{ id: 'A', texto: 'Apenas advertência e multa.' }, { id: 'B', texto: 'Advertência, multa, impedimento de licitar e contratar (até 3 anos) e declaração de inidoneidade (até 6 anos).' }, { id: 'C', texto: 'Prisão e reclusão.' }, { id: 'D', texto: 'Nenhuma sanção está prevista.' }], gabarito: 'B', explicacao: { correta: 'Sanções: ADVERTÊNCIA, MULTA, IMPEDIMENTO de licitar e contratar (até 3 anos) e DECLARAÇÃO DE INIDONEIDADE (até 6 anos).', incorretas: { A: 'Vai além.', C: 'Prisão é sanção penal, não administrativa.', D: 'Há sanções previstas.' }, conceitoCobrado: 'Sanções administrativas na Lei 14.133.', pegadinha: 'Confundir com sanções penais.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'licitação', 'sanções'] },
    { id: 'Q-DID-DA-0047', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-08', subtema: 'Modalidades', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a modalidade diálogo competitivo, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É prevista na Lei 8.666/1993.' }, { id: 'B', texto: 'É modalidade prevista na Lei 14.133/2021 para contratação de soluções inovadoras ou de alta complexidade técnica.' }, { id: 'C', texto: 'É sinônimo de pregão.' }, { id: 'D', texto: 'Só existe na iniciativa privada.' }], gabarito: 'B', explicacao: { correta: 'DIÁLOGO COMPETITIVO: modalidade NOVA da Lei 14.133/2021, para inovação tecnológica ou alta complexidade técnica.', incorretas: { A: 'Não existia na Lei 8.666.', C: 'É diferente do pregão.', D: 'É modalidade pública.' }, conceitoCobrado: 'Diálogo competitivo.', pegadinha: 'Confundir com pregão.', comoApareceEmConcurso: 'Cobrado em DA pós-2021.' }, tags: ['DA', 'licitação', 'diálogo'] },
    { id: 'Q-DID-DA-0048', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-09', subtema: 'Responsabilidade objetiva', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a responsabilidade civil do Estado em atos comissivos, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Exige prova de culpa do agente público.' }, { id: 'B', texto: 'É objetiva, bastando dano + nexo causal + conduta, conforme art. 37, §6º, da CF.' }, { id: 'C', texto: 'Não existe responsabilidade do Estado.' }, { id: 'D', texto: 'Depende sempre de decisão judicial prévia.' }], gabarito: 'B', explicacao: { correta: 'Art. 37, §6º, CF: pessoas jurídicas de direito público e de direito privado prestadoras de serviços públicos respondem OBJETIVAMENTE pelos danos de seus agentes a terceiros em atos comissivos.', incorretas: { A: 'Não exige culpa.', C: 'Existe.', D: 'Independe de decisão judicial prévia.' }, conceitoCobrado: 'Responsabilidade objetiva do Estado.', pegadinha: 'Achar que exige culpa.', comoApareceEmConcurso: 'Alta frequência em DA.' }, tags: ['DA', 'responsabilidade'] },
    { id: 'Q-DID-DA-0049', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-09', subtema: 'Ação regressiva', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a ação regressiva do Estado contra o agente público, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Dispensa comprovação de dolo ou culpa do agente.' }, { id: 'B', texto: 'Exige DOLO ou CULPA do agente, conforme art. 37, §6º, da CF.' }, { id: 'C', texto: 'Só cabe em caso de crime.' }, { id: 'D', texto: 'Não existe no Direito brasileiro.' }], gabarito: 'B', explicacao: { correta: 'Após indenizar o terceiro, o Estado pode ajuizar AÇÃO REGRESSIVA contra o agente, mas exige DOLO ou CULPA (art. 37, §6º, CF).', incorretas: { A: 'Exige dolo ou culpa.', C: 'Não é só crime.', D: 'Existe.' }, conceitoCobrado: 'Ação regressiva.', pegadinha: 'Achar que dispensa culpa.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'responsabilidade'] },
    { id: 'Q-DID-DA-0050', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-09', subtema: 'Excludentes', dificuldade: 2, prioridade: 'alta', enunciado: 'São excludentes da responsabilidade civil do Estado:', alternativas: [{ id: 'A', texto: 'Culpa exclusiva da vítima, fato exclusivo de terceiro e caso fortuito/força maior.' }, { id: 'B', texto: 'Somente a culpa exclusiva da vítima.' }, { id: 'C', texto: 'Qualquer ato do agente.' }, { id: 'D', texto: 'A falta de dolo do agente.' }], gabarito: 'A', explicacao: { correta: 'Excludentes: culpa EXCLUSIVA da vítima, fato EXCLUSIVO de terceiro e caso fortuito/força maior.', incorretas: { B: 'Vai além.', C: 'Não é excludente.', D: 'Falta de dolo não exclui a responsabilidade objetiva.' }, conceitoCobrado: 'Excludentes.', pegadinha: 'Confundir culpa concorrente com exclusiva.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'responsabilidade'] },
