<!DOCTYPE html>
<!--
Aplicativo: Administracao e Direito Administrativo para Concursos
Versao: 0.5
Fase: 5
Status: funcional
Changelog v0.5:
- Banco de questoes expandido de 12 para 35 questoes DIDATICAS
- Cobertura de 18 modulos de alta prioridade
- Nenhuma questao REAL (nao ha origem verificavel nesta fase)
- Nova tela "Banco de Questoes" com contadores REAL/DIDATICA
- Exportacao JSON de questoes e progresso
- Importacao JSON com validador: questao REAL sem
  banca/orgao/ano/prova/fonte e REJEITADA
- Botao "Carregar exemplo" para orientar formato de importacao
- Helpers qRealCount / qDidCount
Changelog v0.4:
- Motor de questoes completo
Changelog v0.3:
- 4 diagnosticos com analise por subtopico
Changelog v0.2:
- 4 aulas de alta prioridade; modo professor programado
Changelog v0.1:
- Estrutura base, dashboard, modulos, persistencia, navegacao
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN-DIR v0.5 — Administração e Direito Administrativo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f1f5f9; --surface: #ffffff; --surface-alt: #f8fafc;
    --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
    --primary: #2563eb; --primary-hover: #1d4ed8; --primary-soft: #dbeafe;
    --success: #16a34a; --success-soft: #dcfce7;
    --warning: #d97706; --warning-soft: #fef3c7;
    --danger: #dc2626; --danger-soft: #fee2e2;
    --purple: #7c3aed; --purple-soft: #f5f3ff;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 6px 20px rgba(15,23,42,.10);
  }

  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.55; font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    display: grid; grid-template-columns: 250px 1fr; grid-template-rows: 56px 1fr;
    grid-template-areas: "header header" "sidebar main"; min-height: 100vh;
  }

  .app-header {
    grid-area: header; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 12px;
    position: sticky; top: 0; z-index: 20;
  }
  .menu-toggle { display: none; background: none; border: none; font-size: 22px; cursor: pointer; padding: 6px 10px; border-radius: 8px; color: var(--text); }
  .menu-toggle:hover { background: var(--surface-alt); }
  .brand { display: flex; align-items: baseline; gap: 8px; font-weight: 700; font-size: 15px; }
  .brand .brand-sub { color: var(--text-muted); font-weight: 400; font-size: 12px; }
  .header-spacer { flex: 1; }
  .version-badge { background: var(--primary-soft); color: var(--primary); font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px; letter-spacing: .3px; }

  .sidebar { grid-area: sidebar; background: var(--surface); border-right: 1px solid var(--border); padding: 14px 10px; overflow-y: auto; }
  .nav-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); padding: 14px 12px 6px; font-weight: 700; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
    cursor: pointer; color: var(--text); font-size: 14px; margin-bottom: 2px;
    border: none; background: none; width: 100%; text-align: left; font-family: inherit;
    transition: background .12s ease;
  }
  .nav-item:hover { background: var(--surface-alt); }
  .nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .nav-item .nav-icon { width: 18px; text-align: center; font-size: 15px; flex-shrink: 0; }

  .main { grid-area: main; padding: 26px; overflow-y: auto; max-width: 1200px; width: 100%; }

  .page-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; letter-spacing: -.3px; }
  .page-subtitle { color: var(--text-muted); margin-bottom: 22px; font-size: 14px; }
  .section-title { font-size: 15px; font-weight: 700; margin: 26px 0 12px; letter-spacing: -.1px; }

  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 6px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .stat-card .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .stat-card .stat-value { font-size: 26px; font-weight: 700; margin-top: 6px; letter-spacing: -.5px; }
  .stat-card .stat-hint { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .filter-pill {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; font-size: 13px; font-family: inherit;
    color: var(--text); font-weight: 500;
  }
  .filter-pill:hover { background: var(--surface-alt); }
  .filter-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .filter-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 12px; }
  .filter-row label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
  .filter-row select {
    padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); font-family: inherit; font-size: 13.5px; color: var(--text);
    min-width: 170px;
  }

  .module-list { display: grid; gap: 8px; }
  .module-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; display: flex; align-items: center; gap: 14px;
    cursor: pointer; transition: border-color .12s ease, box-shadow .12s ease;
    text-align: left; width: 100%; font-family: inherit; color: inherit;
  }
  .module-card:hover { border-color: var(--primary); box-shadow: var(--shadow); }
  .module-card .mod-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; color: var(--text-muted); min-width: 62px; }
  .module-card .mod-info { flex: 1; min-width: 0; }
  .module-card .mod-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .module-card .mod-area { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .module-card .mod-badges { display: flex; gap: 6px; align-items: center; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .module-card .mod-priority { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: .4px; }
  .priority-alta { background: #fee2e2; color: #b91c1c; }
  .priority-media { background: #fed7aa; color: #c2410c; }
  .priority-baixa { background: #e2e8f0; color: #475569; }

  .badge-pill { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: .4px; }
  .badge-aula { background: var(--success-soft); color: var(--success); }
  .badge-diag { background: var(--purple-soft); color: var(--purple); }
  .badge-real { background: #dbeafe; color: #1e40af; }
  .badge-did { background: #fef3c7; color: #92400e; }
  .badge-facil { background: var(--success-soft); color: var(--success); }
  .badge-medio { background: var(--warning-soft); color: var(--warning); }
  .badge-dificil { background: var(--danger-soft); color: var(--danger); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 14px; font-family: inherit; cursor: pointer; font-weight: 500;
    transition: background .12s ease;
  }
  .btn:hover { background: var(--surface-alt); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-purple { background: var(--purple); color: #fff; border-color: var(--purple); }
  .btn-purple:hover { filter: brightness(.94); }
  .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn-danger:hover { filter: brightness(.94); }
  .btn-ghost { background: transparent; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .notice { background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); padding: 18px 20px; color: var(--text-muted); font-size: 14px; }
  .notice strong { color: var(--text); }

  .info-list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 18px; }
  .info-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .info-row:last-child { border-bottom: none; }
  .info-row .info-key { color: var(--text-muted); }
  .info-row .info-val { font-weight: 600; text-align: right; }

  .subtopic-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .subtopic-chip { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--text-muted); }

  .lesson-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 12px; }
  .lesson-block h3 { font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .lesson-block h3 .lb-icon { font-size: 16px; }
  .lesson-block p { margin-bottom: 10px; font-size: 14.5px; }
  .lesson-block p:last-child { margin-bottom: 0; }
  .lesson-block ul, .lesson-block ol { padding-left: 22px; margin-bottom: 8px; }
  .lesson-block li { margin-bottom: 6px; font-size: 14.5px; }
  .lesson-block.block-objetivo { border-left: 4px solid var(--primary); }
  .lesson-block.block-pegadinha { border-left: 4px solid var(--warning); background: #fffbeb; }
  .lesson-block.block-erros { border-left: 4px solid var(--danger); background: #fef2f2; }
  .lesson-block.block-resumo { border-left: 4px solid var(--success); background: #f0fdf4; }
  .lesson-block.block-aplicacao { border-left: 4px solid var(--purple); background: var(--purple-soft); }

  .compare-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
  .compare-table th, .compare-table td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .compare-table th { background: var(--surface-alt); font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-muted); }
  .compare-table tr:last-child td { border-bottom: none; }

  .prereq-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .prereq-tag { background: var(--primary-soft); color: var(--primary); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .professor-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .professor-answer { margin-top: 14px; padding: 14px 16px; border-left: 3px solid var(--primary); background: var(--surface-alt); border-radius: 6px; font-size: 14px; white-space: pre-wrap; }
  .professor-answer strong { display: block; margin-bottom: 6px; color: var(--primary); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }

  .lesson-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .lesson-toolbar .lt-left { display: flex; gap: 8px; flex-wrap: wrap; }
  .lesson-read-indicator { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--success-soft); color: var(--success); }
  .lesson-read-indicator.pending { background: var(--warning-soft); color: var(--warning); }

  .diag-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .diag-progress-bar { flex: 1; height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .diag-progress-fill { height: 100%; background: var(--purple); transition: width .25s ease; }
  .diag-progress-label { font-size: 13px; font-weight: 600; color: var(--text-muted); min-width: 70px; text-align: right; }
  .diag-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; }
  .diag-meta .tag { background: var(--purple-soft); color: var(--purple); padding: 3px 10px; border-radius: 999px; font-weight: 600; letter-spacing: .3px; }
  .diag-question { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 12px; }
  .diag-question h2 { font-size: 17px; font-weight: 600; line-height: 1.45; margin-bottom: 18px; letter-spacing: -.1px; }
  .diag-options { display: grid; gap: 8px; }
  .diag-option {
    display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
    cursor: pointer; font-family: inherit; text-align: left; font-size: 14.5px;
    color: var(--text); transition: border-color .12s ease, background .12s ease; line-height: 1.45;
  }
  .diag-option:hover:not(:disabled) { border-color: var(--purple); background: var(--purple-soft); }
  .diag-option:disabled { cursor: default; }
  .diag-option .opt-letter { font-weight: 700; min-width: 18px; color: var(--text-muted); }
  .diag-option.selected { border-color: var(--purple); background: var(--purple-soft); }
  .diag-option.correct { border-color: var(--success); background: var(--success-soft); }
  .diag-option.wrong { border-color: var(--danger); background: var(--danger-soft); }
  .diag-option.correct .opt-letter, .diag-option.wrong .opt-letter { color: var(--text); }

  .diag-feedback { margin-top: 18px; padding: 14px 16px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
  .diag-feedback.ok { background: var(--success-soft); border-left: 4px solid var(--success); }
  .diag-feedback.no { background: var(--danger-soft); border-left: 4px solid var(--danger); }
  .diag-feedback strong { display: block; margin-bottom: 6px; }

  .diag-actions { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .self-assess { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .self-assess .btn { padding: 12px 20px; font-size: 14.5px; }

  .result-summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .result-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .result-stat .rs-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .result-stat .rs-value { font-size: 22px; font-weight: 700; margin-top: 4px; }

  .subtopic-result { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 10px; border-left-width: 4px; border-left-style: solid; }
  .subtopic-result.status-conhecido { border-left-color: var(--success); }
  .subtopic-result.status-duvida { border-left-color: var(--warning); }
  .subtopic-result.status-desconhecido { border-left-color: var(--danger); }
  .subtopic-result h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .status-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: .4px; }
  .status-badge.status-conhecido { background: var(--success-soft); color: var(--success); }
  .status-badge.status-duvida { background: var(--warning-soft); color: var(--warning); }
  .status-badge.status-desconhecido { background: var(--danger-soft); color: var(--danger); }
  .subtopic-result .signals { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); margin: 6px 0 10px; }
  .subtopic-result .signals span strong { color: var(--text); }
  .subtopic-result .recommendation { font-size: 14px; line-height: 1.5; color: var(--text); }
  .subtopic-result .recommendation strong { color: var(--text); }

  .question-preview {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 8px;
  }
  .question-preview .qp-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .question-preview .qp-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; color: var(--text-muted); }
  .question-preview .qp-text { font-size: 14px; color: var(--text); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .question-preview .qp-meta { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .question-preview .qp-status { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: .4px; }
  .qp-status.qs-nova { background: var(--surface-alt); color: var(--text-muted); }
  .qp-status.qs-acerto { background: var(--success-soft); color: var(--success); }
  .qp-status.qs-erro { background: var(--danger-soft); color: var(--danger); }

  .run-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .run-toolbar .rt-info { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--text-muted); }

  .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 12px; }
  .q-card .q-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .q-card .q-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; color: var(--text-muted); }
  .q-card .q-statement { font-size: 16px; line-height: 1.55; font-weight: 500; margin-bottom: 18px; letter-spacing: -.1px; }
  .q-options { display: grid; gap: 8px; }
  .q-option {
    display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
    cursor: pointer; font-family: inherit; text-align: left; font-size: 14.5px;
    color: var(--text); transition: border-color .12s ease, background .12s ease;
    line-height: 1.45;
  }
  .q-option:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }
  .q-option:disabled { cursor: default; }
  .q-option .opt-letter { font-weight: 700; min-width: 20px; color: var(--text-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .q-option.selected { border-color: var(--primary); background: var(--primary-soft); }
  .q-option.correct { border-color: var(--success); background: var(--success-soft); }
  .q-option.wrong { border-color: var(--danger); background: var(--danger-soft); }

  .q-feedback { margin-top: 16px; padding: 14px 16px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
  .q-feedback.ok { background: var(--success-soft); border-left: 4px solid var(--success); }
  .q-feedback.no { background: var(--danger-soft); border-left: 4px solid var(--danger); }
  .q-feedback > strong { display: block; margin-bottom: 8px; font-size: 15px; }

  .explain-block { margin-top: 14px; padding: 14px 16px; background: var(--surface-alt); border-radius: 8px; border-left: 3px solid var(--primary); }
  .explain-block h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
  .explain-block p { font-size: 14px; line-height: 1.55; margin-bottom: 8px; color: var(--text); }
  .explain-block p:last-child { margin-bottom: 0; }
  .explain-block .distractor { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; line-height: 1.5; }
  .explain-block .distractor:last-child { border-bottom: none; }
  .explain-block .distractor .d-letter { font-weight: 700; color: var(--danger); min-width: 22px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .q-actions { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

  .type-banner {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--surface-alt); border-radius: 8px;
    border: 1px dashed var(--border); margin-bottom: 14px; font-size: 13px;
    color: var(--text-muted);
  }
  .type-banner strong { color: var(--text); }

  /* ===== Banco de questões (v0.5) ===== */
  .db-summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .db-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .db-stat .dbs-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .db-stat .dbs-value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .db-stat.dbs-real { border-left: 4px solid #1e40af; }
  .db-stat.dbs-did { border-left: 4px solid var(--warning); }
  .db-stat.dbs-total { border-left: 4px solid var(--primary); }

  .io-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 12px; }
  .io-box h3 { font-size: 14px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }

  .io-box textarea {

  /* ============================================================
     ESTADO
  ============================================================ */
  var AppState = null;
  var currentScreen = 'dashboard';
  var currentModuleId = null;
  var currentLessonId = null;
  var moduleFilter = 'todas';
  var professorAnswerOpen = null;
  var diagRunning = { moduleId: null, answers: {}, itemIndex: 0, revealed: {} };
  var questionFilter = { area: 'todas', moduloId: 'todos', dificuldade: 'todas', tipo: 'TODAS' };

  function createDefaultState() {
    var now = new Date().toISOString();
    return {
      schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION,
      createdAt: now, updatedAt: now,
      settings: { theme: 'light' },
      modules: {},
      questions: {},
      stats: { questoesRespondidas: 0, acertos: 0, erros: 0, flashcardsEstudados: 0, simuladosRealizados: 0, tempoEstudoMin: 0 },
      lastScreen: 'dashboard'
    };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return createDefaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return createDefaultState();
      var base = createDefaultState();
      return {
        schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION,
        createdAt: parsed.createdAt || base.createdAt,
        updatedAt: parsed.updatedAt || base.updatedAt,
        settings: Object.assign({}, base.settings, parsed.settings || {}),
        modules: parsed.modules || {},
        questions: parsed.questions || {},
        stats: Object.assign({}, base.stats, parsed.stats || {}),
        lastScreen: parsed.lastScreen || 'dashboard'
      };
    } catch (e) { console.error('[ADMIN-DIR] Falha ao ler estado:', e); return createDefaultState(); }
  }
  function saveState() {
    AppState.updatedAt = new Date().toISOString();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState)); }
    catch (e) { console.error('[ADMIN-DIR] Falha ao salvar estado:', e); }
  }

  function getModuleUserState(modId) {
    if (!AppState.modules[modId]) AppState.modules[modId] = { status: 'nao_iniciado', aulasLidas: [], diagnostico: null, dominioEstimado: 0, ultimaAtividade: null };
    if (!Array.isArray(AppState.modules[modId].aulasLidas)) AppState.modules[modId].aulasLidas = [];
    if (AppState.modules[modId].diagnostico === undefined) AppState.modules[modId].diagnostico = null;
    return AppState.modules[modId];
  }
  function getQuestionUserState(qid) {
    if (!AppState.questions[qid]) AppState.questions[qid] = { tentativas: 0, acertos: 0, erros: 0, ultimaResposta: null, ultimaCorreta: null, ultimaTentativa: null, status: 'nao_respondida', historico: [] };
    return AppState.questions[qid];
  }

  /* ============================================================
     HELPERS
  ============================================================ */
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function getModule(modId) { for (var i = 0; i < MODULES.length; i++) if (MODULES[i].id === modId) return MODULES[i]; return null; }
  function getLessonByModuleId(modId) { return LESSONS[modId] || null; }
  function getLessonById(lessonId) { for (var k in LESSONS) if (LESSONS.hasOwnProperty(k) && LESSONS[k].id === lessonId) return LESSONS[k]; return null; }
  function getDiagnosticByModuleId(modId) { return DIAGNOSTICS[modId] || null; }
  function getQuestion(qid) { for (var i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].id === qid) return QUESTIONS[i]; return null; }
  function formatDate(iso) { if (!iso) return '—'; try { return new Date(iso).toLocaleString('pt-BR'); } catch (e) { return iso; } }
  function isObjective(item) { return item.tipo === 'multipla_escolha' || item.tipo === 'verdadeiro_falso' || item.tipo === 'situacao'; }
  function difficultyLabel(d) { return DIFFICULTY_LABELS[d] || ('Nível ' + d); }
  function typeLabel(t) { return t === 'REAL' ? 'Real' : 'Didática'; }
  function typeBadgeClass(t) { return t === 'REAL' ? 'badge-real' : 'badge-did'; }
  function qRealCount() { var n = 0; for (var i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].tipo === 'REAL') n++; return n; }
  function qDidCount() { var n = 0; for (var i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].tipo === 'DIDATICA') n++; return n; }
  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  /* ============================================================
     ANALISE DO DIAGNOSTICO
  ============================================================ */
  function computeDiagnosticResult(moduleId, answers) {
    var diag = getDiagnosticByModuleId(moduleId);
    if (!diag) return null;
    var bySubtopic = {}, totalPontos = 0, totalSinais = 0;
    for (var i = 0; i < diag.itens.length; i++) {
      var item = diag.itens[i];
      var sub = item.subtopico;
      if (!bySubtopic[sub]) bySubtopic[sub] = { acertos: 0, erros: 0, sabia: 0, nao_sabia: 0, total: 0 };
      var resp = answers[item.id];
      bySubtopic[sub].total += 1;
      if (isObjective(item)) {
        if (resp === item.gabarito) { bySubtopic[sub].acertos += 1; totalPontos += 1; } else bySubtopic[sub].erros += 1;
        totalSinais += 1;
      } else if (item.tipo === 'autoavaliacao') {
        if (resp === 'sabia') { bySubtopic[sub].sabia += 1; totalPontos += 1; } else if (resp === 'nao_sabia') bySubtopic[sub].nao_sabia += 1;
        totalSinais += 1;
      }
    }
    var result = { bySubtopic: {} };
    for (var subName in bySubtopic) {
      if (!bySubtopic.hasOwnProperty(subName)) continue;
      var s = bySubtopic[subName];
      var positivos = s.acertos + s.sabia, negativos = s.erros + s.nao_sabia;
      var status;
      if (s.erros === 0 && s.nao_sabia === 0 && positivos >= 1) status = 'conhecido';
      else if (positivos === 0 && negativos >= 1) status = 'desconhecido';
      else status = 'duvida';
      var rec;
      if (status === 'conhecido') rec = 'Você demonstra bom domínio neste subtópico. Siga para a aula (revisão) e mantenha revisões periódicas.';
      else if (status === 'duvida') rec = 'Há base, mas o domínio é parcial. Estude a aula com atenção, foque nos exemplos e nas comparações, e refaça este diagnóstico depois de revisar.';
      else rec = 'Trate este subtópico como prioridade. Estude a aula desde o início, sem pular a explicação simples. Refaça o diagnóstico em seguida.';
      result.bySubtopic[subName] = { status: status, acertos: s.acertos, erros: s.erros, sabia: s.sabia, nao_sabia: s.nao_sabia, total: s.total, recommendation: rec };
    }
    var dominio = 0;
    if (totalSinais > 0) {
      dominio = totalPontos / totalSinais;
      if (negativosNoTotal(bySubtopic) > 0) dominio = dominio * 0.9;
      dominio = Math.max(0, Math.min(1, dominio));
    }
    result.dominioEstimado = Math.round(dominio * 100) / 100;
    result.completedAt = new Date().toISOString();
    return result;
  }
  function negativosNoTotal(bySubtopic) { var n = 0; for (var k in bySubtopic) if (bySubtopic.hasOwnProperty(k)) n += bySubtopic[k].erros + bySubtopic[k].nao_sabia; return n; }

  /* ============================================================
     MOTOR DE QUESTOES
  ============================================================ */
  function filterQuestions() {
    return QUESTIONS.filter(function (q) {
      if (questionFilter.area !== 'todas' && q.area !== questionFilter.area) return false;
      if (questionFilter.moduloId !== 'todos' && q.moduloId !== questionFilter.moduloId) return false;
      if (questionFilter.dificuldade !== 'todas' && q.dificuldade !== Number(questionFilter.dificuldade)) return false;
      if (questionFilter.tipo !== 'TODAS' && q.tipo !== questionFilter.tipo) return false;
      return true;
    });
  }
  function startQuestionSession() {
    var list = filterQuestions();
    if (list.length === 0) { window.alert('Nenhuma questão corresponde aos filtros escolhidos.'); return; }
    var ids = shuffleArray(list.map(function (q) { return q.id; }));
    questionRunning = { ids: ids, index: 0, respostas: {}, revealed: {}, startedAt: new Date().toISOString() };
    navigate('questao-run');
  }
  function answerQuestion(altId) {
    if (!questionRunning) return;
    var qid = questionRunning.ids[questionRunning.index];
    if (Object.prototype.hasOwnProperty.call(questionRunning.respostas, qid)) return;
    questionRunning.respostas[qid] = altId;
    questionRunning.revealed[qid] = true;
    var q = getQuestion(qid);
    if (!q) return;
    var qs = getQuestionUserState(qid);
    var correta = altId === q.gabarito;
    qs.tentativas += 1;
    if (correta) qs.acertos += 1; else qs.erros += 1;
    qs.ultimaResposta = altId; qs.ultimaCorreta = correta; qs.ultimaTentativa = new Date().toISOString();
    qs.status = correta ? 'acerto' : 'erro';
    qs.historico.push({ data: qs.ultimaTentativa, resposta: altId, correta: correta });
    if (qs.historico.length > 30) qs.historico = qs.historico.slice(-30);
    AppState.stats.questoesRespondidas += 1;
    if (correta) AppState.stats.acertos += 1; else AppState.stats.erros += 1;
    var st = getModuleUserState(q.moduloId);
    if (st.status === 'nao_iniciado') st.status = 'em_estudo';
    st.ultimaAtividade = new Date().toISOString();
    saveState();
    render();
  }
  function nextQuestion() { if (questionRunning && questionRunning.index < questionRunning.ids.length - 1) { questionRunning.index += 1; render(); var main = document.getElementById('main'); if (main) main.scrollTop = 0; } }
  function prevQuestion() { if (questionRunning && questionRunning.index > 0) { questionRunning.index -= 1; render(); var main = document.getElementById('main'); if (main) main.scrollTop = 0; } }
  function cancelQuestionSession() {
    var ok = window.confirm('Cancelar a sessão? As respostas já registradas serão mantidas no histórico.');
    if (!ok) return;
    questionRunning = null; navigate('questoes');
  }
  function finishQuestionSession() {
    if (!questionRunning) return;
    var sess = questionRunning;
    questionRunning = null;
    window.__lastSession = sess;
    navigate('questao-result');
  }

  /* ============================================================
     NAVEGACAO
  ============================================================ */
  var VALID_SCREENS = ['dashboard','modulos','modulo-detalhe','licao','diagnostico','diag-resultado','questoes','questao-run','questao-result','banco-questoes','configuracoes','sobre'];

  function navigate(screen, opts) {
    opts = opts || {};
    if (VALID_SCREENS.indexOf(screen) === -1) screen = 'dashboard';
    currentScreen = screen;
    if (screen === 'modulo-detalhe') currentModuleId = opts.moduleId || currentModuleId;
    if (screen === 'licao') {
      currentLessonId = opts.lessonId || currentLessonId;
      if (currentLessonId) { var lesson = getLessonById(currentLessonId); if (lesson) currentModuleId = lesson.moduloId; }
    }
    if (screen === 'diagnostico' || screen === 'diag-resultado') { if (opts.moduleId) currentModuleId = opts.moduleId; }
    AppState.lastScreen = screen;
    saveState();
    document.body.classList.remove('sidebar-open');
    professorAnswerOpen = null;
    render();
    var main = document.getElementById('main');
    if (main) main.scrollTop = 0;
  }

  /* ============================================================
     RENDER
  ============================================================ */
  function render() {
    renderSidebarActive(); renderMain();
    var badge = document.getElementById('appVersionBadge');
    if (badge) badge.textContent = 'v' + APP_VERSION;
  }
  function renderSidebarActive() {
    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      var target = items[i].getAttribute('data-nav');
      var active = (target === currentScreen) ||
        (currentScreen === 'modulo-detalhe' && target === 'modulos') ||
        (currentScreen === 'licao' && target === 'modulos') ||
        (currentScreen === 'diagnostico' && target === 'modulos') ||
        (currentScreen === 'diag-resultado' && target === 'modulos') ||
        (currentScreen === 'questao-run' && target === 'questoes') ||
        (currentScreen === 'questao-result' && target === 'questoes');
      items[i].classList.toggle('active', active);
    }
  }
  function renderMain() {
    var main = document.getElementById('main');
    if (!main) return;
    var html = '';
    switch (currentScreen) {
      case 'dashboard': html = renderDashboard(); break;
      case 'modulos': html = renderModules(); break;
      case 'modulo-detalhe': html = renderModuleDetail(); break;
      case 'licao': html = renderLesson(); break;
      case 'diagnostico': html = renderDiagnosticRunning(); break;
      case 'diag-resultado': html = renderDiagnosticResult(); break;
      case 'questoes': html = renderQuestions(); break;
      case 'questao-run': html = renderQuestionRun(); break;
      case 'questao-result': html = renderQuestionResult(); break;
      case 'banco-questoes': html = renderQuestionBank(); break;
      case 'configuracoes': html = renderSettings(); break;
      case 'sobre': html = renderAbout(); break;
      default: html = renderDashboard();
    }
    main.innerHTML = html;
  }

  function renderDashboard() {
    var stats = AppState.stats;
    var taxa = stats.questoesRespondidas > 0 ? Math.round((stats.acertos / stats.questoesRespondidas) * 100) : 0;
    var totalModulos = MODULES.length;
    var emEstudo = 0, concluidos = 0;
    for (var i = 0; i < MODULES.length; i++) {
      var st = getModuleUserState(MODULES[i].id);
      if (st.status === 'em_estudo') emEstudo++;
      if (st.status === 'concluido') concluidos++;
    }
    var diagFeitos = 0;
    for (var d = 0; d < MODULES.length; d++) { var dst = AppState.modules[MODULES[d].id]; if (dst && dst.diagnostico) diagFeitos++; }
    var diagDisponiveis = Object.keys(DIAGNOSTICS).length;
    var qRespondidas = Object.keys(AppState.questions).length;
    var qTotal = QUESTIONS.length;
    var qReal = qRealCount(), qDid = qDidCount();

    var sugestoes = [];
    for (var j = 0; j < MODULES.length && sugestoes.length < 3; j++) {
      var m = MODULES[j];
      if (m.prioridade !== 'alta') continue;
      if (!getDiagnosticByModuleId(m.id) && !getLessonByModuleId(m.id)) continue;
      var ms = getModuleUserState(m.id);
      if (ms.status === 'concluido') continue;
      sugestoes.push(m);
    }

    var html = '';
    html += '<h1 class="page-title">Dashboard</h1>';
    html += '<p class="page-subtitle">Visão geral do seu progresso. Dados salvos localmente no navegador.</p>';
    html += '<div class="cards-grid">';
    html += statCard('Questões respondidas', stats.questoesRespondidas, qReal + ' reais · ' + qDid + ' didáticas');
    html += statCard('Taxa de acerto', taxa + '%', stats.acertos + ' acertos / ' + stats.erros + ' erros');
    html += statCard('Diagnósticos feitos', diagFeitos + ' / ' + diagDisponiveis, 'Fase 3 — análise por subtópico');
    html += statCard('Módulos em estudo', emEstudo + ' / ' + totalModulos, concluidos + ' concluído(s)');
    html += '</div>';

    html += '<h2 class="section-title">O que estudar hoje?</h2>';
    if (sugestoes.length === 0) html += '<div class="notice"><strong>Sem sugestões ainda.</strong></div>';
    else {
      html += '<div class="module-list">';
      for (var s = 0; s < sugestoes.length; s++) html += moduleCardHtml(sugestoes[s]);
      html += '</div>';
    }

    html += '<h2 class="section-title">Aviso desta versão</h2>';
    html += '<div class="notice">' +
      '<strong>Fase 5 — Banco de questões.</strong> O banco contém <strong>' + qTotal + ' questões didáticas</strong> ' +
      'cobrindo 18 módulos de alta prioridade. ' +
      '<em>Nenhuma questão está marcada como REAL</em> — a classificação REAL exige banca, órgão, ano, prova e fonte verificáveis, ' +
      'conforme regra do projeto. Use a tela <strong>Banco de Questões</strong> para importar questões reais com origem confirmada ' +
      'ou exportar o banco atual.' +
      '</div>';

    html += footerHtml();
    return html;
  }

  function statCard(label, value, hint) {
    return '<div class="stat-card"><div class="stat-label">' + esc(label) + '</div><div class="stat-value">' + esc(value) + '</div>' + (hint ? '<div class="stat-hint">' + esc(hint) + '</div>' : '') + '</div>';
  }

  function renderModules() {
    var areas = ['todas', 'ADM', 'AP', 'DA'];
    var pills = '';
    for (var i = 0; i < areas.length; i++) {
      var a = areas[i];
      var label = a === 'todas' ? 'Todos' : AREA_LABELS[a];
      var active = (moduleFilter === a) ? ' active' : '';
      pills += '<button class="filter-pill' + active + '" data-filter="' + a + '">' + esc(label) + '</button>';
    }
    var filtered = MODULES.filter(function (m) { return moduleFilter === 'todas' || m.area === moduleFilter; });
    var html = '';
    html += '<h1 class="page-title">Módulos</h1>';
    html += '<p class="page-subtitle">' + filtered.length + ' módulo(s) listado(s). IDs permanentes — o histórico é preservado mesmo quando o texto muda.</p>';
    html += '<div class="filters">' + pills + '</div>';
    if (filtered.length === 0) html += '<div class="notice">Nenhum módulo nesta área.</div>';
    else {
      html += '<div class="module-list">';
      for (var j = 0; j < filtered.length; j++) html += moduleCardHtml(filtered[j]);
      html += '</div>';
    }
    html += footerHtml();
    return html;
  }

  function moduleCardHtml(m) {
    var areaLabel = AREA_LABELS[m.area] || m.area;
    var pLabel = PRIORITY_LABELS[m.prioridade] || m.prioridade;
    var hasLesson = !!getLessonByModuleId(m.id);
    var hasDiag = !!getDiagnosticByModuleId(m.id);
    var qCount = 0;
    for (var i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].moduloId === m.id) qCount++;
    var badges = '';
    if (hasLesson) badges += '<span class="badge-pill badge-aula">Aula</span>';
    if (hasDiag) badges += '<span class="badge-pill badge-diag">Diagnóstico</span>';
    if (qCount > 0) badges += '<span class="badge-pill badge-real">' + qCount + ' questão(ões)</span>';
    return '<button class="module-card" data-action="open-module" data-module-id="' + esc(m.id) + '">' +
      '<span class="mod-id">' + esc(m.id) + '</span>' +
      '<span class="mod-info"><span class="mod-title">' + esc(m.titulo) + '</span><span class="mod-area">' + esc(areaLabel) + '</span></span>' +
      '<span class="mod-badges">' + badges + '<span class="mod-priority priority-' + esc(m.prioridade) + '">' + esc(pLabel) + '</span></span>' +
    '</button>';
  }

  function renderModuleDetail() {
    var m = getModule(currentModuleId);
    if (!m) return '<h1 class="page-title">Módulo não encontrado</h1><button class="btn" data-nav="modulos">← Voltar</button>';
    var st = getModuleUserState(m.id);
    var areaLabel = AREA_LABELS[m.area] || m.area;
    var pLabel = PRIORITY_LABELS[m.prioridade] || m.prioridade;
    var lesson = getLessonByModuleId(m.id);
    var diag = getDiagnosticByModuleId(m.id);
    var lessonRead = lesson && (st.aulasLidas || []).indexOf(lesson.id) !== -1;
    var diagDone = !!st.diagnostico;
    var moduleQuestions = QUESTIONS.filter(function (q) { return q.moduloId === m.id; });
    var qDone = 0, qAcc = 0, qErr = 0;
    for (var qi = 0; qi < moduleQuestions.length; qi++) {
      var qs = AppState.questions[moduleQuestions[qi].id];
      if (qs && qs.tentativas > 0) { qDone++; qAcc += qs.acertos; qErr += qs.erros; }
    }
    var chips = '';
    for (var i = 0; i < m.subtopicos.length; i++) chips += '<span class="subtopic-chip">' + esc(m.subtopicos[i]) + '</span>';

    var html = '';
    html += '<button class="btn" data-nav="modulos" style="margin-bottom:16px;">← Voltar aos módulos</button>';
    html += '<h1 class="page-title">' + esc(m.id) + ' — ' + esc(m.titulo) + '</h1>';
    html += '<p class="page-subtitle">' + esc(areaLabel) + ' · Prioridade: ' + esc(pLabel) + '</p>';
    html += '<div class="info-list">';
    html += infoRow('Status', statusLabel(st.status));
    html += infoRow('Domínio estimado', Math.round((st.dominioEstimado || 0) * 100) + '%');
    html += infoRow('Última atividade', st.ultimaAtividade ? formatDate(st.ultimaAtividade) : '—');
    html += infoRow('Aulas lidas', (st.aulasLidas || []).length + (lesson ? ' / 1' : ' / 0'));
    if (diagDone) html += infoRow('Diagnóstico', 'Feito em ' + formatDate(st.diagnostico.completedAt));
    else if (diag) html += infoRow('Diagnóstico', 'Disponível');
    else html += infoRow('Diagnóstico', '—');
    html += infoRow('Questões', moduleQuestions.length + ' cadastrada(s) · ' + qDone + ' vista(s) · ' + qAcc + ' acerto(s) / ' + qErr + ' erro(s)');
    html += '</div>';

    html += '<h2 class="section-title">Subtópicos</h2><div class="subtopic-list">' + chips + '</div>';

    html += '<h2 class="section-title">Conteúdo pedagógico</h2>';
    if (lesson) {
      html += '<div class="lesson-block"><h3><span class="lb-icon">📘</span> Aula: ' + esc(lesson.id) + '</h3>';
      html += '<p>' + esc(lesson.objetivo) + '</p>';
      html += '<div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">';
      html += '<button class="btn btn-primary" data-action="open-lesson" data-lesson-id="' + esc(lesson.id) + '">Estudar aula →</button>';
      html += lessonRead ? '<span class="lesson-read-indicator">✓ Lida</span>' : '<span class="lesson-read-indicator pending">Não lida</span>';
      html += '</div></div>';
    } else html += '<div class="notice"><strong>Aula ainda não cadastrada.</strong></div>';

    html += '<h2 class="section-title">Diagnóstico</h2>';
    if (diag) {
      html += '<div class="lesson-block" style="border-left:4px solid var(--purple);"><h3><span class="lb-icon">🧪</span> Diagnóstico ' + esc(diag.id) + '</h3>';
      html += '<p>' + diag.itens.length + ' itens. Análise por subtópico.</p>';
      if (diagDone) {
        var resumo = summarizeResult(st.diagnostico.result || {});
        html += '<p style="margin-top:6px;font-size:13px;color:var(--text-muted);">Conhecidos: ' + resumo.conhecido + ' · Em dúvida: ' + resumo.duvida + ' · Desconhecidos: ' + resumo.desconhecido + '</p>';
        html += '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">';
        html += '<button class="btn btn-purple" data-action="open-diag-result" data-module-id="' + esc(m.id) + '">Ver resultado</button>';
        html += '<button class="btn" data-action="refazer-diag" data-module-id="' + esc(m.id) + '">Refazer diagnóstico</button></div>';
      } else {
        html += '<div style="margin-top:12px;"><button class="btn btn-purple" data-action="start-diag" data-module-id="' + esc(m.id) + '">Fazer diagnóstico →</button></div>';
      }
      html += '</div>';
    } else html += '<div class="notice"><strong>Diagnóstico ainda não cadastrado.</strong></div>';

    html += '<h2 class="section-title">Questões deste módulo</h2>';
    if (moduleQuestions.length > 0) {
      html += '<div class="notice">' + moduleQuestions.length + ' questão(ões) disponíveis. ';
      html += '<button class="btn btn-primary" style="margin-top:10px;" data-action="questions-by-module" data-module-id="' + esc(m.id) + '">Praticar questões deste módulo →</button>';
      html += '</div>';
    } else html += '<div class="notice">Nenhuma questão cadastrada para este módulo ainda.</div>';

    html += footerHtml();
    return html;
  }
  function summarizeResult(result) {
    var c = 0, d = 0, x = 0;
    var bs = result.bySubtopic || {};
    for (var k in bs) {
      if (!bs.hasOwnProperty(k)) continue;
      if (bs[k].status === 'conhecido') c++;
      else if (bs[k].status === 'duvida') d++;
      else if (bs[k].status === 'desconhecido') x++;
    }
    return { conhecido: c, duvida: d, desconhecido: x };
  }
  function infoRow(key, value) { return '<div class="info-row"><span class="info-key">' + esc(key) + '</span><span class="info-val">' + esc(value) + '</span></div>'; }
  function statusLabel(s) { var map = { 'nao_iniciado': 'Não iniciado', 'em_estudo': 'Em estudo', 'concluido': 'Concluído' }; return map[s] || s || 'Não iniciado'; }

  function renderLesson() {
    var lesson = currentLessonId ? getLessonById(currentLessonId) : null;
    if (!lesson) return '<h1 class="page-title">Aula não encontrada</h1><button class="btn" data-nav="modulos">← Voltar</button>';
    var m = getModule(lesson.moduloId);
    var st = m ? getModuleUserState(m.id) : null;
    var wasRead = st && (st.aulasLidas || []).indexOf(lesson.id) !== -1;
    var html = '';
    html += '<div class="lesson-toolbar"><div class="lt-left">';
    html += '<button class="btn" data-action="open-module" data-module-id="' + esc(lesson.moduloId) + '">← Módulo ' + esc(lesson.moduloId) + '</button>';
    html += '<button class="btn" data-nav="modulos">📚 Módulos</button>';
    html += '</div><div class="lt-right">';
    html += wasRead ? '<span class="lesson-read-indicator">✓ Aula lida</span>' : '<button class="btn btn-primary" data-action="mark-lesson-read" data-lesson-id="' + esc(lesson.id) + '">Marcar como lida</button>';
    html += '</div></div>';
    html += '<h1 class="page-title">' + esc(m ? m.titulo : lesson.moduloId) + '</h1>';
    html += '<p class="page-subtitle">Aula ' + esc(lesson.id) + ' · Módulo ' + esc(lesson.moduloId) + '</p>';
    html += '<div class="lesson-block block-objetivo"><h3><span class="lb-icon">🎯</span> Objetivo</h3><p>' + esc(lesson.objetivo) + '</p>';
    if (lesson.prerequisitos && lesson.prerequisitos.length) {
      var ptags = '';
      for (var i = 0; i < lesson.prerequisitos.length; i++) ptags += '<span class="prereq-tag">' + esc(lesson.prerequisitos[i]) + '</span>';
      html += '<p style="margin-top:8px;font-size:13px;color:var(--text-muted);">Pré-requisitos:</p><div class="prereq-list">' + ptags + '</div>';
    }
    html += '</div>';
    html += '<div class="lesson-block"><h3><span class="lb-icon">📖</span> Introdução</h3><p>' + esc(lesson.introducao) + '</p></div>';
    html += '<div class="lesson-block"><h3><span class="lb-icon">💡</span> Explicação simples</h3><p>' + esc(lesson.explicacaoSimples) + '</p></div>';
    html += '<div class="lesson-block"><h3><span class="lb-icon">📐</span> Explicação técnica</h3><p>' + esc(lesson.explicacaoTecnica) + '</p></div>';
    if (lesson.exemplos && lesson.exemplos.length) {
      html += '<div class="lesson-block"><h3><span class="lb-icon">🔎</span> Exemplos</h3><ul>';
      for (var e = 0; e < lesson.exemplos.length; e++) html += '<li>' + esc(lesson.exemplos[e]) + '</li>';
      html += '</ul></div>';
    }
    if (lesson.comparacoes && lesson.comparacoes.length) {
      html += '<div class="lesson-block"><h3><span class="lb-icon">⚖️</span> Comparações</h3>';
      html += '<table class="compare-table"><thead><tr><th>Conceito A</th><th>Conceito B</th><th>Diferença-chave</th></tr></thead><tbody>';
      for (var c = 0; c < lesson.comparacoes.length; c++) {
        var cp = lesson.comparacoes[c];
        html += '<tr><td>' + esc(cp.termoA) + '</td><td>' + esc(cp.termoB) + '</td><td>' + esc(cp.diferenca) + '</td></tr>';
      }
      html += '</tbody></table></div>';
    }
    if (lesson.aplicacaoAdministracaoPublica) html += '<div class="lesson-block block-aplicacao"><h3><span class="lb-icon">🏛️</span> Aplicação na Administração Pública</h3><p>' + esc(lesson.aplicacaoAdministracaoPublica) + '</p></div>';
    if (lesson.pegadinhas && lesson.pegadinhas.length) {
      html += '<div class="lesson-block block-pegadinha"><h3><span class="lb-icon">⚠️</span> Pegadinhas de concurso</h3><ul>';
      for (var p = 0; p < lesson.pegadinhas.length; p++) html += '<li>' + esc(lesson.pegadinhas[p]) + '</li>';
      html += '</ul></div>';
    }
    if (lesson.errosComuns && lesson.errosComuns.length) {
      html += '<div class="lesson-block block-erros"><h3><span class="lb-icon">🚫</span> Erros comuns</h3><ul>';
      for (var er = 0; er < lesson.errosComuns.length; er++) html += '<li>' + esc(lesson.errosComuns[er]) + '</li>';
      html += '</ul></div>';
    }
    if (lesson.resumo && lesson.resumo.length) {
      html += '<div class="lesson-block block-resumo"><h3><span class="lb-icon">✅</span> Resumo</h3><ul>';
      for (var r = 0; r < lesson.resumo.length; r++) html += '<li>' + esc(lesson.resumo[r]) + '</li>';
      html += '</ul></div>';
    }
    html += renderProfessorBlock(lesson);
    html += footerHtml();
    return html;
  }

  function renderProfessorBlock(lesson) {
    var mp = lesson.modoProfessor || {};
    var actions = [
      { key: 'explicarMaisSimples', label: 'Explique de forma mais simples' },
      { key: 'outroExemplo', label: 'Mostre outro exemplo' },
      { key: 'compararConceitos', label: 'Compare os conceitos' },
      { key: 'mostrarPegadinha', label: 'Mostre uma pegadinha' },
      { key: 'comoApareceEmConcurso', label: 'Como aparece em concurso' },
      { key: 'fazerPergunta', label: 'Faça uma pergunta sobre isso' }
    ];
    var html = '';
    html += '<div class="lesson-block"><h3><span class="lb-icon">🧑‍🏫</span> Modo professor (conteúdo programado)</h3>';
    html += '<p style="font-size:13px;color:var(--text-muted);">Escolha uma das ações abaixo. Este app não usa IA externa.</p>';
    html += '<div class="professor-actions">';
    for (var i = 0; i < actions.length; i++) {
      var a = actions[i];
      var disabled = !mp[a.key];
      html += '<button class="btn btn-ghost" data-action="professor-answer" data-lesson-id="' + esc(lesson.id) + '" data-key="' + esc(a.key) + '"' + (disabled ? ' disabled' : '') + '>' + esc(a.label) + '</button>';
    }
    html += '</div>';
    if (professorAnswerOpen && professorAnswerOpen.lessonId === lesson.id) {
      var key = professorAnswerOpen.key;
      var content = '';
      if (key === 'fazerPergunta' && mp.fazerPergunta) content = 'Pergunta: ' + mp.fazerPergunta.pergunta + '\n\nResposta: ' + mp.fazerPergunta.resposta;
      else content = mp[key] || '';
      html += '<div class="professor-answer"><strong>Resposta programada</strong>' + esc(content) + '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderDiagnosticRunning() {
    var moduleId = diagRunning.moduleId;
    var diag = getDiagnosticByModuleId(moduleId);
    if (!diag) return '<h1 class="page-title">Diagnóstico não encontrado</h1><button class="btn" data-nav="modulos">← Voltar</button>';
    var m = getModule(moduleId);
    var idx = diagRunning.itemIndex, total = diag.itens.length;
    if (idx < 0) idx = 0; if (idx >= total) idx = total - 1;
    var item = diag.itens[idx];
    var answered = Object.prototype.hasOwnProperty.call(diagRunning.answers, item.id);
    var userAnswer = diagRunning.answers[item.id];
    var percent = Math.round((idx / total) * 100);
    var html = '';
    html += '<div class="diag-progress"><div class="diag-progress-bar"><div class="diag-progress-fill" style="width:' + percent + '%"></div></div><div class="diag-progress-label">Item ' + (idx + 1) + ' / ' + total + '</div></div>';
    html += '<h1 class="page-title">Diagnóstico — ' + esc(m ? m.titulo : moduleId) + '</h1>';
    html += '<p class="page-subtitle">Módulo ' + esc(moduleId) + ' · ' + esc(DIAG_TYPE_LABELS[item.tipo] || item.tipo) + '</p>';
    html += '<div class="diag-meta"><span class="tag">Subtópico: ' + esc(item.subtopico) + '</span><span class="tag">' + esc(DIAG_TYPE_LABELS[item.tipo] || item.tipo) + '</span></div>';
    html += '<div class="diag-question"><h2>' + esc(item.pergunta) + '</h2>';
    if (isObjective(item)) {
      html += '<div class="diag-options">';
      for (var a = 0; a < item.alternativas.length; a++) {
        var alt = item.alternativas[a];
        var cls = 'diag-option';
        if (answered) { if (alt.id === item.gabarito) cls += ' correct'; else if (alt.id === userAnswer) cls += ' wrong'; }
        else if (alt.id === userAnswer) cls += ' selected';
        html += '<button class="' + cls + '" data-action="diag-answer" data-alt="' + esc(alt.id) + '"' + (answered ? ' disabled' : '') + '><span class="opt-letter">' + esc(alt.id) + '</span><span>' + esc(alt.texto) + '</span></button>';
      }
      html += '</div>';
      if (answered) {
        var acertou = userAnswer === item.gabarito;
        html += '<div class="diag-feedback ' + (acertou ? 'ok' : 'no') + '"><strong>' + (acertou ? '✓ Correto' : '✗ Incorreto') + '</strong>' + esc(item.explicacao) + '</div>';
      }
    } else if (item.tipo === 'autoavaliacao') {
      html += '<p style="color:var(--text-muted);font-size:14px;margin-bottom:8px;">Marque com sinceridade.</p>';
      if (answered) {
        html += '<div class="diag-feedback ' + (userAnswer === 'sabia' ? 'ok' : 'no') + '"><strong>' + (userAnswer === 'sabia' ? 'Você marcou: Eu sabia' : 'Você marcou: Eu não sabia') + '</strong>Gabarito conceitual: ' + esc(item.resposta) + '</div>';
      } else {
        html += '<div class="self-assess"><button class="btn btn-primary" data-action="diag-answer" data-alt="sabia">Eu sabia</button><button class="btn" data-action="diag-answer" data-alt="nao_sabia">Eu não sabia</button></div>';
      }
    }
    html += '<div class="diag-actions"><div>';
    html += idx > 0 ? '<button class="btn" data-action="diag-prev">← Item anterior</button>' : '<button class="btn" data-action="diag-cancel">Cancelar</button>';
    html += '</div><div>';

    else if (answered && idx === total - 1) html += '<button class="btn btn-purple" data-action="diag-finish">Finalizar diagnóstico →</button>';

  function renderDiagnosticResult() {
    var moduleId = currentModuleId;
    var m = getModule(moduleId);
    if (!m) return '<h1 class="page-title">Módulo não encontrado</h1><button class="btn" data-nav="modulos">← Voltar</button>';
    var st = getModuleUserState(moduleId);
    if (!st.diagnostico || !st.diagnostico.result) return '<h1 class="page-title">Nenhum diagnóstico registrado</h1><button class="btn btn-primary" data-action="start-diag" data-module-id="' + esc(moduleId) + '">Fazer diagnóstico</button>';
    var r = st.diagnostico.result, bs = r.bySubtopic || {};
    var subtopicos = [];
    for (var k in bs) if (bs.hasOwnProperty(k)) subtopicos.push(k);
    subtopicos.sort(function (a, b) {
      var order = { 'desconhecido': 0, 'duvida': 1, 'conhecido': 2 };
      return (order[bs[a].status] || 9) - (order[bs[b].status] || 9);
    });
    var resumo = summarizeResult(r);
    var totalSub = subtopicos.length;
    var html = '';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;">';
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn" data-action="open-module" data-module-id="' + esc(moduleId) + '">← Módulo ' + esc(moduleId) + '</button><button class="btn" data-nav="modulos">📚 Módulos</button></div>';
    html += '<div><button class="btn btn-purple" data-action="refazer-diag" data-module-id="' + esc(moduleId) + '">Refazer diagnóstico</button></div></div>';
    html += '<h1 class="page-title">Resultado do diagnóstico</h1>';
    html += '<p class="page-subtitle">' + esc(m.id) + ' — ' + esc(m.titulo) + ' · Concluído em ' + esc(formatDate(r.completedAt)) + '</p>';
    html += '<div class="result-summary">';
    html += resultStat('Subtópicos avaliados', totalSub);
    html += resultStat('Conhecidos', resumo.conhecido);
    html += resultStat('Em dúvida', resumo.duvida);
    html += resultStat('Desconhecidos', resumo.desconhecido);
    html += resultStat('Domínio estimado', Math.round((r.dominioEstimado || 0) * 100) + '%');
    html += '</div>';
    html += '<h2 class="section-title">Análise por subtópico</h2>';
    html += '<p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">O status é calculado cruzando acertos, erros e autoavaliação — não é apenas percentual.</p>';
    for (var i = 0; i < subtopicos.length; i++) {
      var sub = subtopicos[i], d = bs[sub];
      html += '<div class="subtopic-result status-' + esc(d.status) + '">';
      html += '<h3>' + esc(sub) + '<span class="status-badge status-' + esc(d.status) + '">' + esc(STATUS_LABELS[d.status]) + '</span></h3>';
      html += '<div class="signals"><span>Acertos: <strong>' + d.acertos + '</strong></span><span>Erros: <strong>' + d.erros + '</strong></span>';
      if (d.sabia > 0 || d.nao_sabia > 0) html += '<span>Autoavaliação — sabia: <strong>' + d.sabia + '</strong> / não sabia: <strong>' + d.nao_sabia + '</strong></span>';
      html += '</div><div class="recommendation">' + esc(d.recommendation) + '</div></div>';
    }
    html += '<h2 class="section-title">Próximos passos</h2><div class="notice">';
    if (resumo.desconhecido > 0) html += '<strong>Prioridade alta.</strong> Você tem ' + resumo.desconhecido + ' subtópico(s) desconhecido(s). Estude a aula desde o início e refaça o diagnóstico.';
    else if (resumo.duvida > 0) html += '<strong>Reforço recomendado.</strong> ' + resumo.duvida + ' subtópico(s) em dúvida. Releia a aula e refaça este diagnóstico.';
    else html += '<strong>Bom desempenho.</strong> Todos os subtópicos foram classificados como conhecidos.';
    html += '</div>';
    html += '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">';
    var lesson = getLessonByModuleId(moduleId);
    if (lesson) html += '<button class="btn btn-primary" data-action="open-lesson" data-lesson-id="' + esc(lesson.id) + '">Estudar aula →</button>';
    html += '<button class="btn" data-action="start-diag" data-module-id="' + esc(moduleId) + '">Refazer agora</button>';
    html += '</div>';
    html += footerHtml();
    return html;
  }
  function resultStat(label, value) { return '<div class="result-stat"><div class="rs-label">' + esc(label) + '</div><div class="rs-value">' + esc(value) + '</div></div>'; }

  function renderQuestions() {
    var areas = ['todas', 'ADM', 'AP', 'DA'];
    var areaPills = '';
    for (var i = 0; i < areas.length; i++) {
      var a = areas[i];
      var label = a === 'todas' ? 'Todas as áreas' : AREA_LABELS[a];
      var active = (questionFilter.area === a) ? ' active' : '';
      areaPills += '<button class="filter-pill' + active + '" data-qf-area="' + a + '">' + esc(label) + '</button>';
    }
    var moduleOptions = '<option value="todos">Todos os módulos</option>';

      var mo = MODULES[j];

      if (!hasQ) continue;
      var sel = questionFilter.moduloId === mo.id ? ' selected' : '';
      moduleOptions += '<option value="' + esc(mo.id) + '"' + sel + '>' + esc(mo.id + ' — ' + mo.titulo) + '</option>';
    }
    var diffOptions = '';
    var diffs = [['todas','Todas as dificuldades'], ['1','Fácil'], ['2','Médio'], ['3','Difícil']];
    for (var d = 0; d < diffs.length; d++) {
      var sel2 = questionFilter.dificuldade === diffs[d][0] ? ' selected' : '';
      diffOptions += '<option value="' + diffs[d][0] + '"' + sel2 + '>' + esc(diffs[d][1]) + '</option>';
    }
    var tipoOptions = '';
    var tipos = [['TODAS','Todas'], ['DIDATICA','Somente didáticas'], ['REAL','Somente reais']];
    for (var t = 0; t < tipos.length; t++) {
      var sel3 = questionFilter.tipo === tipos[t][0] ? ' selected' : '';
      tipoOptions += '<option value="' + tipos[t][0] + '"' + sel3 + '>' + esc(tipos[t][1]) + '</option>';
    }
    var filtered = filterQuestions();
    var html = '';
    html += '<h1 class="page-title">Questões</h1>';
    html += '<p class="page-subtitle">Motor de questões — filtros, correção, explicação pedagógica estruturada, histórico e desempenho.</p>';
    html += '<div class="type-banner"><span class="badge-pill badge-did">DIDÁTICA</span><span>O banco atual contém <strong>' + QUESTIONS.length + ' questões didáticas</strong>. ';
    html += 'Nenhuma foi classificada como <strong>REAL</strong> porque não há origem verificável. ';
    html += 'Use a tela <strong>Banco de Questões</strong> para importar reais com banca, órgão, ano, prova e fonte.</span></div>';
    html += '<h2 class="section-title">Filtros</h2>';
    html += '<div class="filters">' + areaPills + '</div>';
    html += '<div class="filter-row">';
    html += '<label>Módulo</label><select id="qFilterModulo">' + moduleOptions + '</select>';
    html += '<label>Dificuldade</label><select id="qFilterDificuldade">' + diffOptions + '</select>';
    html += '<label>Tipo</label><select id="qFilterTipo">' + tipoOptions + '</select>';
    html += '</div>';
    html += '<div style="margin:14px 0;">';
    html += '<button class="btn btn-primary" data-action="start-question-session"' + (filtered.length === 0 ? ' disabled' : '') + '>▶ Iniciar sessão (' + filtered.length + ' questão(ões))</button>';
    html += '</div>';
    html += '<h2 class="section-title">Prévia das questões (' + filtered.length + ')</h2>';
    if (filtered.length === 0) html += '<div class="notice">Nenhuma questão corresponde aos filtros escolhidos.</div>';
    else {
      for (var p = 0; p < filtered.length; p++) {
        var q = filtered[p];
        var qs = AppState.questions[q.id];
        var statusClass = 'qs-nova', statusText = 'Nova';
        if (qs && qs.tentativas > 0) {
          if (qs.status === 'acerto') { statusClass = 'qs-acerto'; statusText = 'Acerto · ' + qs.acertos + '/' + qs.tentativas; }
          else if (qs.status === 'erro') { statusClass = 'qs-erro'; statusText = 'Erro · ' + qs.acertos + '/' + qs.tentativas; }
        }
        html += '<div class="question-preview">';
        html += '<div class="qp-header">';
        html += '<span class="qp-id">' + esc(q.id) + '</span>';
        html += '<span class="badge-pill ' + typeBadgeClass(q.tipo) + '">' + esc(typeLabel(q.tipo)) + '</span>';
        html += '<span class="badge-pill ' + (DIFFICULTY_CLASS[q.dificuldade] || '') + '">' + esc(difficultyLabel(q.dificuldade)) + '</span>';
        html += '<span class="qp-status ' + statusClass + '">' + esc(statusText) + '</span>';
        html += '</div>';
        html += '<div class="qp-text">' + esc(q.enunciado) + '</div>';
        html += '<div class="qp-meta">' + esc(q.moduloId + ' · ' + (getModule(q.moduloId) ? getModule(q.moduloId).titulo : '') + ' · ' + q.subtema) + '</div>';
        html += '</div>';
      }
    }
    html += footerHtml();
    return html;
  }

  function renderQuestionRun() {
    if (!questionRunning) return '<h1 class="page-title">Sessão não iniciada</h1><button class="btn btn-primary" data-nav="questoes">Ir para Questões</button>';
    var total = questionRunning.ids.length;
    var idx = questionRunning.index;
    var qid = questionRunning.ids[idx];
    var q = getQuestion(qid);
    if (!q) return '<h1 class="page-title">Questão não encontrada</h1><button class="btn" data-nav="questoes">← Questões</button>';
    var answered = Object.prototype.hasOwnProperty.call(questionRunning.respostas, qid);
    var userAnswer = questionRunning.respostas[qid];
    var percent = Math.round(((idx + (answered ? 1 : 0)) / total) * 100);
    var html = '';
    html += '<div class="run-toolbar"><div class="rt-info"><span>Sessão · Questão ' + (idx + 1) + ' de ' + total + '</span><span class="badge-pill ' + typeBadgeClass(q.tipo) + '">' + esc(typeLabel(q.tipo)) + '</span><span class="badge-pill ' + (DIFFICULTY_CLASS[q.dificuldade] || '') + '">' + esc(difficultyLabel(q.dificuldade)) + '</span></div>';
    html += '<button class="btn" data-action="cancel-question-session">Cancelar sessão</button></div>';
    html += '<div class="diag-progress"><div class="diag-progress-bar"><div class="diag-progress-fill" style="width:' + percent + '%"></div></div><div class="diag-progress-label">' + (idx + 1) + ' / ' + total + '</div></div>';
    html += '<div class="q-card">';
    html += '<div class="q-head"><span class="q-id">' + esc(q.id) + '</span>';
    html += '<span class="badge-pill ' + typeBadgeClass(q.tipo) + '">' + esc(typeLabel(q.tipo)) + '</span>';
    if (q.tipo === 'REAL') html += '<span style="font-size:12px;color:var(--text-muted);">' + esc(q.banca + ' · ' + q.orgao + ' · ' + q.ano) + '</span>';
    else html += '<span style="font-size:12px;color:var(--text-muted);">' + esc(q.moduloId + ' · ' + q.subtema) + '</span>';
    html += '</div>';
    html += '<div class="q-statement">' + esc(q.enunciado) + '</div>';
    html += '<div class="q-options">';
    for (var a = 0; a < q.alternativas.length; a++) {
      var alt = q.alternativas[a];
      var cls = 'q-option';
      if (answered) { if (alt.id === q.gabarito) cls += ' correct'; else if (alt.id === userAnswer) cls += ' wrong'; }
      else if (alt.id === userAnswer) cls += ' selected';
      html += '<button class="' + cls + '" data-action="answer-question" data-alt="' + esc(alt.id) + '"' + (answered ? ' disabled' : '') + '><span class="opt-letter">' + esc(alt.id) + '</span><span>' + esc(alt.texto) + '</span></button>';
    }
    html += '</div>';
    if (answered) {
      var acertou = userAnswer === q.gabarito;
      html += '<div class="q-feedback ' + (acertou ? 'ok' : 'no') + '">';
      html += '<strong>' + (acertou ? '✓ Você acertou' : '✗ Você errou') + '</strong>';
      html += 'Resposta correta: <strong>' + esc(q.gabarito) + '</strong>. Sua resposta: <strong>' + esc(userAnswer) + '</strong>.';
      html += '</div>';
      var ex = q.explicacao || {};
      html += '<div class="explain-block"><h4>Por que a correta está correta</h4><p>' + esc(ex.correta || '') + '</p></div>';
      html += '<div class="explain-block"><h4>Por que as demais estão erradas</h4>';
      var inc = ex.incorretas || {};
      for (var key in inc) { if (!inc.hasOwnProperty(key)) continue; html += '<div class="distractor"><span class="d-letter">' + esc(key) + '</span><span>' + esc(inc[key]) + '</span></div>'; }
      html += '</div>';
      html += '<div class="explain-block"><h4>Conceito cobrado</h4><p>' + esc(ex.conceitoCobrado || '') + '</p></div>';
      html += '<div class="explain-block"><h4>Pegadinha</h4><p>' + esc(ex.pegadinha || '') + '</p></div>';
      html += '<div class="explain-block"><h4>Como aparece em concurso</h4><p>' + esc(ex.comoApareceEmConcurso || '') + '</p></div>';
    }
    html += '<div class="q-actions"><div>';
    if (idx > 0) html += '<button class="btn" data-action="prev-question">← Questão anterior</button>';
    html += '</div><div>';
    if (answered && idx < total - 1) html += '<button class="btn btn-primary" data-action="next-question">Próxima →</button>';
    else if (answered && idx === total - 1) html += '<button class="btn btn-purple" data-action="finish-question-session">Finalizar sessão →</button>';
    html += '</div></div>';
    html += '</div>';
    html += footerHtml();
    return html;
  }

  function renderQuestionResult() {
    var sess = window.__lastSession;
    if (!sess) return '<h1 class="page-title">Nenhum resultado disponível</h1><button class="btn btn-primary" data-nav="questoes">Ir para Questões</button>';
    var ids = sess.ids, total = ids.length;
    var acertos = 0, erros = 0;
    var porModulo = {}, porDificuldade = {}, porTipo = {};
    for (var i = 0; i < ids.length; i++) {
      var q = getQuestion(ids[i]);
      if (!q) continue;
      var resp = sess.respostas[ids[i]];
      var acertou = resp === q.gabarito;
      if (acertou) acertos++; else erros++;
      if (!porModulo[q.moduloId]) porModulo[q.moduloId] = { total: 0, acertos: 0 };
      porModulo[q.moduloId].total++; if (acertou) porModulo[q.moduloId].acertos++;
      var dl = difficultyLabel(q.dificuldade);
      if (!porDificuldade[dl]) porDificuldade[dl] = { total: 0, acertos: 0 };
      porDificuldade[dl].total++; if (acertou) porDificuldade[dl].acertos++;
      if (!porTipo[q.tipo]) porTipo[q.tipo] = { total: 0, acertos: 0 };
      porTipo[q.tipo].total++; if (acertou) porTipo[q.tipo].acertos++;
    }
    var pct = total > 0 ? Math.round((acertos / total) * 100) : 0;
    var html = '';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;">';
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn" data-nav="questoes">← Questões</button></div>';
    html += '</div>';
    html += '<h1 class="page-title">Resultado da sessão</h1>';
    html += '<p class="page-subtitle">Sessão iniciada em ' + esc(formatDate(sess.startedAt)) + '</p>';
    html += '<div class="result-summary">';
    html += resultStat('Questões', total);
    html += resultStat('Acertos', acertos);
    html += resultStat('Erros', erros);
    html += resultStat('Aproveitamento', pct + '%');
    html += '</div>';
    html += '<h2 class="section-title">Desempenho por módulo</h2>';
    html += renderBreakdown(porModulo, function (k) { var m = getModule(k); return k + (m ? ' — ' + m.titulo : ''); });
    html += '<h2 class="section-title">Desempenho por dificuldade</h2>';
    html += renderBreakdown(porDificuldade, function (k) { return k; });
    html += '<h2 class="section-title">Desempenho por tipo de questão</h2>';
    html += renderBreakdown(porTipo, function (k) { return typeLabel(k); });
    html += '<h2 class="section-title">Detalhe por questão</h2>';
    for (var j = 0; j < ids.length; j++) {
      var qq = getQuestion(ids[j]);
      if (!qq) continue;
      var rr = sess.respostas[ids[j]];
      var ok = rr === qq.gabarito;
      html += '<div class="question-preview">';
      html += '<div class="qp-header">';
      html += '<span class="qp-id">' + esc(qq.id) + '</span>';
      html += '<span class="badge-pill ' + typeBadgeClass(qq.tipo) + '">' + esc(typeLabel(qq.tipo)) + '</span>';
      html += '<span class="qp-status ' + (ok ? 'qs-acerto' : 'qs-erro') + '">' + (ok ? '✓ Acerto' : '✗ Erro') + '</span>';
      html += '</div>';
      html += '<div class="qp-text">' + esc(qq.enunciado) + '</div>';
      html += '<div class="qp-meta">Sua resposta: <strong>' + esc(rr || '—') + '</strong> · Gabarito: <strong>' + esc(qq.gabarito) + '</strong></div>';
      html += '</div>';
    }
    html += '<div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;">';
    html += '<button class="btn btn-primary" data-nav="questoes">Nova sessão →</button>';
    html += '</div>';
    html += footerHtml();
    return html;
  }
  function renderBreakdown(map, labelFn) {
    var html = '';
    for (var k in map) {
      if (!map.hasOwnProperty(k)) continue;
      var d = map[k];
      var pct = d.total > 0 ? Math.round((d.acertos / d.total) * 100) : 0;
      var status = pct >= 70 ? 'status-conhecido' : (pct >= 40 ? 'status-duvida' : 'status-desconhecido');
      html += '<div class="subtopic-result ' + status + '">';
      html += '<h3>' + esc(labelFn(k)) + '<span class="status-badge ' + status + '">' + pct + '%</span></h3>';
      html += '<div class="signals"><span>Acertos: <strong>' + d.acertos + '</strong> / ' + d.total + '</span></div>';
      html += '</div>';
    }
    return html;
  }

     BANCO DE QUESTOES (v0.5)
