    'ADM-06': {
      id: 'L-ADM-06',
      moduloId: 'ADM-06',
      objetivo: 'Compreender a função administrativa de Controle: seu conceito, etapas, tipos (preventivo, simultâneo e posterior), padrões, indicadores, avaliação de desempenho e correção de desvios. Fechar o ciclo PODC.',
      prerequisitos: ['ADM-02'],
      introducao: 'Controle é verificar se o que foi planejado está sendo executado conforme o esperado e corrigir os desvios. Fecha o ciclo PODC e alimenta novo planejamento — o ciclo é contínuo.',
      explicacaoSimples: 'Imagine dirigir um carro: o painel mostra velocidade, combustível e temperatura (padrões). Você compara com o que quer (velocidade segura, combustível suficiente). Se algo está fora, corrige (acelera, freia, abastece). Isso é controle: medir, comparar e corrigir.',
      explicacaoTecnica: 'Controle é a função administrativa que verifica e corrige o desempenho para assegurar que os objetivos sejam alcançados. Quatro etapas: (1) estabelecimento de PADRÕES de desempenho; (2) MONITORAMENTO do desempenho real; (3) COMPARAÇÃO entre real e padrão; (4) AÇÃO CORRETIVA se houver desvio. Tipos quanto ao momento: PREVENTIVO (antes — ex.: treinamento, seleção), SIMULTÂNEO (durante — ex.: supervisão direta) e POSTERIOR (depois — ex.: auditoria, avaliação de resultados). Ferramentas: indicadores, auditoria, balanced scorecard. O controle é contínuo e cíclico — retroalimenta o planejamento.',
      exemplos: [
        'Padrão: tempo máximo de 30 minutos para atendimento no guichê.',
        'Monitoramento: sistema registra o tempo de cada atendimento.',
        'Comparação: média semanal de 45 minutos → acima do padrão.',
        'Ação corretiva: redistribuir servidores nos horários de pico e treinar a equipe.'
      ],
      comparacoes: [
        { termoA: 'Planejamento', termoB: 'Controle', diferenca: 'Planejamento define o que fazer e os padrões. Controle verifica se está sendo feito e corrige. O controle usa o padrão que veio do planejamento — sem padrão, não há controle.' },
        { termoA: 'Controle preventivo', termoB: 'Controle posterior', diferenca: 'Preventivo (antes): age na causa para evitar o desvio. Posterior (depois): identifica o desvio já ocorrido e corrige. O simultâneo atua durante a execução.' },
        { termoA: 'Controle', termoB: 'Avaliação', diferenca: 'Controle é o processo geral (medir, comparar, corrigir). Avaliação é um instrumento do controle: atribuir valor/juízo ao desempenho observado.' }
      ],
      aplicacaoAdministracaoPublica: 'Na Administração Pública, o controle é intenso e obrigatório: interno (controladorias, corregedorias, CGU), externo (Tribunais de Contas, Ministério Público, Poder Legislativo, Judiciário). A Lei 8.429/1992 (improbidade), a Lei 9.784/1999 (processo administrativo) e a Lei de Responsabilidade Fiscal (LC 101/2000) reforçam o controle. A autotutela (Súmulas 346 e 473/STF) é manifestação do controle administrativo: a Administração anula atos ilegais e revoga os inconvenientes.',
      pegadinhas: [
        'Dizer que controle é a última etapa do PODC e nunca volta ao planejamento. ERRADO. O controle retroalimenta o planejamento — o ciclo é contínuo.',
        'Confundir controle com fiscalização. Fiscalização é apenas uma das formas de controle (controle durante a execução).',
        'Achar que o controle elimina a necessidade de planejamento. Ele pressupõe o planejamento — sem padrão, não há controle.',
        'Confundir controle interno com externo. Interno: dentro do órgão. Externo: por outro Poder ou instituição autônoma.'
      ],
      errosComuns: [
        'Decorar as etapas sem saber aplicá-las a uma situação prática.',
        'Confundir controle preventivo com posterior.',
        'Achar que no setor público só existe controle posterior.'
      ],
      resumo: [
        'Controle verifica se o planejado está sendo executado e corrige desvios.',
        'Quatro etapas: padrão → monitoramento → comparação → ação corretiva.',
        'Tipos: preventivo (antes), simultâneo (durante), posterior (depois).',
        'É contínuo e retroalimenta o planejamento — fecha o ciclo PODC.',
        'Na Administração Pública: controle interno e externo (Tribunais de Contas, MP, Judiciário).'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Controle é dirigir o carro olhando o painel: você sabe onde quer chegar, olha os ponteiros, compara e corrige. Sem painel, você dirige no escuro.',
        outroExemplo: 'Uma escola pública quer 90% de aprovação. Padrão: 90%. Monitora bimestralmente as notas. Compara: 75% no 1º bimestre. Ação corretiva: reforço escolar e reunião com pais. Ao fim do ano, refaz o planejamento com base no resultado.',
        compararConceitos: 'Planejar = definir padrão. Controlar = verificar se o real bate com o padrão. Preventivo = antes. Simultâneo = durante. Posterior = depois.',
        mostrarPegadinha: 'Cuidado: "O controle é a última etapa do processo administrativo, sem retorno às fases anteriores". ERRADO. Ele retroalimenta o planejamento — o ciclo é contínuo.',
        comoApareceEmConcurso: 'Cai como: (1) identificar a etapa do controle em uma situação; (2) classificar o tipo (preventivo/simultâneo/posterior); (3) diferença entre controle interno e externo (ligado a DA).',
        fazerPergunta: {
          pergunta: 'Uma prefeitura faz auditoria em contratos já encerrados e identifica desvios. Que tipo de controle foi exercido?',
          resposta: 'CONTROLE POSTERIOR — atua depois que os fatos ocorreram. O controle preventivo seria antes (ex.: treinamento, seleção); o simultâneo, durante (ex.: supervisão em tempo real).'

    'ADM-07': {
      id: 'L-ADM-07',
      moduloId: 'ADM-07',
      objetivo: 'Compreender a Gestão de Pessoas: conceito, recrutamento, seleção, treinamento, desenvolvimento, avaliação de desempenho e gestão por competências. Foco nas etapas clássicas de provisão e aplicação de pessoas.',
      prerequisitos: ['ADM-01'],
      introducao: 'Gestão de Pessoas é o conjunto de políticas e práticas para atrair, desenvolver, motivar e manter pessoas na organização. Na Administração Pública, tem regras próprias (concurso público, estágio probatório, avaliação de desempenho, etc.).',
      explicacaoSimples: 'Gerir pessoas é como montar e cuidar de um time: atrair bons candidatos (recrutamento), escolher o melhor para cada posição (seleção), treinar (capacitação), acompanhar (avaliação) e desenvolver para que cresça (desenvolvimento). Tudo com foco em competências.',
      explicacaoTecnica: 'Gestão de Pessoas (ou Gestão de RH) é a área que cuida do capital humano: provisão (recrutamento e seleção), aplicação (cargos, funções, desenho de trabalho), manutenção (benefícios, higiene e segurança), desenvolvimento (treinamento, capacitação, carreira) e monitoração (avaliação de desempenho, banco de talentos). Conceitos-chave: RECRUTAMENTO atrai candidatos (interno ou externo); SELEÇÃO escolhe o mais adequado ao cargo; TREINAMENTO prepara para a tarefa atual; DESENVOLVIMENTO prepara para o futuro; AVALIAÇÃO DE DESEMPENHO mede o resultado do servidor. Gestão por competências: alinha conhecimentos (saber), habilidades (saber fazer) e atitudes (querer fazer) com os objetivos da organização.',
      exemplos: [
        'Recrutamento externo: publicação de edital de concurso público.',
        'Seleção: prova objetiva, prova discursiva e prova de títulos.',
        'Treinamento: curso de atendimento ao público para novos servidores.',
        'Desenvolvimento: programa de formação de lideranças para servidores experientes.',
        'Gestão por competências: mapear competências necessárias ao cargo e treinar o servidor para desenvolvê-las.'
      ],
      comparacoes: [
        { termoA: 'Recrutamento', termoB: 'Seleção', diferenca: 'Recrutamento atrai/divulga a vaga para conseguir candidatos. Seleção escolhe, entre os candidatos, o mais adequado ao perfil do cargo. Primeiro vem recrutamento; depois, seleção.' },
        { termoA: 'Treinamento', termoB: 'Desenvolvimento', diferenca: 'Treinamento é de curto prazo e foca o cargo atual (preparar para a tarefa). Desenvolvimento é de longo prazo e foca a carreira (preparar para o futuro, novas funções).' },
        { termoA: 'Recrutamento interno', termoB: 'Recrutamento externo', diferenca: 'Interno: busca candidatos dentro da própria organização (movimenta servidores, aproveita experiência). Externo: busca no mercado (traz ideias novas). No serviço público, a regra é concurso público — recrutamento externo obrigatório (art. 37, II, CF).' }
      ],
      aplicacaoAdministracaoPublica: 'Na Administração Pública, a Gestão de Pessoas segue regime jurídico próprio. O concurso público (art. 37, II, CF) é a regra para provimento de cargos efetivos. A Lei 8.112/1990 (federal) traz provimento, vacância, remoção, redistribuição, licenças, avaliação de desempenho e estágio probatório. O Decreto 5.707/2006 instituiu a Política Nacional de Desenvolvimento de Pessoal (PNDP), com foco em gestão por competências. A avaliação de desempenho é obrigatória para progressão em muitas carreiras.',
      pegadinhas: [
        'Trocar recrutamento e seleção. Recrutamento atrai; seleção escolhe.',
        'Confundir treinamento com desenvolvimento. Treinamento é para o cargo atual; desenvolvimento é para a carreira.',
        'Achar que recrutamento interno é sinônimo de "apadrinhamento". Não é — é movimentação dentro da carreira.',
        'Dizer que no Brasil é permitido provimento de cargo efetivo sem concurso público. É vedado — salvo cargos em comissão (livre nomeação) e contratações temporárias em hipóteses específicas.'
      ],
      errosComuns: [
        'Confundir as etapas de provisão (recrutamento e seleção).',
        'Achar que avaliação de desempenho serve apenas para punir.',
        'Ignorar que gestão por competências envolve CHA (Conhecimento, Habilidade, Atitude).'
      ],
      resumo: [
        'Gestão de Pessoas cuida do capital humano: atrair, desenvolver, motivar e manter.',
        'Recrutamento atrai; seleção escolhe.',
        'Treinamento prepara para o cargo atual; desenvolvimento prepara para o futuro.',
        'Avaliação de desempenho mede resultados e orienta o desenvolvimento.',
        'Gestão por competências: alinha CHA (Conhecimento, Habilidade, Atitude) aos objetivos da organização.',
        'No serviço público, concurso público é a regra para cargos efetivos (art. 37, II, CF).'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Gerir pessoas é como formar um time: atrair candidatos (recrutamento), escolher o melhor para cada posição (seleção), treinar (capacitação) e desenvolver (fazer crescer). Tudo com foco nas competências necessárias.',
        outroExemplo: 'Uma prefeitura abre concurso para assistente (recrutamento externo). Prova objetiva, discursiva e títulos (seleção). Curso de integração na posse (treinamento). Programa de formação de gestores (desenvolvimento). Avaliação anual (desempenho).',
        compararConceitos: 'Recrutar = atrair. Selecionar = escolher. Treinar = preparar para a tarefa atual. Desenvolver = preparar para o futuro. Avaliar = medir desempenho. Gerir por competências = alinhar CHA ao objetivo.',
        mostrarPegadinha: 'Cuidado: "O treinamento prepara o servidor para funções futuras, enquanto o desenvolvimento foca o cargo atual". ERRADO — é o INVERSO. Treinamento = cargo atual; desenvolvimento = futuro.',
        comoApareceEmConcurso: 'Cai como correspondência entre situação e etapa (recrutamento, seleção, treinamento, desenvolvimento). Também aparece sobre concurso público e avaliação de desempenho no serviço público.',

    'DA-06': {
      id: 'L-DA-06',
      moduloId: 'DA-06',
      objetivo: 'Dominar o conceito, os atributos, os elementos, a classificação e as formas de extinção do ato administrativo. Distinguir anulação de revogação e compreender a convalidação. Assunto de altíssima frequência em concursos.',
      prerequisitos: ['DA-05'],
      introducao: 'O ato administrativo é a manifestação unilateral da Administração Pública que produz efeitos jurídicos imediatos, sob regime de direito público. É o principal instrumento de atuação do Estado e tema campeão em provas.',
      explicacaoSimples: 'Quando a Administração toma uma decisão que afeta alguém — nomeia um servidor, aplica uma multa, interdita um estabelecimento, concede uma licença — ela está praticando um ato administrativo. É uma decisão que produz efeitos jurídicos concretos.',
      explicacaoTecnica: 'Ato administrativo é a manifestação unilateral da Administração Pública, no exercício de prerrogativas públicas, que produz efeitos jurídicos imediatos, sujeita ao regime de direito público e sujeita a controle. ATRIBUTOS (PATI): Presunção de legitimidade (os atos se presumem válidos até prova em contrário), Autoexecutoriedade (a Administração executa diretamente, sem precisar do Judiciário — ex.: interdição), Tipicidade (o ato deve corresponder a uma figura legal), Imperatividade (a Administração impõe o ato unilateralmente ao administrado). ELEMENTOS (Competência, Finalidade, Forma, Motivo, Objeto) — o famoso COFOMOB ou "eu não fiz nem farei". EXTINÇÃO: ANULAÇÃO (ato ilegal — efeitos EX TUNC, retroage) e REVOGAÇÃO (ato discricionário por conveniência e oportunidade — efeitos EX NUNC, não retroage; só atos discricionários podem ser revogados). CONVALIDAÇÃO: correção de vícios sanáveis (competência e forma, quando não houver prejuízo).',
      exemplos: [
        'Nomeação: ato administrativo que provê cargo público.',
        'Licença para construir: ato vinculado concedido ao particular.',
        'Interdição de estabelecimento: ato administrativo com autoexecutoriedade.',
        'Anulação: prefeito anula nomeação feita em desrespeito à ordem de classificação.',
        'Revogação: Secretaria revoga permissão de uso de espaço público por conveniência.'
      ],
      comparacoes: [
        { termoA: 'Anulação', termoB: 'Revogação', diferenca: 'ANULAÇÃO: recai sobre ato ILEGAL; efeitos EX TUNC (retroage); pode ser feita pela Administração (autotutela) ou pelo Judiciário. REVOGAÇÃO: recai sobre ato DISCRICIONÁRIO por conveniência e oportunidade (mérito); efeitos EX NUNC (não retroage); só a própria Administração revoga — o Judiciário não revoga ato de outro Poder.' },
        { termoA: 'Atributos', termoB: 'Elementos', diferenca: 'ATRIBUTOS (PATI): presunção de legitimidade, autoexecutoriedade, tipicidade, imperatividade — são características do ato. ELEMENTOS (COFOMOB): competência, finalidade, forma, motivo, objeto — são os requisitos de validade. Se faltar um elemento, o ato é inválido.' },
        { termoA: 'Atos vinculados', termoB: 'Atos discricionários', diferenca: 'Vinculados: a lei define todos os elementos; a Administração não tem margem de escolha (ex.: certidão). Discricionários: a lei deixa margem para conveniência e oportunidade no motivo e no objeto (ex.: autorização para uso de bem público). Só atos DISCRICIONÁRIOS podem ser revogados.' }
      ],
      aplicacaoAdministracaoPublica: 'Todo o Direito Administrativo gira em torno do ato administrativo: licitações, contratos, atos de agentes, poder de polícia, serviços públicos. A autotutela (Súmulas 346 e 473/STF) autoriza a Administração a anular seus atos ilegais e revogar os inconvenientes, sem precisar do Judiciário. A Lei 9.784/1999 (processo administrativo federal) regula prazos e procedimentos de anulação/revogação.',
      pegadinhas: [
        'Inverter EX TUNC e EX NUNC. Anulação → EX TUNC (retroage). Revogação → EX NUNC (não retroage).',
        'Dizer que o Judiciário revoga ato administrativo. ERRADO. O Judiciário ANULA (por ilegalidade), mas não revoga (mérito é da Administração).',
        'Achar que todo ato administrativo pode ser revogado. Falso. Atos VINCULADOS não podem ser revogados; só os DISCRICIONÁRIOS.',
        'Confundir atributos com elementos. PATI são atributos; COFOMOB são elementos.',
        'Achar que ato nulo produz efeitos. Ato nulo não produz efeitos (ou, se produziu, são desfeitos retroativamente pela anulação).'
      ],
      errosComuns: [
        'Decorar PATI e COFOMOB sem entender cada um.',
        'Confundir anulação com revogação.',
        'Achar que convalidação corrige qualquer vício. Só vícios SANÁVEIS (competência e forma), quando não houver prejuízo ao interesse público nem a terceiros.'
      ],
      resumo: [
        'Ato administrativo: manifestação unilateral da Administração que produz efeitos jurídicos.',
        'Atributos (PATI): presunção de legitimidade, autoexecutoriedade, tipicidade, imperatividade.',
        'Elementos (COFOMOB): competência, finalidade, forma, motivo, objeto.',
        'Anulação: ato ilegal, efeitos EX TUNC. Revogação: ato discricionário por mérito, efeitos EX NUNC.',
        'Só atos DISCRICIONÁRIOS podem ser revogados. O Judiciário anula, mas não revoga.',
        'Convalidação: corrige vícios sanáveis (competência e forma, sem prejuízo).'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Ato administrativo é qualquer decisão da Administração que afeta alguém: nomear, multar, licenciar, interditar. Ele tem atributos (PATI) e elementos (COFOMOB). Se for ilegal, anula; se for inconveniente, revoga.',
        outroExemplo: 'Um prefeito nomeia um candidato fora da ordem de classificação. Esse ato é ILEGAL → deve ser ANULADO (efeitos retroativos). Se a Administração tivesse concedido uma licença a um particular por conveniência, mas depois quisesse retirar por interesse público, REVOGA (sem retroagir).',
        compararConceitos: 'Atributos = características do ato (PATI). Elementos = requisitos de validade (COFOMOB). Anulação = ilegalidade, retroage. Revogação = mérito, não retroage. Só discricionário é revogável. Judiciário anula, não revoga.',
        mostrarPegadinha: 'Cuidado com duas pegadinhas clássicas: (1) "A revogação tem efeitos ex tunc". ERRADO — a revogação tem efeitos EX NUNC. (2) "O Judiciário pode revogar ato administrativo". ERRADO — o Judiciário anula; revogar é competência da Administração.',
        comoApareceEmConcurso: 'É o módulo mais cobrado em DA. Aparece como: (1) identificar se o ato é vinculado ou discricionário; (2) distinguir anulação de revogação; (3) identificar qual elemento foi violado; (4) saber atributos e elementos.',
        fazerPergunta: {
          pergunta: 'Um servidor foi nomeado para cargo para o qual não tinha o requisito de escolaridade exigido em lei. Qual vício e qual medida?',
          resposta: 'Vício no ELEMENTO MOTIVO ou COMPETÊNCIA (depende do caso). O ato é ILEGAL → deve ser ANULADO (efeitos EX TUNC).'
        }
      }
    },
    'DA-08': {
      id: 'L-DA-08',
      moduloId: 'DA-08',
      objetivo: 'Dominar a Lei 14.133/2021 (Nova Lei de Licitações e Contratos): princípios, modalidades, contratação direta (dispensa e inexigibilidade), contratos administrativos e sanções. Assunto de altíssima frequência em concursos de nível médio.',
      prerequisitos: ['DA-06'],
      introducao: 'A licitação é o procedimento administrativo pelo qual a Administração Pública seleciona a proposta mais vantajosa para contratar. A Lei 14.133/2021 substituiu a antiga Lei 8.666/1993 e trouxe mudanças importantes: novas modalidades, maior flexibilidade e foco em resultados.',
      explicacaoSimples: 'Quando o poder público precisa comprar algo ou contratar um serviço, ele não pode simplesmente escolher um fornecedor. Precisa abrir um processo público, com regras iguais para todos, e escolher a melhor proposta. Isso é licitação — uma forma de garantir impessoalidade e economicidade na aplicação do dinheiro público.',
      explicacaoTecnica: 'A Lei 14.133/2021 rege licitações e contratos administrativos. PRINCÍPIOS: legalidade, impessoalidade, moralidade, publicidade, eficiência, interesse público, probidade administrativa, igualdade, planejamento, transparência, eficácia, segregação de funções, motivação, vinculação ao edital, julgamento objetivo, segurança jurídica, razoabilidade, competitividade, proporcionalidade, celeridade, economicidade e desenvolvimento nacional sustentável. MODALIDADES: pregão (obrigatório para bens e serviços comuns), concorrência (obras e serviços especiais), concurso (trabalho técnico, científico ou artístico), leilão (alienação de bens) e diálogo competitivo (inovação tecnológica). Não existem mais tomada de preços e convite. CONTRATAÇÃO DIRETA: DISPENSA (hipóteses legais em que a competição é possível, mas a lei autoriza não licitar — ex.: valores baixos, emergência) e INEXIGIBILIDADE (impossibilidade de competição — ex.: fornecedor exclusivo, artista consagrado). CONTRATOS: prazo, fiscalização, garantias, matriz de riscos, sanções (advertência, multa, impedimento de licitar, declaração de inidoneidade).',
      exemplos: [
        'Pregão para compra de material de escritório.',
        'Concorrência para obra de construção de uma escola.',
        'Dispensa por valor: compra de R$ 40.000,00 de material de consumo.',
        'Inexigibilidade: contratação de artista consagrado pela crítica especializada.',
        'Sanção: empresa impedida de licitar por descumprimento de contrato.'
      ],
      comparacoes: [
        { termoA: 'Dispensa', termoB: 'Inexigibilidade', diferenca: 'DISPENSA: a competição é possível, mas a lei autoriza não licitar (valores baixos, emergência, licitação deserta). INEXIGIBILIDADE: a competição é IMPOSSÍVEL — fornecedor exclusivo, artista consagrado, serviço técnico especializado. Nunca chamar uma de outra.' },
        { termoA: 'Pregão', termoB: 'Concorrência', diferenca: 'PREGÃO: obrigatório para bens e serviços COMUNS (aqueles que podem ser definidos objetivamente no edital). CONCORRÊNCIA: obras e serviços especiais, concessões. Na Lei 14.133, a concorrência e o pregão são as duas modalidades mais usadas.' },
        { termoA: 'Lei 8.666/1993', termoB: 'Lei 14.133/2021', diferenca: 'A Lei 8.666/1993 (revogada em 2023) tinha 5 modalidades: concorrência, tomada de preços, convite, concurso e leilão (pregão era à parte). A Lei 14.133/2021 tem 5 modalidades: pregão, concorrência, concurso, leilão e diálogo competitivo. Tomada de preços e convite foram EXTINTOS.' }
      ],
      aplicacaoAdministracaoPublica: 'Toda compra e contratação pública segue a Lei 14.133/2021. Exemplos: prefeituras comprando material escolar, estados contratando empresas de obra, União contratando serviços de TI. O Tribunal de Contas fiscaliza licitações. A Lei 14.133 trouxe instrumentos gerenciais (contrato de eficiência, matriz de riscos, diálogo competitivo) e reforçou a governança. Cuidado: a Lei 8.666/1993 foi revogada em 30/12/2023 (após o prazo final de transição) — concursos atuais cobram a Lei 14.133.',
      pegadinhas: [
        'Trocar dispensa por inexigibilidade. Cai MUITO em prova.',
        'Misturar modalidades da lei antiga com a nova. Tomada de preços e convite não existem mais.',
        'Achar que pregão é apenas para bens. Pregão é para bens E serviços COMUNS.',
        'Dizer que o diálogo competitivo é para compras comuns. É para inovação/tecnologia.',
        'Achar que dispensa e inexigibilidade são sinônimos — não são.',
        'Esquecer que a publicidade é princípio essencial: o edital deve ser publicado.'
      ],
      errosComuns: [
        'Decorar modalidades sem saber quando usar cada uma.',
        'Confundir dispensa com inexigibilidade.',
        'Achar que qualquer valor pode ser dispensado.',
        'Ignorar que o diálogo competitivo existe só na Lei 14.133.'
      ],
      resumo: [
        'Licitação: procedimento administrativo para escolher a proposta mais vantajosa.',
        'Lei 14.133/2021 (Nova Lei de Licitações) — modalidades: pregão, concorrência, concurso, leilão e diálogo competitivo.',
        'Tomada de preços e convite: EXTINTOS.',
        'Contratação direta: dispensa (competição possível, lei autoriza) e inexigibilidade (competição impossível).',
        'Sanções: advertência, multa, impedimento de licitar e declaração de inidoneidade.',
        'Lei 8.666/1993 foi revogada em 30/12/2023.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Licitação é o "concurso" que o Estado faz para escolher quem vai vender ou prestar serviço. Todo mundo pode participar, com as mesmas regras, e ganha a melhor proposta. Dispensa é quando a lei deixa pular o concurso. Inexigibilidade é quando só tem um fornecedor possível.',
        outroExemplo: 'Uma prefeitura precisa comprar 1.000 cadeiras escolares. Abre pregão. Publica edital, prazo para propostas, sessão pública, disputa. Ganha o fornecedor que oferece o menor preço cumprindo os requisitos. Se o valor for abaixo do limite legal, pode dispensar o pregão.',
        compararConceitos: 'Dispensa = competição possível, mas lei autoriza não licitar. Inexigibilidade = competição impossível. Pregão = bens/serviços comuns. Concorrência = obras/serviços especiais. Leilão = alienar bens. Concurso = trabalho técnico/artístico. Diálogo competitivo = inovação.',
        mostrarPegadinha: 'Cuidado: "A tomada de preços é uma modalidade prevista na Lei 14.133/2021". ERRADO — foi EXTINTA. Outra: "A inexigibilidade ocorre quando a competição é possível, mas a Administração não quer licitar". ERRADO — nesse caso é dispensa.',
        comoApareceEmConcurso: 'É o módulo mais cobrado de DA em concursos administrativos. Cai como: (1) enumeração de modalidades; (2) correspondência entre exemplo e modalidade; (3) distinguir dispensa de inexigibilidade; (4) prazos e sanções.',
        fazerPergunta: {
          pergunta: 'A Administração precisa contratar um cantor famoso para evento oficial. Qual hipótese se aplica?',
          resposta: 'INEXIGIBILIDADE — artista consagrado pela crítica especializada ou pela opinião pública. A competição é impossível, pois o serviço é pessoal e único.'
        }
      }
    },
    'DA-05': {
      id: 'L-DA-05',
      moduloId: 'DA-05',
      objetivo: 'Dominar os Poderes Administrativos: hierárquico, disciplinar, regulamentar, de polícia, vinculado e discricionário. Distinguir poder de polícia de poder disciplinar e compreender a discricionariedade administrativa.',
      prerequisitos: ['DA-04'],
      introducao: 'Os poderes administrativos são prerrogativas que a Administração Pública possui para defender o interesse público. Eles são irrenunciáveis e devem ser usados dentro dos limites da lei — o excesso gera abuso de poder.',
      explicacaoSimples: 'O Estado tem "ferramentas" para fazer valer o interesse público: mandar nos subordinados (hierárquico), punir servidores (disciplinar), editar decretos para executar a lei (regulamentar), limitar direitos dos particulares em favor da coletividade (polícia). São poderes, mas todos limitados pela lei.',
      explicacaoTecnica: 'Poderes administrativos: (1) HIERÁRQUICO — organiza a relação superior/subordinado: ordenar, fiscalizar, delegar, avocar, rever atos. (2) DISCIPLINAR — apura infrações FUNCIONAIS e aplica sanções a SERVIDORES e a particulares com vínculo específico (ex.: concessionárias). (3) REGULAMENTAR — editar decretos para fiel execução da lei (privativo do Chefe do Executivo). (4) DE POLÍCIA — condiciona e limita o exercício de DIREITOS E LIBERDADES dos PARTICULARES em favor do interesse público (CTN art. 78). (5) VINCULADO — a lei define todos os elementos; sem margem de escolha (ex.: licença para construir). (6) DISCRICIONÁRIO — a lei deixa margem para conveniência e oportunidade (mérito administrativo), nos limites da lei. ABUSO DE PODER: (a) EXCESSO DE PODER — a autoridade atua fora dos limites de sua competência; (b) DESVIO DE FINALIDADE — a autoridade atua dentro da competência, mas com finalidade diferente do interesse público.',
      exemplos: [
        'Poder hierárquico: chefe distribui tarefas e fiscaliza o trabalho dos servidores.',
        'Poder disciplinar: aplicação de suspensão a servidor que faltou sem justificativa.',
        'Poder regulamentar: Presidente edita decreto para regulamentar lei.',
        'Poder de polícia: prefeitura interditando restaurante sem alvará.',
        'Poder vinculado: emissão de certidão quando o requerente cumpre os requisitos.',
        'Poder discricionário: autorização para uso de espaço público em evento.'
      ],
      comparacoes: [
        { termoA: 'Poder de polícia', termoB: 'Poder disciplinar', diferenca: 'POLÍCIA: atinge PARTICULARES em geral, limitando direitos em favor da coletividade (ex.: interdição, multa de trânsito). DISCIPLINAR: atinge SERVIDORES e pessoas com vínculo específico (ex.: suspensão de servidor). São poderes distintos.' },
        { termoA: 'Poder vinculado', termoB: 'Poder discricionário', diferenca: 'VINCULADO: a lei define todos os elementos; a Administração só executa (ex.: certidão). DISCRICIONÁRIO: a lei deixa margem para o juízo de conveniência e oportunidade (mérito) — só os atos discricionários podem ser REVOGADOS.' },
        { termoA: 'Excesso de poder', termoB: 'Desvio de finalidade', diferenca: 'EXCESSO: a autoridade atua FORA dos limites de sua competência. DESVIO: atua DENTRO da competência, mas com finalidade diferente do interesse público. Ambos são formas de ABUSO DE PODER.' }
      ],
      aplicacaoAdministracaoPublica: 'O poder de polícia é exercido por órgãos variados: vigilância sanitária, fiscalização tributária, meio ambiente, trânsito, PROCON. O poder disciplinar é exercido pelas corregedorias e comissões de processo administrativo disciplinar. O poder regulamentar aparece nos decretos do Executivo. O poder hierárquico sustenta toda a estrutura administrativa. A Súmula 473/STF garante que a Administração pode anular (ilegalidade) e revogar (mérito) seus próprios atos.',
      pegadinhas: [
        'Confundir poder de polícia com poder disciplinar. Polícia atinge particulares; disciplinar atinge servidores.',
        'Dizer que poder de polícia é só de corporações policiais. É de TODOS os órgãos com competência de fiscalização (vigilância sanitária, PROCON, etc.).',
        'Achar que poder regulamentar pode inovar a lei (criar obrigações novas). Não pode — só regulamenta a lei.',
        'Confundir excesso de poder com desvio de finalidade. Excesso = fora da competência; desvio = dentro, mas com finalidade errada.',
        'Achar que todo ato discricionário pode ser revogado. Só o discricionário pode ser revogado — o vinculado, não.'
      ],
      errosComuns: [
        'Decorar os poderes sem exemplos práticos.',
        'Confundir discricionariedade com arbitrariedade. Discricionariedade é legal; arbitrariedade é ilegal.',
        'Achar que o poder disciplinar só pune servidores. Também pune particulares com vínculo específico (concessionárias, permissionárias).'
      ],
      resumo: [
        'Poderes administrativos: prerrogativas para defender o interesse público.',
        'Hierárquico: relação superior/subordinado. Disciplinar: infrações funcionais.',
        'Regulamentar: decretos para executar a lei. De polícia: limita direitos dos particulares.',
        'Vinculado: sem margem. Discricionário: mérito (conveniência e oportunidade) — só este pode ser revogado.',
        'Abuso de poder: excesso (fora da competência) e desvio de finalidade.',
        'Poder de polícia atinge particulares; disciplinar atinge servidores.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'O Estado tem ferramentas para fazer valer o interesse público: mandar no subordinado (hierárquico), punir servidor (disciplinar), editar decreto (regulamentar), limitar direito do particular (polícia). Todas essas ferramentas têm limites.',
        outroExemplo: 'A Vigilância Sanitária interdita um restaurante sem alvará — poder de polícia. A Corregedoria suspende um servidor que faltou — poder disciplinar. O prefeito distribui tarefas entre secretários — poder hierárquico. O Presidente edita decreto regulamentando a lei — poder regulamentar.',
        compararConceitos: 'Polícia x Disciplinar: o primeiro atinge particulares; o segundo, servidores. Vinculado x Discricionário: o primeiro não tem margem; o segundo tem, e por isso pode ser revogado. Excesso x Desvio: fora da competência x dentro, mas com finalidade errada.',
        mostrarPegadinha: 'Cuidado: "O poder de polícia é exercido exclusivamente pela Polícia Federal". ERRADO — vigilância sanitária, PROCON, meio ambiente, trânsito etc. também exercem poder de polícia. Outra: "O poder regulamentar pode criar obrigações não previstas em lei". ERRADO — só regulamenta o que a lei já prevê.',
        comoApareceEmConcurso: 'Cai como: (1) correspondência entre situação e poder; (2) distinção entre polícia e disciplinar; (3) excesso x desvio de finalidade; (4) discricionário x vinculado.',
        fazerPergunta: {
          pergunta: 'A Vigilância Sanitária aplica multa a um supermercado por vender produtos vencidos. Qual poder foi exercido?',
          resposta: 'PODER DE POLÍCIA — o Estado está limitando/condicionando o exercício de atividade econômica em favor do interesse público (saúde coletiva), atingindo um particular.'
        }
      }
    },
    'DA-04': {
      id: 'L-DA-04',
      moduloId: 'DA-04',
      objetivo: 'Compreender o conceito e a classificação dos agentes públicos, distinguir cargo, emprego e função pública, e conhecer as regras básicas do regime disciplinar dos servidores.',
      prerequisitos: ['DA-03'],
      introducao: 'Agentes públicos são todas as pessoas que, de alguma forma, prestam serviço ao Estado. Não são apenas servidores concursados — incluem também agentes políticos, temporários, honoríficos e delegados. Cada categoria tem regras próprias.',
      explicacaoSimples: 'Quando você pensa em "quem trabalha para o Estado", vêm à cabeça os concursados. Mas há vários tipos: o prefeito (agente político), o mesário (agente honorífico), o médico contratado temporariamente para uma emergência, o tabelião (particular em colaboração). Todos são agentes públicos.',
      explicacaoTecnica: 'Agentes públicos: (1) AGENTES POLÍTICOS — ocupam cargos estruturais do Estado (Presidente, Governador, Prefeito, Ministros, Senadores, Deputados, Juízes). (2) SERVIDORES PÚBLICOS (em sentido estrito) — ocupam cargos efetivos (concursados) ou em comissão (livre nomeação). (3) EMPREGADOS PÚBLICOS — celetistas, em empresas públicas e sociedades de economia mista. (4) AGENTES TEMPORÁRIOS — contratados por prazo determinado, em hipóteses legais (ex.: emergência). (5) AGENTES HONORÍFICOS — prestam serviço relevante sem remuneração (ex.: mesário, jurado). (6) AGENTES DELEGADOS — particulares em colaboração com o Estado (ex.: tabelião, concessionária). Cargo público: criado por lei, com denominação própria, ocupado por servidor estatutário (regime legal). Emprego público: ocupado por empregado celetista. Função pública: gênero — pode ser exercida por servidor (cargo), empregado (emprego) ou por agente sem cargo (função temporária, por ex.). Cargo em comissão: livre nomeação e exoneração, sem concurso, destinado a funções de direção/assessoramento.',
      exemplos: [
        'Presidente da República: agente político.',
        'Servidor concursado de prefeitura: servidor público (estatutário).',
        'Empregado de empresa pública federal: empregado público (celetista).',
        'Contratado temporariamente para atender emergência: agente temporário.',
        'Mesário: agente honorífico.',
        'Tabelião: agente delegado.'
      ],
      comparacoes: [
        { termoA: 'Cargo público', termoB: 'Emprego público', diferenca: 'CARGO: criado por lei, ocupado por servidor ESTATUTÁRIO (regime legal), com denominação própria. EMPREGO: ocupado por empregado CELETISTA, com regime trabalhista (CLT). Em comum: ambos exigem concurso público (salvo cargo em comissão).' },
        { termoA: 'Cargo em comissão', termoB: 'Cargo efetivo', diferenca: 'COMISSÃO: livre nomeação e exoneração, sem concurso, para funções de direção/assessoramento. EFETIVO: preenchido por concurso público, garante estabilidade após estágio probatório. São naturezas distintas.' },
        { termoA: 'Agente político', termoB: 'Servidor público', diferenca: 'POLÍTICO: ocupa cargo estrutural do Estado (Presidente, Ministro, Prefeito), tem mandato. SERVIDOR: ocupante de cargo/emprego público, com vínculo funcional. O agente político não é servidor em sentido estrito.' }
      ],
      aplicacaoAdministracaoPublica: 'A Lei 8.112/1990 regula os servidores públicos federais: provimento, vacância, remoção, redistribuição, licenças, regime disciplinar. A CF/88, art. 37, II exige concurso público para cargos e empregos efetivos, salvo cargos em comissão. A estabilidade após 3 anos de efetivo exercício (art. 41, CF) protege o servidor de despedida arbitrária. O estágio probatório é de 24 meses (Lei 8.112/1990 e EC 19/1998 combinadas). Responsabilidade do servidor: civil, penal e administrativa (podem acumular).',
      pegadinhas: [
        'Confundir cargo com emprego. Cargo = estatutário; emprego = celetista.',
        'Achar que todo agente público é servidor público. Agente público é gênero (inclui políticos, honoríficos, temporários, delegados).',
        'Dizer que cargo em comissão exige concurso. NÃO exige — é de livre nomeação.',
        'Confundir função pública com cargo. Função é gênero (cargo, emprego e função temporária).',
        'Achar que a responsabilidade civil, penal e administrativa é excludente entre si. Elas podem ser CUMULATIVAS.'
      ],
      errosComuns: [
        'Decorar as categorias de agentes públicos sem exemplos.',
        'Achar que servidor só pode ser punido na esfera administrativa.',
        'Ignorar que cargo em comissão também exige requisitos legais, apesar de não exigir concurso.'
      ],
      resumo: [
        'Agente público é gênero: políticos, servidores, empregados públicos, temporários, honoríficos e delegados.',
        'Cargo público: estatutário, criado por lei. Emprego: celetista.',
        'Cargo em comissão: livre nomeação, sem concurso. Cargo efetivo: concurso obrigatório.',
        'Função pública é gênero (cargo, emprego e função temporária).',
        'Estabilidade: 3 anos de efetivo exercício (art. 41, CF).',
        'Responsabilidades civil, penal e administrativa podem ser CUMULATIVAS.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Agente público é qualquer um que trabalha para o Estado. Isso inclui o prefeito (político), o concursado (servidor), o empregado de empresa pública (celetista), o mesário (honorífico) e o tabelião (delegado). Só o servidor concursado é "servidor público" em sentido estrito.',
        outroExemplo: 'Um analista concursado da Receita Federal: servidor público (estatutário). Um funcionário da Caixa Econômica Federal: empregado público (celetista). Um mesário em eleição: agente honorífico. Um tabelião de cartório: agente delegado. Todos são agentes públicos.',
        compararConceitos: 'Cargo = estatutário. Emprego = celetista. Função = gênero. Comissão = livre nomeação. Efetivo = concurso + estabilidade após 3 anos. Responsabilidade civil, penal e administrativa podem acumular.',
        mostrarPegadinha: 'Cuidado: "O cargo em comissão exige aprovação em concurso público". ERRADO — é de livre nomeação e exoneração. Outra: "Todo agente público é servidor público". ERRADO — servidor é apenas uma das espécies.',
        comoApareceEmConcurso: 'Cai como: (1) classificação do agente em uma situação; (2) distinção entre cargo e emprego; (3) requisitos de cargo em comissão; (4) estabilidade e estágio probatório.',
        fazerPergunta: {
          pergunta: 'Um servidor ocupante de cargo em comissão de assessor foi exonerado no dia seguinte à nomeação. Isso é possível?',
          resposta: 'SIM. Cargo em comissão é de LIVRE NOMEAÇÃO E EXONERAÇÃO, sem exigência de motivação ou prazo. O ocupante não tem estabilidade, diferentemente do cargo efetivo.'
        }
      }
    },
    'AP-03': {
      id: 'L-AP-03',
      moduloId: 'AP-03',
      objetivo: 'Dominar os princípios da Administração Pública (LIMPE e desdobramentos) aplicados à Administração Pública, diferenciando-os de outros princípios administrativos e compreendendo suas consequências práticas para o gestor público.',
      prerequisitos: ['AP-02'],
      introducao: 'Os princípios são as bases do regime jurídico-administrativo. Eles orientam toda a atuação do Estado e estão expressos no caput do art. 37 da CF/88 pela sigla LIMPE. Sem eles, não é possível entender nenhum instituto de Administração Pública ou de Direito Administrativo.',
      explicacaoSimples: 'Imagine que o Estado é como um funcionário que trabalha para você, cidadão. Ele deve seguir cinco regras básicas: fazer só o que a lei manda (Legalidade), tratar todos do mesmo jeito (Impessoalidade), ser honesto e ético (Moralidade), trabalhar de portas abertas (Publicidade) e fazer bem feito (Eficiência). Essas cinco regras formam o LIMPE.',
      explicacaoTecnica: 'LIMPE (art. 37, caput, CF/88): LEGALIDADE — o administrador só pode fazer o que a lei autoriza ou determina (legalidade estrita); diferente do particular, que pode fazer tudo que a lei não proíbe. IMPESSOALIDADE — vedação a favoritismos e tratamento igualitário, além de proibição de promoção pessoal (art. 37, §1º, CF). MORALIDADE — ética administrativa; o ato pode ser legal e, ainda assim, imoral (ex.: nepotismo). PUBLICIDADE — dever de transparência, com exceções constitucionais (segurança nacional, intimidade). EFICIÊNCIA — inserido pela EC 19/1998 (Reforma Gerencial), exige resultado útil e economicidade. Princípios implícitos: supremacia do interesse público, indisponibilidade do interesse público, autotutela (Súmulas 346 e 473/STF), razoabilidade, proporcionalidade, motivação, ampla defesa, contraditório, segurança jurídica, continuidade do serviço público.',
      exemplos: [
        'Legalidade: secretário só contrata após licitação ou hipótese legal de dispensa.',
        'Impessoalidade: ato é atribuído ao órgão, não à pessoa física do agente.',
        'Moralidade: ato formalmente legal, mas com desvio de finalidade, é imoral e nulo.',
        'Publicidade: publicação no Diário Oficial e portais de transparência.',
        'Eficiência: busca do melhor resultado com os recursos disponíveis.'
      ],
      comparacoes: [
        { termoA: 'Legalidade (Administração)', termoB: 'Legalidade (particular)', diferenca: 'Para o PARTICULAR, é lícito fazer tudo que a lei NÃO proíbe (autonomia privada). Para a ADMINISTRAÇÃO, só é lícito fazer o que a lei AUTORIZA ou DETERMINA (legalidade estrita). Isso decorre da indisponibilidade do interesse público.' },
        { termoA: 'Moralidade', termoB: 'Legalidade', diferenca: 'Um ato pode ser LEGAL e IMORAL ao mesmo tempo. Exemplo clássico: nomear um amigo para cargo em comissão respeitando os requisitos formais, mas com claro favorecimento pessoal. O ato é legal em forma, mas imoral em substância — e pode ser anulado.' },
        { termoA: 'Princípios expressos', termoB: 'Princípios implícitos', diferenca: 'EXPRESSOS: os 5 do LIMPE no caput do art. 37 (Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência). IMPLÍCITOS: supremacia do interesse público, indisponibilidade, autotutela, razoabilidade, proporcionalidade, motivação, ampla defesa, contraditório, segurança jurídica, continuidade.' }
      ],
      aplicacaoAdministracaoPublica: 'Os princípios estão em todo o serviço público: editais de licitação (publicidade + impessoalidade), controle pelos Tribunais de Contas (legalidade + eficiência), responsabilização por improbidade administrativa (moralidade), autotutela para anular atos ilegais (Súmula 473/STF), exigência de motivação dos atos (Lei 9.784/1999), concessão de prazo para defesa antes de sanção (ampla defesa e contraditório). No Rio Grande do Norte e em concursos federais, LIMPE é cobrado em praticamente toda prova de AP e DA.',
      pegadinhas: [
        'Confundir legalidade administrativa com legalidade do particular. Cai MUITO.',
        'Esquecer que eficiência é princípio EXPRESSO desde a EC 19/1998.',
        'Achar que publicidade é absoluta — tem exceções (segurança do Estado e intimidade).',
        'Pensar que supremacia do interesse público está expressa na CF — é IMPLÍCITA.',
        'Dizer que razoabilidade e proporcionalidade são expressas — são implícitas.',
        'Confundir impessoalidade com imparcialidade. Impessoalidade é princípio constitucional; imparcialidade é dever do agente.'
      ],
      errosComuns: [
        'Decorar LIMPE sem entender cada princípio em situações práticas.',
        'Achar que moralidade e legalidade são a mesma coisa.',
        'Ignorar os princípios implícitos, que também são cobrados.'
      ],
      resumo: [
        'LIMPE (art. 37, caput, CF/88): Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência.',
        'Eficiência: inserida pela EC 19/1998 (Reforma Gerencial).',
        'Legalidade administrativa = legalidade estrita.',
        'Impessoalidade: tratamento igualitário + proibição de promoção pessoal (art. 37, §1º).',
        'Moralidade: ética administrativa; não basta ser legal.',
        'Publicidade: regra é transparência; exceções constitucionais.',
        'Implícitos: supremacia e indisponibilidade do interesse público, autotutela (Súmulas 346 e 473/STF), razoabilidade, proporcionalidade, motivação, ampla defesa, contraditório, segurança jurídica, continuidade.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Cinco placas na porta de toda repartição: "Só faço o que a lei manda" (legalidade), "Trato todos igual" (impessoalidade), "Sou honesto e ético" (moralidade), "Trabalho de portas abertas" (publicidade), "Trabalho bem e com resultado" (eficiência). Além dessas, há outras placas menos visíveis — autotutela, proporcionalidade, motivação.',
        outroExemplo: 'Um edital de concurso público reúne vários princípios: publicidade (publicado no DOU), impessoalidade (mesmo critério para todos), legalidade (previsão legal de vagas e regras), moralidade (vedação a favorecimento), eficiência (selecionar o melhor candidato).',
        compararConceitos: 'Legalidade = base. Impessoalidade = tratamento. Moralidade = ética. Publicidade = transparência. Eficiência = resultado. Os cinco se somam; não se substituem.',
        mostrarPegadinha: '"O princípio da eficiência foi inserido pela EC 45/2004". ERRADO. Foi pela EC 19/1998 (Reforma Gerencial). A EC 45/2004 tratou da Reforma do Judiciário.',
        comoApareceEmConcurso: 'Praticamente toda prova de AP e DA cobra LIMPE. As bancas testam: (a) enumeração; (b) exceções à publicidade; (c) diferença de legalidade; (d) reconhecimento de princípios implícitos; (e) aplicação a casos concretos.',
        fazerPergunta: {
          pergunta: 'Um prefeito publica, em outdoor pago com recursos públicos, uma obra municipal com seu nome e foto. Fere qual princípio?',
          resposta: 'Fere a IMPESSOALIDADE (art. 37, §1º, CF — veda promoção pessoal). Também viola a MORALIDADE administrativa.'
        }
      }
    },
    'AP-04': {
      id: 'L-AP-04',
      moduloId: 'AP-04',
      objetivo: 'Compreender a estrutura da Administração Pública brasileira: Administração Direta e Indireta, entidades que compõem cada uma, características das autarquias, fundações, empresas públicas e sociedades de economia mista.',
      prerequisitos: ['AP-02'],
      introducao: 'O Estado não executa tudo diretamente. Ele se organiza em uma estrutura chamada Administração Direta (órgãos internos dos Poderes) e Administração Indireta (entidades com personalidade jurídica própria). Entender essa estrutura é base para todo concurso de AP e DA.',
      explicacaoSimples: 'Imagine o Estado como um grande grupo empresarial. A matriz é a Administração Direta (ministérios, secretarias — órgãos sem personalidade própria, ligados ao poder central). As subsidiárias são a Administração Indireta (autarquias, fundações, empresas públicas e sociedades de economia mista — cada uma com CNPJ próprio).',
      explicacaoTecnica: 'ADMINISTRAÇÃO DIRETA: conjunto de órgãos internos dos Poderes (Executivo, Legislativo, Judiciário) — sem personalidade jurídica própria; são criados por lei ou por decreto (no caso de órgãos internos). ADMINISTRAÇÃO INDIRETA (art. 37, XIX, CF): composta por entidades com PERSONALIDADE JURÍDICA PRÓPRIA, criadas por lei específica. São: AUTARQUIAS (personalidade de direito público; ex.: INSS, IBAMA, universidades federais); FUNDAÇÕES PÚBLICAS (personalidade de direito público ou privado; ex.: FUNAI, IBGE); EMPRESAS PÚBLICAS (personalidade de direito privado; capital 100% público; qualquer forma societária; ex.: Caixa, Correios); SOCIEDADES DE ECONOMIA MISTA (personalidade de direito privado; capital misto, com maioria pública; forma de S.A.; ex.: Petrobras, Banco do Brasil). Todas as entidades da Administração Indireta estão sujeitas a CONTROLE FINALÍSTICO pelo Estado (tutela) e a controle pelos Tribunais de Contas.',
      exemplos: [
        'Administração Direta: Ministério da Educação (órgão federal), Secretaria Municipal de Saúde (órgão municipal).',
        'Autarquia: INSS, IBAMA, universidades federais, agências reguladoras (ANVISA, ANATEL).',
        'Fundação pública: FUNAI, IBGE, Fundação Oswaldo Cruz (Fiocruz).',
        'Empresa pública: Caixa Econômica Federal, Correios, BNDES.',
        'Sociedade de economia mista: Petrobras, Banco do Brasil, Sabesp (SP).'
      ],
      comparacoes: [
        { termoA: 'Administração Direta', termoB: 'Administração Indireta', diferenca: 'DIRETA: órgãos internos dos Poderes, SEM personalidade jurídica própria, ligados diretamente ao poder central (ex.: ministérios, secretarias). INDIRETA: entidades com PERSONALIDADE JURÍDICA PRÓPRIA, criadas por lei, com CNPJ (autarquias, fundações, empresas públicas, sociedades de economia mista).' },
        { termoA: 'Empresa pública', termoB: 'Sociedade de economia mista', diferenca: 'EMPRESA PÚBLICA: capital 100% PÚBLICO; qualquer forma societária (S.A., Ltda.). SOCIEDADE DE ECONOMIA MISTA: capital MISTO (público + privado), com maioria pública; obrigatoriamente S.A. Ambas são pessoas jurídicas de direito PRIVADO.' },
        { termoA: 'Autarquia', termoB: 'Fundação pública', diferenca: 'AUTARQUIA: personalidade de direito PÚBLICO, criada por lei, para atividades típicas de Estado (ex.: INSS). FUNDAÇÃO: personalidade de direito público ou PRIVADO, criada por lei, para atividades sociais (educação, saúde, cultura — ex.: IBGE, Fiocruz). A natureza do patrimônio e da atividade varia.' }
      ],
      aplicacaoAdministracaoPublica: 'A estrutura do Estado é cobrada em provas de AP e DA. O Decreto-Lei 200/1967 organiza a Administração Federal (princípios de planejamento, coordenação, descentralização). O art. 37, XIX, CF exige lei específica para criar autarquias e autorizar a criação de empresas públicas, sociedades de economia mista e fundações. As autarquias têm imunidade tributária recíproca (art. 150, VI, "a", CF) e fazem concurso público. Empresas públicas e sociedades de economia mista também fazem concurso, mas empregados são celetistas. A EC 19/1998 criou as agências executivas e reguladoras, reforçando a Administração Indireta.',
      pegadinhas: [
        'Dizer que órgãos têm personalidade jurídica própria. NÃO têm — personalidade é da entidade.',
        'Confundir empresa pública com sociedade de economia mista. Empresa = capital 100% público; SEM = capital misto com maioria pública.',
        'Achar que autarquia pode explorar atividade econômica. Autarquia exerce atividade típica de Estado; exploração econômica é das empresas públicas e SEM.',
        'Dizer que toda entidade da Administração Indireta é criada por lei. Empresas públicas e SEM são AUTORIZADAS por lei; autarquias e fundações são CRIADAS por lei.',
        'Confundir descentralização (criação de entidades) com desconcentração (criação de órgãos).'
      ],
      errosComuns: [
        'Decorar as quatro entidades sem entender as diferenças.',
        'Confundir Administração Direta com Administração Indireta.',
        'Ignorar que a Administração Indireta é sujeita a controle pelos TCs.',
        'Achar que toda empresa estatal é sociedade de economia mista.'
      ],
      resumo: [
        'Administração Direta: órgãos internos dos Poderes, sem personalidade jurídica.',
        'Administração Indireta: entidades com personalidade jurídica própria, criadas por lei (autarquias e fundações) ou autorizadas por lei (empresas públicas e SEM).',
        'Autarquias: direito público, atividade típica de Estado.',
        'Fundações públicas: direito público ou privado, atividades sociais.',
        'Empresas públicas: capital 100% público, direito privado.',
        'Sociedades de economia mista: capital misto com maioria pública, S.A., direito privado.',
        'Administração Indireta sujeita a controle finalístico (tutela) e pelos TCs.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'A Administração Direta é a "matriz" (ministérios, secretarias — órgãos do Estado). A Administração Indireta são as "subsidiárias" (autarquias, fundações, empresas públicas e SEM), cada uma com CNPJ próprio, mas todas ligadas ao Estado.',
        outroExemplo: 'Um cidadão precisa se aposentar. Ele vai ao INSS — uma autarquia federal (Administração Indireta, personalidade de direito público). Diferente de ir a um posto do Ministério da Previdência (Administração Direta), que é órgão interno.',
        compararConceitos: 'Direta x Indireta: órgão x entidade. Autarquia x Fundação: atividade típica de Estado x atividade social. Empresa pública x SEM: capital 100% público x capital misto com maioria pública. Descentralização (cria entidade) x Desconcentração (cria órgão).',
        mostrarPegadinha: 'Cuidado: "Os órgãos públicos têm personalidade jurídica própria". ERRADO. Personalidade é da entidade; o órgão é desprovido dela. Outra: "As empresas públicas e SEM são criadas por lei". ERRADO — são AUTORIZADAS por lei (a criação efetiva depende de registro).',
        comoApareceEmConcurso: 'Cai como: (1) classificação de entidade (autarquia, fundação, EP ou SEM); (2) diferença entre órgão e entidade; (3) características de cada tipo; (4) regime de pessoal (estatutário x celetista).',
        fazerPergunta: {
          pergunta: 'A Petrobras é uma empresa pública ou uma sociedade de economia mista?',
          resposta: 'SOCIEDADE DE ECONOMIA MISTA — tem capital misto (público + privado), com maioria pública, e é constituída como S.A. A empresa pública teria capital 100% público.'
        }
      }
    },
    'AP-05': {
      id: 'L-AP-05',
      moduloId: 'AP-05',
      objetivo: 'Distinguir órgãos públicos de entidades públicas, classificá-los segundo a posição estatal, a estrutura e a atuação, e compreender a capacidade processual dos órgãos.',
      prerequisitos: ['AP-04'],
      introducao: 'Nem tudo que está dentro do Estado é órgão. É preciso distinguir órgão (sem personalidade jurídica) de entidade (com personalidade jurídica própria). Essa distinção cai muito em concursos.',
      explicacaoSimples: 'Órgão é como um departamento dentro de uma empresa: existe, tem nome, tem função, mas não tem CNPJ próprio. Entidade é como uma subsidiária: tem CNPJ, pode contratar, processar e ser processada em nome próprio. O Ministério da Saúde é órgão; o INSS é entidade.',
      explicacaoTecnica: 'ÓRGÃO PÚBLICO: unidade de atuação dentro da estrutura do Estado, SEM personalidade jurídica própria, criado por lei ou por decreto (órgãos internos). Entidade: pessoa jurídica (pública ou privada) com personalidade própria. CLASSIFICAÇÃO DOS ÓRGÃOS: (1) quanto à POSIÇÃO ESTATAL: independentes (cúpula dos Poderes — Presidência, Congresso, STF, governos, assembleias, tribunais), autônomos (subordinados à cúpula, com autonomia administrativa e financeira — ministérios, secretarias), superiores (com poder de decisão, mas subordinados a um autônomo — coordenadorias, procuradorias), subalternos (execução — repartições, seções). (2) quanto à ESTRUTURA: simples (um só centro de competência — ex.: Presidência) ou compostos (mais de um órgão dentro — ex.: Ministério). (3) quanto à ATUAÇÃO: singulares (um só titular — ex.: Presidência) ou colegiados (vários titulares com decisão conjunta — ex.: Tribunais, Conselhos). CAPACIDADE PROCESSUAL: em regra, os órgãos não têm capacidade processual. Exceção: órgãos independentes e autônomos podem impetrar MANDADO DE SEGURANÇA em defesa de suas prerrogativas institucionais.',
      exemplos: [
        'Órgão independente: Presidência da República, Congresso Nacional, Supremo Tribunal Federal.',
        'Órgão autônomo: Ministério da Fazenda, Secretaria de Educação.',
        'Órgão superior: Procuradoria-Geral de um ministério, coordenadoria.',
        'Órgão subalterno: uma seção, uma repartição.',
        'Órgão composto: Ministério (composto por vários órgãos internos).',
        'Órgão colegiado: Tribunal (vários ministros/desembargadores decidem juntos).'
      ],
      comparacoes: [
        { termoA: 'Órgão', termoB: 'Entidade', diferenca: 'ÓRGÃO: unidade interna, SEM personalidade jurídica própria, criada por lei ou decreto. ENTIDADE: pessoa jurídica com personalidade própria (autarquia, fundação, empresa pública, SEM), criada por lei (ou autorizada). Só a entidade tem CNPJ e capacidade processual plena.' },
        { termoA: 'Órgão independente', termoB: 'Órgão subalterno', diferenca: 'INDEPENDENTE: cúpula dos Poderes, sem subordinação hierárquica a outro órgão (Presidência, Congresso, STF). SUBALTERNO: execução, com poder apenas de execução técnica (repartições, seções).' },
        { termoA: 'Órgão simples', termoB: 'Órgão composto', diferenca: 'SIMPLES: um único centro de competência (ex.: Presidência). COMPOSTO: reúne vários órgãos dentro dele, cada um com competências próprias (ex.: Ministério, composto por várias secretarias e departamentos).' }
      ],
      aplicacaoAdministracaoPublica: 'A estrutura da Administração Direta é composta por órgãos internos dos Poderes. O Ministério Público, os Tribunais de Contas e a Defensoria Pública são órgãos independentes, sem personalidade jurídica, mas com capacidade processual reconhecida para defender suas prerrogativas. Os órgãos não têm capacidade contratual — quem contrata é a pessoa jurídica (União, Estado, Município, autarquia).',
      pegadinhas: [
        'Dizer que órgãos têm personalidade jurídica própria. ERRADO — personalidade é da entidade.',
        'Achar que órgãos não podem ir a juízo em nenhuma hipótese. Exceção: órgãos independentes e autônomos podem impetrar mandado de segurança em defesa de suas prerrogativas.',
        'Confundir órgãos independentes com órgãos autônomos. Independentes: sem subordinação a outro órgão (Presidência, Congresso). Autônomos: subordinados à cúpula, com autonomia administrativa e financeira (ministérios, secretarias).',
        'Confundir órgão colegiado com órgão composto. Colegiado: vários titulares decidem juntos (Tribunais). Composto: vários órgãos dentro de um (Ministério).',
        'Achar que todo órgão tem capacidade contratual. Só a pessoa jurídica (União, Estado, Município, autarquia) tem — órgãos não contratam em nome próprio.'
      ],
      errosComuns: [
        'Decorar classificações sem saber aplicar.',
        'Confundir órgãos (Direta) com entidades (Indireta).',
        'Achar que todo órgão é sinônimo de repartição.'
      ],
      resumo: [
        'Órgão: unidade interna do Estado, SEM personalidade jurídica.',
        'Entidade: pessoa jurídica com personalidade própria (Administração Indireta).',
        'Classificação dos órgãos: posição estatal (independentes, autônomos, superiores, subalternos), estrutura (simples/compostos), atuação (singulares/colegiados).',
        'Órgãos não têm capacidade processual em regra; exceção: órgãos independentes e autônomos podem impetrar mandado de segurança em defesa de prerrogativas.',
        'Órgão não contrata em nome próprio — quem contrata é a pessoa jurídica.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Órgão é como um departamento dentro de uma empresa (tem função, mas não tem CNPJ). Entidade é como uma subsidiária (tem CNPJ, pode contratar, processar). Ministério da Saúde é órgão; INSS é entidade.',
        outroExemplo: 'A Presidência da República é órgão independente (cúpula). Um ministério é órgão autônomo (subordinado à Presidência, mas com autonomia). Uma coordenadoria dentro de um ministério é órgão superior. Uma seção é órgão subalterno (execução).',
        compararConceitos: 'Órgão x Entidade: sem personalidade x com personalidade. Independente x Autônomo: cúpula x subordinado com autonomia. Simples x Composto: um centro x vários órgãos internos. Singular x Colegiado: um titular x vários decidindo juntos.',
        mostrarPegadinha: 'Cuidado: "Órgãos públicos têm personalidade jurídica própria". ERRADO. Personalidade é da entidade. Outra: "Órgãos nunca podem ir a juízo". ERRADO — órgãos independentes e autônomos podem impetrar mandado de segurança em defesa de suas prerrogativas.',
        comoApareceEmConcurso: 'Cai como: (1) classificação de um órgão em uma situação; (2) diferença entre órgão e entidade; (3) capacidade processual dos órgãos.',
        fazerPergunta: {
          pergunta: 'O Supremo Tribunal Federal é órgão independente ou autônomo?',
          resposta: 'ÓRGÃO INDEPENDENTE — está na cúpula do Poder Judiciário, sem subordinação hierárquica a outro órgão. Órgãos autônomos são ministérios e secretarias (subordinados à cúpula, mas com autonomia administrativa e financeira).'
        }
      }
    },
    'DA-10': {
      id: 'L-DA-10',
      moduloId: 'DA-10',
      objetivo: 'Compreender as formas de controle da Administração Pública: controle interno e externo, controle legislativo (Tribunais de Contas), controle judicial e controle administrativo (autotutela). Assunto de altíssima frequência em DA e AP.',
      prerequisitos: ['DA-06'],
      introducao: 'A Administração Pública não é livre para fazer o que quiser. Toda a sua atuação é fiscalizada por órgãos internos e externos, o que garante legalidade, impessoalidade e eficiência. Esse é o tema do controle.',
      explicacaoSimples: 'Imagine uma escola pública. O diretor (interno) fiscaliza os professores. Mas a escola também é fiscalizada pela Secretaria de Educação, pelo Tribunal de Contas, pelo Ministério Público, pelo Poder Legislativo e até pelo Judiciário. Todo esse aparato é o controle da Administração.',
      explicacaoTecnica: 'Controle da Administração é o conjunto de mecanismos que verificam a legalidade e o mérito dos atos administrativos. Classificação: (1) quanto à ORIGEM: INTERNO (dentro do próprio Poder, sobre seus órgãos — ex.: corregedorias, controladorias, CGU) e EXTERNO (por outro Poder ou instituição autônoma — ex.: Tribunal de Contas, Judiciário, MP). (2) quanto ao MOMENTO: prévio (antes), concomitante (durante) e posterior (depois). (3) quanto à NATUREZA: LEGALIDADE (verifica conformidade com a lei) e MÉRITO (verifica conveniência e oportunidade — só a própria Administração pode fazer). Controle LEGISLATIVO: exercido pelo Congresso/Parlamento com auxílio dos TRIBUNAIS DE CONTAS — julga contas do Executivo, aprecia atos, susta atos normativos que exorbitem, fiscaliza. Controle JUDICIAL: exercido pelo Judiciário — só de LEGALIDADE, nunca de mérito (Súmula 473/STF, art. 5º, XXXV, CF). Controle ADMINISTRATIVO (autotutela): a própria Administração anula atos ilegais e revoga atos inconvenientes (Súmulas 346 e 473/STF).',
      exemplos: [
        'Controle interno: a Controladoria-Geral da União (CGU) fiscaliza os órgãos federais.',
        'Controle externo: o Tribunal de Contas da União (TCU) julga as contas do Presidente da República.',
        'Controle legislativo: o Congresso susta ato normativo do Executivo que exorbite do poder regulamentar.',
        'Controle judicial: o Judiciário anula ato administrativo ilegal.',
        'Controle administrativo (autotutela): o próprio órgão anula sua própria nomeação ilegal.'
      ],
      comparacoes: [
        { termoA: 'Controle interno', termoB: 'Controle externo', diferenca: 'INTERNO: exercido dentro do próprio Poder/órgão (ex.: CGU, corregedoria, controladoria). EXTERNO: exercido por outro Poder ou instituição autônoma (ex.: Tribunal de Contas, Judiciário, MP). O interno é o autocontrole; o externo é o heterocontrole.' },
        { termoA: 'Controle de legalidade', termoB: 'Controle de mérito', diferenca: 'LEGALIDADE: verifica se o ato está conforme a lei (pode ser feito pela própria Administração e pelo Judiciário). MÉRITO: verifica conveniência e oportunidade — só pode ser feito pela própria Administração (autotutela), NUNCA pelo Judiciário.' },
        { termoA: 'Controle Legislativo', termoB: 'Controle Judicial', diferenca: 'LEGISLATIVO: exercido pelo Parlamento com auxílio dos Tribunais de Contas (julga contas, susta atos, fiscaliza). JUDICIAL: exercido pelos juízes, apenas quanto à LEGALIDADE (não analisa mérito administrativo). O Judiciário anula, não revoga.' }

      aplicacaoAdministracaoPublica: 'O controle é onipresente no Estado: CGU nos órgãos federais, Tribunais de Contas nos três níveis, Ministério Público, ouvidorias, corregedorias, controle social (participação popular). A Lei de Responsabilidade Fiscal (LC 101/2000) reforça o controle fiscal. A Lei 8.429/1992 (improbidade) e a Lei 9.784/1999 (processo administrativo) também são instrumentos de controle. Em concursos federais e do RN, o controle é tema recorrente em DA e AP.',
      pegadinhas: [
        'Achar que o Judiciário pode analisar o MÉRITO administrativo. NÃO pode. O Judiciário examina apenas a LEGALIDADE (Súmula 473/STF).',
        'Dizer que o controle legislativo é feito apenas pelo Legislativo. É feito pelo Legislativo COM AUXÍLIO dos Tribunais de Contas.',
        'Confundir Tribunal de Contas com Judiciário. O TC é órgão auxiliar do Legislativo (não é subordinado) e faz controle técnico.',
        'Achar que o controle externo só pode ser feito pelo Judiciário. Também é feito pelo Legislativo (com TC) e pelo MP.',
        'Confundir autotutela com tutela. AUTOTUTELA: o órgão controla seus próprios atos. TUTELA: controle finalístico da Administração Direta sobre a Indireta.'
      ],
      errosComuns: [
        'Decorar classificações sem entender quem exerce cada controle.',
        'Achar que o Judiciário substitui a Administração.',
        'Ignorar o papel dos Tribunais de Contas.',
        'Confundir controle interno com controle administrativo (autotutela).'
      ],
      resumo: [
        'Controle: verificação da legalidade e mérito dos atos administrativos.',
        'Interno (dentro do órgão) x Externo (por outro Poder ou instituição).',
        'Legislativo: com auxílio dos Tribunais de Contas. Judicial: só legalidade. Administrativo: autotutela.',
        'Controle de legalidade pode ser feito pela Administração e pelo Judiciário. Controle de mérito só pela Administração.',
        'Autotutela: Súmulas 346 e 473/STF — anular atos ilegais e revogar os inconvenientes.',
        'Judiciário anula, não revoga.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Controle é a fiscalização da Administração. Quem fiscaliza: o próprio órgão (interno), o Tribunal de Contas, o Judiciário, o Legislativo, o MP (externos). O Judiciário olha se o ato respeitou a lei; se está apenas inconveniente, só a própria Administração pode mexer.',
        outroExemplo: 'Um prefeito contrata uma empresa sem licitação. A CGU (interno) investiga; o TCE (externo) aponta irregularidade; o Judiciário anula o contrato. O MP pode propor ação de improbidade. O próprio prefeito, pela autotutela, também pode anular o ato.',
        compararConceitos: 'Interno = dentro. Externo = fora. Legalidade = lei. Mérito = conveniência. Judiciário só vê legalidade. Administração vê legalidade e mérito. Súmula 473: anular (ilegal) e revogar (inconveniente).',
        mostrarPegadinha: 'Cuidado: "O Poder Judiciário pode revogar ato administrativo por inconveniência". ERRADO — o Judiciário anula por ilegalidade, mas NÃO revoga por mérito. Só a Administração revoga (autotutela).',
        comoApareceEmConcurso: 'Cai como: (1) classificar o tipo de controle em situação prática; (2) distinguir interno e externo; (3) reconhecer limites do Judiciário; (4) papel dos Tribunais de Contas.',
        fazerPergunta: {
          pergunta: 'O Tribunal de Contas da União é órgão do Poder Judiciário?',
