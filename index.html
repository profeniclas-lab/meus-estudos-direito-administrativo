        outroExemplo: 'Quando um servidor aplica uma multa de trânsito, quando a prefeitura abre licitação, quando um ministério pune um servidor faltoso — tudo isso é Direito Administrativo em ação.',
        compararConceitos: 'DA = atividade do Estado sob regime público. Direito Constitucional = estrutura do Estado. Direito Privado = relações entre iguais. Fonte primária = lei. Fonte secundária = doutrina, jurisprudência, princípios, costumes.',
        mostrarPegadinha: 'Cuidado: "A jurisprudência é fonte primária do Direito Administrativo". ERRADO. É fonte SECUNDÁRIA. A fonte primária é a lei.',
        comoApareceEmConcurso: 'Cai como: (1) conceito e objeto do DA; (2) enumeração de fontes; (3) distinção entre fontes primárias e secundárias; (4) base legal do DA.',
        fazerPergunta: {
          pergunta: 'A doutrina e a jurisprudência são fontes primárias ou secundárias do Direito Administrativo?',
          resposta: 'SECUNDÁRIAS. A lei é a fonte PRIMÁRIA do Direito Administrativo. Doutrina, jurisprudência, princípios gerais e costumes orientam a interpretação, mas não substituem a lei.'
        }
      }
    },
    'DA-07': {
      id: 'L-DA-07',
      moduloId: 'DA-07',
      objetivo: 'Compreender o conceito e os princípios dos serviços públicos, e distinguir as formas de prestação: concessão, permissão e autorização.',
      prerequisitos: ['DA-03'],
      introducao: 'Serviço público é uma das atividades centrais do Estado. Entender quem presta, como presta e sob qual regime é fundamental para concursos de DA e AP.',
      explicacaoSimples: 'Serviço público é aquilo que o Estado oferece diretamente ao cidadão para atender suas necessidades essenciais: saúde, educação, transporte, energia, água. Às vezes o próprio Estado presta; às vezes ele passa a bola para uma empresa privada, mas continua regulando e fiscalizando.',
      explicacaoTecnica: 'Serviço público é a atividade material prestada pelo Estado, direta ou indiretamente, sob regime de direito público, para satisfazer necessidades coletivas essenciais. PRINCÍPIOS (art. 175, CF + Lei 8.987/1995): GENERALIDADE (atender a todos, sem discriminação), CONTINUIDADE (não pode parar — salvo hipóteses legais, como inadimplemento do usuário), MODICIDADE DAS TARIFAS (reajustes e revisões apenas por lei/contrato), CORTESIA, ATUALIDADE (modernização), SEGURANÇA, EFICIÊNCIA, REGULARIDADE, UNIVERSALIDADE. FORMAS DE PRESTAÇÃO: (1) DIRETA — pelo próprio Estado, por meio de seus órgãos. (2) INDIRETA — por delegação (concessão, permissão) ou por outorga (autarquias, empresas públicas etc.). CONCESSÃO (Lei 8.987/1995): contrato administrativo, por prazo determinado, no qual o Estado transfere a EXECUÇÃO do serviço ao CONCESSIONÁRIO (empresa privada ou consórcio), mediante licitação na modalidade concorrência (Lei 14.133 agora permite diálogo competitivo em hipóteses). PERMISSÃO: ato administrativo (não contrato), de adesão, discricionário, precário, também precedido de licitação. AUTORIZAÇÃO: ato administrativo unilateral, discricionário e precário, sem licitação, usado em serviços de pequeno porte ou emergenciais.',
      exemplos: [
        'Concessão: empresa privada presta serviço de energia elétrica sob contrato com o Estado.',
        'Permissão: motorista de táxi autorizado a operar em determinado município.',
        'Autorização: banca de jornal em calçada pública.',
        'Serviço público direto: SUS oferecendo consultas.',
        'Serviço público por outorga: autarquia municipal de saneamento.'
      ],
      comparacoes: [
        { termoA: 'Concessão', termoB: 'Permissão', diferenca: 'CONCESSÃO: CONTRATO administrativo, por prazo determinado, entre Estado e empresa/concessionária. PERMISSÃO: ATO administrativo unilateral, precário, discricionário, de adesão. Ambas exigem licitação; a concessão tem natureza contratual mais estável, a permissão é mais precária.' },
        { termoA: 'Concessão', termoB: 'Autorização', diferenca: 'CONCESSÃO: delegação de serviço público de maior porte, feita por contrato, sempre com licitação. AUTORIZAÇÃO: ato unilateral, discricionário e precário, SEM licitação, para serviços de pequeno porte ou situações emergenciais (ex.: banca de jornal, transporte individual de passageiros — táxi).' },
        { termoA: 'Generalidade', termoB: 'Continuidade', diferenca: 'GENERALIDADE: o serviço deve atender a todos, sem discriminação ou privilégios. CONTINUIDADE: o serviço não pode ser interrompido arbitrariamente — há exceções legais (ex.: inadimplemento do usuário, razões técnicas).' }
      ],
      aplicacaoAdministracaoPublica: 'A prestação de serviços públicos é um dos eixos do Estado. Os contratos de concessão são fiscalizados pelas agências reguladoras (ANVISA, ANATEL, ANEEL, ANP, etc.). O serviço público pode ser prestado diretamente (órgãos), por outorga (autarquias, empresas públicas, SEM) ou por delegação (concessão e permissão). A Lei 8.987/1995 rege as concessões e permissões de serviços públicos. O CDC (Lei 8.078/1990) também se aplica, com o usuário protegido como consumidor. Os princípios estão no art. 175, CF e na Lei 8.987.',
      pegadinhas: [
        'Confundir concessão com permissão. Concessão = contrato. Permissão = ato administrativo.',
        'Achar que autorização exige licitação. NÃO exige.',
        'Dizer que a continuidade é absoluta. Tem exceções (inadimplemento do usuário, razões técnicas, emergência).',
        'Achar que a modicidade tarifária impede qualquer reajuste. Permite reajustes e revisões conforme contrato e lei.',
        'Confundir serviço público com atividade econômica (art. 173, CF). Serviço público é atividade típica do Estado; atividade econômica pode ser explorada por empresas estatais em regime concorrencial.'
      ],
      errosComuns: [
        'Decorar princípios sem entender o significado.',
        'Confundir concessão, permissão e autorização.',
        'Ignorar as exceções à continuidade.',
        'Achar que todo serviço é prestado diretamente pelo Estado.'
      ],
      resumo: [
        'Serviço público é atividade essencial prestada pelo Estado, direta ou indiretamente, sob regime de direito público.',
        'Princípios: generalidade, continuidade, modicidade tarifária, cortesia, atualidade, segurança, eficiência, regularidade, universalidade.',
        'Formas de prestação: direta, indireta por outorga (entidades) ou por delegação (concessão e permissão).',
        'Concessão: contrato, prazo determinado, licitação. Permissão: ato administrativo, precário, licitação.',
        'Autorização: ato unilateral, precário, sem licitação, para serviços de pequeno porte.',
        'Continuidade tem exceções (inadimplemento, razões técnicas, emergência).'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Serviço público é aquilo que o Estado oferece para você viver bem: saúde, transporte, energia, água, educação. Ele pode fazer sozinho ou passar para uma empresa, mas continua fiscalizando. Há três formas de passar: concessão (contrato), permissão (ato) e autorização (ato menor, sem licitação).',
        outroExemplo: 'A energia elétrica da sua casa é prestada por uma concessionária (contrato com o Estado). O táxi da cidade é prestado por permissão (ato). A banca de jornal na calçada é autorização (ato simples). Os três têm regimes jurídicos diferentes.',
        compararConceitos: 'Concessão: contrato + prazo + licitação. Permissão: ato + precário + licitação. Autorização: ato + sem licitação + precário. Generalidade = atender a todos. Continuidade = não parar (com exceções). Modicidade = tarifa acessível.',
        mostrarPegadinha: 'Cuidado: "A autorização exige licitação prévia". ERRADO — autorização não exige licitação. Outra: "A concessão é ato administrativo precário". ERRADO — concessão é CONTRATO, com prazo determinado.',
        comoApareceEmConcurso: 'Cai como: (1) distinguir concessão, permissão e autorização; (2) identificar o princípio violado em uma situação; (3) conhecer exceções à continuidade.',
        fazerPergunta: {
          pergunta: 'O motorista de táxi exerce serviço público sob qual forma de delegação?',
          resposta: 'PERMISSÃO — ato administrativo, discricionário, precário e precedido de licitação. Não é concessão (que é contrato) nem autorização (que é para serviços de pequeno porte, sem licitação).'
        }
      }
    },
    'DA-09': {
      id: 'L-DA-09',
      moduloId: 'DA-09',
      objetivo: 'Compreender a responsabilidade civil do Estado: teoria da responsabilidade objetiva (art. 37, §6º, CF), excludentes e ação regressiva contra o agente público.',
      prerequisitos: ['DA-06'],
      introducao: 'Quando o Estado causa dano a alguém, ele responde pelos prejuízos. A responsabilidade civil do Estado segue um regime próprio, mais protetivo ao cidadão do que o regime do direito privado. Entender isso é essencial em DA.',
      explicacaoSimples: 'Se um carro oficial atropela alguém por falha do motorista, quem paga a indenização? O Estado — independentemente de culpa do servidor. Depois, o Estado pode cobrar do servidor (ação regressiva). O cidadão não precisa provar culpa do Estado, apenas o dano e o nexo causal. Isso é responsabilidade OBJETIVA.',
      explicacaoTecnica: 'Responsabilidade civil do Estado: obrigação de reparar danos causados a terceiros por atos de seus agentes, no exercício da função pública. EVOLUÇÃO: (1) irresponsabilidade (Estado não respondia); (2) responsabilidade subjetiva (culpa administrativa); (3) TEORIA DA RESPONSABILIDADE OBJETIVA (art. 37, §6º, CF) — o Estado responde independentemente de culpa, bastando DANO + NEXO CAUSAL + CONDUTA (comissiva ou omissiva). Aplicável em regra aos atos COMISSIVOS. Em OMISSÕES, a doutrina e o STF admitem responsabilidade SUBJETIVA (culpa do serviço / faute du service). EXCLUDENTES: culpa exclusiva da vítima, fato exclusivo de terceiro, caso fortuito/força maior, e, para alguns, atos de multidão. AÇÃO REGRESSIVA: o Estado, após indenizar o terceiro, pode cobrar do AGENTE PÚBLICO responsável, mas só mediante CULPA ou DOLO do agente (art. 37, §6º, CF). A responsabilidade do agente perante o Estado é SUBJETIVA (precisa de culpa/dolo). Existe ainda a teoria do RISCO ADMINISTRATIVO e a teoria do RISCO INTEGRAL (para casos específicos, como danos nucleares e atos terroristas em aeronaves — Lei 10.744/2003).',
      exemplos: [
        'Comissivo: viatura policial atropela pedestre por imprudência do motorista. Estado responde objetivamente.',
        'Omissivo: o Estado deixa de fiscalizar e ocorre desabamento em escola pública. Em regra, exige-se culpa do serviço.',
        'Excludente: pedestre se joga na frente do carro oficial. Culpa exclusiva da vítima afasta a responsabilidade.',
        'Ação regressiva: Estado indeniza o terceiro e depois cobra o valor do servidor que agiu com dolo ou culpa.',
        'Risco integral: danos causados por atentados terroristas a aeronaves brasileiras — responsabilidade objetiva ampliada.'
      ],
      comparacoes: [
        { termoA: 'Responsabilidade subjetiva', termoB: 'Responsabilidade objetiva', diferenca: 'SUBJETIVA: exige prova de CULPA (do Estado ou do agente) + dano + nexo causal. OBJETIVA: independe de culpa — basta DANO + NEXO CAUSAL (art. 37, §6º, CF). A regra para o Estado em atos comissivos é a OBJETIVA; em omissões, a doutrina admite a SUBJETIVA.' },
        { termoA: 'Responsabilidade do Estado', termoB: 'Responsabilidade do agente', diferenca: 'ESTADO: perante o terceiro lesado, a responsabilidade é OBJETIVA (independe de culpa). AGENTE: perante o Estado, em ação regressiva, a responsabilidade é SUBJETIVA — exige comprovação de dolo ou culpa.' },
        { termoA: 'Culpa exclusiva da vítima', termoB: 'Culpa concorrente', diferenca: 'CULPA EXCLUSIVA: exclui totalmente a responsabilidade do Estado. CULPA CONCORRENTE: não exclui — apenas reduz o valor da indenização (culpa recíproca).' }
      ],
      aplicacaoAdministracaoPublica: 'A responsabilidade civil do Estado é um dos temas mais cobrados em DA. Base: art. 37, §6º, CF — "As pessoas jurídicas de direito público e as de direito privado prestadoras de serviços públicos responderão pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa." Aplica-se a todas as esferas (União, Estados, DF, Municípios) e a entidades da Administração Indireta de direito público (autarquias, fundações) e privado prestadoras de serviços públicos (empresas públicas, SEM e concessionárias). Não se aplica a empresas estatais exploradoras de atividade econômica (art. 173, §1º, II, CF) — estas respondem como empresas privadas.',
      pegadinhas: [
        'Achar que o Estado responde subjetivamente em todos os casos. Em atos COMISSIVOS, responde OBJETIVAMENTE. Em omissões, a doutrina admite SUBJETIVA.',
        'Dizer que a ação regressiva dispensa culpa do agente. NÃO dispensa — art. 37, §6º, CF exige DOLO ou CULPA.',
        'Confundir culpa exclusiva da vítima (afasta) com culpa concorrente (reduz).',
        'Achar que o Estado responde por ato de qualquer pessoa. Só responde por atos de AGENTE PÚBLICO no exercício da função (ou a pretexto dela).',
        'Confundir responsabilidade civil com responsabilidade penal e administrativa. São esferas independentes.'
      ],
      errosComuns: [
        'Decorar as teorias sem entender quando aplicar cada uma.',
        'Confundir responsabilidade objetiva e subjetiva.',
        'Ignorar a ação regressiva.',
        'Achar que empresas estatais exploradoras de atividade econômica respondem objetivamente.'
      ],
      resumo: [
        'Responsabilidade civil do Estado: obrigação de reparar danos a terceiros por atos de seus agentes.',
        'Regra geral (atos comissivos): RESPONSABILIDADE OBJETIVA (art. 37, §6º, CF) — basta dano + nexo causal.',
        'Omissões: doutrina admite responsabilidade SUBJETIVA (culpa do serviço).',
        'Excludentes: culpa exclusiva da vítima, fato exclusivo de terceiro, caso fortuito/força maior.',
        'Ação regressiva: Estado cobra do agente, mas só com DOLO ou CULPA (responsabilidade subjetiva).',
        'Culpa concorrente: não exclui, apenas reduz a indenização.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Se o Estado causa dano, ele paga — não precisa o cidadão provar culpa (responsabilidade objetiva). Depois, se o servidor agiu com culpa ou dolo, o Estado cobra dele (ação regressiva). Se o próprio cidadão causou o dano, o Estado não paga (culpa exclusiva da vítima).',
        outroExemplo: 'Uma viatura policial causa acidente por excesso de velocidade. O cidadão lesado não precisa provar culpa: o Estado indeniza direto. Depois, o Estado entra com ação regressiva contra o policial que dirigia com culpa.',
        compararConceitos: 'Objetiva: dano + nexo. Subjetiva: dano + nexo + culpa. Estado → terceiro: objetiva. Estado → agente: subjetiva. Culpa exclusiva da vítima: afasta. Culpa concorrente: reduz.',
        mostrarPegadinha: 'Cuidado: "O Estado pode entrar com ação regressiva contra o agente independentemente de culpa ou dolo". ERRADO — a ação regressiva EXIGE dolo ou culpa do agente (art. 37, §6º, CF).',
        comoApareceEmConcurso: 'Cai como: (1) teoria aplicável (objetiva em comissivos, subjetiva em omissões); (2) excludentes; (3) ação regressiva; (4) responsabilidade de entes da Administração Indireta.',
        fazerPergunta: {
          pergunta: 'O Estado indeniza um cidadão por dano causado por servidor público. O servidor agiu com culpa. O que o Estado pode fazer?',
          resposta: 'Entrar com AÇÃO REGRESSIVA contra o servidor, cobrando o valor da indenização — desde que comprove DOLO ou CULPA do agente (art. 37, §6º, CF). A responsabilidade do servidor perante o Estado é SUBJETIVA.'
        }
      }
    },
    'ADM-11': {
      id: 'L-ADM-11',
      moduloId: 'ADM-11',
      objetivo: 'Compreender a Administração de Materiais e Patrimônio: conceito, ciclo de materiais (compras, recebimento, armazenagem, distribuição), gestão de estoques, ponto de pedido, estoque de segurança, inventário e controle patrimonial.',
      prerequisitos: ['ADM-01'],
      introducao: 'Toda organização precisa de materiais para funcionar: papel, computadores, medicamentos, viaturas, material de limpeza. A Administração de Materiais cuida de garantir que tudo esteja disponível no momento certo, na quantidade certa, com o menor custo possível.',
      explicacaoSimples: 'Pense em uma cozinha. Você precisa planejar a lista de compras (compras), receber os produtos, guardar no armário certo (armazenagem), usar na hora certa (distribuição) e repor o que está acabando (controle de estoque). Na empresa e no órgão público é igual — só que com muito mais itens e regras.',
      explicacaoTecnica: 'Administração de Materiais é o conjunto de atividades que garantem o suprimento de materiais necessários à organização, no tempo, quantidade e qualidade adequados. CICLO DE MATERIAIS: (1) IDENTIFICAÇÃO das necessidades; (2) COMPRAS (licitação, no setor público); (3) RECEBIMENTO e conferência; (4) ARMAZENAGEM; (5) DISTRIBUIÇÃO interna; (6) CONTROLE de estoques; (7) INVENTÁRIO. GESTÃO DE ESTOQUES: ESTOQUE MÍNIMO (menor quantidade aceitável), ESTOQUE MÁXIMO (limite superior), ESTOQUE DE SEGURANÇA (quantidade adicional para cobrir variações imprevistas — atrasos, picos de demanda), PONTO DE PEDIDO (nível que dispara nova compra), ESTOQUE EM TRÂNSITO (mercadoria entre fornecedor e recebedor). PATRIMÔNIO: bens permanentes (veículos, computadores, móveis). INVENTÁRIO: levantamento físico dos bens, comparando com os registros contábeis. No setor público, o patrimônio é registrado no SIAFI e sujeito a depreciação e baixa.',
      exemplos: [
        'Estoque de segurança: um hospital mantém 200 doses extras de insulina para eventuais aumentos de demanda.',
        'Ponto de pedido: quando o estoque de papel A4 cai para 50 resmas, dispara-se novo pedido.',
        'Inventário: a prefeitura faz contagem física dos bens móveis uma vez por ano.',
        'Distribuição: material de escritório entregue às secretarias conforme requisição interna.',
        'Baixa patrimonial: computador obsoleto é desincorporado após processo administrativo.'
      ],
      comparacoes: [
        { termoA: 'Estoque mínimo', termoB: 'Estoque de segurança', diferenca: 'ESTOQUE MÍNIMO: menor quantidade que pode existir sem comprometer a operação (limite absoluto). ESTOQUE DE SEGURANÇA: quantidade ADICIONAL mantida para cobrir variações imprevistas (atraso do fornecedor, aumento de demanda). O estoque de segurança costuma ser calculado sobre o estoque mínimo.' },
        { termoA: 'Ponto de pedido', termoB: 'Estoque de segurança', diferenca: 'PONTO DE PEDIDO: nível que, quando atingido, dispara nova compra. ESTOQUE DE SEGURANÇA: quantidade mantida como reserva para imprevistos. O ponto de pedido geralmente é calculado considerando o consumo médio durante o prazo de entrega + o estoque de segurança.' },
        { termoA: 'Estoque máximo', termoB: 'Estoque em trânsito', diferenca: 'ESTOQUE MÁXIMO: limite superior que não deve ser ultrapassado (evita capital parado e desperdício). ESTOQUE EM TRÂNSITO: mercadoria já adquirida mas ainda não recebida (entre fornecedor e recebedor). São categorias distintas.' }
      ],
      aplicacaoAdministracaoPublica: 'Na Administração Pública, a área de materiais tem dois pilares: SUPRIMENTO (compras, licitação na Lei 14.133/2021, almoxarifado) e PATRIMÔNIO (bens permanentes, depreciação, baixa, inventário). O SIAFI (Sistema Integrado de Administração Financeira) é o sistema federal de controle patrimonial. As autarquias, empresas públicas e SEM também mantêm setores de material e patrimônio. A Lei 4.320/1964 classifica despesas em custeio (material de consumo) e investimento (bens permanentes). O controle de bens é feito pelos Tribunais de Contas.',
      pegadinhas: [
        'Confundir estoque de segurança com ponto de pedido. O primeiro é reserva; o segundo dispara compra.',
        'Achar que estoque máximo é o mínimo. São opostos.',
        'Dizer que material de consumo é patrimônio. Material de consumo NÃO é bem permanente — é despesa de custeio.',
        'Achar que o inventário é apenas contagem. Também envolve ajuste de registros e baixa de itens.',
        'Confundir almoxarifado (materiais de consumo) com depósito de bens permanentes.'
      ],
      errosComuns: [
        'Decorar tipos de estoque sem exemplos.',
        'Confundir despesa de custeio com investimento.',
        'Ignorar a importância do inventário no setor público.'
      ],
      resumo: [
        'Administração de Materiais garante suprimento adequado no tempo, quantidade e qualidade.',
        'Ciclo: identificação → compras → recebimento → armazenagem → distribuição → controle → inventário.',
        'Tipos de estoque: mínimo, máximo, de segurança, ponto de pedido, em trânsito.',
        'Estoque de segurança é reserva para imprevistos; ponto de pedido dispara compra.',
        'Patrimônio: bens permanentes (SIAFI, depreciação, baixa, inventário).',
        'No setor público, compras via licitação (Lei 14.133/2021) e despesas classificadas em custeio e investimento.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Administrar material é como abastecer uma despensa: você precisa saber o que tem, o que está faltando, quando comprar e onde guardar. E se for da casa do Estado, ainda precisa prestar contas de tudo.',
        outroExemplo: 'Um hospital público calcula que gasta 100 luvas por dia. O fornecedor demora 5 dias. Então o ponto de pedido é 500 + reserva (ex.: 100). Quando o estoque chega a 600, dispara a compra. O estoque mínimo é 100, o de segurança 100, o máximo é o limite que não se deve ultrapassar.',
        compararConceitos: 'Estoque mínimo = limite absoluto. Estoque de segurança = reserva. Ponto de pedido = gatilho de compra. Estoque máximo = limite superior. Material de consumo = custeio. Bem permanente = investimento.',
        mostrarPegadinha: 'Cuidado: "Material de consumo é registrado como patrimônio". ERRADO. Material de consumo é despesa de CUSTEIO. Bem permanente é INVESTIMENTO e vai para o patrimônio.',
        comoApareceEmConcurso: 'Cai como: (1) identificar tipos de estoque em situações; (2) diferenciar material de consumo de bem permanente; (3) etapas do ciclo de materiais; (4) inventário e baixa patrimonial.',
        fazerPergunta: {
          pergunta: 'Uma prefeitura comprou 100 cadeiras novas para a escola municipal. Isso é material de consumo ou bem permanente?',
          resposta: 'BEM PERMANENTE — cadeiras têm vida útil superior a 2 anos e não se esgotam com o uso. Vão para o patrimônio e são contabilizadas como INVESTIMENTO. Material de consumo seria, por exemplo, papel, caneta, grampeador (uso imediato).'
        }
      }
    },
    'ADM-08': {
      id: 'L-ADM-08',
      moduloId: 'ADM-08',
      objetivo: 'Aprofundar o estudo da Liderança e Motivação: principais teorias da motivação (Maslow, Herzberg, McGregor, Vroom), estilos de liderança (autocrático, democrático, liberal, situacional, transformacional) e comportamento de equipes.',
      prerequisitos: ['ADM-05'],
      introducao: 'Motivação e liderança são dois pilares da gestão de pessoas. Motivação explica POR QUE as pessoas agem; liderança explica COMO conduzi-las. Todo concurso de área administrativa cobra pelo menos uma dessas teorias.',
      explicacaoSimples: 'Motivação é o combustível interno que faz a pessoa se esforçar. Liderança é a habilidade de influenciar pessoas para que deem o melhor de si. Sem motivação, ninguém produz; sem liderança, ninguém se organiza. As teorias clássicas tentam explicar como e por que isso funciona.',
      explicacaoTecnica: 'TEORIAS DA MOTIVAÇÃO: (1) MASLOW — Hierarquia das necessidades em 5 níveis: fisiológicas, segurança, sociais, estima e autorrealização (só se sobe de nível quando o inferior está satisfeito). (2) HERZBERG — Teoria dos dois fatores: HIGIÊNICOS (salário, condições de trabalho, segurança — evitam insatisfação, mas não motivam) e MOTIVACIONAIS (realização, reconhecimento, responsabilidade, crescimento — geram satisfação). (3) MCGREGOR — Teoria X (trabalhador preguiçoso, precisa ser controlado) e Teoria Y (trabalhador gosta do trabalho, busca responsabilidade). (4) VROOM — Teoria da expectativa: motivação = expectativa × instrumentalidade × valência. ESTILOS DE LIDERANÇA: AUTOCRÁTICO (decide sozinho), DEMOCRÁTICO (compartilha decisões), LIBERAL/LAISSEZ-FAIRE (deixa a equipe livre). LIDERANÇA SITUACIONAL (Hersey e Blanchard) — o líder adapta o estilo ao nível de maturidade da equipe. LIDERANÇA TRANSFORMACIONAL — inspira, motiva, cria visão de futuro (Burns, Bass). EQUIPES: estágios de desenvolvimento (formação, turbulência, normalização, desempenho, dissolução) e características de equipes de alta performance.',
      exemplos: [
        'Maslow: primeiro o servidor precisa de salário e segurança; depois busca reconhecimento e realização.',
        'Herzberg: aumento salarial evita insatisfação, mas não motiva; já o reconhecimento motiva.',
        'McGregor: um gestor que confia na equipe adota Teoria Y; quem vigia demais adota Teoria X.',
        'Vroom: o servidor se esforça se acreditar que o esforço levará à recompensa que ele valoriza.',
        'Liderança transformacional: o gestor propõe uma visão de futuro, inspira e desenvolve as pessoas.'
      ],
      comparacoes: [
        { termoA: 'Maslow', termoB: 'Herzberg', diferenca: 'MASLOW: hierarquia de 5 necessidades (fisiológicas, segurança, sociais, estima, autorrealização); só sobe de nível quando o inferior é atendido. HERZBERG: dois fatores (higiênicos e motivacionais) — os higiênicos apenas evitam insatisfação; os motivacionais geram satisfação. Herzberg criticou Maslow por não distinguir bem os níveis.' },
        { termoA: 'Liderança autocrática', termoB: 'Liderança liberal', diferenca: 'AUTOCRÁTICA: líder centraliza decisões, dá ordens, controla rigorosamente. LIBERAL (laissez-faire): líder quase não interfere, deixando a equipe decidir livremente. A DEMOCRÁTICA fica no meio — compartilha decisões.' },
        { termoA: 'Liderança transacional', termoB: 'Liderança transformacional', diferenca: 'TRANSACIONAL: baseada em troca (recompensa pelo desempenho, punição pelo erro). TRANSFORMACIONAL: baseada em inspiração, visão, desenvolvimento pessoal — o líder eleva a equipe. As duas podem coexistir.' }
      ],
      aplicacaoAdministracaoPublica: 'No serviço público, as teorias da motivação ajudam a entender o comportamento do servidor: a estabilidade e o salário satisfazem necessidades higiênicas, mas o reconhecimento e o propósito do serviço público geram motivação intrínseca. A liderança é cobrada em concursos como competência comportamental na avaliação de desempenho. A gestão por competências trabalha liderança e motivação como competências a desenvolver. O Decreto 5.707/2006 (PNDP) prevê desenvolvimento de competências gerenciais.',
      pegadinhas: [
        'Trocar Herzberg com Maslow. Herzberg distingue higiênicos x motivacionais; Maslow hierarquiza 5 níveis.',
        'Achar que salário motiva. No Herzberg, salário é fator higiênico — evita insatisfação, mas não motiva.',
        'Confundir Teoria X e Teoria Y. X = trabalhador preguiçoso. Y = trabalhador motivado.',
        'Achar que liderança liberal é a melhor. Depende da maturidade da equipe.',
        'Confundir liderança transacional com transformacional. Uma troca recompensa por desempenho; a outra transforma por inspiração.'
      ],
      errosComuns: [
        'Decorar teorias sem entender as diferenças.',
        'Confundir fator higiênico com fator motivacional.',
        'Achar que todo líder deve ser transformacional.'
      ],
      resumo: [
        'Motivação é o combustível; liderança é a condução.',
        'Maslow: 5 níveis (fisiológicas, segurança, sociais, estima, autorrealização).',
        'Herzberg: fatores higiênicos (evitam insatisfação) e motivacionais (geram satisfação).',
        'McGregor: Teoria X (trabalhador preguiçoso) x Teoria Y (trabalhador motivado).',
        'Vroom: motivação = expectativa × instrumentalidade × valência.',
        'Estilos: autocrático, democrático, liberal; situacional; transformacional.',
        'Salário evita insatisfação, mas não motiva.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Motivação é o "porquê" (o que faz alguém se esforçar). Liderança é o "como" (conduzir pessoas). As teorias tentam explicar esses "porquês": Maslow diz que a gente sobe uma escada; Herzberg diz que tem coisas que só evitam insatisfação; McGregor diz que gestor pode confiar ou desconfiar do trabalhador; Vroom diz que a motivação depende da expectativa de que o esforço vai valer a pena.',
        outroExemplo: 'Em um órgão público: salário e estabilidade satisfazem as necessidades higiênicas (Herzberg). Reconhecimento, propósito do serviço público e desenvolvimento de carreira são motivacionais. Um gestor que inspira (transformacional) obtém mais engajamento do que um gestor que apenas pune e recompensa (transacional).',
        compararConceitos: 'Maslow: hierarquia. Herzberg: higiênicos x motivacionais. McGregor: X x Y. Vroom: expectativa. Autocrático x democrático x liberal. Transacional x transformacional.',
        mostrarPegadinha: 'Cuidado: "O aumento de salário é fator motivacional na teoria de Herzberg". ERRADO — salário é HIGIÊNICO. Ele evita insatisfação, mas não gera motivação. Fatores motivacionais: reconhecimento, responsabilidade, crescimento, realização.',
        comoApareceEmConcurso: 'Cai como: (1) identificação da teoria em uma situação; (2) diferença entre higiênico e motivacional; (3) estilos de liderança; (4) Teoria X x Y.',
        fazerPergunta: {
          pergunta: 'Um gestor concede um bônus ao servidor que bateu a meta. Esse gestor adota liderança transacional ou transformacional?',
          resposta: 'TRANSACIONAL — baseia-se em troca (recompensa por desempenho). A liderança transformacional iria além: inspiraria, daria visão de futuro e desenvolveria o servidor como pessoa.'
        }
      }
    },
    'ADM-09': {
      id: 'L-ADM-09',
      moduloId: 'ADM-09',
      objetivo: 'Compreender o processo de comunicação organizacional: elementos (emissor, receptor, mensagem, canal, código, ruído, feedback), barreiras e tipos de comunicação (formal, informal, vertical, horizontal, diagonal).',
      prerequisitos: ['ADM-05'],
      introducao: 'Comunicação é o sistema nervoso da organização. Sem ela, as ordens não chegam, os problemas não são resolvidos, as equipes não se alinham. É um dos temas mais presentes em concursos administrativos.',
      explicacaoSimples: 'Comunicar é fazer a informação sair de uma cabeça e chegar a outra, do jeito certo. Isso envolve quem fala (emissor), o que se fala (mensagem), como se fala (canal), quem recebe (receptor) e o que o receptor devolve (feedback). Se algo atrapalha no caminho, é ruído.',
      explicacaoTecnica: 'Comunicação é o processo de transmissão de informação e significado entre pessoas. ELEMENTOS: EMISSOR (quem envia), CODIFICAÇÃO (transformar ideia em linguagem), MENSAGEM (conteúdo), CANAL (meio: verbal, escrito, eletrônico), DECODIFICAÇÃO (interpretar), RECEPTOR (quem recebe), FEEDBACK (retorno ao emissor), RUÍDO (qualquer interferência que distorça a mensagem). BARREIRAS: físicas (ruído ambiente), fisiológicas (problemas de audição/visão), psicológicas (preconceitos, emoções), semânticas (palavras ambíguas), culturais. TIPOS DE COMUNICAÇÃO: (1) FORMAL (canais oficiais: memorandos, portarias, e-mails institucionais) x INFORMAL (rádio-peão, conversas de corredor); (2) VERTICAL DESCENDENTE (de cima para baixo: ordens, instruções), VERTICAL ASCENDENTE (de baixo para cima: relatórios, sugestões); (3) HORIZONTAL (entre pares de mesmo nível); (4) DIAGONAL (entre níveis e áreas diferentes).',
      exemplos: [
        'Emissor: o secretário. Mensagem: reestruturar o setor. Canal: e-mail oficial. Receptor: diretores. Feedback: respostas confirmando entendimento.',
        'Comunicação descendente: portaria que cria uma nova rotina.',
        'Comunicação ascendente: relatório mensal da equipe para a chefia.',
        'Comunicação horizontal: reunião entre coordenadores de mesmo nível.',
        'Comunicação diagonal: contato entre um coordenador e um técnico de outro setor.'
      ],
      comparacoes: [
        { termoA: 'Comunicação formal', termoB: 'Comunicação informal', diferenca: 'FORMAL: usa canais oficiais da organização (memorandos, e-mails institucionais, atas, portarias). INFORMAL: ocorre fora dos canais oficiais (rádio-peão, conversas de corredor, mensagens espontâneas). Ambas influenciam o clima organizacional; a informal pode ser muito rápida.' },
        { termoA: 'Comunicação descendente', termoB: 'Comunicação ascendente', diferenca: 'DESCENDENTE: da chefia para o subordinado (ordens, instruções, informações). ASCENDENTE: do subordinado para a chefia (relatórios, sugestões, reclamações). A horizontal é entre pares; a diagonal cruza áreas e níveis.' },
        { termoA: 'Ruído', termoB: 'Barreira', diferenca: 'RUÍDO: qualquer interferência que distorça a mensagem durante o processo (som alto, distração, canal inadequado). BARREIRA: obstáculo mais amplo, que pode ser físico, fisiológico, psicológico, semântico ou cultural. O ruído é uma forma de barreira.' }
      ],
      aplicacaoAdministracaoPublica: 'Na Administração Pública, a comunicação é essencial para o atendimento ao cidadão, para o trabalho em equipe e para a transparência. A Lei de Acesso à Informação (LAI — Lei 12.527/2011) reforça a comunicação pública. A Ouvidoria é um canal de comunicação entre cidadão e Estado. Internamente, a comunicação organizacional reduz conflitos e melhora a eficiência. Em concursos, aparece ligada a atendimento, gestão de pessoas e qualidade.',
      pegadinhas: [
        'Achar que o feedback é opcional. É parte essencial do processo — sem feedback, não se sabe se a mensagem foi entendida.',
        'Confundir comunicação formal com escrita e informal com oral. Ambos os tipos podem ser verbais ou escritos; o que os distingue é o canal oficial.',
        'Dizer que comunicação descendente é sempre a melhor. Depende do contexto; a ascendente é importante para ouvir a equipe.',
        'Achar que ruído é só som. Ruído pode ser distração, emoção, ambiguidade, canal inadequado.',
        'Confundir barreira semântica com psicológica. Semântica é sobre o significado das palavras; psicológica é sobre emoções e preconceitos.'
      ],
      errosComuns: [
        'Decorar os elementos sem entender o fluxo.',
        'Ignorar o papel do feedback.',
        'Confundir ruído com barreira.',
        'Achar que comunicação informal é prejudicial — pode ser positiva e complementar.'
      ],
      resumo: [
        'Comunicação é transmissão de informação e significado entre pessoas.',
        'Elementos: emissor, codificação, mensagem, canal, decodificação, receptor, feedback, ruído.',
        'Barreiras: físicas, fisiológicas, psicológicas, semânticas, culturais.',
        'Tipos: formal x informal; vertical descendente x ascendente; horizontal; diagonal.',
        'Feedback é essencial para verificar o entendimento.',
        'Ruído é interferência que distorce; barreira é obstáculo mais amplo.',
        'Comunicação informal pode complementar a formal (rádio-peão).'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Comunicar é passar uma ideia de uma cabeça para outra. Para isso: alguém fala (emissor), transforma em palavras (codificação), envia pelo canal certo (mensagem), o outro interpreta (decodificação), e devolve uma resposta (feedback). Se algo atrapalha, é ruído.',
        outroExemplo: 'Um secretário envia um e-mail pedindo que os diretores façam reuniões com as equipes. No e-mail: mensagem. E-mail: canal. Diretores: receptores. Respostas confirmando: feedback. Se o e-mail tiver termos ambíguos ou for mal redigido, há barreira semântica.',
        compararConceitos: 'Formal = canal oficial. Informal = rádio-peão. Descendente = de cima pra baixo. Ascendente = de baixo pra cima. Horizontal = entre pares. Diagonal = entre áreas/níveis. Ruído = interferência. Barreira = obstáculo mais amplo.',
        mostrarPegadinha: 'Cuidado: "A comunicação informal é sempre prejudicial à organização". ERRADO — a comunicação informal (rádio-peão) pode ser rápida e complementar a formal, ajudando a resolver problemas do dia a dia.',
        comoApareceEmConcurso: 'Cai como: (1) identificar elementos do processo; (2) classificar tipos de comunicação; (3) reconhecer barreiras; (4) papel do feedback.',
        fazerPergunta: {
          pergunta: 'Um servidor envia um relatório mensal à sua chefia. Esse tipo de comunicação é:',
          resposta: 'COMUNICAÇÃO ASCENDENTE — vai do subordinado para a chefia. Seria DESCENDENTE se a chefia enviasse uma ordem ao servidor; HORIZONTAL se fosse entre colegas de mesmo nível.'
        }
      }
    },
    'DA-11': {
      id: 'L-DA-11',
      moduloId: 'DA-11',
      objetivo: 'Compreender o regime da improbidade administrativa (Lei 8.429/1992, alterada pela Lei 14.230/2021): conceito, sujeitos, atos de improbidade (enriquecimento ilícito, prejuízo ao erário e violação de princípios), sanções e prescrição.',
      prerequisitos: ['DA-04'],
      introducao: 'A improbidade administrativa é uma das principais ferramentas de combate à corrupção no Brasil. A Lei 8.429/1992 sofreu alterações profundas com a Lei 14.230/2021 — concursos atualizados cobram o novo texto. Entender o que é improbidade, quem pode cometer e quais as sanções é decisivo.',
      explicacaoSimples: 'Improbidade administrativa é a conduta desonesta de um agente público que fere os deveres de honestidade, imparcialidade e lealdade à Administração. Não basta ser ilegal — é preciso que haja desonestidade (dolo). Um ato meramente ilegal, sem má-fé, não gera improbidade.',
      explicacaoTecnica: 'Improbidade administrativa é a conduta dolosa (com intenção) praticada por agente público ou terceiro que atente contra a Administração Pública. Marco legal: Lei 8.429/1992, com alterações substanciais da Lei 14.230/2021. SUJEITOS ATIVOS: agente público (servidor, político, empregado público, dirigente) e terceiro que induza, concorra ou se beneficie. SUJEITOS PASSIVOS: a Administração Pública direta e indireta de qualquer ente. MODALIDADES DE ATOS (art. 9º, 10 e 11): (1) ENRIQUECIMENTO ILÍCITO — auferir vantagem patrimonial indevida (art. 9º). (2) PREJUÍZO AO ERÁRIO — causar perda patrimonial ao Estado (art. 10). (3) VIOLAÇÃO DE PRINCÍPIOS — violar deveres de honestidade, imparcialidade, legalidade e lealdade às instituições (art. 11). SANÇÕES (art. 12): perda dos bens ou valores acrescidos ilicitamente, ressarcimento integral do dano, perda da função pública, suspensão dos direitos políticos, multa civil, proibição de contratar com o poder público e de receber benefícios fiscais por prazo determinado. Após a Lei 14.230/2021, é OBRIGATÓRIO o DOLO (não há mais improbidade culposa). PRESCRIÇÃO: em regra, 8 anos a contar do fato ou do término do mandato, conforme o caso. A ação é proposta pelo Ministério Público.',
      exemplos: [
        'Enriquecimento ilícito: servidor recebe propina para favorecer empresa em licitação.',
        'Prejuízo ao erário: gestor autoriza compra superfaturada com desvio de finalidade.',
        'Violação de princípios: gestor utiliza servidor público para fins particulares.',
        'Sanção aplicada: perda da função pública + ressarcimento integral + multa civil.',
        'Após a Lei 14.230/2021: ato praticado por mera culpa (sem dolo) não configura improbidade.'
      ],
      comparacoes: [
        { termoA: 'Improbidade administrativa', termoB: 'Ato ilegal comum', diferenca: 'IMPROBIDADE: exige DOLO (intenção de obter vantagem ou causar dano). ATO ILEGAL COMUM: pode ser por culpa, imperícia ou simples ilegalidade — não configura improbidade. Após a Lei 14.230/2021, a improbidade culposa deixou de existir.' },
        { termoA: 'Improbidade administrativa', termoB: 'Crime de responsabilidade', diferenca: 'IMPROBIDADE: ilícito de natureza CIVIL-ADMINISTRATIVA, julgado na Justiça Comum, sancionado pela Lei 8.429/1992. CRIME DE RESPONSABILIDADE: ilícito POLÍTICO-ADMINISTRATIVO, previsto na Lei 1.079/1950 (agentes políticos federais) e leis estaduais/municipais, julgado pelo Legislativo (impeachment). São esferas distintas, podendo haver cumulação.' },
        { termoA: 'Enriquecimento ilícito', termoB: 'Prejuízo ao erário', diferenca: 'ENRIQUECIMENTO ILÍCITO (art. 9º): agente obtém vantagem patrimonial indevida (ex.: propina). PREJUÍZO AO ERÁRIO (art. 10): Estado sofre perda patrimonial (ex.: desvio de recursos, superfaturamento). VIOLAÇÃO DE PRINCÍPIOS (art. 11): atenta contra deveres de honestidade, imparcialidade, legalidade, sem necessariamente haver vantagem ou prejuízo.' }
      ],
      aplicacaoAdministracaoPublica: 'A Lei 8.429/1992 é uma das principais ferramentas de combate à corrupção. A Lei 14.230/2021 trouxe mudanças profundas: exigência de dolo, novas regras de prescrição, reformulação do art. 11 e legitimidade ativa exclusiva do MP para a ação de improbidade. A Controladoria-Geral da União (CGU), os Tribunais de Contas e o Ministério Público atuam na apuração. O processo pode correr paralelamente à esfera penal e administrativa, sem prejuízo recíproco (esferas independentes).',
      pegadinhas: [
        'Dizer que ato culposo configura improbidade. Após a Lei 14.230/2021, NÃO configura — exige-se DOLO.',
        'Confundir improbidade administrativa com crime de responsabilidade. São esferas distintas (civil-administrativa x político-administrativa).',
        'Achar que qualquer ilegalidade é improbidade. Não é: precisa de DOLO e enquadramento em uma das três modalidades.',
        'Confundir as três modalidades (arts. 9º, 10 e 11). Memorize: art. 9º = enriquecimento; art. 10 = prejuízo ao erário; art. 11 = princípios.',
        'Achar que o particular não pode cometer improbidade. Pode — se concorrer, induzir ou se beneficiar.'
      ],
      errosComuns: [
        'Decorar sanções sem entender quando cada modalidade se aplica.',
        'Confundir improbidade com ato ilegal.',
        'Ignorar as mudanças da Lei 14.230/2021.',
        'Achar que só o servidor efetivo pode ser sujeito ativo.'
      ],
      resumo: [
        'Improbidade administrativa: conduta DOLOSA que atenta contra a Administração Pública (Lei 8.429/1992).',
        'Três modalidades: enriquecimento ilícito (art. 9º), prejuízo ao erário (art. 10) e violação de princípios (art. 11).',
        'Após a Lei 14.230/2021: exige DOLO; improbidade culposa foi extinta.',
        'Sanções: perda dos bens, ressarcimento, perda da função, suspensão de direitos políticos, multa civil, proibição de contratar com o poder público.',
        'Sujeitos ativos: agente público e terceiro que concorra, induza ou se beneficie.',
        'Prescrição: em regra, 8 anos.',
        'Ação é proposta pelo Ministério Público.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Improbidade é o "ato desonesto" do servidor. Não basta ser ilegal — tem que ter má-fé (dolo). Há três tipos: ficar rico ilicitamente (propina), causar prejuízo ao Estado (superfaturamento) ou violar princípios (usar cargo para fins pessoais). As sanções são pesadas.',
        outroExemplo: 'Um servidor aprova uma licitação para uma empresa amiga em troca de R$ 50.000. Ele enriqueceu ilicitamente (art. 9º) e causou prejuízo ao erário (art. 10, se houve superfaturamento). Sanções: perda da função, ressarcimento, multa civil e suspensão de direitos políticos.',
        compararConceitos: 'Improbidade x crime de responsabilidade: civil-administrativa x político-administrativa. Improbidade x ato ilegal: exige dolo x não exige. Art. 9º: enriquecimento. Art. 10: prejuízo. Art. 11: princípios. Sem dolo, não há improbidade.',
        mostrarPegadinha: 'Cuidado: "Ato culposo pode configurar improbidade". ERRADO após a Lei 14.230/2021. Só DOLO. Outra: "O particular não pode cometer improbidade". ERRADO — pode, se concorrer, induzir ou se beneficiar do ato.',
        comoApareceEmConcurso: 'Cai como: (1) identificar a modalidade de improbidade; (2) distinguir improbidade de ato ilegal; (3) aplicar as sanções; (4) reconhecer as mudanças da Lei 14.230/2021.',
        fazerPergunta: {
          pergunta: 'Um servidor, por mera inexperiência, autoriza uma compra com valor acima do mercado, causando prejuízo ao erário. Isso configura improbidade administrativa?',
          respostA: 'NÃO — após a Lei 14.230/2021, a improbidade exige DOLO (intenção). Mera culpa (imperícia, imprudência) não configura improbidade, embora possa gerar outras responsabilidades (administrativa, civil comum).'
        }
      }
    },
    'DA-12': {
      id: 'L-DA-12',
      moduloId: 'DA-12',
      objetivo: 'Compreender o processo administrativo brasileiro: princípios, fases (instauração, instrução, defesa, relatório e decisão), recursos administrativos e a Lei 9.784/1999.',
      prerequisitos: ['DA-06'],
      introducao: 'O processo administrativo é o caminho formal pelo qual a Administração toma decisões que afetam o cidadão. Sem ele, não há contraditório, ampla defesa, nem segurança jurídica. É tema de concursos de DA e AP.',
      explicacaoSimples: 'Imagine que um servidor será punido. A Administração não pode simplesmente punir — precisa abrir um processo, ouvir o servidor, dar chance de defesa, analisar provas, produzir relatório e só então decidir. Todo esse rito é o processo administrativo. Ele protege o cidadão e organiza a ação do Estado.',
      explicacaoTecnica: 'Processo administrativo é o conjunto de atos administrativos ordenados que visa a uma decisão final da Administração, com participação dos interessados. Marco legal federal: Lei 9.784/1999. PRINCÍPIOS: legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público, eficiência. FASES: (1) INSTAURAÇÃO — início de ofício ou a requerimento; (2) INSTRUÇÃO — produção de provas, oitiva de testemunhas, juntada de documentos; (3) DEFESA — oportunidade de o interessado se manifestar (contraditório e ampla defesa); (4) RELATÓRIO — síntese dos fatos e provas; (5) DECISÃO — ato final da autoridade competente; (6) RECURSO — possibilidade de revisão. RECURSOS ADMINISTRATIVOS: pedido de reconsideração (à mesma autoridade), recurso hierárquico (à autoridade superior) e revisão (reapreciação de ato sancionatório). Prazos: em regra, 10 dias para decisão, prorrogáveis por mais 5 (Lei 9.784/1999). Decadência: 5 anos para anular atos administrativos dos quais decorram efeitos favoráveis ao destinatário, salvo má-fé.',
      exemplos: [
        'Instauração: portaria que abre processo disciplinar contra servidor.',
        'Instrução: oitiva de testemunhas, juntada de documentos, perícias.',
        'Defesa: servidor apresenta defesa escrita, indicando provas.',
        'Relatório: comissão resume os fatos e conclui pela punição ou absolvição.',
        'Decisão: autoridade competente aplica suspensão de 30 dias.'
      ],
      comparacoes: [
        { termoA: 'Contraditório', termoB: 'Ampla defesa', diferenca: 'CONTRADITÓRIO: direito de saber o que está sendo alegado contra o interessado e de se opor. AMPLA DEFESA: direito de usar todos os meios legais para se defender (provas, testemunhas, documentos, advogado). São complementares e inseparáveis.' },
        { termoA: 'Recurso hierárquico', termoB: 'Pedido de reconsideração', diferenca: 'RECURSO HIERÁRQUICO: dirigido à autoridade SUPERIOR à que praticou o ato. PEDIDO DE RECONSIDERAÇÃO: dirigido à MESMA autoridade que praticou o ato, pedindo nova análise. São instrumentos distintos de impugnação.' },
        { termoA: 'Processo administrativo', termoB: 'Processo judicial', diferenca: 'ADMINISTRATIVO: conduzido pela própria Administração, sem intervenção do Judiciário. JUDICIAL: conduzido pelo Poder Judiciário, com decisão definitiva (coisa julgada). O processo administrativo pode ser revisto pelo Judiciário quanto à legalidade.' }
      ],
      aplicacaoAdministracaoPublica: 'A Lei 9.784/1999 regula o processo administrativo no âmbito da Administração Pública Federal. Estados e Municípios têm leis próprias, mas frequentemente se inspiram nela. Em concursos, o processo administrativo aparece como base para: processo disciplinar, licitação, anulação/revogação de atos, defesa do cidadão. A Súmula Vinculante 5 do STF garante o contraditório e a ampla defesa no processo administrativo disciplinar. O prazo decadencial de 5 anos (art. 54 da Lei 9.784/1999) é cobrado com frequência.',
      pegadinhas: [
        'Achar que o processo administrativo dispensa contraditório e ampla defesa. NÃO dispensa — são obrigatórios.',
        'Confundir pedido de reconsideração (mesma autoridade) com recurso hierárquico (autoridade superior).',
        'Dizer que o prazo decadencial para anular ato administrativo é de 10 anos. É de 5 anos, salvo má-fé (art. 54 da Lei 9.784/1999).',
        'Achar que a Administração pode revisar de ofício a qualquer tempo. Só nos limites da Súmula 473/STF e do prazo decadencial.',
        'Confundir processo administrativo com processo judicial.'
      ],
      errosComuns: [
        'Decorar fases sem entender o fluxo.',
        'Confundir tipos de recursos administrativos.',
        'Ignorar prazos (10 dias para decisão, 5 anos para anulação).'
      ],
      resumo: [
        'Processo administrativo: conjunto de atos ordenados que visa a decisão final com participação dos interessados.',
        'Base legal: Lei 9.784/1999 (âmbito federal).',
        'Princípios: legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público, eficiência.',
        'Fases: instauração → instrução → defesa → relatório → decisão → recurso.',
        'Recursos: pedido de reconsideração (mesma autoridade) e recurso hierárquico (autoridade superior).',
        'Prazo para decisão: em regra, 10 dias, prorrogável por mais 5.',
        'Prazo decadencial para anular ato favorável: 5 anos (art. 54), salvo má-fé.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Processo administrativo é o ritual que a Administração segue antes de tomar uma decisão. Não pode punir sem ouvir; não pode decidir sem instruir o processo. Isso protege o cidadão e dá segurança jurídica.',
        outroExemplo: 'Um servidor é acusado de faltar sem justificativa. A Administração instaura portaria (instauração), colhe provas (instrução), ouve o servidor (defesa), resume os fatos (relatório), decide (suspensão) e o servidor pode recorrer (recurso). Tudo dentro da Lei 9.784/1999.',
        compararConceitos: 'Contraditório x ampla defesa: saber o que se alega x ter meios de se defender. Recurso hierárquico x pedido de reconsideração: autoridade superior x mesma autoridade. Prazo de decisão: 10 + 5 dias. Prazo decadencial: 5 anos.',
        mostrarPegadinha: 'Cuidado: "O prazo decadencial para a Administração anular ato favorável ao administrado é de 10 anos". ERRADO. É de 5 anos, salvo comprovada má-fé (art. 54 da Lei 9.784/1999).',
        comoApareceEmConcurso: 'Cai como: (1) princípios do processo administrativo; (2) fases do processo; (3) tipos de recursos; (4) prazos (10 dias, 5 anos); (5) necessidade de contraditório e ampla defesa.',
        fazerPergunta: {
          pergunta: 'O servidor pode ser punido sem que se lhe dê oportunidade de defesa?',
          resposta: 'NÃO. O contraditório e a ampla defesa são obrigatórios no processo administrativo (art. 5º, LV, CF/88 e Lei 9.784/1999). Punir sem defesa é nulidade absoluta do processo. A Súmula Vinculante 5 do STF reforça essa garantia.'
        }
      }
    },
    'ADM-10': {
      id: 'L-ADM-10',
      moduloId: 'ADM-10',
      objetivo: 'Compreender os fundamentos da Gestão da Qualidade: conceito, melhoria contínua, ciclo PDCA, ferramentas da qualidade, foco no cliente e gestão por processos.',
      prerequisitos: ['ADM-02'],
      introducao: 'Qualidade deixou de ser "luxo" e virou obrigação — tanto no setor privado quanto no setor público. Entender a evolução do conceito, o PDCA e as ferramentas da qualidade é essencial para concursos administrativos.',
      explicacaoSimples: 'Qualidade é fazer o que o cliente precisa, do jeito que ele espera, sem desperdício e sempre melhorando. Na prática, é entregar um serviço público que resolve o problema do cidadão, com agilidade, cortesia e eficiência. Para isso se usa um ciclo de melhoria contínua: planejar, executar, verificar e agir (PDCA).',
      explicacaoTecnica: 'Gestão da Qualidade é o conjunto de práticas voltadas a garantir que produtos e serviços atendam aos requisitos do cliente e melhorem continuamente. EVOLUÇÃO: inspeção (século XIX) → controle estatístico (anos 1930) → garantia da qualidade (anos 1950-1960) → gestão da qualidade total (TQM, anos 1980) → excelência (modelos como PNQ). CICLO PDCA (Deming): PLAN (planejar — definir metas e métodos), DO (executar — treinar e implementar), CHECK (verificar — medir e comparar resultados) e ACT (agir — corrigir e padronizar). FERRAMENTAS DA QUALIDADE: (1) DIAGRAMA DE PARETO (80/20 — prioriza problemas mais frequentes); (2) DIAGRAMA DE CAUSA E EFEITO (Ishikawa / espinha de peixe — identifica causas); (3) HISTOGRAMA (distribuição de dados); (4) FOLHA DE VERIFICAÇÃO (check sheet); (5) GRÁFICO DE CONTROLE (monitora variações); (6) FLUXOGRAMA (mapeia processos); (7) DIAGRAMA DE DISPERSÃO (correlação entre variáveis). FOCO NO CLIENTE: no serviço público, o cliente é o CIDADÃO — usuário dos serviços. GESTÃO POR PROCESSOS: entradas → atividades → saídas, com indicadores e melhoria contínua.',
      exemplos: [
        'PDCA em um posto de saúde: PLAN (meta reduzir filas); DO (nova escala); CHECK (medir tempo de espera); ACT (ajustar).',
        'Pareto: 80% das reclamações vêm de 20% dos problemas (ex.: demora no atendimento).',
        'Ishikawa: causa e efeito (máquina, método, mão de obra, material, medida, meio ambiente).',
        'Histograma: distribuição do tempo de espera por faixa.',
        'Fluxograma: mapeamento do processo de atendimento do cidadão.'
      ],
      comparacoes: [
        { termoA: 'PDCA', termoB: 'PODC', diferenca: 'PODCA é o ciclo administrativo clássico de Fayol (Planejamento, Organização, Direção e Controle) — voltado à Administração em geral. PDCA é o ciclo da qualidade de Deming (Plan, Do, Check, Act) — voltado à melhoria contínua de processos. PODC é mais amplo; PDCA é específico da qualidade.' },
        { termoA: 'Diagrama de Pareto', termoB: 'Diagrama de Ishikawa', diferenca: 'PARETO: prioriza problemas (80% dos efeitos vêm de 20% das causas). ISHIKAWA (causa e efeito / espinha de peixe): identifica as causas de um problema (máquina, método, mão de obra, material, medida, meio ambiente). São complementares.' },
        { termoA: 'Garantia da qualidade', termoB: 'Gestão da qualidade total (TQM)', diferenca: 'GARANTIA: foco em prevenção de defeitos, envolvendo etapas de produção (anos 1950-1960). GESTÃO DA QUALIDADE TOTAL (TQM): foco no cliente, melhoria contínua, envolvimento de todos os setores da organização (anos 1980).' }
      ],
      aplicacaoAdministracaoPublica: 'Na Administração Pública, a qualidade vem ganhando força desde a Reforma Gerencial (EC 19/1998). O GesPública (Programa Nacional de Gestão Pública e Desburocratização) e o Prêmio Nacional da Gestão Pública (PNG) incentivam a gestão por resultados e o foco no cidadão. Ferramentas como PDCA, Ishikawa e Pareto são usadas na melhoria de processos administrativos. A Carta de Serviços ao Usuário (Lei 13.460/2017) obriga órgãos a informar seus serviços, prazos e padrões de qualidade. A gestão por processos (BPM) ganha espaço.',
      pegadinhas: [
        'Confundir PDCA com PODC. PDCA é ciclo da qualidade (Deming); PODC é ciclo administrativo (Fayol).',
        'Trocar Pareto com Ishikawa. Pareto prioriza; Ishikawa identifica causas.',
        'Achar que qualidade é só para o setor privado. No setor público, o foco é o cidadão.',
        'Dizer que o PDCA é um ciclo linear. É CIRCULAR — cada volta deve elevar o padrão.',
        'Confundir ferramentas (check sheet, histograma, gráfico de controle).'
      ],
      errosComuns: [
        'Decorar ferramentas sem saber quando aplicar.',
        'Confundir os ciclos PDCA e PODC.',
        'Achar que qualidade é responsabilidade de um único setor.'
      ],
      resumo: [
        'Gestão da Qualidade busca atender o cliente e melhorar continuamente.',
        'Evolução: inspeção → controle estatístico → garantia → TQM → excelência.',
        'PDCA (Deming): Plan, Do, Check, Act — melhoria contínua.',
        'PODC (Fayol): Planejamento, Organização, Direção, Controle — ciclo administrativo.',
        'Ferramentas: Pareto (80/20), Ishikawa (causa e efeito), histograma, folha de verificação, gráfico de controle, fluxograma, dispersão.',
        'Foco no cliente: no setor público, o cliente é o CIDADÃO.',
        'Gestão por processos: entradas → atividades → saídas, com indicadores.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Qualidade é fazer certo, sempre melhorando. Para isso, usa-se o PDCA: planeja, executa, verifica, corrige. Ferramentas como Pareto e Ishikawa ajudam a achar e priorizar problemas. No setor público, o cliente é o cidadão.',
        outroExemplo: 'Uma escola pública quer reduzir a evasão. PLAN: meta. DO: ações de reforço. CHECK: medir evasão. ACT: ajustar. Pareto ajuda a priorizar as causas mais frequentes; Ishikawa identifica por que os alunos estão saindo.',
        compararConceitos: 'PDCA = melhoria contínua. PODC = ciclo administrativo. Pareto = prioriza. Ishikawa = identifica causas. No serviço público, cliente = cidadão.',
        mostrarPegadinha: 'Cuidado: "O PDCA é o mesmo que o PODC". ERRADO. PDCA é da qualidade (Deming); PODC é da Administração clássica (Fayol).',
        comoApareceEmConcurso: 'Cai como: (1) identificar a ferramenta correta; (2) distinguir PDCA de PODC; (3) compreender foco no cliente no setor público; (4) gestão por processos.',
        fazerPergunta: {
          pergunta: 'A equipe percebe que 80% das reclamações vêm de apenas 20% dos problemas. Qual ferramenta da qualidade ajuda a visualizar isso?',
          resposta: 'DIAGRAMA DE PARETO — princípio 80/20. Ele prioriza os problemas mais relevantes, permitindo focar esforços onde o impacto é maior.'
        }
      }
    },
    'ADM-12': {
      id: 'L-ADM-12',
      moduloId: 'ADM-12',
      objetivo: 'Compreender a Gestão por Processos (BPM): conceito, diferença entre processo e projeto, elementos (entradas, atividades, saídas, clientes), mapeamento (fluxograma, BPMN), indicadores e melhoria contínua.',
      prerequisitos: ['ADM-10'],
      introducao: 'A Gestão por Processos, também chamada de BPM (Business Process Management), é uma abordagem que enxerga a organização como um conjunto de processos interligados, e não como departamentos isolados. É a base da modernização administrativa em órgãos públicos.',
      explicacaoSimples: 'Em vez de olhar a empresa como caixinhas separadas (RH, Financeiro, Compras), você olha como um fluxo: o cidadão pede algo (entrada), o serviço é executado por várias áreas em sequência (atividades) e o resultado chega ao cidadão (saída). Gerenciar por processos é otimizar esse fluxo como um todo, e não cada caixinha isoladamente.',
      explicacaoTecnica: 'Gestão por Processos (BPM) é a abordagem sistemática de identificar, desenhar, executar, documentar, monitorar, controlar e melhorar processos de negócio. CONCEITO DE PROCESSO: conjunto de atividades inter-relacionadas que transformam ENTRADAS em SAÍDAS, agregando valor ao cliente. ELEMENTOS: (1) ENTRADAS (inputs) — recursos, informações, solicitações; (2) ATIVIDADES — o que é feito; (3) SAÍDAS (outputs) — produto ou serviço; (4) CLIENTE — quem recebe a saída (interno ou externo); (5) INDICADORES — medem desempenho (tempo, custo, qualidade, satisfação). DIFERENÇA PROCESSO x PROJETO: PROCESSO é contínuo, repetitivo, padronizado (ex.: atendimento ao cidadão). PROJETO é temporário, único, com início e fim definidos (ex.: implantação de novo sistema). FERRAMENTAS DE MAPEAMENTO: FLUXOGRAMA (representação simples) e BPMN (Business Process Model and Notation — padrão mais detalhado). MELHORIA: PDCA aplicado ao processo; redesenho; automação; eliminação de desperdícios. TIPOS DE PROCESSO: primários (essenciais, geram valor direto — ex.: atendimento), de apoio (suportam os primários — ex.: compras) e gerenciais (planejamento, controle).',
      exemplos: [
        'Processo: emissão de certidão no atendimento ao cidadão.',
        'Projeto: implantação de um novo sistema de protocolo.',
        'Fluxograma: representação visual do passo a passo do atendimento.',
        'Indicador: tempo médio de emissão de uma certidão.',
        'Melhoria: eliminar uma etapa redundante do processo.'
      ],
      comparacoes: [
        { termoA: 'Processo', termoB: 'Projeto', diferenca: 'PROCESSO: contínuo, repetitivo, padronizado (ex.: atendimento diário ao cidadão). PROJETO: temporário, único, com início, meio e fim definidos (ex.: implantação de um sistema, construção de um prédio). Processo se gerencia; projeto se conduz por fases.' },
        { termoA: 'Gestão funcional', termoB: 'Gestão por processos', diferenca: 'FUNCIONAL: a organização é vista por departamentos isolados (RH, Compras, Financeiro) — cada um cuida do seu. POR PROCESSOS: a organização é vista como fluxos que atravessam departamentos — o foco é o resultado final entregue ao cliente. A gestão por processos elimina "ilhas" e reduz gargalos.' },
        { termoA: 'Fluxograma', termoB: 'BPMN', diferenca: 'FLUXOGRAMA: representação gráfica simples do passo a passo de um processo, usando símbolos básicos. BPMN (Business Process Model and Notation): notação PADRONIZADA e mais detalhada, com elementos como eventos, gateways (decisões), tarefas, subprocessos e raias (swimlanes). É o padrão mais usado profissionalmente.' }
      ],
      aplicacaoAdministracaoPublica: 'A Gestão por Processos é a base da modernização do Estado. O GesPública (Programa Nacional de Gestão Pública) e o Decreto 9.094/2017 (carta de serviços ao usuário) incentivam o mapeamento e a melhoria de processos. O Governo Digital (Lei 14.129/2021) reforça a digitalização e a simplificação de processos. Órgãos como Receita Federal, INSS e Detran usam BPM para reduzir filas e tempo de espera. A gestão por processos também é exigida em programas de qualidade e no PNQ (Prêmio Nacional da Qualidade).',
      pegadinhas: [
        'Confundir processo com projeto. Processo é contínuo; projeto é temporário.',
        'Achar que gestão por processos é o mesmo que gestão funcional. A primeira olha o fluxo; a segunda, os departamentos.',
        'Confundir fluxograma com BPMN. BPMN é mais detalhado e padronizado.',
        'Dizer que processo é só o que se faz, sem considerar entradas, saídas e clientes.',
        'Esquecer que o foco é o CLIENTE — no setor público, o CIDADÃO.'
      ],
      errosComuns: [
        'Decorar conceito sem entender os elementos.',
        'Confundir tipos de processo (primário, apoio, gerencial).',
        'Achar que mapear é só desenhar — envolve análise e melhoria.'
      ],
      resumo: [
        'Gestão por Processos (BPM) enxerga a organização como fluxos, não como departamentos isolados.',
        'Processo: contínuo, repetitivo, padronizado. Projeto: temporário e único.',
        'Elementos: entradas, atividades, saídas, cliente, indicadores.',
        'Ferramentas: fluxograma, BPMN.',
        'Tipos: primários, de apoio e gerenciais.',
        'Melhoria contínua via PDCA.',
        'Foco no cliente — no setor público, o CIDADÃO.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Processo é o caminho que a informação percorre para virar serviço. Gestão por processos é otimizar esse caminho como um todo, e não cada pedaço isolado. É como olhar a estrada inteira em vez de olhar só os postos de gasolina.',
        outroExemplo: 'No INSS, um pedido de aposentadoria passa por várias etapas: recepção, conferência de documentos, análise, cálculo, decisão e comunicação. Se cada setor trabalhar isolado, o processo trava. Se for gerido como fluxo único, o tempo cai muito.',
        compararConceitos: 'Processo x Projeto: contínuo x temporário. Gestão funcional x por processos: departamentos x fluxos. Fluxograma x BPMN: simples x padronizado. Primário x Apoio: gera valor direto x suporta.',
        mostrarPegadinha: 'Cuidado: "Projeto é o mesmo que processo, apenas com nome diferente". ERRADO. Processo é CONTÍNUO; projeto é TEMPORÁRIO, com início e fim definidos.',
        comoApareceEmConcurso: 'Cai como: (1) distinguir processo de projeto; (2) identificar elementos do processo; (3) reconhecer ferramentas (fluxograma, BPMN); (4) tipos de processo.',
        fazerPergunta: {
          pergunta: 'Implantar um novo sistema de protocolo em um órgão é um processo ou um projeto?',
          resposta: 'PROJETO — tem início, meio e fim definidos, com objetivo único. Já o uso diário do sistema, após implantado, será um PROCESSO contínuo.'
        }
      }
    },
    'ADM-13': {
      id: 'L-ADM-13',
      moduloId: 'ADM-13',
      objetivo: 'Compreender os fundamentos do Atendimento ao Público: qualidade no atendimento, ética, comunicação, relacionamento com o usuário e postura profissional. Base para concursos de nível médio na área administrativa.',
      prerequisitos: ['ADM-09'],
      introducao: 'Atendimento ao público é a porta de entrada do cidadão no Estado. Um bom atendimento melhora a imagem da instituição, reduz conflitos e contribui para a efetividade das políticas públicas. Em concursos administrativos, é tema recorrente.',
      explicacaoSimples: 'Atender bem é mais do que ser educado: é resolver o problema do cidadão, ouvir com atenção, explicar com clareza e, quando não puder resolver, orientar para quem pode. O atendimento é a face visível do serviço público.',
      explicacaoTecnica: 'Atendimento ao público é o conjunto de práticas que visa satisfazer o cidadão-usuário dos serviços públicos. QUALIDADE NO ATENDIMENTO: envolve cortesia, agilidade, clareza, empatia, precisão das informações e resolução efetiva. PRINCÍPIOS: legalidade, impessoalidade, moralidade, publicidade e eficiência (LIMPE), aplicados ao contato direto. ÉTICA NO ATENDIMENTO: sigilo das informações, respeito, imparcialidade, vedação a favorecimento, transparência. COMUNICAÇÃO: ouvir ativamente (escuta ativa), falar com clareza e sem jargões, adequar a linguagem ao interlocutor, confirmar entendimento. POSTURA PROFISSIONAL: pontualidade, assiduidade, discrição, urbanidade, apresentação adequada, autocontrole. BARREIRAS: linguagem técnica, preconceitos, impaciência, falta de informação, ausência de empatia. CANAIS DE ATENDIMENTO: presencial, telefônico, eletrônico, ouvidoria. Marco legal: Lei 13.460/2017 (Carta de Serviços ao Usuário); Código de Ética do Servidor (Decreto 1.171/1994, federal); Lei 8.112/1990 (deveres do servidor — urbanidade, lealdade).',
      exemplos: [
        'Escuta ativa: o servidor deixa o cidadão terminar a fala antes de responder.',
        'Clareza: explicar o procedimento em linguagem simples, sem jargões técnicos.',
        'Empatia: reconhecer a dificuldade do cidadão e buscar soluções.',
        'Impessoalidade: tratar todos os cidadãos com igual atenção, sem favorecimento.',
        'Encerramento: confirmar se o cidadão entendeu o que precisa fazer.'
      ],
      comparacoes: [
        { termoA: 'Cortesia', termoB: 'Eficiência no atendimento', diferenca: 'CORTESIA: tratar com educação e respeito (componente comportamental). EFICIÊNCIA: resolver o problema do cidadão de forma ágil e correta (componente de resultado). Um atendimento educado que não resolve o problema não é completo; o ideal combina os dois.' },
        { termoA: 'Ouvir', termoB: 'Escutar ativamente', diferenca: 'OUVIR: captar o som. ESCUTAR ATIVAMENTE: prestar atenção plena, sem interromper, interpretando o conteúdo e as emoções, confirmando entendimento e respondendo com precisão. No atendimento, o que se exige é a ESCUTA ATIVA.' },
        { termoA: 'Ouvidoria', termoB: 'Atendimento comum', diferenca: 'ATENDIMENTO COMUM: contato rotineiro do cidadão com o serviço (pedido de informação, solicitação). OUVIDORIA: canal específico para reclamações, denúncias, sugestões e elogios — com registro formal e encaminhamento para melhoria. A ouvidoria é instância de segunda escuta.' }
      ],
      aplicacaoAdministracaoPublica: 'O atendimento é regulado pela Lei 13.460/2017 (Carta de Serviços ao Usuário), que obriga os órgãos a informar serviços, prazos, padrões de qualidade e canais de atendimento. A ouvidoria é o canal de reclamações e sugestões. O Código de Ética do Servidor Federal (Decreto 1.171/1994) exige urbanidade e respeito. A Lei 8.112/1990 lista os deveres do servidor (art. 116). O atendimento humanizado tem sido valorizado com a adoção de boas práticas em concursos. As bancas cobram situações práticas: o que fazer diante de um cidadão exaltado, como lidar com informação sigilosa, como proceder quando o serviço não é competência do órgão.',
      pegadinhas: [
        'Achar que ser educado já é suficiente. É preciso resolver ou encaminhar corretamente.',

        'Dizer que o servidor pode compartilhar informações sigilosas com o cidadão. NÃO pode — sigilo é dever.',
        'Achar que atender bem é dizer "sim" a tudo. Atender bem é atender dentro da lei, com clareza e empatia.',
        'Confundir ouvidoria com atendimento comum. A ouvidoria é instância de reclamações, denúncias e sugestões.'

      errosComuns: [

      ],
      resumo: [
        'Atendimento ao público é a face visível do serviço público.',
        'Qualidade envolve cortesia, agilidade, clareza, empatia, precisão e resolução.',
        'Ética: sigilo, respeito, imparcialidade, transparência.',
        'Comunicação: escuta ativa, linguagem clara, adequação ao interlocutor.',
        'Postura: pontualidade, assiduidade, discrição, urbanidade, autocontrole.',
        'Marco legal: Lei 13.460/2017, Decreto 1.171/1994, Lei 8.112/1990 (deveres do servidor).',
        'Ouvidoria é canal específico para reclamações, denúncias e sugestões.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Atender bem é ouvir com atenção, explicar com clareza, resolver o problema e tratar todos com respeito. Não basta ser simpático — é preciso ser útil.',
        outroExemplo: 'Um cidadão chega exaltado porque o benefício não foi liberado. O servidor: ouve sem interromper (escuta ativa), confirma o entendimento, verifica o sistema, explica o motivo em linguagem clara e informa o prazo. Se não for competência do órgão, encaminha ao setor correto.',

        comoApareceEmConcurso: 'Cai como: (1) situações práticas de atendimento (cidadão exaltado, informação sigilosa); (2) princípios do atendimento; (3) papel da ouvidoria; (4) deveres do servidor no atendimento.',

    'DA-13': {
      id: 'L-DA-13',
      moduloId: 'DA-13',
      objetivo: 'Compreender o conceito, a classificação e o regime jurídico dos bens públicos, além das formas de uso por particulares (autorização, permissão e concessão de uso).',
      prerequisitos: ['DA-03'],
      introducao: 'Bens públicos são todos os bens pertencentes às pessoas jurídicas de direito público e os afetados a serviços públicos. Compreender seu regime jurídico é fundamental para entender licitações, concessões e uso de espaços públicos.',
      explicacaoSimples: 'Bens públicos são os bens do Estado: prédios, terrenos, praças, rios, ruas, veículos oficiais. Têm regime jurídico próprio — o Estado não é dono como um particular é dono de sua casa. Ele é gestor desses bens em favor da coletividade, e a lei impõe restrições e prerrogativas específicas.',
      explicacaoTecnica: 'Bens públicos são os bens pertencentes às pessoas jurídicas de direito público (União, Estados, DF, Municípios, autarquias e fundações públicas) e os bens de pessoas jurídicas de direito privado afetados a serviços públicos (ex.: bens de concessionárias). CLASSIFICAÇÃO QUANTO À DESTINAÇÃO: (1) BENS DE USO COMUM DO POVO (ruas, praças, rios, mares) — uso livre e gratuito por todos; (2) BENS DE USO ESPECIAL (edifícios públicos, escolas, hospitais, repartições) — afetados a um serviço ou estabelecimento público; (3) BENS DOMINICAIS (terras devolutas, terrenos sem destinação específica) — patrimônio disponível. REGIME JURÍDICO: INALIENABILIDADE (bens de uso comum e especial não podem ser alienados enquanto mantida a destinação; bens dominicais podem ser alienados, com autorização legal, licitação e avaliação prévia); IMPENHORABILIDADE (não podem ser penhorados); IMPRESCRITIBILIDADE (não podem ser usucapidos); NÃO ONERABILIDADE (não podem ser dados em garantia). FORMAS DE USO POR PARTICULARES: (1) AUTORIZAÇÃO DE USO — ato unilateral, discricionário, precário, sem licitação, para uso episódico (ex.: banca de jornal); (2) PERMISSÃO DE USO — ato unilateral, discricionário, precário, com ou sem licitação, para uso mais duradouro (ex.: uso de área para evento); (3) CONCESSÃO DE USO — contrato administrativo, prazo determinado, sempre com licitação, para uso mais estável (ex.: exploração de restaurante em prédio público). Afetação e desafetação: ato pelo qual o bem passa a ter (afetação) ou deixa de ter (desafetação) destinação pública.',
      exemplos: [
        'Bem de uso comum: praça pública, rua, praia.',
        'Bem de uso especial: sede de prefeitura, escola pública, hospital.',
        'Bem dominical: terreno devoluto sem destinação.',
        'Autorização de uso: banca de jornal em calçada.',
        'Permissão de uso: uso de ginásio municipal para evento esportivo.',
        'Concessão de uso: restaurante em prédio público, com licitação.'
      ],
      comparacoes: [
        { termoA: 'Bem público', termoB: 'Bem privado', diferenca: 'BEM PÚBLICO: pertence a pessoa jurídica de direito público; sujeito a regime especial (inalienabilidade, impenhorabilidade, imprescritibilidade). BEM PRIVADO: pertence a particular; segue o regime civil comum (alienável, penhorável, usucapível).' },
        { termoA: 'Uso comum do povo', termoB: 'Uso especial', diferenca: 'USO COMUM: bens destinados à coletividade em geral, uso livre e gratuito (ruas, praças, rios). USO ESPECIAL: bens afetados a um serviço ou estabelecimento público (escolas, hospitais, repartições). Os dominicais não têm destinação específica.' },
        { termoA: 'Autorização de uso', termoB: 'Concessão de uso', diferenca: 'AUTORIZAÇÃO: ato unilateral, discricionário, precário, SEM licitação — para uso episódico (ex.: banca de jornal). CONCESSÃO: CONTRATO administrativo, prazo determinado, SEMPRE com licitação — para uso mais estável (ex.: restaurante em prédio público).' }
      ],
      aplicacaoAdministracaoPublica: 'Os bens públicos são essenciais à prestação de serviços. A União, Estados, DF e Municípios têm patrimônios próprios. A Súmula 340/STJ trata de bens de empresa pública; a Súmula 619/STF trata de terras devolutas. O Código Civil (arts. 98 a 103) estabelece conceitos básicos; a Constituição (art. 20 e 26) define bens da União e dos Estados. A Lei 9.636/1998 regula bens da União. A alienação de bens públicos exige desafetação, avaliação prévia, autorização legal e licitação, na forma da Lei 14.133/2021.',
      pegadinhas: [
        'Achar que todo bem público é inalienável. Os bens DOMINICAIS podem ser alienados, cumpridos os requisitos legais.',
        'Confundir uso comum com uso especial. O primeiro é destinado ao povo; o segundo a um serviço público específico.',
        'Trocar autorização com permissão e concessão de uso. Autorização: ato unilateral e sem licitação. Permissão: ato unilateral. Concessão: contrato com licitação.',
        'Dizer que bem público pode ser usucapido. NÃO pode — imprescritibilidade.',
        'Achar que bens de empresas públicas são sempre bens públicos. Depende da destinação e do regime — a Súmula 340/STJ trata disso.',
        'Confundir afetação com desafetação.'
      ],
      errosComuns: [
        'Decorar classificações sem exemplos.',
        'Confundir formas de uso por particulares.',
        'Ignorar os requisitos para alienação de bens públicos.'
      ],
      resumo: [
        'Bens públicos: pertencem a pessoas jurídicas de direito público ou são afetados a serviços públicos.',
        'Classificação quanto à destinação: uso comum do povo, uso especial e dominicais.',
        'Regime jurídico: inalienabilidade (regra), impenhorabilidade, imprescritibilidade, não onerabilidade.',
        'Bens dominicais podem ser alienados, cumpridos os requisitos legais (desafetação, avaliação, autorização legal e licitação).',
        'Uso por particulares: autorização (ato unilateral, sem licitação), permissão (ato unilateral) e concessão (contrato, com licitação).',
        'Afetação: destinação pública. Desafetação: retirada da destinação.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Bem público é o que pertence ao Estado: ruas, praças, prédios, rios. Tem regime especial — não pode ser vendido a qualquer tempo, nem penhorado. Alguns bens (dominicais) podem ser alienados com licitação. O particular pode usar bens públicos por autorização, permissão ou concessão.',
        outroExemplo: 'A praça é bem de uso comum (todos usam). A escola pública é bem de uso especial (afetada ao serviço). O terreno abandonado é bem dominical (sem destinação). O dono da banca de jornal usa o espaço por AUTORIZAÇÃO. A empresa que explora restaurante em prédio público usa por CONCESSÃO.',
        compararConceitos: 'Comum x Especial x Dominical: destinado ao povo x a um serviço x sem destinação. Autorização x Permissão x Concessão: ato sem licitação x ato (com ou sem) x contrato com licitação. Afetação x Desafetação: dar destinação x retirar destinação.',
        mostrarPegadinha: 'Cuidado: "Todo bem público é inalienável". ERRADO. Bens DOMINICAIS são alienáveis, cumpridos os requisitos legais (desafetação, avaliação, autorização legal, licitação). Uso comum e especial são inalienáveis enquanto mantida a destinação.',
        comoApareceEmConcurso: 'Cai como: (1) classificar o bem quanto à destinação; (2) distinguir autorização, permissão e concessão; (3) conhecer o regime jurídico (inalienabilidade, impenhorabilidade, imprescritibilidade); (4) requisitos para alienação.',
        fazerPergunta: {
          pergunta: 'Uma prefeitura pretende instalar uma banca de jornal em uma calçada pública. Qual é a forma de uso do bem?',
          resposta: 'AUTORIZAÇÃO DE USO — ato unilateral, discricionário, precário, sem licitação, para uso episódico. Se fosse para exploração comercial estável (ex.: restaurante em prédio público), seria CONCESSÃO de uso, com licitação.'
        }
