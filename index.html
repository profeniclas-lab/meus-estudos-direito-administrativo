    { id: 'F-ADM-01-0005', moduloId: 'ADM-01', topicoId: 'ADM-01', frente: 'Quais são as quatro funções administrativas clássicas (Fayol)?', verso: 'Planejamento, Organização, Direção e Controle (PODC).', dificuldade: 1, tags: ['PODC'] },
    { id: 'F-ADM-01-0006', moduloId: 'ADM-01', topicoId: 'ADM-01', frente: 'Quais são os três níveis organizacionais?', verso: 'Estratégico (institucional, longo prazo), Tático (gerencial, intermediário) e Operacional (execução, dia a dia).', dificuldade: 2, tags: ['níveis'] },
    { id: 'F-ADM-02-0001', moduloId: 'ADM-02', topicoId: 'ADM-02', frente: 'O que significa PODC?', verso: 'Planejamento, Organização, Direção e Controle — ciclo administrativo clássico de Fayol.', dificuldade: 1, tags: ['PODC'] },
    { id: 'F-ADM-02-0002', moduloId: 'ADM-02', topicoId: 'ADM-02', frente: 'O que faz a função Planejamento?', verso: 'Define objetivos e meios, nos níveis estratégico, tático e operacional.', dificuldade: 2, tags: ['planejamento'] },
    { id: 'F-ADM-02-0003', moduloId: 'ADM-02', topicoId: 'ADM-02', frente: 'O que faz a função Organização?', verso: 'Estrutura recursos, define autoridade, responsabilidade, hierarquia e departamentalização.', dificuldade: 2, tags: ['organização'] },
    { id: 'F-ADM-02-0004', moduloId: 'ADM-02', topicoId: 'ADM-02', frente: 'O que faz a função Direção?', verso: 'Lidera, motiva, comunica e coordena pessoas para executar o planejado.', dificuldade: 2, tags: ['direção'] },
    { id: 'F-ADM-02-0005', moduloId: 'ADM-02', topicoId: 'ADM-02', frente: 'O que faz a função Controle?', verso: 'Estabelece padrões, monitora desempenho, compara com o padrão e corrige desvios. É contínuo e retroalimenta o planejamento.', dificuldade: 2, tags: ['controle'] },
    { id: 'F-ADM-02-0006', moduloId: 'ADM-02', topicoId: 'ADM-02', frente: 'Qual a diferença entre PODC e PDCA?', verso: 'PODC é o ciclo administrativo clássico (Fayol). PDCA (Plan, Do, Check, Act) é ferramenta da qualidade (Deming).', dificuldade: 3, tags: ['PODC', 'PDCA'] },
    { id: 'F-AP-02-0001', moduloId: 'AP-02', topicoId: 'AP-02', frente: 'Quais são os três modelos históricos de Administração Pública no Brasil?', verso: 'Patrimonialista, Burocrático e Gerencial.', dificuldade: 1, tags: ['modelos'] },
    { id: 'F-AP-02-0002', moduloId: 'AP-02', topicoId: 'AP-02', frente: 'O que caracteriza o patrimonialismo?', verso: 'Confusão entre público e privado; cargos tratados como propriedade; nepotismo e clientelismo.', dificuldade: 1, tags: ['patrimonialismo'] },
    { id: 'F-AP-02-0003', moduloId: 'AP-02', topicoId: 'AP-02', frente: 'Quem é o teórico central da burocracia?', verso: 'Max Weber. Características: impessoalidade, formalismo, hierarquia, meritocracia, regras escritas.', dificuldade: 2, tags: ['burocracia'] },
    { id: 'F-AP-02-0004', moduloId: 'AP-02', topicoId: 'AP-02', frente: 'Quando foi consolidada a reforma burocrática no Brasil?', verso: 'A partir de 1936, com a criação do DASP em 1938, no Estado Novo de Getúlio Vargas.', dificuldade: 3, tags: ['burocracia', 'Brasil'] },
    { id: 'F-AP-02-0005', moduloId: 'AP-02', topicoId: 'AP-02', frente: 'Quando e por quem foi conduzida a Reforma Gerencial no Brasil?', verso: 'Em 1995, sob coordenação de Bresser-Pereira, no governo FHC. Marco legal: EC 19/1998.', dificuldade: 3, tags: ['gerencial', 'EC 19/1998'] },
    { id: 'F-AP-02-0006', moduloId: 'AP-02', topicoId: 'AP-02', frente: 'O que caracteriza a administração gerencial?', verso: 'Foco em resultados, eficiência, controle por desempenho, descentralização, accountability e foco no cidadão-cliente.', dificuldade: 2, tags: ['gerencial'] },
    { id: 'F-DA-02-0001', moduloId: 'DA-02', topicoId: 'DA-02', frente: 'O que significa LIMPE?', verso: 'Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência — princípios expressos no caput do art. 37 da CF/88.', dificuldade: 1, tags: ['LIMPE'] },
    { id: 'F-DA-02-0002', moduloId: 'DA-02', topicoId: 'DA-02', frente: 'Qual a diferença entre legalidade administrativa e legalidade do particular?', verso: 'Particular: pode fazer tudo que a lei NÃO proíbe. Administração: só pode fazer o que a lei AUTORIZA ou DETERMINA (legalidade estrita).', dificuldade: 2, tags: ['legalidade'] },
    { id: 'F-DA-02-0003', moduloId: 'DA-02', topicoId: 'DA-02', frente: 'O que caracteriza a impessoalidade?', verso: 'Vedação a favoritismos e tratamento igualitário + proibição de promoção pessoal de agentes (art. 37, §1º, CF).', dificuldade: 2, tags: ['impessoalidade'] },
    { id: 'F-DA-02-0004', moduloId: 'DA-02', topicoId: 'DA-02', frente: 'Quais são exemplos de princípios IMPLÍCITOS?', verso: 'Supremacia do interesse público, indisponibilidade do interesse público, autotutela (Súmulas 346 e 473/STF), razoabilidade, proporcionalidade, motivação, ampla defesa, contraditório, segurança jurídica.', dificuldade: 3, tags: ['implícitos'] },
    { id: 'F-DA-02-0005', moduloId: 'DA-02', topicoId: 'DA-02', frente: 'Por qual EC o princípio da eficiência foi inserido no art. 37?', verso: 'EC 19/1998 (Reforma Gerencial).', dificuldade: 1, tags: ['eficiência', 'EC 19/1998'] },
    { id: 'F-DA-02-0006', moduloId: 'DA-02', topicoId: 'DA-02', frente: 'A publicidade é um princípio absoluto?', verso: 'Não. Tem exceções constitucionais: segurança do Estado e intimidade/privacidade.', dificuldade: 2, tags: ['publicidade'] },
    { id: 'F-ADM-03-0001', moduloId: 'ADM-03', topicoId: 'ADM-03', frente: 'O que é planejamento?', verso: 'Função administrativa que define objetivos, analisa o ambiente interno e externo, formula alternativas e escolhe cursos de ação ANTES da execução. É a primeira função do ciclo PODC.', dificuldade: 1, tags: ['planejamento'] },
    { id: 'F-ADM-03-0002', moduloId: 'ADM-03', topicoId: 'ADM-03', frente: 'Quais são os três níveis do planejamento?', verso: 'ESTRATÉGICO (longo prazo, alta direção, toda a organização, missão/visão); TÁTICO (médio prazo, média gerência, por área); OPERACIONAL (curto prazo, execução, tarefas do dia a dia).', dificuldade: 1, tags: ['planejamento', 'níveis'] },
    { id: 'F-ADM-03-0003', moduloId: 'ADM-03', topicoId: 'ADM-03', frente: 'Qual a diferença entre objetivo e meta?', verso: 'OBJETIVO é qualitativo e genérico (ex.: reduzir evasão escolar). META é quantificada, com prazo e valor (ex.: reduzir em 15% até dezembro). Objetivo aponta o norte; meta mede o resultado.', dificuldade: 2, tags: ['planejamento'] },
    { id: 'F-ADM-03-0004', moduloId: 'ADM-03', topicoId: 'ADM-03', frente: 'O que é análise SWOT?', verso: 'Ferramenta do planejamento estratégico: Forças e Fraquezas (ambiente INTERNO), Oportunidades e Ameaças (ambiente EXTERNO). Também conhecida como FOFA.', dificuldade: 2, tags: ['planejamento', 'SWOT'] },
    { id: 'F-ADM-03-0005', moduloId: 'ADM-03', topicoId: 'ADM-03', frente: 'Como se relacionam PPA, LDO e LOA com os níveis de planejamento?', verso: 'PPA: ESTRATÉGICO (4 anos). LDO: TÁTICO (diretrizes anuais). LOA: OPERACIONAL (orçamento anual). São os três instrumentos orçamentários previstos na CF/88.', dificuldade: 3, tags: ['planejamento', 'PPA', 'LDO', 'LOA'] },
    { id: 'F-ADM-03-0006', moduloId: 'ADM-03', topicoId: 'ADM-03', frente: 'Qual a diferença entre planejamento e previsão?', verso: 'PREVISÃO estima o futuro (o que pode acontecer). PLANEJAMENTO decide o que fazer diante do futuro (ação). Planejamento engloba a previsão, mas vai além — define cursos de ação.', dificuldade: 3, tags: ['planejamento'] },
    { id: 'F-ADM-04-0001', moduloId: 'ADM-04', topicoId: 'ADM-04', frente: 'O que é organização como função administrativa?', verso: 'Função que estrutura recursos, define autoridade, responsabilidade, hierarquia e canais de comunicação. É a segunda função do PODC. Também chamada de "organização" ou "estruturação".', dificuldade: 1, tags: ['organização'] },
    { id: 'F-ADM-04-0002', moduloId: 'ADM-04', topicoId: 'ADM-04', frente: 'O que é departamentalização funcional?', verso: 'Agrupamento de atividades por ÁREAS DE ESPECIALIDADE (ex.: Saúde, Educação, Obras em uma prefeitura). Cada departamento agrega funções especializadas.', dificuldade: 2, tags: ['organização', 'departamentalização'] },
    { id: 'F-ADM-04-0003', moduloId: 'ADM-04', topicoId: 'ADM-04', frente: 'Qual a diferença entre autoridade e responsabilidade?', verso: 'AUTORIDADE é o direito de mandar e cobrar execução. RESPONSABILIDADE é o dever de responder pelos resultados. A autoridade PODE ser delegada; a responsabilidade, em regra, NÃO se transfere integralmente.', dificuldade: 2, tags: ['organização'] },
    { id: 'F-ADM-04-0004', moduloId: 'ADM-04', topicoId: 'ADM-04', frente: 'O que é amplitude de controle?', verso: 'Número de subordinados que cada chefe coordena diretamente. Amplitude ESTREITA: poucos subordinados, MAIS níveis hierárquicos. Amplitude LARGA: muitos subordinados, MENOS níveis.', dificuldade: 2, tags: ['organização', 'amplitude'] },
    { id: 'F-ADM-04-0005', moduloId: 'ADM-04', topicoId: 'ADM-04', frente: 'Qual a diferença entre centralização e descentralização?', verso: 'CENTRALIZAÇÃO: decisões concentradas no topo da hierarquia. DESCENTRALIZAÇÃO: decisões delegadas a níveis inferiores ou unidades locais, dando mais autonomia. A descentralização dá agilidade, mas exige controle.', dificuldade: 2, tags: ['organização'] },
    { id: 'F-ADM-04-0006', moduloId: 'ADM-04', topicoId: 'ADM-04', frente: 'Quais são os tipos clássicos de departamentalização?', verso: 'FUNCIONAL (por área/especialidade), POR PRODUTOS/SERVIÇOS, GEOGRÁFICA (por região), POR CLIENTES (por público-alvo), POR PROCESSOS e MATRICIAL (combina funcional com projetos).', dificuldade: 2, tags: ['organização', 'departamentalização'] },
    { id: 'F-ADM-05-0001', moduloId: 'ADM-05', topicoId: 'ADM-05', frente: 'O que é Direção?', verso: 'Função administrativa que conduz e coordena pessoas para executar o planejado. Envolve LIDERANÇA, MOTIVAÇÃO, COMUNICAÇÃO e COORDENAÇÃO. É a terceira função do PODC.', dificuldade: 1, tags: ['direção'] },
    { id: 'F-ADM-05-0002', moduloId: 'ADM-05', topicoId: 'ADM-05', frente: 'Qual a diferença entre chefe e líder?', verso: 'CHEFE é uma posição formal na hierarquia (autoridade legal). LÍDER é quem influencia pessoas, mesmo sem cargo formal. Nem todo chefe é líder; nem todo líder tem cargo.', dificuldade: 2, tags: ['direção', 'liderança'] },
    { id: 'F-ADM-05-0003', moduloId: 'ADM-05', topicoId: 'ADM-05', frente: 'Quais são os três estilos clássicos de liderança?', verso: 'AUTOCRÁTICO (decide sozinho, centralizador); DEMOCRÁTICO (compartilha decisões, participativo); LIBERAL ou laissez-faire (deixa a equipe à vontade, quase sem interferência).', dificuldade: 2, tags: ['direção', 'liderança'] },
    { id: 'F-ADM-05-0004', moduloId: 'ADM-05', topicoId: 'ADM-05', frente: 'Qual a diferença entre motivação intrínseca e extrínseca?', verso: 'INTRÍNSECA vem de DENTRO (satisfação, propósito, realização). EXTRÍNSECA vem de FORA (salário, bônus, promoção, medo de punição). As duas se combinam no ambiente de trabalho.', dificuldade: 2, tags: ['direção', 'motivação'] },
    { id: 'F-ADM-05-0005', moduloId: 'ADM-05', topicoId: 'ADM-05', frente: 'O que faz a função de coordenação?', verso: 'Integra os esforços de diferentes áreas/unidades, buscando harmonia e alinhamento com os objetivos organizacionais. É diferente de comunicação (transmitir informação) e de liderança (influenciar pessoas).', dificuldade: 2, tags: ['direção'] },
    { id: 'F-ADM-05-0006', moduloId: 'ADM-05', topicoId: 'ADM-05', frente: 'O que é liderança democrática?', verso: 'O líder COMPARTILHA decisões, ouve a equipe, mantém comunicação aberta e foca no grupo. Contrapõe-se à autocrática (decide sozinho) e à liberal (não interfere).', dificuldade: 2, tags: ['direção', 'liderança'] },
    { id: 'F-ADM-06-0001', moduloId: 'ADM-06', topicoId: 'ADM-06', frente: 'O que é controle?', verso: 'Função administrativa que verifica e corrige o desempenho para assegurar que os objetivos sejam alcançados. Fecha o ciclo PODC e RETROALIMENTA o planejamento — é contínuo e cíclico.', dificuldade: 1, tags: ['controle'] },
    { id: 'F-ADM-06-0002', moduloId: 'ADM-06', topicoId: 'ADM-06', frente: 'Quais são as quatro etapas do controle?', verso: '1) Estabelecer PADRÃO; 2) MONITORAR o desempenho real; 3) COMPARAR o real com o padrão; 4) Aplicar AÇÃO CORRETIVA, se houver desvio.', dificuldade: 2, tags: ['controle'] },
    { id: 'F-ADM-06-0003', moduloId: 'ADM-06', topicoId: 'ADM-06', frente: 'O que são controle preventivo, simultâneo e posterior?', verso: 'PREVENTIVO (a priori): antes da execução — evita o desvio. SIMULTÂNEO: durante a execução. POSTERIOR (a posteriori): depois — identifica o que já ocorreu (ex.: auditoria).', dificuldade: 2, tags: ['controle'] },
    { id: 'F-ADM-06-0004', moduloId: 'ADM-06', topicoId: 'ADM-06', frente: 'Qual a relação entre controle e planejamento?', verso: 'O controle PRESSUPÕE o planejamento, pois compara o desempenho real com os PADRÕES definidos no planejamento. Sem planejamento, não há parâmetro. O controle retroalimenta o planejamento.', dificuldade: 2, tags: ['controle', 'planejamento'] },
    { id: 'F-ADM-06-0005', moduloId: 'ADM-06', topicoId: 'ADM-06', frente: 'O que é autotutela?', verso: 'Poder da Administração de ANULAR seus atos ILEGAIS e REVOGAR os INCONVENIENTES, sem precisar do Judiciário. Súmulas 346 e 473/STF.', dificuldade: 2, tags: ['controle', 'autotutela'] },
    { id: 'F-ADM-06-0006', moduloId: 'ADM-06', topicoId: 'ADM-06', frente: 'O que é um indicador de desempenho?', verso: 'Parâmetro MENSURÁVEL, RELEVANTE e ALINHADO aos objetivos organizacionais, usado pelo controle para comparar o desempenho real com o esperado. Pode ser de tempo, custo, qualidade, produtividade etc.', dificuldade: 2, tags: ['controle', 'indicadores'] },
    { id: 'F-ADM-07-0001', moduloId: 'ADM-07', topicoId: 'ADM-07', frente: 'Qual a diferença entre recrutamento e seleção?', verso: 'RECRUTAMENTO atrai candidatos e divulga a vaga (interno ou externo). SELEÇÃO escolhe, entre os candidatos, o mais adequado ao perfil do cargo. Primeiro recruta; depois seleciona.', dificuldade: 1, tags: ['RH'] },
    { id: 'F-ADM-07-0002', moduloId: 'ADM-07', topicoId: 'ADM-07', frente: 'Qual a diferença entre treinamento e desenvolvimento?', verso: 'TREINAMENTO: curto prazo, prepara para as tarefas do CARGO ATUAL. DESENVOLVIMENTO: longo prazo, prepara para a CARREIRA e funções FUTURAS.', dificuldade: 2, tags: ['RH'] },
    { id: 'F-ADM-07-0003', moduloId: 'ADM-07', topicoId: 'ADM-07', frente: 'O que significa CHA na gestão por competências?', verso: 'C = Conhecimento (saber). H = Habilidade (saber fazer). A = Atitude (querer fazer). Alinhar os três ao cargo é a base da gestão por competências.', dificuldade: 2, tags: ['RH', 'competências'] },
    { id: 'F-ADM-07-0004', moduloId: 'ADM-07', topicoId: 'ADM-07', frente: 'O que é avaliação de desempenho?', verso: 'Processo sistemático de ACOMPANHAMENTO e MENSURAÇÃO da atuação do servidor, com fins de desenvolvimento e melhoria contínua. Não é apenas punição.', dificuldade: 2, tags: ['RH', 'avaliação'] },
    { id: 'F-ADM-07-0005', moduloId: 'ADM-07', topicoId: 'ADM-07', frente: 'Como funciona o provimento de cargos efetivos no serviço público?', verso: 'Art. 37, II, CF/88: depende de aprovação prévia em CONCURSO PÚBLICO de provas ou de provas e títulos. Exceção: cargos em comissão (livre nomeação e exoneração), sem concurso.', dificuldade: 2, tags: ['RH', 'concurso'] },
    { id: 'F-ADM-07-0006', moduloId: 'ADM-07', topicoId: 'ADM-07', frente: 'Quais são as etapas clássicas da gestão de pessoas?', verso: 'PROVISÃO (recrutamento e seleção), APLICAÇÃO (cargos e funções), MANUTENÇÃO (benefícios, higiene e segurança), DESENVOLVIMENTO (treinamento e carreira) e MONITORAÇÃO (avaliação de desempenho).', dificuldade: 3, tags: ['RH'] },
    { id: 'F-ADM-08-0001', moduloId: 'ADM-08', topicoId: 'ADM-08', frente: 'O que é a hierarquia das necessidades de Maslow?', verso: 'Cinco níveis, do inferior ao superior: FISIOLÓGICAS, SEGURANÇA, SOCIAIS, ESTIMA e AUTORREALIZAÇÃO. Só se sobe de nível quando o inferior é razoavelmente atendido.', dificuldade: 2, tags: ['motivação', 'Maslow'] },
    { id: 'F-ADM-08-0002', moduloId: 'ADM-08', topicoId: 'ADM-08', frente: 'O que são fatores higiênicos e motivacionais em Herzberg?', verso: 'HIGIÊNICOS (salário, condições de trabalho, segurança): evitam INSATISFAÇÃO, mas NÃO motivam. MOTIVACIONAIS (realização, reconhecimento, responsabilidade, crescimento): geram SATISFAÇÃO.', dificuldade: 3, tags: ['motivação', 'Herzberg'] },
    { id: 'F-ADM-08-0003', moduloId: 'ADM-08', topicoId: 'ADM-08', frente: 'O que é a Teoria X e a Teoria Y de McGregor?', verso: 'X: visão negativa — o trabalhador é preguiçoso e precisa ser controlado. Y: visão positiva — o trabalhador gosta do trabalho e busca responsabilidade. São duas visões opostas do gestor sobre a equipe.', dificuldade: 2, tags: ['motivação', 'McGregor'] },
    { id: 'F-ADM-08-0004', moduloId: 'ADM-08', topicoId: 'ADM-08', frente: 'O que é a Teoria da Expectativa de Vroom?', verso: 'Motivação = EXPECTATIVA × INSTRUMENTALIDADE × VALÊNCIA. O servidor se esforça quando acredita que: (1) o esforço leva ao desempenho, (2) o desempenho leva à recompensa, (3) a recompensa é valorizada por ele.', dificuldade: 3, tags: ['motivação', 'Vroom'] },
    { id: 'F-ADM-08-0005', moduloId: 'ADM-08', topicoId: 'ADM-08', frente: 'O que é liderança transformacional?', verso: 'O líder INSPIRA, cria visão de futuro e desenvolve as pessoas, elevando a equipe a um patamar superior. Baseia-se em valores e propósito, não apenas em troca. Diferente da TRANSACIONAL (recompensa por desempenho).', dificuldade: 3, tags: ['liderança', 'transformacional'] },
    { id: 'F-ADM-08-0006', moduloId: 'ADM-08', topicoId: 'ADM-08', frente: 'O que é liderança situacional (Hersey e Blanchard)?', verso: 'O líder ADAPTA o estilo de liderança ao nível de MATURIDADE e competência da equipe para cada tarefa. Não existe um estilo único ideal — depende da situação.', dificuldade: 2, tags: ['liderança', 'situacional'] },
    { id: 'F-ADM-09-0001', moduloId: 'ADM-09', topicoId: 'ADM-09', frente: 'Quais são os elementos do processo de comunicação?', verso: 'Emissor, codificação, mensagem, canal, decodificação, receptor, feedback e ruído. O feedback é o retorno do receptor ao emissor, confirmando o entendimento.', dificuldade: 2, tags: ['comunicação'] },
    { id: 'F-ADM-09-0002', moduloId: 'ADM-09', topicoId: 'ADM-09', frente: 'O que é feedback na comunicação?', verso: 'É o retorno do receptor ao emissor. Confirma se a mensagem foi compreendida. Sem feedback, não se sabe se a comunicação foi efetiva.', dificuldade: 1, tags: ['comunicação', 'feedback'] },
    { id: 'F-ADM-09-0003', moduloId: 'ADM-09', topicoId: 'ADM-09', frente: 'Qual a diferença entre comunicação descendente e ascendente?', verso: 'DESCENDENTE: da chefia para o subordinado (ordens, instruções). ASCENDENTE: do subordinado para a chefia (relatórios, sugestões, reclamações).', dificuldade: 2, tags: ['comunicação'] },
    { id: 'F-ADM-09-0004', moduloId: 'ADM-09', topicoId: 'ADM-09', frente: 'O que é comunicação horizontal e diagonal?', verso: 'HORIZONTAL: entre pares de mesmo nível hierárquico (ex.: dois coordenadores). DIAGONAL: cruza níveis e áreas diferentes (ex.: coordenador de uma área e técnico de outra).', dificuldade: 2, tags: ['comunicação'] },
    { id: 'F-ADM-09-0005', moduloId: 'ADM-09', topicoId: 'ADM-09', frente: 'O que é ruído na comunicação?', verso: 'Qualquer interferência que distorça ou dificulte a compreensão da mensagem. Pode ser físico (som alto), psicológico (emoções), semântico (ambiguidade) ou cultural.', dificuldade: 2, tags: ['comunicação', 'ruído'] },
    { id: 'F-ADM-09-0006', moduloId: 'ADM-09', topicoId: 'ADM-09', frente: 'O que é comunicação informal nas organizações?', verso: 'Ocorre FORA dos canais oficiais (rádio-peão, conversas de corredor). Pode ser rápida e complementar à comunicação formal. Não é sempre prejudicial — pode ajudar a resolver problemas do dia a dia.', dificuldade: 2, tags: ['comunicação', 'informal'] },
    { id: 'F-ADM-10-0001', moduloId: 'ADM-10', topicoId: 'ADM-10', frente: 'O que é o ciclo PDCA e quem o formulou?', verso: 'Plan (planejar), Do (executar), Check (verificar) e Act (agir). Formulado por W. Edwards DEMING. É ferramenta de melhoria contínua da qualidade. Não confundir com PODC (Fayol).', dificuldade: 1, tags: ['qualidade', 'PDCA'] },
    { id: 'F-ADM-10-0002', moduloId: 'ADM-10', topicoId: 'ADM-10', frente: 'Qual a diferença entre PDCA e PODC?', verso: 'PDCA (Deming): ciclo da QUALIDADE — Plan, Do, Check, Act. PODC (Fayol): ciclo ADMINISTRATIVO — Planejamento, Organização, Direção, Controle. São ferramentas diferentes, com contextos diferentes.', dificuldade: 3, tags: ['qualidade', 'PDCA', 'PODC'] },
    { id: 'F-ADM-10-0003', moduloId: 'ADM-10', topicoId: 'ADM-10', frente: 'O que é o Diagrama de Pareto?', verso: 'Ferramenta da qualidade baseada no princípio 80/20: 80% dos efeitos vêm de 20% das causas. Usado para PRIORIZAR problemas mais impactantes.', dificuldade: 2, tags: ['qualidade', 'Pareto'] },
    { id: 'F-ADM-10-0004', moduloId: 'ADM-10', topicoId: 'ADM-10', frente: 'O que é o Diagrama de Ishikawa?', verso: 'Também chamado de espinha de peixe ou diagrama causa-efeito. Usado para IDENTIFICAR as causas de um problema, categorizando-as em 6M: máquina, método, mão de obra, material, medida e meio ambiente.', dificuldade: 2, tags: ['qualidade', 'Ishikawa'] },
    { id: 'F-ADM-10-0005', moduloId: 'ADM-10', topicoId: 'ADM-10', frente: 'O que é a Gestão da Qualidade Total (TQM)?', verso: 'Total Quality Management. Envolve TODA a organização, com foco no cliente, melhoria contínua e participação de todos os setores. Aplicável ao setor público, onde o cliente é o CIDADÃO.', dificuldade: 2, tags: ['qualidade', 'TQM'] },
    { id: 'F-ADM-10-0006', moduloId: 'ADM-10', topicoId: 'ADM-10', frente: 'Quais são as fases da evolução da qualidade?', verso: 'INSPEÇÃO (séc. XIX) → CONTROLE ESTATÍSTICO (anos 1930) → GARANTIA DA QUALIDADE (anos 1950-60) → GESTÃO DA QUALIDADE TOTAL (anos 1980) → EXCELÊNCIA (modelos como PNQ).', dificuldade: 3, tags: ['qualidade'] },
    { id: 'F-ADM-11-0001', moduloId: 'ADM-11', topicoId: 'ADM-11', frente: 'O que é estoque de segurança?', verso: 'Quantidade ADICIONAL mantida para cobrir variações imprevistas (atrasos de fornecedores, picos de demanda). É diferente de estoque MÍNIMO (limite absoluto) e de PONTO DE PEDIDO (nível que dispara nova compra).', dificuldade: 2, tags: ['materiais', 'estoques'] },
    { id: 'F-ADM-11-0002', moduloId: 'ADM-11', topicoId: 'ADM-11', frente: 'O que é ponto de pedido?', verso: 'Nível de estoque que, quando atingido, DISPARA uma nova compra. É calculado a partir do consumo médio durante o prazo de entrega + o estoque de segurança.', dificuldade: 2, tags: ['materiais', 'estoques'] },
    { id: 'F-ADM-11-0003', moduloId: 'ADM-11', topicoId: 'ADM-11', frente: 'Qual a diferença entre material de consumo e bem permanente?', verso: 'MATERIAL DE CONSUMO: despesa de CUSTEIO, uso imediato (ex.: papel, caneta, grampeador). BEM PERMANENTE: vida útil superior a 2 anos, registrado como INVESTIMENTO no patrimônio (ex.: computador, cadeira, veículo).', dificuldade: 2, tags: ['materiais', 'patrimônio'] },
    { id: 'F-ADM-11-0004', moduloId: 'ADM-11', topicoId: 'ADM-11', frente: 'Quais são as etapas do ciclo de administração de materiais?', verso: 'Identificação da necessidade → COMPRA (licitação no setor público) → RECEBIMENTO e conferência → ARMAZENAGEM → DISTRIBUIÇÃO → CONTROLE → INVENTÁRIO.', dificuldade: 2, tags: ['materiais'] },
    { id: 'F-ADM-11-0005', moduloId: 'ADM-11', topicoId: 'ADM-11', frente: 'O que é inventário de bens patrimoniais?', verso: 'Levantamento FÍSICO dos bens, comparando os registros contábeis com a existência real. Permite ajustes e BAIXA de itens inservíveis. Aplica-se a bens móveis e imóveis. Costuma ser feito por comissão específica.', dificuldade: 2, tags: ['materiais', 'patrimônio'] },
    { id: 'F-ADM-11-0006', moduloId: 'ADM-11', topicoId: 'ADM-11', frente: 'O que é almoxarifado?', verso: 'Local de guarda e controle de MATERIAIS DE CONSUMO (papel, caneta, material de limpeza). Os bens permanentes são controlados pelo PATRIMÔNIO. Não confundir almoxarifado (consumo) com patrimônio (permanente).', dificuldade: 2, tags: ['materiais'] },
    { id: 'F-ADM-12-0001', moduloId: 'ADM-12', topicoId: 'ADM-12', frente: 'Qual a diferença entre processo e projeto?', verso: 'PROCESSO: contínuo, repetitivo, padronizado (ex.: atendimento diário ao cidadão). PROJETO: temporário, único, com início e fim definidos (ex.: implantação de novo sistema).', dificuldade: 2, tags: ['processos'] },
    { id: 'F-ADM-12-0002', moduloId: 'ADM-12', topicoId: 'ADM-12', frente: 'O que é a gestão por processos (BPM)?', verso: 'Abordagem que vê a organização como um conjunto de FLUXOS que atravessam departamentos, com foco no RESULTADO FINAL entregue ao cliente. Diferente da gestão funcional (visão por departamentos isolados).', dificuldade: 2, tags: ['processos', 'BPM'] },
    { id: 'F-ADM-12-0003', moduloId: 'ADM-12', topicoId: 'ADM-12', frente: 'Quais são os elementos de um processo?', verso: 'ENTRADAS (inputs): recursos/informações que iniciam o processo. ATIVIDADES: o que é feito. SAÍDAS (outputs): produto/serviço gerado. CLIENTE: quem recebe a saída. INDICADORES: medem o desempenho.', dificuldade: 2, tags: ['processos'] },
    { id: 'F-ADM-12-0004', moduloId: 'ADM-12', topicoId: 'ADM-12', frente: 'Quais são os tipos de processo?', verso: 'PRIMÁRIOS (essenciais, geram valor direto ao cliente — ex.: atendimento); DE APOIO (suportam os primários — ex.: compras, RH); GERENCIAIS (planejamento e controle).', dificuldade: 3, tags: ['processos'] },
    { id: 'F-ADM-12-0005', moduloId: 'ADM-12', topicoId: 'ADM-12', frente: 'O que é BPMN?', verso: 'Business Process Model and Notation. Notação PADRONIZADA e detalhada para modelagem de processos, com elementos como eventos, tarefas, gateways (decisões), subprocessos e raias (swimlanes). Mais detalhada que o fluxograma simples.', dificuldade: 3, tags: ['processos', 'BPMN'] },
    { id: 'F-ADM-12-0006', moduloId: 'ADM-12', topicoId: 'ADM-12', frente: 'Como o PDCA se aplica à gestão por processos?', verso: 'PLAN: desenhar ou redesenhar o processo. DO: executar o processo conforme desenhado. CHECK: medir indicadores e comparar com metas. ACT: corrigir desvios e padronizar melhorias — melhoria contínua.', dificuldade: 3, tags: ['processos', 'PDCA'] },
    { id: 'F-ADM-13-0001', moduloId: 'ADM-13', topicoId: 'ADM-13', frente: 'Quais são os componentes do bom atendimento ao público?', verso: 'CORTESIA (educação e respeito) + CLAREZA (linguagem acessível) + EMPATIA (reconhecer a dificuldade do cidadão) + PRECISÃO (informação correta) + RESOLUÇÃO efetiva do problema.', dificuldade: 1, tags: ['atendimento'] },
    { id: 'F-ADM-13-0002', moduloId: 'ADM-13', topicoId: 'ADM-13', frente: 'O que é escuta ativa no atendimento?', verso: 'Prestar ATENÇÃO PLENA ao cidadão, sem interromper, interpretando conteúdo e emoções, confirmando entendimento e respondendo com precisão. É diferente de simplesmente OUVIR (captar o som).', dificuldade: 2, tags: ['atendimento', 'escuta'] },
    { id: 'F-ADM-13-0003', moduloId: 'ADM-13', topicoId: 'ADM-13', frente: 'Como o servidor deve agir diante de um cidadão exaltado?', verso: 'Manter a CALMA (autocontrole), OUVIR com atenção (escuta ativa), CONFIRMAR o entendimento e BUSCAR SOLUÇÃO ou encaminhamento correto. Nunca responder no mesmo tom, ignorar ou encerrar sem resolver.', dificuldade: 2, tags: ['atendimento', 'postura'] },
    { id: 'F-ADM-13-0004', moduloId: 'ADM-13', topicoId: 'ADM-13', frente: 'Qual é o dever do servidor em relação ao sigilo das informações?', verso: 'O servidor tem DEVER DE SIGILO. Informações sigilosas só podem ser fornecidas ao TITULAR ou por ordem legal/judicial. Parentesco NÃO autoriza o acesso. Vazamento é falta funcional.', dificuldade: 2, tags: ['atendimento', 'sigilo'] },
    { id: 'F-ADM-13-0005', moduloId: 'ADM-13', topicoId: 'ADM-13', frente: 'O que é a ouvidoria no serviço público?', verso: 'Canal específico para RECLAMAÇÕES, DENÚNCIAS, SUGESTÕES e ELOGIOS. Registra formalmente e encaminha para melhoria. Não substitui o atendimento comum nem julga processos disciplinares.', dificuldade: 2, tags: ['atendimento', 'ouvidoria'] },
    { id: 'F-ADM-13-0006', moduloId: 'ADM-13', topicoId: 'ADM-13', frente: 'Qual a diferença entre cortesia e eficiência no atendimento?', verso: 'CORTESIA: tratar com educação e respeito (comportamento). EFICIÊNCIA: resolver o problema de forma ágil e correta (resultado). O ideal combina as duas — ser educado não basta se o problema não é resolvido.', dificuldade: 3, tags: ['atendimento'] },
    { id: 'F-AP-01-0001', moduloId: 'AP-01', topicoId: 'AP-01', frente: 'O que é Administração Pública em sentido amplo?', verso: 'Sentido AMPLO (subjetivo/formal): conjunto de ÓRGÃOS e ENTIDADES de TODOS os Poderes (Executivo, Legislativo, Judiciário), no exercício de função administrativa. Olha o SUJEITO.', dificuldade: 2, tags: ['AP', 'conceito'] },
    { id: 'F-AP-01-0002', moduloId: 'AP-01', topicoId: 'AP-01', frente: 'O que é Administração Pública em sentido estrito?', verso: 'Sentido ESTRITO (objetivo/material): a própria FUNÇÃO ADMINISTRATIVA — atividade concreta e imediata do Estado, sob regime de direito público, para atender ao interesse coletivo. Olha a ATIVIDADE.', dificuldade: 2, tags: ['AP', 'conceito'] },
    { id: 'F-AP-01-0003', moduloId: 'AP-01', topicoId: 'AP-01', frente: 'Quais são os dois pilares do regime jurídico-administrativo?', verso: '1) SUPREMACIA do interesse público: prevalece sobre o privado (ex.: desapropriação). 2) INDISPONIBILIDADE do interesse público: o administrador é GESTOR, não dono — não pode renunciar ao interesse público.', dificuldade: 3, tags: ['AP', 'regime'] },
    { id: 'F-AP-01-0004', moduloId: 'AP-01', topicoId: 'AP-01', frente: 'Como o Estado atua no seu campo de atuação?', verso: '1) PODER PÚBLICO (imperium): poder de polícia, desapropriação. 2) PRESTADOR DE SERVIÇOS PÚBLICOS: saúde, educação, transporte. 3) AGENTE ECONÔMICO: empresas estatais. 4) REGULADOR da economia: agências reguladoras.', dificuldade: 2, tags: ['AP', 'campo'] },
    { id: 'F-AP-01-0005', moduloId: 'AP-01', topicoId: 'AP-01', frente: 'Qual a diferença entre Administração Pública e Direito Administrativo?', verso: 'AP é a ATIVIDADE administrativa (o que o Estado faz — objeto de estudo). DA é o RAMO DO DIREITO que regula essa atividade (normas e princípios). AP é objeto; DA é disciplina jurídica. Não são sinônimos.', dificuldade: 2, tags: ['AP', 'conceito'] },
    { id: 'F-AP-01-0006', moduloId: 'AP-01', topicoId: 'AP-01', frente: 'Os três Poderes exercem função administrativa?', verso: 'SIM, de forma ATÍPICA. Além das funções típicas (Executivo: administrar; Legislativo: legislar; Judiciário: julgar), os três exercem função ADMINISTRATIVA quando gerenciam seus órgãos, contratam, compram, etc. Por isso integram a AP em sentido amplo.', dificuldade: 3, tags: ['AP', 'função'] },
    { id: 'F-AP-03-0001', moduloId: 'AP-03', topicoId: 'AP-03', frente: 'O que significa LIMPE?', verso: 'Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência. São os princípios expressos no caput do art. 37 da CF/88.', dificuldade: 1, tags: ['AP', 'LIMPE'] },
    { id: 'F-AP-03-0002', moduloId: 'AP-03', topicoId: 'AP-03', frente: 'Qual a diferença entre legalidade administrativa e legalidade do particular?', verso: 'PARTICULAR: pode fazer tudo que a lei NÃO proíbe (autonomia privada). ADMINISTRAÇÃO: só pode fazer o que a lei AUTORIZA ou DETERMINA (legalidade estrita).', dificuldade: 2, tags: ['AP', 'legalidade'] },
    { id: 'F-AP-03-0003', moduloId: 'AP-03', topicoId: 'AP-03', frente: 'O que caracteriza a impessoalidade?', verso: 'Vedação a favoritismos + tratamento igualitário + PROIBIÇÃO DE PROMOÇÃO PESSOAL de agentes públicos (art. 37, §1º, CF). Não confundir com imparcialidade (que é dever do agente).', dificuldade: 2, tags: ['AP', 'impessoalidade'] },
    { id: 'F-AP-03-0004', moduloId: 'AP-03', topicoId: 'AP-03', frente: 'O que é moralidade administrativa?', verso: 'Ética administrativa. Exige que o ato seja não apenas LEGAL, mas também ÉTICO e HONESTO. Um ato pode ser legal e imoral ao mesmo tempo (ex.: nepotismo).', dificuldade: 2, tags: ['AP', 'moralidade'] },
    { id: 'F-AP-03-0005', moduloId: 'AP-03', topicoId: 'AP-03', frente: 'A publicidade é princípio absoluto?', verso: 'NÃO. Tem exceções constitucionais: SEGURANÇA DO ESTADO e INTIMIDADE/PRIVACIDADE. Fora dessas hipóteses, a regra é transparência.', dificuldade: 2, tags: ['AP', 'publicidade'] },
    { id: 'F-AP-03-0006', moduloId: 'AP-03', topicoId: 'AP-03', frente: 'Por qual EC a eficiência foi inserida no art. 37 da CF?', verso: 'EC 19/1998 (Reforma Gerencial). Antes dela, o caput tinha apenas 4 princípios. A inclusão da eficiência formou o LIMPE.', dificuldade: 1, tags: ['AP', 'eficiência', 'EC 19/1998'] },
    { id: 'F-AP-04-0001', moduloId: 'AP-04', topicoId: 'AP-04', frente: 'Qual a diferença entre Administração Direta e Indireta?', verso: 'DIRETA: ÓRGÃOS internos dos Poderes, sem personalidade jurídica própria (ministérios, secretarias). INDIRETA: ENTIDADES com personalidade jurídica própria (autarquias, fundações, empresas públicas, SEM).', dificuldade: 2, tags: ['AP', 'administração'] },
    { id: 'F-AP-04-0002', moduloId: 'AP-04', topicoId: 'AP-04', frente: 'O que é uma autarquia?', verso: 'Entidade da Administração Indireta com personalidade jurídica de DIREITO PÚBLICO, criada por lei específica, para exercer atividade TÍPICA de Estado. Ex.: INSS, IBAMA, universidades federais, agências reguladoras.', dificuldade: 2, tags: ['AP', 'autarquia'] },
    { id: 'F-AP-04-0003', moduloId: 'AP-04', topicoId: 'AP-04', frente: 'O que é uma fundação pública?', verso: 'Entidade da Administração Indireta, criada por lei, com personalidade de direito PÚBLICO ou PRIVADO, para atividades SOCIAIS (educação, saúde, cultura, assistência). Ex.: IBGE, FUNAI, Fiocruz.', dificuldade: 2, tags: ['AP', 'fundação'] },
    { id: 'F-AP-04-0004', moduloId: 'AP-04', topicoId: 'AP-04', frente: 'O que é uma empresa pública?', verso: 'Entidade da Administração Indireta, de direito PRIVADO, com capital 100% PÚBLICO, qualquer forma societária. Ex.: Caixa Econômica Federal, Correios, BNDES. Empregados são celetistas, mas exige concurso.', dificuldade: 2, tags: ['AP', 'empresa pública'] },
    { id: 'F-AP-04-0005', moduloId: 'AP-04', topicoId: 'AP-04', frente: 'O que é uma sociedade de economia mista?', verso: 'Entidade da Administração Indireta, de direito PRIVADO, com capital MISTO (público + privado), MAIORIA pública, obrigatoriamente S.A. Ex.: Petrobras, Banco do Brasil, Sabesp.', dificuldade: 2, tags: ['AP', 'SEM'] },
    { id: 'F-AP-04-0006', moduloId: 'AP-04', topicoId: 'AP-04', frente: 'Como se dá a criação das entidades da Administração Indireta?', verso: 'AUTARQUIAS e FUNDAÇÕES PÚBLICAS: CRIADAS por lei específica (personalidade surge com a lei). EMPRESAS PÚBLICAS e SEM: AUTORIZADAS por lei específica (personalidade surge com o registro).', dificuldade: 3, tags: ['AP', 'criação'] },
    { id: 'F-AP-05-0001', moduloId: 'AP-05', topicoId: 'AP-05', frente: 'Qual a diferença entre órgão e entidade?', verso: 'ÓRGÃO: unidade interna SEM personalidade jurídica própria (ex.: ministérios, secretarias). ENTIDADE: pessoa jurídica COM personalidade própria (autarquias, fundações, empresas públicas, SEM).', dificuldade: 2, tags: ['AP', 'órgão'] },
    { id: 'F-AP-05-0002', moduloId: 'AP-05', topicoId: 'AP-05', frente: 'Como se classificam os órgãos quanto à posição estatal?', verso: 'INDEPENDENTES: cúpula dos Poderes (Presidência, Congresso, STF). AUTÔNOMOS: subordinados à cúpula com autonomia administrativa e financeira (ministérios, secretarias). SUPERIORES: com poder de decisão, mas subordinados a um autônomo. SUBALTERNOS: execução.', dificuldade: 3, tags: ['AP', 'órgãos'] },
    { id: 'F-AP-05-0003', moduloId: 'AP-05', topicoId: 'AP-05', frente: 'Como se classificam os órgãos quanto à estrutura?', verso: 'SIMPLES: um único centro de competência (ex.: Presidência). COMPOSTOS: reúnem vários órgãos dentro de si (ex.: Ministério, com suas secretarias e departamentos).', dificuldade: 2, tags: ['AP', 'órgãos'] },
    { id: 'F-AP-05-0004', moduloId: 'AP-05', topicoId: 'AP-05', frente: 'Como se classificam os órgãos quanto à atuação?', verso: 'SINGULARES: um único titular decide (ex.: Presidência). COLEGIADOS: vários titulares decidem em conjunto (ex.: Tribunais, Conselhos).', dificuldade: 2, tags: ['AP', 'órgãos'] },
    { id: 'F-AP-05-0005', moduloId: 'AP-05', topicoId: 'AP-05', frente: 'Órgãos públicos têm capacidade processual?', verso: 'Em regra, NÃO. Exceção: órgãos INDEPENDENTES e AUTÔNOMOS podem impetrar MANDADO DE SEGURANÇA em defesa de suas prerrogativas institucionais. Órgãos também não contratam em nome próprio.', dificuldade: 3, tags: ['AP', 'capacidade'] },
    { id: 'F-AP-05-0006', moduloId: 'AP-05', topicoId: 'AP-05', frente: 'O que é a Administração Direta?', verso: 'Conjunto de ÓRGÃOS internos dos Poderes (Executivo, Legislativo e Judiciário), sem personalidade jurídica própria, ligados diretamente ao poder central. Ex.: Presidência, ministérios, secretarias.', dificuldade: 1, tags: ['AP', 'direta'] },
    { id: 'F-DA-01-0001', moduloId: 'DA-01', topicoId: 'DA-01', frente: 'O que é Direito Administrativo?', verso: 'Ramo do DIREITO PÚBLICO que estuda os princípios e normas que regem a Administração Pública e sua relação com os administrados. Objeto: a própria Administração e sua atividade.', dificuldade: 1, tags: ['DA', 'conceito'] },
    { id: 'F-DA-01-0002', moduloId: 'DA-01', topicoId: 'DA-01', frente: 'Quais são as fontes do Direito Administrativo?', verso: 'PRIMÁRIA: a LEI (em sentido amplo: CF, leis, decretos, regulamentos). SECUNDÁRIAS: doutrina, jurisprudência, princípios gerais do direito e costumes administrativos.', dificuldade: 2, tags: ['DA', 'fontes'] },
    { id: 'F-DA-01-0003', moduloId: 'DA-01', topicoId: 'DA-01', frente: 'Qual é o objeto do Direito Administrativo?', verso: 'A Administração Pública (órgãos, entidades, agentes) e a ATIVIDADE ADMINISTRATIVA (atos, contratos, licitações, poder de polícia, serviços públicos, responsabilidade e controle).', dificuldade: 2, tags: ['DA', 'objeto'] },
    { id: 'F-DA-01-0004', moduloId: 'DA-01', topicoId: 'DA-01', frente: 'Quais são os dois pilares do regime jurídico-administrativo?', verso: '1) SUPREMACIA do interesse público (prevalece sobre o privado). 2) INDISPONIBILIDADE do interesse público (o administrador é gestor, não dono — não pode renunciar).', dificuldade: 3, tags: ['DA', 'regime'] },
    { id: 'F-DA-01-0005', moduloId: 'DA-01', topicoId: 'DA-01', frente: 'Qual a diferença entre Direito Administrativo e Direito Privado?', verso: 'DA: regido por normas de direito PÚBLICO, com prerrogativas do Estado (supremacia) e restrições (indisponibilidade). Direito Privado: regido pela AUTONOMIA DA VONTADE, com igualdade formal entre as partes.', dificuldade: 3, tags: ['DA', 'direito público'] },
    { id: 'F-DA-01-0006', moduloId: 'DA-01', topicoId: 'DA-01', frente: 'Quais são as normas-base do Direito Administrativo brasileiro?', verso: 'CF/88 (arts. 37 a 41), Lei 8.112/1990 (servidores), Lei 9.784/1999 (processo administrativo), Lei 14.133/2021 (licitações) e Lei 8.429/1992 (improbidade).', dificuldade: 2, tags: ['DA', 'legislação'] },
    { id: 'F-DA-03-0001', moduloId: 'DA-03', topicoId: 'DA-03', frente: 'Qual a diferença entre desconcentração e descentralização?', verso: 'DESCONCENTRAÇÃO: dentro da MESMA pessoa jurídica — criação de órgãos (ex.: delegacia regional de um ministério). DESCENTRALIZAÇÃO: criação de NOVA pessoa jurídica (outorga) ou delegação a particular.', dificuldade: 3, tags: ['DA', 'organização'] },
    { id: 'F-DA-03-0002', moduloId: 'DA-03', topicoId: 'DA-03', frente: 'Qual a diferença entre outorga e delegação?', verso: 'OUTORGA: o Estado transfere TITULARIDADE + EXECUÇÃO a uma ENTIDADE da Administração Indireta, criada por lei (ex.: autarquia). DELEGAÇÃO: o Estado transfere apenas a EXECUÇÃO a um PARTICULAR, mantendo a titularidade (ex.: concessão, permissão).', dificuldade: 3, tags: ['DA', 'outorga', 'delegação'] },
    { id: 'F-DA-03-0003', moduloId: 'DA-03', topicoId: 'DA-03', frente: 'Quem integra a Administração Direta e a Indireta?', verso: 'DIRETA: ÓRGÃOS sem personalidade (ministérios, secretarias). INDIRETA: ENTIDADES com personalidade própria (autarquias, fundações, empresas públicas, SEM).', dificuldade: 2, tags: ['DA', 'administração'] },
    { id: 'F-DA-03-0004', moduloId: 'DA-03', topicoId: 'DA-03', frente: 'Como se dá a criação de órgãos e entidades?', verso: 'ÓRGÃOS: por lei ou decreto, conforme o caso. AUTARQUIAS e FUNDAÇÕES: CRIADAS por lei específica. EMPRESAS PÚBLICAS e SEM: AUTORIZADAS por lei específica (personalidade surge com o registro).', dificuldade: 3, tags: ['DA', 'criação'] },
    { id: 'F-DA-03-0005', moduloId: 'DA-03', topicoId: 'DA-03', frente: 'Órgãos públicos têm personalidade jurídica própria?', verso: 'NÃO. Órgãos são unidades internas, sem personalidade jurídica própria. Quem tem personalidade é a PESSOA JURÍDICA (União, Estado, Município, autarquia). Órgãos também não contratam em nome próprio.', dificuldade: 2, tags: ['DA', 'órgão'] },
    { id: 'F-DA-03-0006', moduloId: 'DA-03', topicoId: 'DA-03', frente: 'O que é a tutela (controle finalístico)?', verso: 'Controle que a Administração Direta exerce sobre as entidades da Administração Indireta. Não é subordinação hierárquica — é controle de fins, dentro dos limites da lei. Diferente da AUTOTUTELA (controle dos próprios atos).', dificuldade: 3, tags: ['DA', 'tutela'] },
    { id: 'F-DA-04-0001', moduloId: 'DA-04', topicoId: 'DA-04', frente: 'Quais são as espécies de agentes públicos?', verso: 'AGENTES POLÍTICOS (Presidente, Ministros, Prefeitos); SERVIDORES PÚBLICOS (efetivos e em comissão); EMPREGADOS PÚBLICOS (celetistas); AGENTES TEMPORÁRIOS; AGENTES HONORÍFICOS (mesário, jurado); AGENTES DELEGADOS (tabelião, concessionária).', dificuldade: 2, tags: ['DA', 'agentes'] },
    { id: 'F-DA-04-0002', moduloId: 'DA-04', topicoId: 'DA-04', frente: 'Qual a diferença entre cargo e emprego público?', verso: 'CARGO: criado por lei, ocupado por servidor ESTATUTÁRIO (regime legal). EMPREGO: ocupado por empregado CELETISTA (CLT). Ambos exigem concurso, exceto o cargo em comissão.', dificuldade: 2, tags: ['DA', 'agentes'] },
    { id: 'F-DA-04-0003', moduloId: 'DA-04', topicoId: 'DA-04', frente: 'O que é cargo em comissão?', verso: 'Cargo de LIVRE NOMEAÇÃO e EXONERAÇÃO, destinado a funções de DIREÇÃO, CHEFIA e ASSESSORAMENTO. NÃO exige concurso público. Previsto no art. 37, II, CF/88.', dificuldade: 2, tags: ['DA', 'agentes'] },
    { id: 'F-DA-04-0004', moduloId: 'DA-04', topicoId: 'DA-04', frente: 'Quando o servidor adquire estabilidade?', verso: 'Após 3 ANOS de efetivo exercício (art. 41, CF/88), mediante aprovação em AVALIAÇÃO ESPECIAL DE DESEMPENHO. Aplica-se aos ocupantes de cargo efetivo.', dificuldade: 2, tags: ['DA', 'estabilidade'] },
    { id: 'F-DA-04-0005', moduloId: 'DA-04', topicoId: 'DA-04', frente: 'As responsabilidades civil, penal e administrativa do servidor são cumulativas?', verso: 'SIM. São esferas INDEPENDENTES e CUMULATIVAS. O servidor pode responder nas três ao mesmo tempo. Absolvição penal, em regra, não afasta automaticamente a punição administrativa (há exceções).', dificuldade: 3, tags: ['DA', 'responsabilidade'] },
    { id: 'F-DA-04-0006', moduloId: 'DA-04', topicoId: 'DA-04', frente: 'O que é função pública?', verso: 'GÊNERO que engloba cargo, emprego e função temporária. Pode ser exercida por servidor (cargo), empregado (emprego) ou por agente sem cargo (função temporária). É diferente de cargo e de emprego, que são ESPÉCIES.', dificuldade: 3, tags: ['DA', 'agentes'] },
     { id: 'F-DA-05-0001', moduloId: 'DA-05', topicoId: 'DA-05', frente: 'Quais são os poderes administrativos?', verso: 'HIERÁRQUICO (relação superior-subordinado), DISCIPLINAR (pune servidores e vínculos específicos), REGULAMENTAR (decretos para execução da lei), DE POLÍCIA (limita direitos dos particulares), VINCULADO (sem margem) e DISCRICIONÁRIO (mérito).', dificuldade: 2, tags: ['DA', 'poderes'] },
    { id: 'F-DA-05-0002', moduloId: 'DA-05', topicoId: 'DA-05', frente: 'Qual a diferença entre poder de polícia e poder disciplinar?', verso: 'POLÍCIA: atinge PARTICULARES em geral, limitando direitos em favor da coletividade (ex.: interdição, multa de trânsito). DISCIPLINAR: atinge SERVIDORES e particulares com vínculo específico (ex.: concessionárias).', dificuldade: 3, tags: ['DA', 'poder de polícia', 'disciplinar'] },
    { id: 'F-DA-05-0003', moduloId: 'DA-05', topicoId: 'DA-05', frente: 'O que é o poder regulamentar?', verso: 'Poder de editar DECRETOS para fiel execução da lei. Privativo do Chefe do Executivo. NÃO pode inovar a lei (criar obrigações novas) — só regulamenta o que já está previsto.', dificuldade: 2, tags: ['DA', 'poder regulamentar'] },
    { id: 'F-DA-05-0004', moduloId: 'DA-05', topicoId: 'DA-05', frente: 'O que é o poder hierárquico?', verso: 'Poder de organizar a relação superior-subordinado: ordenar, fiscalizar, delegar, avocar e rever atos. É a base estrutural da Administração.', dificuldade: 2, tags: ['DA', 'poder hierárquico'] },
    { id: 'F-DA-05-0005', moduloId: 'DA-05', topicoId: 'DA-05', frente: 'Qual a diferença entre excesso de poder e desvio de finalidade?', verso: 'EXCESSO: a autoridade atua FORA dos limites de sua competência. DESVIO: atua DENTRO da competência, mas com finalidade diferente do interesse público. Ambos são formas de ABUSO DE PODER.', dificuldade: 3, tags: ['DA', 'abuso'] },
    { id: 'F-DA-05-0006', moduloId: 'DA-05', topicoId: 'DA-05', frente: 'Quais atos podem ser revogados?', verso: 'Apenas atos DISCRICIONÁRIOS, por conveniência e oportunidade (mérito). Atos VINCULADOS não podem ser revogados — apenas anulados se ilegais.', dificuldade: 2, tags: ['DA', 'revogação'] },
    { id: 'F-DA-06-0001', moduloId: 'DA-06', topicoId: 'DA-06', frente: 'O que é ato administrativo?', verso: 'Manifestação UNILATERAL da Administração Pública, no exercício de prerrogativas públicas, que produz efeitos jurídicos imediatos, sob regime de direito público e sujeita a controle.', dificuldade: 1, tags: ['DA', 'atos'] },
    { id: 'F-DA-06-0002', moduloId: 'DA-06', topicoId: 'DA-06', frente: 'Quais são os atributos do ato administrativo (PATI)?', verso: 'P = Presunção de legitimidade. A = Autoexecutoriedade. T = Tipicidade. I = Imperatividade. São características do ato, não requisitos de validade.', dificuldade: 2, tags: ['DA', 'atributos'] },
    { id: 'F-DA-06-0003', moduloId: 'DA-06', topicoId: 'DA-06', frente: 'Quais são os elementos do ato administrativo (COFOMOB)?', verso: 'C = Competência. F = Finalidade. F = Forma. M = Motivo. O = Objeto. Se faltar um, o ato é INVÁLIDO. São requisitos de validade.', dificuldade: 2, tags: ['DA', 'elementos'] },
    { id: 'F-DA-06-0004', moduloId: 'DA-06', topicoId: 'DA-06', frente: 'Qual a diferença entre anulação e revogação?', verso: 'ANULAÇÃO: recai sobre ato ILEGAL; efeitos EX TUNC (retroage). REVOGAÇÃO: recai sobre ato DISCRICIONÁRIO por conveniência e oportunidade (mérito); efeitos EX NUNC (não retroage).', dificuldade: 3, tags: ['DA', 'anulação', 'revogação'] },
    { id: 'F-DA-06-0005', moduloId: 'DA-06', topicoId: 'DA-06', frente: 'O Judiciário pode revogar ato administrativo?', verso: 'NÃO. O Judiciário ANULA atos ilegais, mas NÃO revoga — revogação por mérito é competência exclusiva da própria Administração (autotutela, Súmula 473/STF).', dificuldade: 3, tags: ['DA', 'controle judicial'] },
    { id: 'F-DA-06-0006', moduloId: 'DA-06', topicoId: 'DA-06', frente: 'O que é convalidação do ato administrativo?', verso: 'Correção de vícios SANÁVEIS (em regra, competência e forma), quando não houver prejuízo ao interesse público nem a terceiros. Feita pela própria Administração.', dificuldade: 3, tags: ['DA', 'convalidação'] },
    { id: 'F-DA-07-0001', moduloId: 'DA-07', topicoId: 'DA-07', frente: 'O que é serviço público?', verso: 'Atividade MATERIAL prestada pelo Estado, direta ou indiretamente, sob regime de direito público, para satisfazer necessidades coletivas essenciais (saúde, educação, transporte, energia, água).', dificuldade: 1, tags: ['DA', 'serviços'] },
    { id: 'F-DA-07-0002', moduloId: 'DA-07', topicoId: 'DA-07', frente: 'Quais são os princípios dos serviços públicos?', verso: 'GENERALIDADE (atender a todos), CONTINUIDADE (não parar, com exceções), MODICIDADE TARIFÁRIA (tarifa acessível), CORTESIA, ATUALIDADE, SEGURANÇA, EFICIÊNCIA, REGULARIDADE e UNIVERSALIDADE.', dificuldade: 2, tags: ['DA', 'serviços'] },
    { id: 'F-DA-07-0003', moduloId: 'DA-07', topicoId: 'DA-07', frente: 'Qual a diferença entre concessão e permissão de serviço público?', verso: 'CONCESSÃO: CONTRATO administrativo, prazo determinado, SEMPRE com licitação. PERMISSÃO: ATO administrativo, unilateral, discricionário, precário, também com licitação.', dificuldade: 3, tags: ['DA', 'concessão', 'permissão'] },
    { id: 'F-DA-07-0004', moduloId: 'DA-07', topicoId: 'DA-07', frente: 'O que é autorização de serviço público?', verso: 'ATO unilateral, discricionário, PRECÁRIO, SEM licitação, para serviços de pequeno porte ou emergenciais. Ex.: banca de jornal, táxi (em algumas legislações).', dificuldade: 2, tags: ['DA', 'autorização'] },
    { id: 'F-DA-07-0005', moduloId: 'DA-07', topicoId: 'DA-07', frente: 'A continuidade do serviço público é absoluta?', verso: 'NÃO. Admite exceções: razões técnicas, segurança das instalações e INADIMPLEMENTO DO USUÁRIO (após aviso prévio). A regra é a não interrupção, mas há hipóteses legais.', dificuldade: 2, tags: ['DA', 'continuidade'] },
    { id: 'F-DA-07-0006', moduloId: 'DA-07', topicoId: 'DA-07', frente: 'Quais são as formas de prestação de serviços públicos?', verso: 'DIRETA: pelos próprios órgãos do Estado. INDIRETA por OUTORGA: por entidades da Administração Indireta (autarquias, empresas públicas, SEM). INDIRETA por DELEGAÇÃO: por particulares (concessão e permissão).', dificuldade: 2, tags: ['DA', 'serviços'] },
    { id: 'F-DA-08-0001', moduloId: 'DA-08', topicoId: 'DA-08', frente: 'O que é licitação?', verso: 'Procedimento administrativo pelo qual a Administração Pública seleciona a proposta mais vantajosa para contratar, garantindo isonomia entre os concorrentes. Regida pela Lei 14.133/2021.', dificuldade: 1, tags: ['DA', 'licitação'] },
    { id: 'F-DA-08-0002', moduloId: 'DA-08', topicoId: 'DA-08', frente: 'Quais são as modalidades de licitação na Lei 14.133/2021?', verso: 'PREGÃO, CONCORRÊNCIA, CONCURSO, LEILÃO e DIÁLOGO COMPETITIVO. Tomada de preços e convite (da antiga Lei 8.666/1993) foram EXTINTOS.', dificuldade: 2, tags: ['DA', 'licitação', 'modalidades'] },
    { id: 'F-DA-08-0003', moduloId: 'DA-08', topicoId: 'DA-08', frente: 'Qual a diferença entre dispensa e inexigibilidade?', verso: 'DISPENSA: a competição é POSSÍVEL, mas a lei autoriza não licitar (ex.: valores baixos, emergência). INEXIGIBILIDADE: a competição é IMPOSSÍVEL (ex.: fornecedor exclusivo, artista consagrado).', dificuldade: 3, tags: ['DA', 'licitação', 'dispensa'] },
    { id: 'F-DA-08-0004', moduloId: 'DA-08', topicoId: 'DA-08', frente: 'O que é o pregão na Lei 14.133/2021?', verso: 'Modalidade OBRIGATÓRIA para aquisição de bens e contratação de serviços COMUNS (objetivamente definíveis no edital). Admite forma eletrônica (preferencial). Não é exclusivo para obras.', dificuldade: 2, tags: ['DA', 'licitação', 'pregão'] },
    { id: 'F-DA-08-0005', moduloId: 'DA-08', topicoId: 'DA-08', frente: 'O que é o diálogo competitivo?', verso: 'Modalidade NOVA da Lei 14.133/2021, para contratação de soluções INOVADORAS ou de ALTA COMPLEXIDADE TÉCNICA. Não existia na Lei 8.666/1993.', dificuldade: 3, tags: ['DA', 'licitação', 'diálogo'] },
    { id: 'F-DA-08-0006', moduloId: 'DA-08', topicoId: 'DA-08', frente: 'Quais são as sanções previstas na Lei 14.133/2021?', verso: 'ADVERTÊNCIA, MULTA, IMPEDIMENTO de licitar e contratar (até 3 anos) e DECLARAÇÃO DE INIDONEIDADE (até 6 anos). São sanções administrativas, diferentes das penais.', dificuldade: 2, tags: ['DA', 'licitação', 'sanções'] },
    { id: 'F-DA-09-0001', moduloId: 'DA-09', topicoId: 'DA-09', frente: 'Qual a regra geral da responsabilidade civil do Estado em atos comissivos?', verso: 'Responsabilidade OBJETIVA (art. 37, §6º, CF): basta DANO + NEXO CAUSAL + CONDUTA. Independe de culpa. Aplica-se às pessoas jurídicas de direito público e de direito privado prestadoras de serviços públicos.', dificuldade: 2, tags: ['DA', 'responsabilidade'] },
    { id: 'F-DA-09-0002', moduloId: 'DA-09', topicoId: 'DA-09', frente: 'E na omissão, qual a responsabilidade do Estado?', verso: 'Em regra, SUBJETIVA, exigindo comprovação de CULPA DO SERVIÇO (faute du service). Exceção: quando o Estado tinha DEVER ESPECÍFICO DE AGIR para evitar o dano (ex.: preso sob custódia) — aí é objetiva.', dificuldade: 3, tags: ['DA', 'responsabilidade', 'omissão'] },
    { id: 'F-DA-09-0003', moduloId: 'DA-09', topicoId: 'DA-09', frente: 'Quais são as excludentes da responsabilidade civil do Estado?', verso: 'CULPA EXCLUSIVA DA VÍTIMA, FATO EXCLUSIVO DE TERCEIRO e CASO FORTUITO/FORÇA MAIOR. Culpa CONCORRENTE não exclui — apenas reduz a indenização.', dificuldade: 2, tags: ['DA', 'responsabilidade', 'excludentes'] },
    { id: 'F-DA-09-0004', moduloId: 'DA-09', topicoId: 'DA-09', frente: 'O que é a ação regressiva?', verso: 'Após indenizar o terceiro, o Estado pode cobrar do AGENTE PÚBLICO responsável. Exige DOLO ou CULPA do agente (art. 37, §6º, CF). A responsabilidade do agente perante o Estado é SUBJETIVA.', dificuldade: 3, tags: ['DA', 'responsabilidade', 'regressiva'] },
    { id: 'F-DA-09-0005', moduloId: 'DA-09', topicoId: 'DA-09', frente: 'Empresas estatais exploradoras de atividade econômica respondem objetivamente?', verso: 'NÃO. As empresas públicas e SEM que exploram ATIVIDADE ECONÔMICA (art. 173, CF) respondem como empresas privadas, sob o regime civil comum. A responsabilidade objetiva aplica-se às prestadoras de SERVIÇO PÚBLICO.', dificuldade: 3, tags: ['DA', 'responsabilidade'] },
    { id: 'F-DA-09-0006', moduloId: 'DA-09', topicoId: 'DA-09', frente: 'Qual é a base constitucional da responsabilidade civil do Estado?', verso: 'Art. 37, §6º, CF/88: "As pessoas jurídicas de direito público e as de direito privado prestadoras de serviços públicos responderão pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa."', dificuldade: 2, tags: ['DA', 'responsabilidade', 'CF'] },
    { id: 'F-DA-10-0001', moduloId: 'DA-10', topicoId: 'DA-10', frente: 'O que é controle da Administração Pública?', verso: 'Conjunto de mecanismos que verificam a LEGALIDADE e o MÉRITO dos atos administrativos. Pode ser interno (dentro do órgão) ou externo (por outro Poder ou instituição autônoma).', dificuldade: 1, tags: ['DA', 'controle'] },
    { id: 'F-DA-10-0002', moduloId: 'DA-10', topicoId: 'DA-10', frente: 'Qual a diferença entre controle interno e externo?', verso: 'INTERNO: dentro do próprio órgão (corregedoria, controladoria, CGU). EXTERNO: por outro Poder ou instituição autônoma (Tribunal de Contas, Judiciário, MP). O interno é autocontrole; o externo é heterocontrole.', dificuldade: 2, tags: ['DA', 'controle'] },
    { id: 'F-DA-10-0003', moduloId: 'DA-10', topicoId: 'DA-10', frente: 'Qual a diferença entre controle de legalidade e controle de mérito?', verso: 'LEGALIDADE: verifica conformidade com a lei — pode ser feito pela Administração e pelo Judiciário. MÉRITO: verifica conveniência e oportunidade — só pode ser feito pela própria Administração, NUNCA pelo Judiciário.', dificuldade: 3, tags: ['DA', 'controle'] },
    { id: 'F-DA-10-0004', moduloId: 'DA-10', topicoId: 'DA-10', frente: 'O que é o controle legislativo e quem exerce?', verso: 'Controle exercido pelo CONGRESSO NACIONAL com AUXÍLIO dos TRIBUNAIS DE CONTAS. O TC emite parecer prévio sobre as contas do Presidente; o julgamento é do Congresso. O Legislativo também susta atos normativos que exorbitem.', dificuldade: 3, tags: ['DA', 'controle'] },
    { id: 'F-DA-10-0005', moduloId: 'DA-10', topicoId: 'DA-10', frente: 'O Judiciário pode revogar ato administrativo por inconveniência?', verso: 'NÃO. O Judiciário examina apenas a LEGALIDADE. Ele ANULA atos ilegais, mas NÃO revoga — revogação por mérito é competência exclusiva da Administração (autotutela, Súmula 473/STF).', dificuldade: 3, tags: ['DA', 'controle'] },
    { id: 'F-DA-10-0006', moduloId: 'DA-10', topicoId: 'DA-10', frente: 'O que são os Tribunais de Contas?', verso: 'Órgãos AUXILIARES do Poder LEGISLATIVO, com autonomia e funções próprias. Não integram o Judiciário nem são subordinados ao Legislativo. Exercem CONTROLE EXTERNO técnico (julgam contas, fiscalizam, aplicam sanções).', dificuldade: 3, tags: ['DA', 'controle', 'TC'] },
     { id: 'F-DA-11-0001', moduloId: 'DA-11', topicoId: 'DA-11', frente: 'O que é improbidade administrativa?', verso: 'Conduta DOLOSA praticada por agente público (ou terceiro que concorra) que atenta contra a Administração Pública. Regida pela Lei 8.429/1992, alterada pela Lei 14.230/2021.', dificuldade: 2, tags: ['DA', 'improbidade'] },
    { id: 'F-DA-11-0002', moduloId: 'DA-11', topicoId: 'DA-11', frente: 'Quais são as três modalidades de atos de improbidade?', verso: '1) ENRIQUECIMENTO ILÍCITO (art. 9º) — auferir vantagem patrimonial indevida. 2) PREJUÍZO AO ERÁRIO (art. 10) — causar perda patrimonial ao Estado. 3) VIOLAÇÃO DE PRINCÍPIOS (art. 11) — atentar contra deveres de honestidade, imparcialidade, legalidade e lealdade.', dificuldade: 2, tags: ['DA', 'improbidade'] },
    { id: 'F-DA-11-0003', moduloId: 'DA-11', topicoId: 'DA-11', frente: 'Após a Lei 14.230/2021, a improbidade exige dolo ou culpa?', verso: 'Exige DOLO. A modalidade CULPOSA foi EXTINTA. Ato meramente culposo (imperícia, imprudência) pode gerar outras responsabilidades, mas NÃO configura improbidade administrativa.', dificuldade: 3, tags: ['DA', 'improbidade', 'dolo'] },
    { id: 'F-DA-11-0004', moduloId: 'DA-11', topicoId: 'DA-11', frente: 'Quem pode ser sujeito ativo na improbidade administrativa?', verso: 'AGENTES PÚBLICOS de qualquer natureza (efetivos, comissionados, empregados públicos, políticos) e TERCEIROS que induzam, concorram ou se beneficiem do ato. O particular também pode responder.', dificuldade: 2, tags: ['DA', 'improbidade'] },
    { id: 'F-DA-11-0005', moduloId: 'DA-11', topicoId: 'DA-11', frente: 'Quais são as sanções previstas para improbidade administrativa?', verso: 'Perda dos bens ilícitos, RESSARCIMENTO integral, PERDA DA FUNÇÃO PÚBLICA, SUSPENSÃO DOS DIREITOS POLÍTICOS, MULTA CIVIL e PROIBIÇÃO de contratar com o poder público e receber benefícios fiscais por prazo determinado.', dificuldade: 3, tags: ['DA', 'improbidade', 'sanções'] },
    { id: 'F-DA-11-0006', moduloId: 'DA-11', topicoId: 'DA-11', frente: 'Qual o prazo de prescrição da ação de improbidade e quem tem legitimidade para propô-la?', verso: 'Prescrição: em regra, 8 ANOS (do fato ou do término do mandato, conforme o caso). Legitimidade ativa: MINISTÉRIO PÚBLICO (após a Lei 14.230/2021). A pessoa jurídica interessada pode atuar como assistente.', dificuldade: 3, tags: ['DA', 'improbidade', 'prescrição'] },
    { id: 'F-DA-12-0001', moduloId: 'DA-12', topicoId: 'DA-12', frente: 'O que é processo administrativo?', verso: 'Conjunto de ATOS ADMINISTRATIVOS ordenados que visa a uma DECISÃO FINAL da Administração, com participação dos interessados. Marco legal federal: Lei 9.784/1999.', dificuldade: 1, tags: ['DA', 'processo'] },
    { id: 'F-DA-12-0002', moduloId: 'DA-12', topicoId: 'DA-12', frente: 'Quais são as fases do processo administrativo?', verso: 'INSTAURAÇÃO → INSTRUÇÃO → DEFESA → RELATÓRIO → DECISÃO. O RECURSO é etapa posterior facultativa. Não confundir com processo judicial.', dificuldade: 2, tags: ['DA', 'processo'] },
    { id: 'F-DA-12-0003', moduloId: 'DA-12', topicoId: 'DA-12', frente: 'Como se instaura o processo administrativo?', verso: 'DE OFÍCIO (pela própria Administração) ou A REQUERIMENTO do interessado. Não depende de ordem judicial nem de autorização do Ministério Público.', dificuldade: 2, tags: ['DA', 'processo'] },
    { id: 'F-DA-12-0004', moduloId: 'DA-12', topicoId: 'DA-12', frente: 'Quais são os princípios do processo administrativo (Lei 9.784/1999, art. 2º)?', verso: 'Legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público e eficiência.', dificuldade: 3, tags: ['DA', 'processo'] },
    { id: 'F-DA-12-0005', moduloId: 'DA-12', topicoId: 'DA-12', frente: 'Qual a diferença entre pedido de reconsideração e recurso hierárquico?', verso: 'RECONSIDERAÇÃO: dirigido à MESMA autoridade que praticou o ato. RECURSO HIERÁRQUICO: dirigido à autoridade SUPERIOR. Ambos são recursos ADMINISTRATIVOS, não judiciais.', dificuldade: 2, tags: ['DA', 'processo', 'recursos'] },
    { id: 'F-DA-12-0006', moduloId: 'DA-12', topicoId: 'DA-12', frente: 'Qual é o prazo decadencial para a Administração anular ato favorável ao destinatário?', verso: '5 ANOS, salvo comprovada má-fé (art. 54 da Lei 9.784/1999). Após esse prazo, o ato se consolida (não pode mais ser anulado administrativamente). Não confundir com o prazo de 10 dias para decisão (que admite prorrogação de 5).', dificuldade: 3, tags: ['DA', 'processo', 'prazo'] },
    { id: 'F-DA-13-0001', moduloId: 'DA-13', topicoId: 'DA-13', frente: 'O que são bens públicos?', verso: 'Bens pertencentes às PESSOAS JURÍDICAS DE DIREITO PÚBLICO (União, Estados, DF, Municípios, autarquias, fundações) e os bens de pessoas jurídicas de direito privado AFETADOS a serviços públicos.', dificuldade: 1, tags: ['DA', 'bens'] },
    { id: 'F-DA-13-0002', moduloId: 'DA-13', topicoId: 'DA-13', frente: 'Como se classificam os bens públicos quanto à destinação?', verso: 'USO COMUM DO POVO: destinados à coletividade (ruas, praças, rios, praias). USO ESPECIAL: afetados a serviço ou estabelecimento público (escolas, hospitais). DOMINICAIS: sem destinação específica (terrenos devolutos).', dificuldade: 2, tags: ['DA', 'bens'] },
    { id: 'F-DA-13-0003', moduloId: 'DA-13', topicoId: 'DA-13', frente: 'Qual é o regime jurídico dos bens públicos?', verso: 'INALIENABILIDADE (enquanto mantida a destinação), IMPENHORABILIDADE (não podem ser penhorados), IMPRESCRITIBILIDADE (não podem ser usucapidos) e NÃO ONERABILIDADE (não podem ser dados em garantia).', dificuldade: 2, tags: ['DA', 'bens', 'regime'] },
    { id: 'F-DA-13-0004', moduloId: 'DA-13', topicoId: 'DA-13', frente: 'Bens dominicais podem ser alienados?', verso: 'SIM, cumpridos os requisitos legais: DESAFETAÇÃO (se necessário), AVALIAÇÃO prévia, AUTORIZAÇÃO LEGAL e LICITAÇÃO (Lei 14.133/2021), salvo hipóteses legais específicas. Bens de uso comum e especial são inalienáveis enquanto mantida a destinação.', dificuldade: 3, tags: ['DA', 'bens', 'alienação'] },

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function getModule(modId) { for (var i = 0; i < MODULES.length; i++) if (MODULES[i].id === modId) return MODULES[i]; return null; }

  function getDiagnosticByModuleId(modId) { return DIAGNOSTICS[modId] || null; }
  function getQuestion(qid) { for (var i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].id === qid) return QUESTIONS[i]; return null; }
  function getFlashcard(fid) { for (var i = 0; i < FLASHCARDS.length; i++) if (FLASHCARDS[i].id === fid) return FLASHCARDS[i]; return null; }
  function formatDate(iso) { if (!iso) return '—'; try { return new Date(iso).toLocaleString('pt-BR'); } catch (e) { return iso; } }
  function formatDateShort(iso) { if (!iso) return '—'; try { return new Date(iso).toLocaleDateString('pt-BR'); } catch (e) { return iso; } }
  function isObjective(item) { return item.tipo === 'multipla_escolha' || item.tipo === 'verdadeiro_falso' || item.tipo === 'situacao'; }
  function difficultyLabel(d) { return DIFFICULTY_LABELS[d] || ('Nível ' + d); }
  function typeLabel(t) { return t === 'REAL' ? 'Real' : 'Didática'; }
  function typeBadgeClass(t) { return t === 'REAL' ? 'badge-real' : 'badge-did'; }
  function qRealCount() { var n = 0; for (var i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].tipo === 'REAL') n++; return n; }
  function qDidCount() { var n = 0; for (var i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].tipo === 'DIDATICA') n++; return n; }
  function fcByModule(modId) { var arr = []; for (var i = 0; i < FLASHCARDS.length; i++) if (FLASHCARDS[i].moduloId === modId) arr.push(FLASHCARDS[i]); return arr; }
  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function addDaysIso(days) {
    var d = new Date();
    d.setDate(d.getDate() + days);
    return d.toISOString();
  }
  function isDue(iso) {
    if (!iso) return false;
    var t = new Date(iso).getTime();
    return isFinite(t) && t <= Date.now();
  }
  function isToday(iso) {
    if (!iso) return false;
    var d = new Date(iso);
    var now = new Date();
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
  }

  /* ============================================================

  ============================================================ */
  function computeDiagnosticResult(moduleId, answers) {
    var diag = getDiagnosticByModuleId(moduleId);
    if (!diag) return null;
    var bySubtopic = {}, totalPontos = 0, totalSinais = 0;
    for (var i = 0; i < diag.itens.length; i++) {
      var item = diag.itens[i];
      var sub = item.subtopico;
      if (!bySubtopic[sub]) bySubtopic[sub] = { acertos: 0, erros: 0, sabia: 0, nao_sabia: 0, total: 0 };
      var resp = answers[item.id];
      bySubtopic[sub].total += 1;
      if (isObjective(item)) {
        if (resp === item.gabarito) { bySubtopic[sub].acertos += 1; totalPontos += 1; } else bySubtopic[sub].erros += 1;
        totalSinais += 1;
      } else if (item.tipo === 'autoavaliacao') {
        if (resp === 'sabia') { bySubtopic[sub].sabia += 1; totalPontos += 1; } else if (resp === 'nao_sabia') bySubtopic[sub].nao_sabia += 1;
        totalSinais += 1;
      }
    }
    var result = { bySubtopic: {} };
    for (var subName in bySubtopic) {
      if (!bySubtopic.hasOwnProperty(subName)) continue;
      var s = bySubtopic[subName];
      var positivos = s.acertos + s.sabia, negativos = s.erros + s.nao_sabia;
      var status;
      if (s.erros === 0 && s.nao_sabia === 0 && positivos >= 1) status = 'conhecido';
      else if (positivos === 0 && negativos >= 1) status = 'desconhecido';
      else status = 'duvida';
      var rec;
      if (status === 'conhecido') rec = 'Você demonstra bom domínio neste subtópico. Siga para a aula (revisão) e mantenha revisões periódicas.';
      else if (status === 'duvida') rec = 'Há base, mas o domínio é parcial. Estude a aula com atenção, foque nos exemplos e nas comparações, e refaça este diagnóstico depois de revisar.';
      else rec = 'Trate este subtópico como prioridade. Estude a aula desde o início, sem pular a explicação simples. Refaça o diagnóstico em seguida.';
      result.bySubtopic[subName] = { status: status, acertos: s.acertos, erros: s.erros, sabia: s.sabia, nao_sabia: s.nao_sabia, total: s.total, recommendation: rec };
    }
    var dominio = 0;
    if (totalSinais > 0) {
      dominio = totalPontos / totalSinais;
      if (negativosNoTotal(bySubtopic) > 0) dominio = dominio * 0.9;
      dominio = Math.max(0, Math.min(1, dominio));
    }
    result.dominioEstimado = Math.round(dominio * 100) / 100;
    result.completedAt = new Date().toISOString();
    return result;
  }
  function negativosNoTotal(bySubtopic) { var n = 0; for (var k in bySubtopic) if (bySubtopic.hasOwnProperty(k)) n += bySubtopic[k].erros + bySubtopic[k].nao_sabia; return n; }

  function filterQuestions() {
    return QUESTIONS.filter(function (q) {
      if (questionFilter.area !== 'todas' && q.area !== questionFilter.area) return false;
      if (questionFilter.moduloId !== 'todos' && q.moduloId !== questionFilter.moduloId) return false;
      if (questionFilter.dificuldade !== 'todas' && q.dificuldade !== Number(questionFilter.dificuldade)) return false;
      if (questionFilter.tipo !== 'TODAS' && q.tipo !== questionFilter.tipo) return false;
      return true;
    });
  }
  function startQuestionSession(ids, modo) {
    var list;
    if (ids && ids.length) list = ids.map(getQuestion).filter(Boolean);
    else list = filterQuestions();
    if (list.length === 0) { window.alert('Nenhuma questão disponível para esta sessão.'); return; }
    var idsArr = shuffleArray(list.map(function (q) { return q.id; }));
    questionRunning = { ids: idsArr, index: 0, respostas: {}, revealed: {}, startedAt: new Date().toISOString(), modo: modo || 'livre' };
    navigate('questao-run');
  }
  function commitQuestionAnswer(qid, altId) {
    var q = getQuestion(qid);
    if (!q) return;
    var qs = getQuestionUserState(qid);
    var correta = altId === q.gabarito;
    qs.tentativas += 1;
    if (correta) qs.acertos += 1; else qs.erros += 1;
    qs.ultimaResposta = altId; qs.ultimaCorreta = correta; qs.ultimaTentativa = new Date().toISOString();
    qs.status = correta ? 'acerto' : 'erro';
    qs.historico.push({ data: qs.ultimaTentativa, resposta: altId, correta: correta });
    if (qs.historico.length > 30) qs.historico = qs.historico.slice(-30);
    if (correta) {
      if (qs.intervaloAtual < 0) qs.intervaloAtual = 0;
      else if (qs.intervaloAtual < Q_INTERVALS.length - 1) qs.intervaloAtual += 1;
      qs.proximaRevisao = addDaysIso(Q_INTERVALS[qs.intervaloAtual]);
    } else {
      qs.intervaloAtual = 0;
      qs.proximaRevisao = addDaysIso(Q_INTERVALS[0]);
    }
    AppState.stats.questoesRespondidas += 1;
    if (correta) AppState.stats.acertos += 1; else AppState.stats.erros += 1;
    var st = getModuleUserState(q.moduloId);
    if (st.status === 'nao_iniciado') st.status = 'em_estudo';
    st.ultimaAtividade = new Date().toISOString();
    saveState();
  }
  function answerQuestion(altId) {
    if (!questionRunning) return;
    var qid = questionRunning.ids[questionRunning.index];
    if (Object.prototype.hasOwnProperty.call(questionRunning.respostas, qid)) return;
    questionRunning.respostas[qid] = altId;
    questionRunning.revealed[qid] = true;
    commitQuestionAnswer(qid, altId);
    render();
    renderNavBadges();
  }
  function nextQuestion() { if (questionRunning && questionRunning.index < questionRunning.ids.length - 1) { questionRunning.index += 1; render(); var main = document.getElementById('main'); if (main) main.scrollTop = 0; } }
  function prevQuestion() { if (questionRunning && questionRunning.index > 0) { questionRunning.index -= 1; render(); var main = document.getElementById('main'); if (main) main.scrollTop = 0; } }
  function cancelQuestionSession() {
    var ok = window.confirm('Cancelar a sessão? As respostas já registradas serão mantidas no histórico.');
    if (!ok) return;
    questionRunning = null; navigate('questoes');

  function finishQuestionSession() {
    if (!questionRunning) return;

  function startFlashcardSession(ids, modo) {
    if (!ids || ids.length === 0) { window.alert('Nenhum flashcard para estudar com esses filtros.'); return; }
    flashcardRunning = { ids: shuffleArray(ids), index: 0, respostas: {}, revelado: false, startedAt: new Date().toISOString(), modo: modo || 'livre' };
    navigate('flashcard-run');
  }
  function revealFlashcard() {
    if (!flashcardRunning) return;
    flashcardRunning.revelado = true;
    render();
  }
  function answerFlashcard(level) {
    if (!flashcardRunning) return;
    var fid = flashcardRunning.ids[flashcardRunning.index];
    if (Object.prototype.hasOwnProperty.call(flashcardRunning.respostas, fid)) return;
    flashcardRunning.respostas[fid] = level;
    var fs = getFlashcardUserState(fid);
    fs.ultimaResposta = level;
    fs.ultimaVez = new Date().toISOString();
    if (level === 'sabia') {
      fs.acertos += 1; fs.repeticoes += 1;
      if (fs.intervaloAtual < FC_INTERVALS.length - 1) fs.intervaloAtual += 1;
    } else if (level === 'duvida') {
      fs.duvidas += 1;
    } else {
      fs.erros += 1;
      fs.intervaloAtual = 0;
    }
    fs.proximaRevisao = addDaysIso(FC_INTERVALS[fs.intervaloAtual] || 0);
    fs.historico.push({ data: fs.ultimaVez, resposta: level });
    if (fs.historico.length > 40) fs.historico = fs.historico.slice(-40);
    AppState.stats.flashcardsEstudados += 1;
    var m = getModule(getFlashcard(fid).moduloId);
    if (m) {
      var ms = getModuleUserState(m.id);
      if (ms.status === 'nao_iniciado') ms.status = 'em_estudo';

  function nextFlashcardAuto() {

      flashcardRunning.index += 1;

      render();
      var main = document.getElementById('main');

    } else {
