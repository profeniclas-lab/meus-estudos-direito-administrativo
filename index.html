<!DOCTYPE html>
<!--
Aplicativo: Administração e Direito Administrativo para Concursos
Versão: 0.3
Fase: 3
Status: funcional
Changelog v0.3:
- Novo objeto estatico DIAGNOSTICS com 4 diagnosticos
  (ADM-01, ADM-02, AP-02, DA-02), 5 itens cada
- Novas telas "diagnostico" (execucao) e "diag-resultado" (analise)
- Botao "Fazer diagnostico" no detalhe do modulo
- Botao "Refazer diagnostico" no resultado
- Analise por subtopico com 3 estados: conhecido / duvida / desconhecido
- Recomendacoes por subtopico e dominio estimado gravado no estado
- Card "Diagnosticos feitos" no dashboard
- Compatibilidade total com v0.2 (mesmo schema)
Changelog v0.2:
- 4 aulas de alta prioridade (ADM-01, ADM-02, AP-02, DA-02)
- Tela "licao" com estrutura pedagogica completa
- Modo professor programado
- Marcacao de aula lida
Changelog v0.1:
- Estrutura base, dashboard, modulos, persistencia local, navegacao
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN-DIR v0.3 — Administração e Direito Administrativo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface-alt: #f8fafc;
    --text: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-soft: #dbeafe;
    --success: #16a34a;
    --success-soft: #dcfce7;
    --warning: #d97706;
    --warning-soft: #fef3c7;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --purple: #7c3aed;
    --purple-soft: #f5f3ff;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 6px 20px rgba(15,23,42,.10);
  }

  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    display: grid;
    grid-template-columns: 250px 1fr;
    grid-template-rows: 56px 1fr;
    grid-template-areas:
      "header header"
      "sidebar main";
    min-height: 100vh;
  }

  .app-header {
    grid-area: header;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .menu-toggle {
    display: none;
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    color: var(--text);
  }
  .menu-toggle:hover { background: var(--surface-alt); }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-weight: 700;
    font-size: 15px;
  }
  .brand .brand-sub {
    color: var(--text-muted);
    font-weight: 400;
    font-size: 12px;
  }
  .header-spacer { flex: 1; }
  .version-badge {
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
    letter-spacing: .3px;
  }

  .sidebar {
    grid-area: sidebar;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 14px 10px;
    overflow-y: auto;
  }
  .nav-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--text-muted);
    padding: 14px 12px 6px;
    font-weight: 700;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 2px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
    transition: background .12s ease;
  }
  .nav-item:hover { background: var(--surface-alt); }
  .nav-item.active {
    background: var(--primary-soft);
    color: var(--primary);
    font-weight: 600;
  }
  .nav-item .nav-icon {
    width: 18px;
    text-align: center;
    font-size: 15px;
    flex-shrink: 0;
  }

  .main {
    grid-area: main;
    padding: 26px;
    overflow-y: auto;
    max-width: 1200px;
    width: 100%;
  }

  .page-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; letter-spacing: -.3px; }
  .page-subtitle { color: var(--text-muted); margin-bottom: 22px; font-size: 14px; }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    margin: 26px 0 12px;
    letter-spacing: -.1px;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 12px;
    margin-bottom: 6px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .stat-card .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    font-weight: 600;
  }
  .stat-card .stat-value {
    font-size: 26px;
    font-weight: 700;
    margin-top: 6px;
    letter-spacing: -.5px;
  }
  .stat-card .stat-hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .filter-pill {
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    font-weight: 500;
  }
  .filter-pill:hover { background: var(--surface-alt); }
  .filter-pill.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  .module-list { display: grid; gap: 8px; }
  .module-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: border-color .12s ease, box-shadow .12s ease;
    text-align: left;
    width: 100%;
    font-family: inherit;
    color: inherit;
  }
  .module-card:hover {
    border-color: var(--primary);
    box-shadow: var(--shadow);
  }
  .module-card .mod-id {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    min-width: 62px;
  }
  .module-card .mod-info { flex: 1; min-width: 0; }
  .module-card .mod-title {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .module-card .mod-area {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .module-card .mod-badges {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-shrink: 0;
  }
  .module-card .mod-priority {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .priority-alta { background: #fee2e2; color: #b91c1c; }
  .priority-media { background: #fed7aa; color: #c2410c; }
  .priority-baixa { background: #e2e8f0; color: #475569; }

  .badge-pill {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .badge-aula { background: var(--success-soft); color: var(--success); }
  .badge-diag { background: var(--purple-soft); color: var(--purple); }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    font-weight: 500;
    transition: background .12s ease;
  }
  .btn:hover { background: var(--surface-alt); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-purple { background: var(--purple); color: #fff; border-color: var(--purple); }
  .btn-purple:hover { filter: brightness(.94); }
  .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn-danger:hover { filter: brightness(.94); }
  .btn-ghost { background: transparent; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .notice {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .notice strong { color: var(--text); }

  .info-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 18px;
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .info-row:last-child { border-bottom: none; }
  .info-row .info-key { color: var(--text-muted); }
  .info-row .info-val { font-weight: 600; text-align: right; }

  .subtopic-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .subtopic-chip {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .lesson-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 12px;
  }
  .lesson-block h3 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .lesson-block h3 .lb-icon { font-size: 16px; }
  .lesson-block p { margin-bottom: 10px; font-size: 14.5px; }
  .lesson-block p:last-child { margin-bottom: 0; }
  .lesson-block ul, .lesson-block ol { padding-left: 22px; margin-bottom: 8px; }
  .lesson-block li { margin-bottom: 6px; font-size: 14.5px; }

  .lesson-block.block-objetivo { border-left: 4px solid var(--primary); }
  .lesson-block.block-pegadinha { border-left: 4px solid var(--warning); background: #fffbeb; }
  .lesson-block.block-erros { border-left: 4px solid var(--danger); background: #fef2f2; }
  .lesson-block.block-resumo { border-left: 4px solid var(--success); background: #f0fdf4; }
  .lesson-block.block-aplicacao { border-left: 4px solid var(--purple); background: var(--purple-soft); }

  .compare-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
    font-size: 14px;
  }
  .compare-table th, .compare-table td {
    text-align: left;
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .compare-table th {
    background: var(--surface-alt);
    font-weight: 700;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: .4px;
    color: var(--text-muted);
  }
  .compare-table tr:last-child td { border-bottom: none; }

  .prereq-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .prereq-tag {
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .professor-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .professor-answer {
    margin-top: 14px;
    padding: 14px 16px;
    border-left: 3px solid var(--primary);
    background: var(--surface-alt);
    border-radius: 6px;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .professor-answer strong { display: block; margin-bottom: 6px; color: var(--primary); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }

  .lesson-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .lesson-toolbar .lt-left { display: flex; gap: 8px; flex-wrap: wrap; }
  .lesson-read-indicator {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--success-soft);
    color: var(--success);
  }
  .lesson-read-indicator.pending {
    background: var(--warning-soft);
    color: var(--warning);
  }

  /* ===== Diagnóstico ===== */
  .diag-progress {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .diag-progress-bar {
    flex: 1;
    height: 8px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .diag-progress-fill {
    height: 100%;
    background: var(--purple);
    transition: width .25s ease;
  }
  .diag-progress-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    min-width: 70px;
    text-align: right;
  }
  .diag-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    font-size: 12px;
  }
  .diag-meta .tag {
    background: var(--purple-soft);
    color: var(--purple);
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: .3px;
  }
  .diag-question {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
  }
  .diag-question h2 {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.45;
    margin-bottom: 18px;
    letter-spacing: -.1px;
  }
  .diag-options {
    display: grid;
    gap: 8px;
  }
  .diag-option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    font-size: 14.5px;
    color: var(--text);
    transition: border-color .12s ease, background .12s ease;
    line-height: 1.45;
  }
  .diag-option:hover:not(:disabled) {
    border-color: var(--purple);
    background: var(--purple-soft);
  }
  .diag-option:disabled { cursor: default; }
  .diag-option .opt-letter {
    font-weight: 700;
    min-width: 18px;
    color: var(--text-muted);
  }
  .diag-option.selected {
    border-color: var(--purple);
    background: var(--purple-soft);
  }
  .diag-option.correct {
    border-color: var(--success);
    background: var(--success-soft);
  }
  .diag-option.wrong {
    border-color: var(--danger);
    background: var(--danger-soft);
  }
  .diag-option.correct .opt-letter,
  .diag-option.wrong .opt-letter { color: var(--text); }

  .diag-feedback {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
  }
  .diag-feedback.ok { background: var(--success-soft); border-left: 4px solid var(--success); }
  .diag-feedback.no { background: var(--danger-soft); border-left: 4px solid var(--danger); }
  .diag-feedback strong { display: block; margin-bottom: 6px; }

  .diag-actions {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  /* Autoavaliação */
  .self-assess {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  .self-assess .btn { padding: 12px 20px; font-size: 14.5px; }

  /* Resultado */
  .result-summary {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  .result-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .result-stat .rs-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    font-weight: 600;
  }
  .result-stat .rs-value {
    font-size: 22px;
    font-weight: 700;
    margin-top: 4px;
  }

  .subtopic-result {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 10px;
    border-left-width: 4px;
    border-left-style: solid;
  }
  .subtopic-result.status-conhecido { border-left-color: var(--success); }
  .subtopic-result.status-duvida { border-left-color: var(--warning); }
  .subtopic-result.status-desconhecido { border-left-color: var(--danger); }
  .subtopic-result h3 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .status-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .status-badge.status-conhecido { background: var(--success-soft); color: var(--success); }
  .status-badge.status-duvida { background: var(--warning-soft); color: var(--warning); }
  .status-badge.status-desconhecido { background: var(--danger-soft); color: var(--danger); }
  .subtopic-result .signals {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--text-muted);
    margin: 6px 0 10px;
  }
  .subtopic-result .signals span strong { color: var(--text); }
  .subtopic-result .recommendation {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
  }
  .subtopic-result .recommendation strong { color: var(--text); }

  .app-footer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  @media (max-width: 780px) {
    #app {
      grid-template-columns: 1fr;
      grid-template-areas: "header" "main";
    }
    .sidebar {
      position: fixed;
      top: 56px;
      left: 0;
      bottom: 0;
      width: 250px;
      z-index: 15;
      transform: translateX(-100%);
      transition: transform .2s ease;
      box-shadow: var(--shadow-lg);
    }
    body.sidebar-open .sidebar { transform: translateX(0); }
    .menu-toggle { display: block; }
    .main { padding: 18px; }
    .page-title { font-size: 20px; }
    .compare-table { font-size: 13px; }
    .compare-table th, .compare-table td { padding: 7px 8px; }
    .diag-question { padding: 18px; }
    .diag-question h2 { font-size: 16px; }
  }
</style>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button class="menu-toggle" data-action="toggle-sidebar" aria-label="Abrir menu">☰</button>
      <div class="brand">
        ADMIN-DIR
        <span class="brand-sub">Administração &amp; Direito Administrativo</span>
      </div>
      <div class="header-spacer"></div>
      <span class="version-badge" id="appVersionBadge">v0.3</span>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="nav-section-title">Estudo</div>
      <button class="nav-item" data-nav="dashboard">
        <span class="nav-icon">🏠</span><span>Dashboard</span>
      </button>
      <button class="nav-item" data-nav="modulos">
        <span class="nav-icon">📚</span><span>Módulos</span>
      </button>

      <div class="nav-section-title">Sistema</div>
      <button class="nav-item" data-nav="configuracoes">
        <span class="nav-icon">⚙️</span><span>Configurações</span>
      </button>
      <button class="nav-item" data-nav="sobre">
        <span class="nav-icon">ℹ️</span><span>Sobre</span>
      </button>
    </aside>

    <main class="main" id="main"></main>
  </div>

<script>
(function () {
  'use strict';

  /* ============================================================
     CONSTANTES
  ============================================================ */
  var APP_VERSION = '0.3';                       // <-- alterado
  var SCHEMA_VERSION = 1;                        // inalterado
  var STORAGE_KEY = 'adminDir.state';

  /* ============================================================
     ESTADO
  ============================================================ */
  var AppState = null;
  var currentScreen = 'dashboard';
  var currentModuleId = null;
  var currentLessonId = null;
  var moduleFilter = 'todas';
  var professorAnswerOpen = null;

  // Estado temporário do diagnóstico em execução (NÃO persistido até finalizar)
  var diagRunning = {
    moduleId: null,
    answers: {},          // { itemId: 'A'|'V'|'F'|'sabia'|'nao_sabia' }
    itemIndex: 0,         // item atual
    revealed: {}          // { itemId: true } — item já respondido/feedback exibido
  };

  function createDefaultState() {
    var now = new Date().toISOString();
    return {
      schemaVersion: SCHEMA_VERSION,
      appVersion: APP_VERSION,
      createdAt: now,
      updatedAt: now,
      settings: { theme: 'light' },
      modules: {},
      stats: {
        questoesRespondidas: 0,
        acertos: 0,
        erros: 0,
        flashcardsEstudados: 0,
        simuladosRealizados: 0,
        tempoEstudoMin: 0
      },
      lastScreen: 'dashboard'
    };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return createDefaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return createDefaultState();
      var base = createDefaultState();
      return {
        schemaVersion: SCHEMA_VERSION,
        appVersion: APP_VERSION,
        createdAt: parsed.createdAt || base.createdAt,
        updatedAt: parsed.updatedAt || base.updatedAt,
        settings: Object.assign({}, base.settings, parsed.settings || {}),
        modules: parsed.modules || {},
        stats: Object.assign({}, base.stats, parsed.stats || {}),
        lastScreen: parsed.lastScreen || 'dashboard'
      };
    } catch (e) {
      console.error('[ADMIN-DIR] Falha ao ler estado:', e);
      return createDefaultState();
    }
  }

  function saveState() {
    AppState.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState));
    } catch (e) {
      console.error('[ADMIN-DIR] Falha ao salvar estado:', e);
    }
  }

  function getModuleUserState(modId) {
    if (!AppState.modules[modId]) {
      AppState.modules[modId] = {
        status: 'nao_iniciado',
        aulasLidas: [],
        diagnostico: null,     // <-- NOVO v0.3
        dominioEstimado: 0,
        ultimaAtividade: null
      };
    }
    if (!Array.isArray(AppState.modules[modId].aulasLidas)) {
      AppState.modules[modId].aulasLidas = [];
    }
    if (AppState.modules[modId].diagnostico === undefined) {
      AppState.modules[modId].diagnostico = null;
    }
    return AppState.modules[modId];
  }

  /* ============================================================
     HELPERS
  ============================================================ */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function getModule(modId) {
    for (var i = 0; i < MODULES.length; i++) if (MODULES[i].id === modId) return MODULES[i];
    return null;
  }
  function getLessonByModuleId(modId) { return LESSONS[modId] || null; }
  function getLessonById(lessonId) {
    for (var k in LESSONS) if (LESSONS.hasOwnProperty(k) && LESSONS[k].id === lessonId) return LESSONS[k];
    return null;
  }
  function getDiagnosticByModuleId(modId) { return DIAGNOSTICS[modId] || null; }
  function formatDate(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleString('pt-BR'); } catch (e) { return iso; }
  }
  function isObjective(item) {
    return item.tipo === 'multipla_escolha' || item.tipo === 'verdadeiro_falso' || item.tipo === 'situacao';
  }

  /* ============================================================
     ANÁLISE DO DIAGNÓSTICO
  ============================================================ */
  function computeDiagnosticResult(moduleId, answers) {
    var diag = getDiagnosticByModuleId(moduleId);
    if (!diag) return null;

    var bySubtopic = {};
    var totalPontos = 0;
    var totalSinais = 0;

    for (var i = 0; i < diag.itens.length; i++) {
      var item = diag.itens[i];
      var sub = item.subtopico;
      if (!bySubtopic[sub]) {
        bySubtopic[sub] = { acertos: 0, erros: 0, sabia: 0, nao_sabia: 0, total: 0 };
      }
      var resp = answers[item.id];
      bySubtopic[sub].total += 1;

      if (isObjective(item)) {
        if (resp === item.gabarito) {
          bySubtopic[sub].acertos += 1;
          totalPontos += 1;
        } else {
          bySubtopic[sub].erros += 1;
        }
        totalSinais += 1;
      } else if (item.tipo === 'autoavaliacao') {
        if (resp === 'sabia') {
          bySubtopic[sub].sabia += 1;
          totalPontos += 1;
        } else if (resp === 'nao_sabia') {
          bySubtopic[sub].nao_sabia += 1;
        }
        totalSinais += 1;
      }
    }

    // Classificação por subtópico — cruzando sinais, NÃO apenas percentual.
    var result = { bySubtopic: {} };
    for (var subName in bySubtopic) {
      if (!bySubtopic.hasOwnProperty(subName)) continue;
      var s = bySubtopic[subName];
      var positivos = s.acertos + s.sabia;
      var negativos = s.erros + s.nao_sabia;
      var total = positivos + negativos;

      // Regras explícitas (cross-signals):
      // - Conhecido: sem erros E sem autoavaliação negativa, com pelo menos 1 sinal positivo.
      // - Desconhecido: todos os sinais negativos, ou zero positivos com pelo menos 1 negativo.
      // - Dúvida: sinal misto.
      var status;
      if (s.erros === 0 && s.nao_sabia === 0 && positivos >= 1) {
        status = 'conhecido';
      } else if (positivos === 0 && negativos >= 1) {
        status = 'desconhecido';
      } else {
        status = 'duvida';
      }

      // Recomendações textuais por subtópico
      var rec;
      if (status === 'conhecido') {
        rec = 'Você demonstra bom domínio neste subtópico. Siga para a aula (revisão do conteúdo) e mantenha revisões periódicas.';
      } else if (status === 'duvida') {
        rec = 'Há base, mas o domínio é parcial. Estude a aula com atenção, foque nos exemplos e nas comparações, e refaça este diagnóstico depois de revisar.';
      } else {
        rec = 'Trate este subtópico como prioridade. Estude a aula desde o início, sem pular a explicação simples. Refaça o diagnóstico em seguida para medir evolução.';
      }

      result.bySubtopic[subName] = {
        status: status,
        acertos: s.acertos,
        erros: s.erros,
        sabia: s.sabia,
        nao_sabia: s.nao_sabia,
        total: s.total,
        recommendation: rec
      };
    }

    // Domínio estimado (usado no painel) — proporção de sinais positivos,
    // com peso reduzido quando há muitos sinais negativos.
    var dominio = 0;
    if (totalSinais > 0) {
      dominio = totalPontos / totalSinais;
      if (negativosNoTotal(bySubtopic) > 0) {
        dominio = dominio * 0.9; // leve penalização por erros/desconhecimento
      }
      dominio = Math.max(0, Math.min(1, dominio));
    }
    result.dominioEstimado = Math.round(dominio * 100) / 100;
    result.completedAt = new Date().toISOString();
    return result;
  }

  function negativosNoTotal(bySubtopic) {
    var n = 0;
    for (var k in bySubtopic) if (bySubtopic.hasOwnProperty(k)) {
      n += bySubtopic[k].erros + bySubtopic[k].nao_sabia;
    }
    return n;
  }

  /* ============================================================
     NAVEGAÇÃO
  ============================================================ */
  var VALID_SCREENS = ['dashboard', 'modulos', 'modulo-detalhe', 'licao', 'diagnostico', 'diag-resultado', 'configuracoes', 'sobre'];

  function navigate(screen, opts) {
    opts = opts || {};
    if (VALID_SCREENS.indexOf(screen) === -1) screen = 'dashboard';
    currentScreen = screen;
    if (screen === 'modulo-detalhe') {
      currentModuleId = opts.moduleId || currentModuleId;
    }
    if (screen === 'licao') {
      currentLessonId = opts.lessonId || currentLessonId;
      if (currentLessonId) {
        var lesson = getLessonById(currentLessonId);
        if (lesson) currentModuleId = lesson.moduloId;
      }
    }
    if (screen === 'diagnostico' || screen === 'diag-resultado') {
      if (opts.moduleId) currentModuleId = opts.moduleId;
    }
    AppState.lastScreen = screen;
    saveState();
    document.body.classList.remove('sidebar-open');
    professorAnswerOpen = null;
    render();
    var main = document.getElementById('main');
    if (main) main.scrollTop = 0;
  }

  /* ============================================================
     RENDER
  ============================================================ */
  function render() {
    renderSidebarActive();
    renderMain();
    var badge = document.getElementById('appVersionBadge');
    if (badge) badge.textContent = 'v' + APP_VERSION;
  }

  function renderSidebarActive() {
    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      var target = items[i].getAttribute('data-nav');
      var active = (target === currentScreen) ||
                   (currentScreen === 'modulo-detalhe' && target === 'modulos') ||
                   (currentScreen === 'licao' && target === 'modulos') ||
                   (currentScreen === 'diagnostico' && target === 'modulos') ||
                   (currentScreen === 'diag-resultado' && target === 'modulos');
      items[i].classList.toggle('active', active);
    }
  }

  function renderMain() {
    var main = document.getElementById('main');
    if (!main) return;
    var html = '';
    switch (currentScreen) {
      case 'dashboard':      html = renderDashboard(); break;
      case 'modulos':        html = renderModules(); break;
      case 'modulo-detalhe': html = renderModuleDetail(); break;
      case 'licao':          html = renderLesson(); break;
      case 'diagnostico':    html = renderDiagnosticRunning(); break;
      case 'diag-resultado': html = renderDiagnosticResult(); break;
      case 'configuracoes':  html = renderSettings(); break;
      case 'sobre':          html = renderAbout(); break;
      default:               html = renderDashboard();
    }
    main.innerHTML = html;
  }

  /* -------- Dashboard -------- */
  function renderDashboard() {
    var stats = AppState.stats;
    var taxa = stats.questoesRespondidas > 0
      ? Math.round((stats.acertos / stats.questoesRespondidas) * 100) : 0;

    var totalModulos = MODULES.length;
    var emEstudo = 0, concluidos = 0;
    for (var i = 0; i < MODULES.length; i++) {
      var st = getModuleUserState(MODULES[i].id);
      if (st.status === 'em_estudo') emEstudo++;
      if (st.status === 'concluido') concluidos++;
    }

    // Conta diagnósticos concluídos
    var diagFeitos = 0;
    for (var d = 0; d < MODULES.length; d++) {
      var dst = AppState.modules[MODULES[d].id];
      if (dst && dst.diagnostico) diagFeitos++;
    }
    var diagDisponiveis = Object.keys(DIAGNOSTICS).length;

    // Sugestões — prioriza diagnósticos ainda não feitos e alta prioridade
    var sugestoes = [];
    for (var j = 0; j < MODULES.length && sugestoes.length < 3; j++) {
      var m = MODULES[j];
      if (m.prioridade !== 'alta') continue;
      if (!getDiagnosticByModuleId(m.id) && !getLessonByModuleId(m.id)) continue;
      var ms = getModuleUserState(m.id);
      if (ms.status === 'concluido') continue;
      sugestoes.push(m);
    }

    var html = '';
    html += '<h1 class="page-title">Dashboard</h1>';
    html += '<p class="page-subtitle">Visão geral do seu progresso. Dados salvos localmente no navegador.</p>';

    html += '<div class="cards-grid">';
    html += statCard('Módulos em estudo', emEstudo + ' / ' + totalModulos, concluidos + ' concluído(s)');
    html += statCard('Aulas disponíveis', Object.keys(LESSONS).length, 'Fase 2 — ' + MODULES.length + ' módulos catalogados');
    html += statCard('Diagnósticos feitos', diagFeitos + ' / ' + diagDisponiveis, 'Fase 3 — análise por subtópico');
    html += statCard('Questões respondidas', stats.questoesRespondidas, 'Disponível nas próximas fases');
    html += '</div>';

    html += '<h2 class="section-title">O que estudar hoje?</h2>';
    if (sugestoes.length === 0) {
      html += '<div class="notice"><strong>Sem sugestões ainda.</strong> Nenhum conteúdo cadastrado.</div>';
    } else {
      html += '<div class="module-list">';
      for (var s = 0; s < sugestoes.length; s++) html += moduleCardHtml(sugestoes[s]);
      html += '</div>';
    }

    html += '<h2 class="section-title">Aviso desta versão</h2>';
    html += '<div class="notice">' +
            '<strong>Fase 3 — Diagnóstico (parcial).</strong> ' +
            'Foram adicionados diagnósticos para os 4 módulos que já possuem aula ' +
            '(ADM-01, ADM-02, AP-02, DA-02), com 5 itens cada. ' +
            'A análise cruza acertos, erros e autoavaliação por subtópico e ' +
            'NÃO conclui domínio apenas por percentual. ' +
            'Novos diagnósticos e o banco de questões virão nas próximas fases.' +
            '</div>';

    html += footerHtml();
    return html;
  }

  function statCard(label, value, hint) {
    return '<div class="stat-card">' +
      '<div class="stat-label">' + esc(label) + '</div>' +
      '<div class="stat-value">' + esc(value) + '</div>' +
      (hint ? '<div class="stat-hint">' + esc(hint) + '</div>' : '') +
    '</div>';
  }

  /* -------- Módulos -------- */
  function renderModules() {
    var areas = ['todas', 'ADM', 'AP', 'DA'];
    var pills = '';
    for (var i = 0; i < areas.length; i++) {
      var a = areas[i];
      var label = a === 'todas' ? 'Todos' : AREA_LABELS[a];
      var active = (moduleFilter === a) ? ' active' : '';
      pills += '<button class="filter-pill' + active + '" data-filter="' + a + '">' + esc(label) + '</button>';
    }

    var filtered = MODULES.filter(function (m) {
      return moduleFilter === 'todas' || m.area === moduleFilter;
    });

    var html = '';
    html += '<h1 class="page-title">Módulos</h1>';
    html += '<p class="page-subtitle">' + filtered.length + ' módulo(s) listado(s). IDs permanentes — o histórico do usuário é preservado mesmo quando o texto muda.</p>';
    html += '<div class="filters">' + pills + '</div>';

    if (filtered.length === 0) {
      html += '<div class="notice">Nenhum módulo nesta área.</div>';
    } else {
      html += '<div class="module-list">';
      for (var j = 0; j < filtered.length; j++) html += moduleCardHtml(filtered[j]);
      html += '</div>';
    }

    html += footerHtml();
    return html;
  }

  function moduleCardHtml(m) {
    var areaLabel = AREA_LABELS[m.area] || m.area;
    var pLabel = PRIORITY_LABELS[m.prioridade] || m.prioridade;
    var hasLesson = !!getLessonByModuleId(m.id);
    var hasDiag = !!getDiagnosticByModuleId(m.id);
    var badges = '';
    if (hasLesson) badges += '<span class="badge-pill badge-aula">Aula</span>';
    if (hasDiag) badges += '<span class="badge-pill badge-diag">Diagnóstico</span>';
    return '<button class="module-card" data-action="open-module" data-module-id="' + esc(m.id) + '">' +
      '<span class="mod-id">' + esc(m.id) + '</span>' +
      '<span class="mod-info">' +
        '<span class="mod-title">' + esc(m.titulo) + '</span>' +
        '<span class="mod-area">' + esc(areaLabel) + '</span>' +
      '</span>' +
      '<span class="mod-badges">' +
        badges +
        '<span class="mod-priority priority-' + esc(m.prioridade) + '">' + esc(pLabel) + '</span>' +
      '</span>' +
    '</button>';
  }

      if (diagDone) {

    } else {
      html += '<div class="notice"><strong>Diagnóstico ainda não cadastrado.</strong> ' +
              'Será adicionado para os módulos que já possuem aula (v0.3) e, nas próximas fases, para os demais.</div>';
    }

    html += footerHtml();
    return html;
  }

  function summarizeResult(result) {
    var c = 0, d = 0, x = 0;
    var bs = result.bySubtopic || {};
    for (var k in bs) {
      if (!bs.hasOwnProperty(k)) continue;
      if (bs[k].status === 'conhecido') c++;
      else if (bs[k].status === 'duvida') d++;
      else if (bs[k].status === 'desconhecido') x++;
    }
    return { conhecido: c, duvida: d, desconhecido: x };
  }

  function infoRow(key, value) {
    return '<div class="info-row">' +
      '<span class="info-key">' + esc(key) + '</span>' +
      '<span class="info-val">' + esc(value) + '</span>' +
    '</div>';
  }
  function statusLabel(s) {
    var map = { 'nao_iniciado': 'Não iniciado', 'em_estudo': 'Em estudo', 'concluido': 'Concluído' };
    return map[s] || s || 'Não iniciado';
  }

  function renderProfessorBlock(lesson) {

      { key: 'outroExemplo',        label: 'Mostre outro exemplo' },

      { key: 'mostrarPegadinha',    label: 'Mostre uma pegadinha' },
      { key: 'comoApareceEmConcurso', label: 'Como aparece em concurso' },
      { key: 'fazerPergunta',       label: 'Faça uma pergunta sobre isso' }
    ];
    var html = '';

    html += '<h3><span class="lb-icon">🧑‍🏫</span> Modo professor (conteúdo programado)</h3>';

    html += '<div class="professor-actions">';
    for (var i = 0; i < actions.length; i++) {
      var a = actions[i];

      html += '<button class="btn btn-ghost" data-action="professor-answer" data-lesson-id="' + esc(lesson.id) + '" data-key="' + esc(a.key) + '"' + (disabled ? ' disabled' : '') + '>' + esc(a.label) + '</button>';
    }

      var key = professorAnswerOpen.key;
      var content = '';
      if (key === 'fazerPergunta' && mp.fazerPergunta) {
        content = 'Pergunta: ' + mp.fazerPergunta.pergunta + '\n\nResposta: ' + mp.fazerPergunta.resposta;
      } else {
        content = mp[key] || '';
      }
      html += '<div class="professor-answer"><strong>Resposta programada</strong>' + esc(content) + '</div>';
    }
    html += '</div>';
    return html;

  /* -------- Diagnóstico em execução (NOVO v0.3) -------- */
  function renderDiagnosticRunning() {
    var moduleId = diagRunning.moduleId;
    var diag = getDiagnosticByModuleId(moduleId);
    if (!diag) {
      return '<h1 class="page-title">Diagnóstico não encontrado</h1>' +
             '<button class="btn" data-nav="modulos">← Voltar aos módulos</button>';
    }
    var m = getModule(moduleId);
    var idx = diagRunning.itemIndex;
    var total = diag.itens.length;
    if (idx < 0) idx = 0;
    if (idx >= total) idx = total - 1;
    var item = diag.itens[idx];
    var answered = Object.prototype.hasOwnProperty.call(diagRunning.answers, item.id);
    var userAnswer = diagRunning.answers[item.id];
    var percent = Math.round(((idx) / total) * 100);

    var html = '';

    // Barra de progresso
    html += '<div class="diag-progress">';
    html += '<div class="diag-progress-bar"><div class="diag-progress-fill" style="width:' + percent + '%"></div></div>';
    html += '<div class="diag-progress-label">Item ' + (idx + 1) + ' / ' + total + '</div>';
    html += '</div>';

    // Cabeçalho
    html += '<h1 class="page-title">Diagnóstico — ' + esc(m ? m.titulo : moduleId) + '</h1>';
    html += '<p class="page-subtitle">Módulo ' + esc(moduleId) + ' · ' + esc(DIAG_TYPE_LABELS[item.tipo] || item.tipo) + '</p>';

    html += '<div class="diag-meta">';
    html += '<span class="tag">Subtópico: ' + esc(item.subtopico) + '</span>';
    html += '<span class="tag">' + esc(DIAG_TYPE_LABELS[item.tipo] || item.tipo) + '</span>';
    html += '</div>';

    // Pergunta
    html += '<div class="diag-question">';
    html += '<h2>' + esc(item.pergunta) + '</h2>';

    if (isObjective(item)) {
      html += '<div class="diag-options">';
      for (var a = 0; a < item.alternativas.length; a++) {
        var alt = item.alternativas[a];
        var cls = 'diag-option';
        if (answered) {
          if (alt.id === item.gabarito) cls += ' correct';
          else if (alt.id === userAnswer) cls += ' wrong';
        } else if (alt.id === userAnswer) {
          cls += ' selected';
        }
        html += '<button class="' + cls + '" data-action="diag-answer" data-alt="' + esc(alt.id) + '"' + (answered ? ' disabled' : '') + '>' +
                  '<span class="opt-letter">' + esc(alt.id) + '</span>' +
                  '<span>' + esc(alt.texto) + '</span>' +
                '</button>';
      }
      html += '</div>';

      if (answered) {
        var acertou = userAnswer === item.gabarito;
        html += '<div class="diag-feedback ' + (acertou ? 'ok' : 'no') + '">';
        html += '<strong>' + (acertou ? '✓ Correto' : '✗ Incorreto') + '</strong>';
        html += esc(item.explicacao);
        html += '</div>';
      }
    } else if (item.tipo === 'autoavaliacao') {
      html += '<p style="color:var(--text-muted);font-size:14px;margin-bottom:8px;">Marque com sinceridade — o sistema usa essa informação para ajustar as próximas recomendações.</p>';
      if (answered) {
        html += '<div class="diag-feedback ' + (userAnswer === 'sabia' ? 'ok' : 'no') + '">';
        html += '<strong>' + (userAnswer === 'sabia' ? 'Você marcou: Eu sabia' : 'Você marcou: Eu não sabia') + '</strong>';
        html += 'Gabarito conceitual: ' + esc(item.resposta);
        html += '</div>';
      } else {
        html += '<div class="self-assess">';
        html += '<button class="btn btn-primary" data-action="diag-answer" data-alt="sabia">Eu sabia</button>';
        html += '<button class="btn" data-action="diag-answer" data-alt="nao_sabia">Eu não sabia</button>';
        html += '</div>';
      }
    }

    // Navegação
    html += '<div class="diag-actions">';
    html += '<div>';
    if (idx > 0) {
      html += '<button class="btn" data-action="diag-prev">← Item anterior</button>';
    } else {
      html += '<button class="btn" data-action="diag-cancel">Cancelar</button>';
    }
    html += '</div>';
    html += '<div>';
    if (answered && idx < total - 1) {
      html += '<button class="btn btn-primary" data-action="diag-next">Próximo →</button>';
    } else if (answered && idx === total - 1) {
      html += '<button class="btn btn-purple" data-action="diag-finish">Finalizar diagnóstico →</button>';
    }
    html += '</div>';
    html += '</div>';

    html += '</div>';

    html += footerHtml();
    return html;
  }

  /* -------- Resultado do diagnóstico (NOVO v0.3) -------- */
  function renderDiagnosticResult() {
    var moduleId = currentModuleId;
    var m = getModule(moduleId);
    if (!m) {
      return '<h1 class="page-title">Módulo não encontrado</h1>' +
             '<button class="btn" data-nav="modulos">← Voltar aos módulos</button>';
    }
    var st = getModuleUserState(moduleId);
    if (!st.diagnostico || !st.diagnostico.result) {
      return '<h1 class="page-title">Nenhum diagnóstico registrado</h1>' +
             '<p class="page-subtitle">Faça o diagnóstico deste módulo antes de ver o resultado.</p>' +
             '<button class="btn btn-primary" data-action="start-diag" data-module-id="' + esc(moduleId) + '">Fazer diagnóstico</button>';
    }
    var r = st.diagnostico.result;
    var bs = r.bySubtopic || {};
    var subtopicos = [];
    for (var k in bs) if (bs.hasOwnProperty(k)) subtopicos.push(k);
    // Ordena para exibir subtópicos desconhecidos primeiro
    subtopicos.sort(function (a, b) {
      var order = { 'desconhecido': 0, 'duvida': 1, 'conhecido': 2 };
      return (order[bs[a].status] || 9) - (order[bs[b].status] || 9);
    });

    var resumo = summarizeResult(r);
    var totalSub = subtopicos.length;

    var html = '';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;">';
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;">';
    html += '<button class="btn" data-action="open-module" data-module-id="' + esc(moduleId) + '">← Módulo ' + esc(moduleId) + '</button>';
    html += '<button class="btn" data-nav="modulos">📚 Módulos</button>';
    html += '</div>';
    html += '<div><button class="btn btn-purple" data-action="refazer-diag" data-module-id="' + esc(moduleId) + '">Refazer diagnóstico</button></div>';
    html += '</div>';

    html += '<h1 class="page-title">Resultado do diagnóstico</h1>';
    html += '<p class="page-subtitle">' + esc(m.id) + ' — ' + esc(m.titulo) + ' · Concluído em ' + esc(formatDate(r.completedAt)) + '</p>';

    html += '<div class="result-summary">';
    html += resultStat('Subtópicos avaliados', totalSub);
    html += resultStat('Conhecidos', resumo.conhecido);
    html += resultStat('Em dúvida', resumo.duvida);
    html += resultStat('Desconhecidos', resumo.desconhecido);
    html += resultStat('Domínio estimado', Math.round((r.dominioEstimado || 0) * 100) + '%');
    html += '</div>';

    html += '<h2 class="section-title">Análise por subtópico</h2>';
    html += '<p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">' +
            'O status de cada subtópico é calculado cruzando acertos, erros e autoavaliação. ' +
            'Não é apenas percentual: um subtópico só é marcado como <strong>conhecido</strong> ' +
            'quando não há erros nem autoavaliação negativa.' +
            '</p>';

    for (var i = 0; i < subtopicos.length; i++) {
      var sub = subtopicos[i];
      var d = bs[sub];
      html += '<div class="subtopic-result status-' + esc(d.status) + '">';
      html += '<h3>' + esc(sub) + '<span class="status-badge status-' + esc(d.status) + '">' + esc(STATUS_LABELS[d.status]) + '</span></h3>';
      html += '<div class="signals">';
      html += '<span>Acertos: <strong>' + d.acertos + '</strong></span>';
      html += '<span>Erros: <strong>' + d.erros + '</strong></span>';
      if (d.sabia > 0 || d.nao_sabia > 0) {
        html += '<span>Autoavaliação — sabia: <strong>' + d.sabia + '</strong> / não sabia: <strong>' + d.nao_sabia + '</strong></span>';
      }
      html += '</div>';
      html += '<div class="recommendation">' + esc(d.recommendation) + '</div>';
      html += '</div>';
    }

    // Recomendações gerais
    html += '<h2 class="section-title">Próximos passos</h2>';
    html += '<div class="notice">';
    if (resumo.desconhecido > 0) {
      html += '<strong>Prioridade alta.</strong> Você tem ' + resumo.desconhecido + ' subtópico(s) classificado(s) como desconhecido(s). Estude a aula desde o início e refaça o diagnóstico depois.';
    } else if (resumo.duvida > 0) {
      html += '<strong>Reforço recomendado.</strong> Você tem ' + resumo.duvida + ' subtópico(s) em dúvida. Releia a aula com atenção nos exemplos e comparações, depois refaça este diagnóstico.';
    } else {
      html += '<strong>Bom desempenho.</strong> Todos os subtópicos avaliados foram classificados como conhecidos. Siga para a aula (consolidação) e mantenha revisões periódicas.';
    }
    html += '</div>';

    html += '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">';
    var lesson = getLessonByModuleId(moduleId);
    if (lesson) {
      html += '<button class="btn btn-primary" data-action="open-lesson" data-lesson-id="' + esc(lesson.id) + '">Estudar aula →</button>';
    }
    html += '<button class="btn" data-action="start-diag" data-module-id="' + esc(moduleId) + '">Refazer agora</button>';
    html += '</div>';

    html += footerHtml();
    return html;
  }

  function resultStat(label, value) {
    return '<div class="result-stat">' +
      '<div class="rs-label">' + esc(label) + '</div>' +
      '<div class="rs-value">' + esc(value) + '</div>' +
    '</div>';
  }

  /* ============================================================
     AÇÕES
  ============================================================ */
  function openModule(modId) {
    if (!getModule(modId)) return;
    var st = getModuleUserState(modId);
    if (st.status === 'nao_iniciado') st.status = 'em_estudo';
    st.ultimaAtividade = new Date().toISOString();
    saveState();
    navigate('modulo-detalhe', { moduleId: modId });
  }
  function openLesson(lessonId) {
    var lesson = getLessonById(lessonId);
    if (!lesson) return;
    var st = getModuleUserState(lesson.moduloId);
    if (st.status === 'nao_iniciado') st.status = 'em_estudo';
    st.ultimaAtividade = new Date().toISOString();
    saveState();
    navigate('licao', { lessonId: lessonId });
  }
  function markLessonRead(lessonId) {
    var lesson = getLessonById(lessonId);
    if (!lesson) return;
    var st = getModuleUserState(lesson.moduloId);
    if (!Array.isArray(st.aulasLidas)) st.aulasLidas = [];
    if (st.aulasLidas.indexOf(lesson.id) === -1) st.aulasLidas.push(lesson.id);
    st.ultimaAtividade = new Date().toISOString();
    if (st.status === 'nao_iniciado') st.status = 'em_estudo';
    saveState();
    render();
  }
  function setModuleFilter(f) {
    if (['todas', 'ADM', 'AP', 'DA'].indexOf(f) === -1) return;
    moduleFilter = f;
    render();
  }
  function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }
  function showProfessorAnswer(lessonId, key) {
    if (professorAnswerOpen && professorAnswerOpen.lessonId === lessonId && professorAnswerOpen.key === key) {
      professorAnswerOpen = null;
    } else {
      professorAnswerOpen = { lessonId: lessonId, key: key };
    }
    render();
    var el = document.querySelector('.professor-answer');
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  /* ----- Diagnóstico ----- */
  function startDiagnostic(modId) {
    var diag = getDiagnosticByModuleId(modId);
    if (!diag) return;
    diagRunning.moduleId = modId;
    diagRunning.answers = {};
    diagRunning.itemIndex = 0;
    diagRunning.revealed = {};
    navigate('diagnostico', { moduleId: modId });
  }

  function answerDiag(altId) {
    var diag = getDiagnosticByModuleId(diagRunning.moduleId);
    if (!diag) return;
    var item = diag.itens[diagRunning.itemIndex];
    if (!item) return;
    if (Object.prototype.hasOwnProperty.call(diagRunning.answers, item.id)) return; // já respondido
    diagRunning.answers[item.id] = altId;
    render();
  }

  function nextDiag() {
    var diag = getDiagnosticByModuleId(diagRunning.moduleId);
    if (!diag) return;
    if (diagRunning.itemIndex < diag.itens.length - 1) {
      diagRunning.itemIndex += 1;
      render();
      var main = document.getElementById('main');
      if (main) main.scrollTop = 0;
    }
  }
  function prevDiag() {
    if (diagRunning.itemIndex > 0) {
      diagRunning.itemIndex -= 1;
      render();
      var main = document.getElementById('main');
      if (main) main.scrollTop = 0;
    }
  }
  function cancelDiag() {
    var ok = window.confirm('Cancelar o diagnóstico em andamento? As respostas não serão salvas.');
    if (!ok) return;
    diagRunning.moduleId = null;
    diagRunning.answers = {};
    diagRunning.itemIndex = 0;
    navigate('modulos');
  }
  function finishDiag() {
    var moduleId = diagRunning.moduleId;
    var diag = getDiagnosticByModuleId(moduleId);
    if (!diag) return;
    // Confere se todos os itens foram respondidos
    for (var i = 0; i < diag.itens.length; i++) {
      if (!Object.prototype.hasOwnProperty.call(diagRunning.answers, diag.itens[i].id)) {
        window.alert('Existem itens não respondidos. Volte e complete o diagnóstico.');
        diagRunning.itemIndex = i;
        render();
        return;
      }
    }

    var result = computeDiagnosticResult(moduleId, diagRunning.answers);

    // Persiste
    var st = getModuleUserState(moduleId);
    st.diagnostico = {
      diagId: diag.id,
      answers: Object.assign({}, diagRunning.answers),
      result: result,
      completedAt: result.completedAt,
      tentativas: (st.diagnostico && st.diagnostico.tentativas ? st.diagnostico.tentativas : 0) + 1
    };
    st.dominioEstimado = result.dominioEstimado;
    st.ultimaAtividade = new Date().toISOString();
    if (st.status === 'nao_iniciado') st.status = 'em_estudo';
    saveState();

    // Limpa estado temporário
    diagRunning.moduleId = null;
    diagRunning.answers = {};
    diagRunning.itemIndex = 0;

    navigate('diag-resultado', { moduleId: moduleId });
  }
  function openDiagResult(modId) {
    if (!getModuleUserState(modId).diagnostico) return;
    navigate('diag-resultado', { moduleId: modId });
  }
  function refazerDiag(modId) {
    var ok = window.confirm('Refazer o diagnóstico deste módulo? O resultado anterior será substituído pelo novo.');
    if (!ok) return;
    startDiagnostic(modId);
  }

  function resetProgress() {
    var ok = window.confirm(
      'Zerar todo o progresso?\n\n' +
      'Esta ação apaga módulos, diagnóstico, estatísticas e histórico salvos localmente. ' +
      'Não é possível desfazer.'
    );
    if (!ok) return;
    localStorage.removeItem(STORAGE_KEY);
    AppState = createDefaultState();
    saveState();
    currentScreen = 'dashboard';
    currentModuleId = null;
    currentLessonId = null;
    moduleFilter = 'todas';
    professorAnswerOpen = null;
    diagRunning = { moduleId: null, answers: {}, itemIndex: 0, revealed: {} };
    render();
    window.alert('Progresso zerado.');
  }

  /* ============================================================
     EVENTOS — delegação única
  ============================================================ */
  document.addEventListener('click', function (e) {
    var navEl = e.target.closest('[data-nav]');
    if (navEl) { e.preventDefault(); navigate(navEl.getAttribute('data-nav')); return; }

    var filterEl = e.target.closest('[data-filter]');
    if (filterEl) { e.preventDefault(); setModuleFilter(filterEl.getAttribute('data-filter')); return; }

    var actionEl = e.target.closest('[data-action]');
    if (!actionEl) return;
    var action = actionEl.getAttribute('data-action');
    e.preventDefault();

    switch (action) {
      case 'toggle-sidebar': toggleSidebar(); break;
      case 'open-module': openModule(actionEl.getAttribute('data-module-id')); break;
      case 'open-lesson': openLesson(actionEl.getAttribute('data-lesson-id')); break;
      case 'mark-lesson-read': markLessonRead(actionEl.getAttribute('data-lesson-id')); break;
      case 'professor-answer':
        showProfessorAnswer(actionEl.getAttribute('data-lesson-id'), actionEl.getAttribute('data-key'));
        break;
      case 'start-diag': startDiagnostic(actionEl.getAttribute('data-module-id')); break;
      case 'open-diag-result': openDiagResult(actionEl.getAttribute('data-module-id')); break;
      case 'refazer-diag': refazerDiag(actionEl.getAttribute('data-module-id')); break;
      case 'diag-answer': answerDiag(actionEl.getAttribute('data-alt')); break;
      case 'diag-next': nextDiag(); break;
      case 'diag-prev': prevDiag(); break;
      case 'diag-cancel': cancelDiag(); break;
      case 'diag-finish': finishDiag(); break;
      case 'reset-progress': resetProgress(); break;
    }
  });

  /* ============================================================
     INICIALIZAÇÃO
  ============================================================ */
  function init() {
    AppState = loadState();
    currentScreen = 'dashboard';
    currentModuleId = null;
    currentLessonId = null;
    moduleFilter = 'todas';
    professorAnswerOpen = null;
    diagRunning = { moduleId: null, answers: {}, itemIndex: 0, revealed: {} };
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
