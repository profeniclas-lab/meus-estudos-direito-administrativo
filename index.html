    'ADM-02': { id: 'L-ADM-02', moduloId: 'ADM-02', objetivo: 'Dominar o ciclo PODC.', prerequisitos: ['ADM-01'], introducao: 'PODC é a espinha dorsal da Administração. Todo concurso cobra esse ciclo.', explicacaoSimples: 'Imagine uma festa: decide tema (planejamento), organiza quem traz o quê (organização), coordena as pessoas (direção), vê se deu certo (controle).', explicacaoTecnica: 'Ciclo com quatro funções: Planejamento, Organização, Direção e Controle. Funções interdependentes e cíclicas.', exemplos: ['Planejar: definir redução de evasão.','Organizar: dividir meta entre escolas.','Dirigir: reunir diretores e motivar.','Controlar: comparar números e ajustar.'], comparacoes: [{ termoA: 'Planejamento', termoB: 'Controle', diferenca: 'Planejamento define o que fazer. Controle verifica se está sendo cumprido.' }, { termoA: 'Organização', termoB: 'Direção', diferenca: 'Organização é estrutural. Direção é comportamental.' }, { termoA: 'PODC (Fayol)', termoB: 'PDCA (Deming)', diferenca: 'PODC é o ciclo administrativo. PDCA é ferramenta da qualidade.' }], aplicacaoAdministracaoPublica: 'PPA (planejamento), LDO/LOA (tradução em metas), estrutura de ministérios (organização), gestores junto às equipes (direção), controle interno e externo.', pegadinhas: ['Bancas trocam "direção" por "coordenação".','Confundir PODC com PDCA.','Ordem: começa pelo PLANEJAMENTO.'], errosComuns: ['Achar que direção é o mesmo que controle.'], resumo: ['PODC = Planejamento + Organização + Direção + Controle.','O ciclo é contínuo e interdependente.'], modoProfessor: { explicarMaisSimples: 'PODC é o passo a passo: pensar (P), arrumar (O), conduzir (D), conferir (C).', outroExemplo: 'Em uma licitação: planeja a contratação, organiza o processo, conduz a sessão, fiscaliza o contrato.', compararConceitos: 'Planejar = decidir o futuro. Organizar = estruturar. Dirigir = conduzir. Controlar = verificar.', mostrarPegadinha: '"A função de controle é a primeira do processo administrativo". ERRADO.', como     'AP-02': { id: 'L-AP-02', moduloId: 'AP-02', objetivo: 'Diferenciar os três modelos históricos de Administração Pública.', prerequisitos: ['AP-01'], introducao: 'A Administração Pública brasileira passou por três modelos predominantes.', explicacaoSimples: 'Patrimonialismo (confusão público/privado), burocracia (regras, concursos), gerencial (metas, resultados, cidadão).', explicacaoTecnica: 'Patrimonialismo: confusão público/privado, nepotismo. Burocrático: Weber; impessoalidade, meritocracia; Brasil 1936-1938 (Vargas). Gerencial: Nova Gestão Pública; resultados; Brasil 1995 (Bresser-Pereira/FHC).', exemplos: ['Nomear parentes sem concurso: patrimonialista.','Exigir concurso: burocrático.','Contrato de gestão: gerencial.'], comparacoes: [{ termoA: 'Patrimonialismo', termoB: 'Burocracia', diferenca: 'Patrimonialismo: confusão. Burocracia: separação com regras rígidas.' }, { termoA: 'Burocracia', termoB: 'Gerencial', diferenca: 'Burocracia: foco em processo. Gerencial: foco em resultado.' }, { termoA: 'Gerencial', termoB: 'NGP', diferenca: 'NGP é corrente internacional; gerencial é aplicação no Brasil (anos 1990).' }], aplicacaoAdministracaoPublica: 'O Brasil convive com traços dos três modelos. EC 19/1998 introduziu princípios como eficiência.', pegadinhas: ['"Burocracia é sinônimo de Administração Pública" — errado.','Trocar autores: Weber vs Bresser-Pereira.','"Reforma gerencial iniciada no governo Vargas" — errado.'], errosComuns: ['Chamar a EC 19/1998 de "Reforma Burocrática".'], resumo: ['Patrimonialista: confusão público/privado.','Burocrático: Weber; Brasil 1936-1938.','Gerencial: resultados; Brasil 1995.'], modoProfessor: { explicarMaisSimples: 'Evolução de uma casa: mistura (patrimonial), muros e regras (burocrática), eficiência (gerencial).', outroExemplo: 'Uma licitação: obrigatoriedade (burocrática), regras da Lei 14.133 (gerencial).', compararConceitos: 'Quem o Estado serve? Soberano (patrimonial), norma (burocrático), cidadão (gerencial).', mostrar oalidade = tratamento. Moralidade = ética. Publicidade = transparência. Eficiência = resultado.', mostrarPegadinha: '"O princípio da eficiência foi inserido pela EC 45/2004". ERRADO.', comoApareceEmConcurso: 'Praticamente toda prova de DA cobra LIMPE.', fazerPergunta: { pergunta: 'Prefeito publica outdoor com sua foto em obra pública. Fere qual princípio?', resposta: 'IMPESSOALIDADE (art. 37, §1º) e MORALIDADE.' } } }

      aplicacaoAdministracaoPublica: 'Na Administração Pública o planejamento é obrigatório por lei. O PPA (Plano Plurianual) é o planejamento estratégico de 4 anos; a LDO (Lei de Diretrizes Orçamentárias) é o planejamento tático anual; a LOA (Lei Orçamentária Anual) é o planejamento operacional. O art. 174 da CF/88 traz o planejamento como determinante para o setor público. A Lei de Responsabilidade Fiscal (LC 101/2000) exige planejamento fiscal em todos os entes.',
      pegadinhas: [
        'Inverter estratégico com operacional. Bancas adoram dizer que "o planejamento operacional define missão e visão" — está errado. Missão e visão são do ESTRATÉGICO.',
        'Achar que objetivo e meta são sinônimos. Objetivo é amplo; meta é quantificada.',
        'Dizer que o planejamento é exclusivo do setor privado. Na Administração Pública é obrigatório (PPA, LDO, LOA).',
        'Confundir SWOT com PDCA. SWOT é ferramenta de análise do planejamento estratégico; PDCA é ciclo de melhoria contínua da qualidade.'
      ],
      errosComuns: [
        'Decorar os três níveis sem saber identificar em exemplos práticos.',
        'Confundir planejamento com execução (executar é a fase seguinte).',
        'Ignorar que no serviço público o planejamento decorre de lei, não é opcional.'
      ],
      resumo: [
        'Planejamento é a primeira função administrativa: define o que, como, quando e com quais recursos.',
        'Três níveis: estratégico (longo prazo, alta direção), tático (médio prazo, gerência) e operacional (curto prazo, execução).',
        'Objetivo é qualitativo; meta é quantificada, com prazo e valor.',
        'Ferramentas: análise SWOT, objetivos SMART, planos, programas e projetos.',
        'Na Administração Pública: PPA (estratégico), LDO (tático), LOA (operacional).'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Planejar é decidir antes de agir. Pense num jogo de futebol: o técnico define a meta (vencer o campeonato), o esquema de jogo (estratégia) e o que cada jogador faz em campo (execução). Sem plano, é chute pra todo lado.',
        outroExemplo: 'Um hospital público precisa reduzir filas. Planejamento estratégico: definir a meta geral para 3 anos. Tático: distribuir metas entre setores. Operacional: escalas, plantões e ações diárias. Controle: medir o tempo de espera e ajustar.',
        compararConceitos: 'Previsão estima o futuro. Planejamento decide o que fazer nele. Estratégico olha longe. Tático olha o meio. Operacional olha o chão. Objetivo é o norte. Meta é o marco com régua.',
        mostrarPegadinha: 'Cuidado: "O planejamento operacional define a missão da organização". ERRADO. Missão é do nível ESTRATÉGICO. Outra pegadinha: "planejamento é facultativo na Administração Pública" — é OBRIGATÓRIO (PPA, LDO, LOA).',
        comoApareceEmConcurso: 'Cai em duas formas: (1) correspondência entre exemplo e nível de planejamento; (2) diferença entre objetivo e meta. Também aparece em prova de Direito Financeiro, ligado ao PPA/LDO/LOA.',
        fazerPergunta: {
          pergunta: 'Uma Secretaria define que, em 3 anos, reduzirá em 25% o tempo médio de espera por consultas, e para isso distribui metas anuais entre postos de saúde. Qual nível de planejamento está sendo exercido?',
          resposta: 'O objetivo geral (25% em 3 anos) é do nível ESTRATÉGICO. A distribuição das metas entre postos de saúde é do nível TÁTICO. Se cada posto definir ações diárias, passa a ser OPERACIONAL.'
        }
      }
    },
    'ADM-04': {
      id: 'L-ADM-04',
      moduloId: 'ADM-04',
      objetivo: 'Compreender a função Organização: estrutura organizacional, divisão do trabalho, hierarquia, autoridade, responsabilidade, amplitude de controle, centralização/descentralização e tipos de departamentalização.',
      prerequisitos: ['ADM-02'],
      introducao: 'Organizar é arrumar os recursos da empresa para que o planejamento possa ser executado. Sem estrutura clara, cada um faz o que quer. É a segunda função do PODC.',
      explicacaoSimples: 'Organizar é montar o time. Você já decidiu o objetivo (planejamento). Agora precisa dizer: quem faz o quê? quem manda em quem? quantas pessoas cada chefe coordena? como dividir as áreas (vendas, produção, finanças)? Isso é organizar.',
      explicacaoTecnica: 'Organização é a função administrativa que estrutura recursos, define autoridade, responsabilidade e canais de comunicação. Componentes principais: (1) divisão do trabalho — separar tarefas em atividades especializadas; (2) hierarquia — cadeia de comando do topo à base; (3) autoridade — direito de dar ordens e cobrar execução; (4) responsabilidade — dever de cumprir e prestar contas; (5) amplitude de controle (ou de comando) — número de subordinados por chefe; (6) centralização x descentralização — onde fica o poder de decisão; (7) departamentalização — agrupamento de atividades (funcional, por produtos, geográfica, por clientes, por processos, matricial).',
      exemplos: [
        'Divisão do trabalho: em uma prefeitura, um setor cuida de compras, outro de licitações, outro de contratos.',
        'Hierarquia: secretário → diretor → coordenador → assistente.',
        'Amplitude de controle: um supervisor com 15 subordinados diretos tem amplitude maior que um com 4.',
        'Departamentalização funcional: secretarias por especialidade (Saúde, Educação, Obras).'
      ],
      comparacoes: [
        { termoA: 'Autoridade', termoB: 'Responsabilidade', diferenca: 'Autoridade é o direito de mandar. Responsabilidade é o dever de responder pelos resultados. A autoridade pode ser delegada; a responsabilidade, em regra, NÃO (o chefe continua responsável pelo que o subordinado faz).' },
        { termoA: 'Centralização', termoB: 'Descentralização', diferenca: 'Centralização: decisões concentradas no topo da hierarquia. Descentralização: decisões delegadas a níveis inferiores ou a unidades locais. A descentralização tende a dar mais agilidade, mas exige controle.' },
        { termoA: 'Amplitude estreita', termoB: 'Amplitude larga', diferenca: 'Estreita: cada chefe tem poucos subordinados → mais níveis hierárquicos → comunicação mais lenta, controle mais fácil. Larga: cada chefe tem muitos subordinados → menos níveis → comunicação mais rápida, exige subordinados mais autônomos.' }
      ],
      aplicacaoAdministracaoPublica: 'Toda estrutura do Estado é uma grande organização: ministérios, secretarias, autarquias, fundações. A divisão do trabalho aparece nos cargos e funções criados por lei. A hierarquia aparece nas carreiras e no poder hierárquico. A departamentalização é o que define as secretarias por área. A descentralização administrativa (criação de autarquias, empresas públicas etc.) é uma forma de organizar o Estado.',
      pegadinhas: [
        'Dizer que responsabilidade pode ser delegada como a autoridade. A responsabilidade NÃO se delega integralmente: quem delega continua responsável perante seus superiores.',
        'Confundir amplitude estreita com menos níveis. É o contrário: amplitude ESTREITA gera MAIS níveis hierárquicos.',
        'Achar que centralização é sempre ruim. Depende do contexto: decisões estratégicas podem exigir centralização.',
        'Trocar departamentalização funcional (por áreas: Saúde, Educação) com geográfica (por região: zona Norte, zona Sul).'
      ],
      errosComuns: [
        'Decorar tipos de departamentalização sem saber identificar em exemplos.',
        'Confundir hierarquia (estrutura de níveis) com disciplina (obediência a normas).',
        'Ignorar que a departamentalização pode ser mista — várias formas ao mesmo tempo na mesma organização.'
      ],
      resumo: [
        'Organização é a função que estrutura recursos, autoridade e responsabilidade.',
        'Divisão do trabalho: especialização por tarefas.',
        'Hierarquia: cadeia de comando. Autoridade: direito de mandar. Responsabilidade: dever de responder.',
        'Amplitude: número de subordinados por chefe. Estreita → mais níveis; larga → menos níveis.',
        'Centralização x descentralização: onde fica o poder de decisão.',
        'Departamentalização: funcional, por produtos, geográfica, por clientes, por processos, matricial.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Organizar é montar o organograma. Quem responde a quem, quem cuida do quê, quantas pessoas cada chefe coordena. É como a hierarquia de um time: técnico, capitão, jogadores.',
        outroExemplo: 'Um hospital público: diretor-geral (topo), diretores por área (clínica, administrativa, enfermagem), coordenadores por setor, equipes. Cada nível tem autoridade e responsabilidade definidas.',
        compararConceitos: 'Autoridade = direito de mandar. Responsabilidade = dever de responder. Hierarquia = níveis de comando. Amplitude = quantos subordinados por chefe. Departamentalização = como agrupar áreas.',
        mostrarPegadinha: 'Cuidado: "A responsabilidade pode ser integralmente delegada, como a autoridade". ERRADO. A autoridade se delega; a responsabilidade permanece com quem delegou.',
        comoApareceEmConcurso: 'Cobrado com exemplos práticos: "determinada prefeitura organiza secretarias por área, isso é departamentalização do tipo...". Também aparece sobre amplitude e centralização/descentralização.',
        fazerPergunta: {
          pergunta: 'Um gerente com 3 subordinados diretos tem amplitude de controle maior ou menor que um gerente com 12 subordinados?',
          resposta: 'MENOR. Amplitude de controle é o número de subordinados por chefe. 3 < 12, logo a amplitude do primeiro é MENOR.'
        }
      }
    },
    'ADM-05': {
      id: 'L-ADM-05',
      moduloId: 'ADM-05',
      objetivo: 'Compreender a função Direção: liderança, motivação, comunicação, coordenação e comportamento organizacional. Distinguir liderança de chefia e conhecer os estilos de liderança mais cobrados.',
      prerequisitos: ['ADM-02'],
      introducao: 'Depois de planejar e organizar, é preciso colocar as pessoas em movimento. Isso é a Direção — a função que lida com gente: liderar, motivar, comunicar e coordenar.',
      explicacaoSimples: 'Imagine um maestro. A orquestra tem partituras (planejamento) e instrumentos distribuídos (organização). Mas sem o maestro dando o ritmo, orientando e motivando, não sai música. Direção é esse papel: conduzir pessoas.',
      explicacaoTecnica: 'Direção é a função administrativa que conduz e coordena pessoas para executar o planejado. Envolve: (1) liderança — capacidade de influenciar pessoas para atingir objetivos; (2) motivação — processos que estimulam o comportamento humano em direção a metas; (3) comunicação — transmissão de informação entre emissor e receptor; (4) coordenação — integração dos esforços de diferentes áreas. Estilos clássicos de liderança: autocrático (centralizador), democrático (participativo) e liberal (laissez-faire). Teorias da motivação mais cobradas: Maslow (hierarquia das necessidades), Herzberg (fatores higiênicos x motivacionais), McGregor (X e Y).',
      exemplos: [
        'Liderança democrática: o coordenador reúne a equipe, ouve sugestões e decide em conjunto.',
        'Liderança autocrática: o gerente decide sozinho e comunica a ordem.',
        'Motivação intrínseca: o servidor se sente realizado com o trabalho em si.',
        'Motivação extrínseca: o servidor se esforça por causa do bônus ou da promoção.'
      ],
      comparacoes: [
        { termoA: 'Chefe', termoB: 'Líder', diferenca: 'Chefe é uma posição formal na hierarquia (autoridade legal). Líder é quem influencia pessoas, mesmo sem cargo. Um pode ter cargo e não ser líder; outro pode ser líder sem cargo.' },
        { termoA: 'Liderança autocrática', termoB: 'Liderança democrática', diferenca: 'Autocrática: decisões centralizadas no líder; comunicação de cima para baixo; foco na tarefa. Democrática: decisões compartilhadas; comunicação aberta; foco no grupo.' },
        { termoA: 'Motivação intrínseca', termoB: 'Motivação extrínseca', diferenca: 'Intrínseca: vem de dentro (satisfação, propósito, realização). Extrínseca: vem de fora (salário, bônus, promoção, medo de punição). As duas se combinam no ambiente de trabalho.' }
      ],
      aplicacaoAdministracaoPublica: 'Na Administração Pública, a direção aparece na atuação de gestores junto às equipes. A Lei 8.112/1990 traz deveres dos servidores (lealdade, urbanidade, respeito) e deveres dos chefes (orientar, delegar, avaliar). A gestão por competências (Decreto 5.707/2006) reforça liderança e desenvolvimento. Liderança também é cobrada em concursos como competência comportamental em avaliações de desempenho.',
      pegadinhas: [
        'Dizer que todo chefe é líder. Falso. Chefia é cargo; liderança é influência.',
        'Confundir motivação intrínseca com extrínseca. Intrínseca vem da própria tarefa; extrínseca vem de recompensa externa.',
        'Trocar estilos de liderança. Autocrático centraliza; democrático compartilha; liberal (laissez-faire) deixa a equipe à vontade, quase sem interferência.',
        'Achar que a Direção é opcional quando há bom planejamento. Não é: mesmo com bom plano, é preciso conduzir pessoas.'
      ],
      errosComuns: [
        'Decorar nomes de teorias sem entender a ideia central de cada uma.',
        'Confundir Direção com Controle. Direção conduz pessoas; Controle verifica resultados.',
        'Pensar que liderança é o mesmo que coordenação. Coordenação é integração de esforços; liderança é influência sobre pessoas.'
      ],
      resumo: [
        'Direção é a função administrativa que conduz pessoas para executar o planejado.',
        'Envolve liderança, motivação, comunicação e coordenação.',
        'Chefe é cargo; líder é influência. Nem todo chefe é líder.',
        'Estilos de liderança: autocrático (centralizador), democrático (participativo), liberal (laissez-faire).',
        'Teorias clássicas: Maslow (necessidades), Herzberg (higiênicos x motivacionais), McGregor (X e Y).'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Direção é o maestro da orquestra: ele não toca todos os instrumentos, mas faz todos tocarem juntos. Liderar é influenciar pessoas. Motivar é dar razão para elas se esforçarem. Comunicar é fazer a informação chegar clara.',
        outroExemplo: 'Em um posto de saúde, a coordenadora de enfermagem reúne a equipe, ouve queixas, propõe escala negociada e reforça o propósito do atendimento humanizado. Isso é liderança democrática + motivação intrínseca.',
        compararConceitos: 'Chefe manda; líder inspira. Motivação intrínseca vem de dentro; extrínseca de fora. Autocrático decide sozinho; democrático decide junto; liberal quase não interfere.',
        mostrarPegadinha: 'Cuidado: "Todo chefe é necessariamente líder, pois ocupa posição formal de comando". ERRADO. Chefia é formal; liderança é influência e pode não acompanhar o cargo.',
        comoApareceEmConcurso: 'Cai em duas formas: (1) correspondência entre situação e estilo de liderança; (2) diferença entre chefe e líder, ou entre motivação intrínseca e extrínseca. Também aparece em questões de gestão de pessoas.',
        fazerPergunta: {
          pergunta: 'Um gerente reúne a equipe, escuta sugestões e decide em conjunto com os servidores. Qual é o estilo de liderança?',
          resposta: 'LIDERANÇA DEMOCRÁTICA (ou participativa). O líder compartilha decisões e ouve o grupo. Seria autocrático se decidisse sozinho; liberal se deixasse a equipe decidir tudo sem participar.'
        }
      }      
    ] },

    { id: 'Q-DID-ADM-0002', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-01', subtema: 'Funções administrativas', dificuldade: 2, prioridade: 'alta', enunciado: 'A Secretaria de Saúde definiu que reduzirá em 20% o tempo médio de espera e alocou equipes, equipamentos e orçamento. Qual função administrativa está sendo exercida?', alternativas: [{ id: 'A', texto: 'Controle.' }, { id: 'B', texto: 'Direção.' }, { id: 'C', texto: 'Planejamento.' }, { id: 'D', texto: 'Organização.' }], gabarito: 'C', explicacao: { correta: 'Definir objetivos e alocar recursos é PLANEJAMENTO.', incorretas: { A: 'Controle viria depois.', B: 'Direção lidaria com pessoas.', D: 'Organização estruturaria cargos.' }, conceitoCobrado: 'Identificação da função.', pegadinha: 'Alocar recursos pode parecer organização.', comoApareceEmConcurso: 'Correspondência exemplo-função.' }, tags: ['PODC'] },
    { id: 'Q-DID-ADM-0003', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-02', subtema: 'Integração das funções', dificuldade: 1, prioridade: 'alta', enunciado: 'Segundo a formulação clássica de Fayol, a ordem do ciclo administrativo é:', alternativas: [{ id: 'A', texto: 'Organização → Planejamento → Controle → Direção.' }, { id: 'B', texto: 'Controle → Planejamento → Organização → Direção.' }, { id: 'C', texto: 'Planejamento → Organização → Direção → Controle.' }, { id: 'D', texto: 'Direção → Planejamento → Organização → Controle.' }], gabarito: 'C', explicacao: { correta: 'O ciclo PODC segue Planejamento → Organização → Direção → Controle.', incorretas: { A: 'Inverte planejamento e organização.', B: 'Começa pelo controle, impossível.', D: 'Começa pela direção sem plano.' }, conceitoCobrado: 'Ordem das funções.', pegadinha: 'Bancas invertem a ordem.', comoApareceEmConcurso: 'Memória aplicada.' }, tags: ['PODC', 'Fayol'] },
    { id: 'Q-DID-ADM-0004', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-02', subtema: 'Direção', dificuldade: 2, prioridade: 'alta', enunciado: 'O gerente reúne a equipe, delega responsabilidades, orienta servidores e mantém o grupo motivado. Qual função?', alternativas: [{ id: 'A', texto: 'Planejamento.' }, { id: 'B', texto: 'Organização.' }, { id: 'C', texto: 'Direção.' }, { id: 'D', texto: 'Controle.' }], gabarito: 'C', explicacao: { correta: 'Liderar, motivar, comunicar é DIREÇÃO.', incorretas: { A: 'Planejamento define objetivos.', B: 'Organização é estrutural.', D: 'Controle compara desempenho.' }, conceitoCobrado: 'Função de direção.', pegadinha: 'Delegar pode parecer organização.', comoApareceEmConcurso: 'Correspondência situação-função.' }, tags: ['PODC'] },
    { id: 'Q-DID-ADM-0005', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-02', subtema: 'Controle', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a função administrativa de controle, assinale a alternativa correta:', alternativas: [{ id: 'A', texto: 'É etapa estanque, só no final.' }, { id: 'B', texto: 'Dispensa padrões.' }, { id: 'C', texto: 'É contínuo e retroalimenta o planejamento.' }, { id: 'D', texto: 'Substitui o planejamento.' }], gabarito: 'C', explicacao: { correta: 'O controle é contínuo: mede, compara com padrões e corrige desvios.', incorretas: { A: 'Controle é contínuo.', B: 'Não existe controle sem padrão.', D: 'Retroalimenta, não substitui.' }, conceitoCobrado: 'Caráter contínuo do controle.', pegadinha: 'Achar que controle é só no final.', comoApareceEmConcurso: 'Conceitual.' }, tags: ['PODC', 'controle'] },
    { id: 'Q-DID-ADM-0006', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-03', subtema: 'Níveis de planejamento', dificuldade: 2, prioridade: 'alta', enunciado: 'O planejamento que define missão, visão e objetivos de longo prazo é classificado como:', alternativas: [{ id: 'A', texto: 'Operacional.' }, { id: 'B', texto: 'Tático.' }, { id: 'C', texto: 'Estratégico.' }, { id: 'D', texto: 'Funcional.' }], gabarito: 'C', explicacao: { correta: 'Planejamento ESTRATÉGICO é nível institucional.', incorretas: { A: 'Operacional é execução.', B: 'Tático é intermediário.', D: 'Funcional não é nível clássico.' }, conceitoCobrado: 'Níveis do planejamento.', pegadinha: 'Inverter tático e estratégico.', comoApareceEmConcurso: 'ADM e AP.' }, tags: ['planejamento'] },
    { id: 'Q-DID-ADM-0007', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-03', subtema: 'Planejamento estratégico', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre o planejamento estratégico, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Tem foco no curto prazo.' }, { id: 'B', texto: 'É elaborado pela média gerência.' }, { id: 'C', texto: 'Envolve toda a organização, tem horizonte longo e é conduzido pela alta direção.' }, { id: 'D', texto: 'Substitui os planejamentos tático e operacional.' }], gabarito: 'C', explicacao: { correta: 'Estratégico: toda a organização, longo prazo, alta direção.', incorretas: { A: 'Curto prazo é operacional.', B: 'Média gerência elabora o tático.', D: 'Os três níveis coexistem.' }, conceitoCobrado: 'Características do planejamento estratégico.', pegadinha: 'Confundir horizonte com nível.', comoApareceEmConcurso: 'ADM Geral.' }, tags: ['planejamento', 'estratégico'] },
    { id: 'Q-DID-ADM-0008', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-04', subtema: 'Departamentalização', dificuldade: 2, prioridade: 'alta', enunciado: 'Uma prefeitura organiza suas secretarias por áreas como Saúde, Educação e Obras. Esse critério é departamentalização:', alternativas: [{ id: 'A', texto: 'Por clientes.' }, { id: 'B', texto: 'Funcional.' }, { id: 'C', texto: 'Geográfica.' }, { id: 'D', texto: 'Por produtos.' }], gabarito: 'B', explicacao: { correta: 'Agrupar por áreas de especialidade é FUNCIONAL.', incorretas: { A: 'Por clientes é por público-alvo.', C: 'Geográfica é por região.', D: 'Por produtos é por bem/serviço.' }, conceitoCobrado: 'Tipos de departamentalização.', pegadinha: 'Confundir funcional com por produtos.', comoApareceEmConcurso: 'ADM e AP.' }, tags: ['departamentalização'] },
    { id: 'Q-DID-ADM-0009', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-04', subtema: 'Centralização e descentralização', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a descentralização administrativa nas organizações, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Concentra a autoridade no topo.' }, { id: 'B', texto: 'Transfere a tomada de decisão para níveis mais próximos da execução.' }, { id: 'C', texto: 'Elimina a hierarquia.' }, { id: 'D', texto: 'É sinônimo de desconcentração.' }], gabarito: 'B', explicacao: { correta: 'Descentralização distribui autoridade decisória para níveis inferiores.', incorretas: { A: 'Concentrar é centralização.', C: 'Não elimina hierarquia.', D: 'Desconcentração é dentro da mesma pessoa jurídica.' }, conceitoCobrado: 'Centralização, descentralização e desconcentração.', pegadinha: 'Trocar descentralização por desconcentração.', comoApareceEmConcurso: 'ADM e DA.' }, tags: ['descentralização'] },
    { id: 'Q-DID-ADM-0010', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-07', subtema: 'Recrutamento e seleção', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre recrutamento e seleção em gestão de pessoas:', alternativas: [{ id: 'A', texto: 'Recrutamento é escolha; seleção é divulgação.' }, { id: 'B', texto: 'Recrutamento atrai candidatos; seleção escolhe o mais adequado.' }, { id: 'C', texto: 'São sinônimos.' }, { id: 'D', texto: 'Ambos ocorrem após o treinamento.' }], gabarito: 'B', explicacao: { correta: 'Recrutamento atrai; seleção escolhe.', incorretas: { A: 'Inverte as definições.', C: 'Não são sinônimos.', D: 'Treinamento é posterior.' }, conceitoCobrado: 'Etapas do processo de provisão.', pegadinha: 'Trocar as definições.', comoApareceEmConcurso: 'ADM.' }, tags: ['RH'] },
    { id: 'Q-DID-ADM-0011', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-07', subtema: 'Avaliação de desempenho', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a avaliação de desempenho nas organizações:', alternativas: [{ id: 'A', texto: 'Serve apenas para punir.' }, { id: 'B', texto: 'É processo sistemático de acompanhamento e mensuração, com fins de desenvolvimento.' }, { id: 'C', texto: 'Deve ser feita apenas pelo próprio avaliado.' }, { id: 'D', texto: 'É incompatível com gestão por competências.' }], gabarito: 'B', explicacao: { correta: 'Avaliação é processo sistemático de acompanhamento e mensuração.', incorretas: { A: 'Reduz a instrumento punitivo.', C: 'Autoavaliação é um método, não o único.', D: 'São complementares.' }, conceitoCobrado: 'Finalidade da avaliação.', pegadinha: 'Achar que é sinônimo de punição.', comoApareceEmConcurso: 'ADM/RH.' }, tags: ['RH', 'avaliação'] },
    { id: 'Q-DID-ADM-0012', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-11', subtema: 'Gestão de estoques', dificuldade: 2, prioridade: 'alta', enunciado: 'O estoque mínimo que deve ser mantido para cobrir atrasos ou picos de demanda é chamado de:', alternativas: [{ id: 'A', texto: 'Estoque máximo.' }, { id: 'B', texto: 'Estoque de segurança.' }, { id: 'C', texto: 'Ponto de pedido.' }, { id: 'D', texto: 'Estoque em trânsito.' }], gabarito: 'B', explicacao: { correta: 'Estoque de SEGURANÇA é quantidade adicional para variações imprevistas.', incorretas: { A: 'Máximo é limite superior.', C: 'Ponto de pedido dispara nova compra.', D: 'Em trânsito está entre fornecedor e recebedor.' }, conceitoCobrado: 'Tipos de estoque.', pegadinha: 'Confundir com ponto de pedido.', comoApareceEmConcurso: 'Provas administrativas.' }, tags: ['materiais'] },
    { id: 'Q-DID-AP-0001', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-02', subtema: 'Patrimonialismo', dificuldade: 1, prioridade: 'alta', enunciado: 'A confusão entre o patrimônio público e o privado, o nepotismo e a pessoalidade são características do modelo:', alternativas: [{ id: 'A', texto: 'Burocrático.' }, { id: 'B', texto: 'Gerencial.' }, { id: 'C', texto: 'Patrimonialista.' }, { id: 'D', texto: 'Nova Gestão Pública.' }], gabarito: 'C', explicacao: { correta: 'Patrimonialismo: sem distinção entre público e privado.', incorretas: { A: 'Burocracia combate isso.', B: 'Gerencial foca em resultado.', D: 'NGP é corrente internacional.' }, conceitoCobrado: 'Características do patrimonialismo.', pegadinha: 'Confundir com burocracia.', comoApareceEmConcurso: 'AP e DA.' }, tags: ['patrimonialismo'] },
    { id: 'Q-DID-AP-0002', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-02', subtema: 'Administração gerencial', dificuldade: 2, prioridade: 'alta', enunciado: 'Um hospital público firma contrato de gestão com metas e bônus. Característica do modelo:', alternativas: [{ id: 'A', texto: 'Patrimonialista.' }, { id: 'B', texto: 'Burocrático.' }, { id: 'C', texto: 'Gerencial.' }, { id: 'D', texto: 'Pré-burocrático.' }], gabarito: 'C', explicacao: { correta: 'Contrato de gestão, metas e bônus são GERENCIAIS.', incorretas: { A: 'Patrimonialismo não separa.', B: 'Burocracia foca em processo.', D: 'Categoria inexistente.' }, conceitoCobrado: 'Instrumentos gerenciais.', pegadinha: 'Achar que contrato de gestão é burocrático.', comoApareceEmConcurso: 'Ligação instrumento-modelo.' }, tags: ['gerencial'] },
    { id: 'Q-DID-AP-0003', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-02', subtema: 'Autores e períodos', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre evolução dos modelos no Brasil, assinale a INCORRETA:', alternativas: [{ id: 'A', texto: 'Reforma burocrática consolidada a partir de 1936, com DASP em 1938.' }, { id: 'B', texto: 'Reforma Gerencial teve na EC 19/1998 seu principal marco.' }, { id: 'C', texto: 'Max Weber é referência central do modelo burocrático.' }, { id: 'D', texto: 'Reforma Gerencial iniciada no governo Vargas, em 1936, por Bresser-Pereira.' }], gabarito: 'D', explicacao: { correta: 'Alternativa D está INCORRETA: 1936 (Vargas) foi BUROCRÁTICA. Gerencial foi 1995 (FHC).', incorretas: { A: 'Correta.', B: 'Correta.', C: 'Correta.' }, conceitoCobrado: 'Datas, autores e modelos.', pegadinha: 'Trocar Vargas/Bresser-Pereira.', comoApareceEmConcurso: 'Clássica.' }, tags: ['EC 19/1998'] },
    { id: 'Q-DID-AP-0004', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-01', subtema: 'Conceito de Administração Pública', dificuldade: 2, prioridade: 'alta', enunciado: 'Em sentido amplo, a Administração Pública compreende:', alternativas: [{ id: 'A', texto: 'Somente órgãos do Executivo.' }, { id: 'B', texto: 'Apenas função administrativa.' }, { id: 'C', texto: 'Órgãos e entidades de todos os Poderes, no desempenho de funções administrativas.' }, { id: 'D', texto: 'Exclusivamente Legislativo e Judiciário.' }], gabarito: 'C', explicacao: { correta: 'Sentido AMPLO: todos os órgãos e entidades dos três Poderes.', incorretas: { A: 'Exclui os demais Poderes.', B: 'Refere-se ao sentido estrito.', D: 'Reduz indevidamente.' }, conceitoCobrado: 'Sentidos amplo e estrito.', pegadinha: 'Confundir sentido amplo com estrito.', comoApareceEmConcurso: 'AP e DA.' }, tags: ['conceito'] },

    { id: 'Q-DID-AP-0006', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-03', subtema: 'Eficiência', dificuldade: 2, prioridade: 'alta', enunciado: 'O princípio da eficiência foi inserido no caput do art. 37 da CF pela:', alternativas: [{ id: 'A', texto: 'EC 45/2004.' }, { id: 'B', texto: 'EC 19/1998.' }, { id: 'C', texto: 'EC 1/1992.' }, { id: 'D', texto: 'CF/1988 original.' }], gabarito: 'B', explicacao: { correta: 'EC 19/1998 (Reforma Gerencial).', incorretas: { A: 'EC 45/2004 tratou do Judiciário.', C: 'EC 1/1992 tratou de outras matérias.', D: 'CF/88 original listava só 4.' }, conceitoCobrado: 'Marco da eficiência.', pegadinha: 'Confundir EC 19/1998 com EC 45/2004.', comoApareceEmConcurso: 'Clássica em DA e AP.' }, tags: ['eficiência'] },

    { id: 'Q-DID-DA-0002', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-02', subtema: 'Legalidade', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre o princípio da legalidade na Administração Pública:', alternativas: [{ id: 'A', texto: 'O administrador pode fazer tudo que a lei não proíbe.' }, { id: 'B', texto: 'A Administração só pode atuar conforme autorização ou determinação legal (legalidade estrita).' }, { id: 'C', texto: 'Veda atos discricionários.' }, { id: 'D', texto: 'É idêntica à autonomia privada.' }], gabarito: 'B', explicacao: { correta: 'Legalidade estrita: só o que a lei autoriza.', incorretas: { A: 'Descreve o PARTICULAR.', C: 'Não veda discricionariedade.', D: 'É o oposto.' }, conceitoCobrado: 'Legalidade administrativa x do particular.', pegadinha: '"Fazer o que a lei não proíbe" é ERRADO.', comoApareceEmConcurso: 'Alta frequência.' }, tags: ['legalidade'] },
    { id: 'Q-DID-DA-0003', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-02', subtema: 'Impessoalidade', dificuldade: 2, prioridade: 'alta', enunciado: 'Um prefeito afixa outdoors com sua foto e nome ao lado de obras municipais pagos com verba pública. Viola o princípio da:', alternativas: [{ id: 'A', texto: 'Legalidade.' }, { id: 'B', texto: 'Impessoalidade.' }, { id: 'C', texto: 'Publicidade.' }, { id: 'D', texto: 'Continuidade do serviço público.' }], gabarito: 'B', explicacao: { correta: 'Art. 37, §1º, CF veda promoção pessoal.', incorretas: { A: 'Há irregularidade, mas o núcleo é impessoalidade.', C: 'Publicidade não promove o agente.', D: 'Continuidade não é o foco.' }, conceitoCobrado: 'Impessoalidade.', pegadinha: 'Trocar por publicidade.', comoApareceEmConcurso: 'Situações práticas.' }, tags: ['impessoalidade'] },

  function createDefaultState() {
    var now = new Date().toISOString();
    return {
      schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION,
      createdAt: now, updatedAt: now,
      settings: { theme: 'light' },
      modules: {},
      questions: {},
      flashcards: {},

      stats: { questoesRespondidas: 0, acertos: 0, erros: 0, flashcardsEstudados: 0, simuladosRealizados: 0, tempoEstudoMin: 0 },
      lastScreen: 'dashboard'
    };
  }
  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return createDefaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return createDefaultState();
      var base = createDefaultState();
      return {
        schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION,
        createdAt: parsed.createdAt || base.createdAt,
        updatedAt: parsed.updatedAt || base.updatedAt,
        settings: Object.assign({}, base.settings, parsed.settings || {}),
        modules: parsed.modules || {},
        questions: parsed.questions || {},
        flashcards: parsed.flashcards || {},
        simulados: Array.isArray(parsed.simulados) ? parsed.simulados : [],
        stats: Object.assign({}, base.stats, parsed.stats || {}),
        lastScreen: parsed.lastScreen || 'dashboard'
      };
    } catch (e) { console.error('[ADMIN-DIR] Falha ao ler estado:', e); return createDefaultState(); }
  }
  function saveState() {
    AppState.updatedAt = new Date().toISOString();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState)); }
    catch (e) { console.error('[ADMIN-DIR] Falha ao salvar estado:', e); }
  }

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function getModule(modId) { for (var i = 0; i < MODULES.length; i++) if (MODULES[i].id === modId) return MODULES[i]; return null; }
  function getLessonByModuleId(modId) { return LESSONS[modId] || null; }
  function getLessonById(lessonId) { for (var k in LESSONS) if (LESSONS.hasOwnProperty(k) && LESSONS[k].id === lessonId) return LESSONS[k]; return null; }
  function getDiagnosticByModuleId(modId) { return DIAGNOSTICS[modId] || null; }
  function getQuestion(qid) { for (var i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].id === qid) return QUESTIONS[i]; return null; }
  function getFlashcard(fid) { for (var i = 0; i < FLASHCARDS.length; i++) if (FLASHCARDS[i].id === fid) return FLASHCARDS[i]; return null; }
  function formatDate(iso) { if (!iso) return '—'; try { return new Date(iso).toLocaleString('pt-BR'); } catch (e) { return iso; } }
  function formatDateShort(iso) { if (!iso) return '—'; try { return new Date(iso).toLocaleDateString('pt-BR'); } catch (e) { return iso; } }
  function isObjective(item) { return item.tipo === 'multipla_escolha' || item.tipo === 'verdadeiro_falso' || item.tipo === 'situacao'; }
  function difficultyLabel(d) { return DIFFICULTY_LABELS[d] || ('Nível ' + d); }
  function typeLabel(t) { return t === 'REAL' ? 'Real' : 'Didática'; }
  function typeBadgeClass(t) { return t === 'REAL' ? 'badge-real' : 'badge-did'; }
  function qRealCount() { var n = 0; for (var i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].tipo === 'REAL') n++; return n; }
  function qDidCount() { var n = 0; for (var i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].tipo === 'DIDATICA') n++; return n; }
  function fcByModule(modId) { var arr = []; for (var i = 0; i < FLASHCARDS.length; i++) if (FLASHCARDS[i].moduloId === modId) arr.push(FLASHCARDS[i]); return arr; }
  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  /* ============================================================
     DIAGNOSTICO
  ============================================================ */
  function computeDiagnosticResult(moduleId, answers) {
    var diag = getDiagnosticByModuleId(moduleId);
    if (!diag) return null;
    var bySubtopic = {}, totalPontos = 0, totalSinais = 0;
    for (var i = 0; i < diag.itens.length; i++) {
      var item = diag.itens[i];
      var sub = item.subtopico;
      if (!bySubtopic[sub]) bySubtopic[sub] = { acertos: 0, erros: 0, sabia: 0, nao_sabia: 0, total: 0 };
      var resp = answers[item.id];
      bySubtopic[sub].total += 1;
      if (isObjective(item)) {
        if (resp === item.gabarito) { bySubtopic[sub].acertos += 1; totalPontos += 1; } else bySubtopic[sub].erros += 1;
        totalSinais += 1;
      } else if (item.tipo === 'autoavaliacao') {
        if (resp === 'sabia') { bySubtopic[sub].sabia += 1; totalPontos += 1; } else if (resp === 'nao_sabia') bySubtopic[sub].nao_sabia += 1;
        totalSinais += 1;
      }
    }
    var result = { bySubtopic: {} };
    for (var subName in bySubtopic) {
      if (!bySubtopic.hasOwnProperty(subName)) continue;
      var s = bySubtopic[subName];
      var positivos = s.acertos + s.sabia, negativos = s.erros + s.nao_sabia;
      var status;
      if (s.erros === 0 && s.nao_sabia === 0 && positivos >= 1) status = 'conhecido';
      else if (positivos === 0 && negativos >= 1) status = 'desconhecido';
      else status = 'duvida';
      var rec;
      if (status === 'conhecido') rec = 'Você demonstra bom domínio neste subtópico. Siga para a aula (revisão) e mantenha revisões periódicas.';
      else if (status === 'duvida') rec = 'Há base, mas o domínio é parcial. Estude a aula com atenção, foque nos exemplos e nas comparações, e refaça este diagnóstico depois de revisar.';
      else rec = 'Trate este subtópico como prioridade. Estude a aula desde o início, sem pular a explicação simples. Refaça o diagnóstico em seguida.';
      result.bySubtopic[subName] = { status: status, acertos: s.acertos, erros: s.erros, sabia: s.sabia, nao_sabia: s.nao_sabia, total: s.total, recommendation: rec };
    }
    var dominio = 0;
    if (totalSinais > 0) {
      dominio = totalPontos / totalSinais;
      if (negativosNoTotal(bySubtopic) > 0) dominio = dominio * 0.9;
      dominio = Math.max(0, Math.min(1, dominio));
    }
    result.dominioEstimado = Math.round(dominio * 100) / 100;
    result.completedAt = new Date().toISOString();
    return result;
  }
  function negativosNoTotal(bySubtopic) { var n = 0; for (var k in bySubtopic) if (bySubtopic.hasOwnProperty(k)) n += bySubtopic[k].erros + bySubtopic[k].nao_sabia; return n; }

  function filterQuestions() {

      if (questionFilter.area !== 'todas' && q.area !== questionFilter.area) return false;
      if (questionFilter.moduloId !== 'todos' && q.moduloId !== questionFilter.moduloId) return false;
      if (questionFilter.dificuldade !== 'todas' && q.dificuldade !== Number(questionFilter.dificuldade)) return false;
      if (questionFilter.tipo !== 'TODAS' && q.tipo !== questionFilter.tipo) return false;

    });

  function startQuestionSession(ids, modo) {
    var list;
    if (ids && ids.length) list = ids.map(getQuestion).filter(Boolean);
    else list = filterQuestions();
    if (list.length === 0) { window.alert('Nenhuma questão disponível para esta sessão.'); return; }
    var idsArr = shuffleArray(list.map(function (q) { return q.id; }));
    questionRunning = { ids: idsArr, index: 0, respostas: {}, revealed: {}, startedAt: new Date().toISOString(), modo: modo || 'livre' };

  function commitQuestionAnswer(qid, altId) {
    var q = getQuestion(qid);
    if (!q) return;
    var qs = getQuestionUserState(qid);
    var correta = altId === q.gabarito;
    qs.tentativas += 1;
    if (correta) qs.acertos += 1; else qs.erros += 1;
    qs.ultimaResposta = altId; qs.ultimaCorreta = correta; qs.ultimaTentativa = new Date().toISOString();
    qs.status = correta ? 'acerto' : 'erro';
    qs.historico.push({ data: qs.ultimaTentativa, resposta: altId, correta: correta });
    if (qs.historico.length > 30) qs.historico = qs.historico.slice(-30);
    if (correta) {
      if (qs.intervaloAtual < 0) qs.intervaloAtual = 0;
      else if (qs.intervaloAtual < Q_INTERVALS.length - 1) qs.intervaloAtual += 1;
      qs.proximaRevisao = addDaysIso(Q_INTERVALS[qs.intervaloAtual]);
    } else {
      qs.intervaloAtual = 0;
      qs.proximaRevisao = addDaysIso(Q_INTERVALS[0]);
    }
    AppState.stats.questoesRespondidas += 1;
    if (correta) AppState.stats.acertos += 1; else AppState.stats.erros += 1;
    var st = getModuleUserState(q.moduloId);
    if (st.status === 'nao_iniciado') st.status = 'em_estudo';
    st.ultimaAtividade = new Date().toISOString();
    saveState();

  function filterForSimulado() {
    var cfg = simuladoConfig;
    return QUESTIONS.filter(function (q) {
      if (cfg.area !== 'todas' && q.area !== cfg.area) return false;
      if (cfg.moduloId !== 'todos' && q.moduloId !== cfg.moduloId) return false;

      return true;
    });
  }
  function quantidadeAlvo() {
    if (simuladoConfig.quantidade === 'custom') {
      var n = parseInt(simuladoConfig.customQty, 10);
      if (!isFinite(n) || n < 1) return 0;
      return Math.min(n, 200);
    }
    return simuladoConfig.quantidade;
  }
  function startSimulado(modoForcado) {
    var modo = modoForcado || simuladoConfig.modo;
    var pool;
    if (modo === 'PROVA_CONCURSO') {
      pool = filterForSimulado().filter(function (q) { return q.tipo === 'REAL'; });
      if (pool.length === 0) {
        var prosseguir = window.confirm(
          'Não há questões REAIS no banco atual.\n\n' +
          'Deseja rodar um Simulado personalizado (com todas as questões disponíveis) no lugar?'
        );
        if (prosseguir) {
          simuladoConfig.modo = 'SIMULADO';
          simuladoConfig.tipo = 'TODAS';
          pool = filterForSimulado();
        } else {
          return;
        }
      }
    } else {
      pool = filterForSimulado();
      if (pool.length === 0) {
        var limpar = window.confirm(
          'Nenhuma questão corresponde aos filtros atuais.\n\n' +
          'Deseja limpar os filtros (área, módulo, dificuldade, tipo) e usar todas as questões?'

        } else {

    if (pool.length === 0) {
      window.alert('Ainda não há questões disponíveis. Importe questões no Banco de Questões.');
      return;

    var qtd = quantidadeAlvo();
    if (qtd === 0) {

      simuladoConfig.customQty = '';
      qtd = 10;
    }
    var ids = shuffleArray(pool.map(function (q) { return q.id; })).slice(0, Math.min(qtd, pool.length));
    if (ids.length === 0) { window.alert('Não há questões suficientes.'); return; }
    simuladoRunning = {
      ids: ids,
      index: 0,
      respostas: {},
      startedAt: new Date().toISOString(),
      config: {
        modo: (modo === 'PROVA_CONCURSO' && simuladoConfig.modo === 'PROVA_CONCURSO') ? 'PROVA_CONCURSO' : 'SIMULADO',

  function prevSimulado() { if (simuladoRunning && simuladoRunning.index > 0) { simuladoRunning.index -= 1; render(); var m = document.getElementById('main'); if (m) m.scrollTop = 0; } }

  function finishSimulado() {
    if (!simuladoRunning) return;
    var total = simuladoRunning.ids.length;
    var respondidas = 0;
    for (var i = 0; i < total; i++) {
      if (simuladoRunning.respostas[simuladoRunning.ids[i]] != null) respondidas++;
    }
    if (respondidas < total) {
      var ok = window.confirm('Você respondeu ' + respondidas + ' de ' + total + ' questões.\n\nDeseja finalizar mesmo assim? As questões não respondidas serão consideradas em branco.');
      if (!ok) return;
    }
    var ids = simuladoRunning.ids;
    var respostas = simuladoRunning.respostas;
    var acertos = 0;
    var porModulo = {}, porDificuldade = {}, porTipo = {};
    for (var j = 0; j < ids.length; j++) {
      var q = getQuestion(ids[j]);
      if (!q) continue;
      var resp = respostas[q.id];
      var correta = resp === q.gabarito;
      if (correta) acertos++;

      if (!porTipo[q.tipo]) porTipo[q.tipo] = { total: 0, acertos: 0, respondidas: 0 };
      porTipo[q.tipo].total++; if (correta) porTipo[q.tipo].acertos++; if (resp != null) porTipo[q.tipo].respondidas++;
    }
    var naoRespondidas = total - respondidas;
    var erros = respondidas - acertos;
    var pct = total > 0 ? Math.round((acertos / total) * 100) : 0;
    var sim = {
      id: 'SIM-' + Date.now().toString(36).toUpperCase(),

        porDificuldade: porDificuldade,
        porTipo: porTipo
      }
    };
    AppState.simulados.push(sim);
    AppState.stats.simuladosRealizados = (AppState.stats.simuladosRealizados || 0) + 1;
    saveState();

    var main = document.getElementById('main');
    if (!main) return;
    var html = '';
    switch (currentScreen) {
      case 'dashboard': html = renderDashboard(); break;
      case 'modulos': html = renderModules(); break;
      case 'modulo-detalhe': html = renderModuleDetail(); break;
      case 'licao': html = renderLesson(); break;
      case 'diagnostico': html = renderDiagnosticRunning(); break;
      case 'diag-resultado': html = renderDiagnosticResult(); break;
      case 'questoes': html = renderQuestions(); break;
      case 'questao-run': html = renderQuestionRun(); break;
      case 'questao-result': html = renderQuestionResult(); break;
      case 'banco-questoes': html = renderQuestionBank(); break;
      case 'flashcards': html = renderFlashcards(); break;
      case 'flashcard-run': html = renderFlashcardRun(); break;
      case 'flashcard-result': html = renderFlashcardResult(); break;
      case 'revisao': html = renderRevision(); break;
      case 'erros': html = renderErrors(); break;
      case 'simulados': html = renderSimulados(); break;
      case 'simulado-run': html = renderSimuladoRun(); break;

  function renderDashboard() {
    var stats = AppState.stats;
    var taxa = stats.questoesRespondidas > 0 ? Math.round((stats.acertos / stats.questoesRespondidas) * 100) : 0;
    var totalModulos = MODULES.length;
    var emEstudo = 0, concluidos = 0;
    for (var i = 0; i < MODULES.length; i++) { var st = getModuleUserState(MODULES[i].id); if (st.status === 'em_estudo') emEstudo++; if (st.status === 'concluido') concluidos++; }
    var diagFeitos = 0;
    for (var d = 0; d < MODULES.length; d++) { var dst = AppState.modules[MODULES[d].id]; if (dst && dst.diagnostico) diagFeitos++; }
    var qReal = qRealCount(), qDid = qDidCount();
    var dueN = countDueAll();
    var errN = countErrorsAll();
    var simCount = AppState.simulados.length;
    var bestSim = null;
    for (var s = 0; s < AppState.simulados.length; s++) {
      var r = AppState.simulados[s].resultado;
      if (bestSim == null || (r.percentual > bestSim)) bestSim = r.percentual;
    }

    var sugestoes = [];
    var dueQ = getDueQuestions();
    var dueF = getDueFlashcards();
    if (dueQ.length > 0 || dueF.length > 0) {
      sugestoes.push({ tipo: 'revisao', titulo: 'Revisão pendente', descricao: dueQ.length + ' questão(ões) e ' + dueF.length + ' flashcard(s) para revisar hoje.' });
    }
    if (errN > 0) {
      sugestoes.push({ tipo: 'erros', titulo: 'Erros em aberto', descricao: errN + ' questão(ões) com erro aguardando revisão dedicada.' });
    }
    for (var j = 0; j < MODULES.length && sugestoes.length < 4; j++) {
      var m = MODULES[j];
      if (m.prioridade !== 'alta') continue;
      if (!getDiagnosticByModuleId(m.id) && !getLessonByModuleId(m.id)) continue;
      var ms = getModuleUserState(m.id);
      if (ms.status === 'concluido') continue;
      sugestoes.push({ tipo: 'modulo', modulo: m });
    }

    var html = '';
    html += '<h1 class="page-title">Dashboard</h1>';
    html += '<p class="page-subtitle">Visão geral do seu progresso. Dados salvos localmente no navegador.</p>';
    html += '<div class="cards-grid">';
    html += statCard('Questões respondidas', stats.questoesRespondidas, qReal + ' reais · ' + qDid + ' didáticas');
    html += statCard('Taxa de acerto', taxa + '%', stats.acertos + ' acertos / ' + stats.erros + ' erros');
    html += statCard('Simulados realizados', simCount, bestSim != null ? 'Melhor aproveitamento: ' + bestSim + '%' : 'Nenhum ainda');
    html += statCard('Revisões pendentes', dueN, dueN === 0 ? 'Nada vencido agora' : 'Vencidas ou para hoje');
    html += '</div>';

    html += '<div style="margin:6px 0 14px;display:flex;gap:8px;flex-wrap:wrap;">';
    html += '<button class="btn btn-primary" data-nav="estatisticas">📊 Ver estatísticas</button>';
    html += '</div>';

    html += '<h2 class="section-title">O que estudar hoje?</h2>';
    if (sugestoes.length === 0) html += '<div class="notice"><strong>Sem sugestões ainda.</strong></div>';
    else {
      html += '<div class="module-list">';
      for (var sg_i = 0; sg_i < sugestoes.length; sg_i++) {
        var sg = sugestoes[sg_i];
        if (sg.tipo === 'revisao') {
          html += '<button class="module-card" data-nav="revisao">';
          html += '<span class="mod-id">REV</span>';
          html += '<span class="mod-info"><span class="mod-title">🔁 ' + esc(sg.titulo) + '</span><span class="mod-area">' + esc(sg.descricao) + '</span></span>';
          html += '<span class="mod-badges"><span class="badge-pill badge-rev">Revisar</span></span></button>';
        } else if (sg.tipo === 'erros') {
          html += '<button class="module-card" data-nav="erros">';
          html += '<span class="mod-id">ERR</span>';
          html += '<span class="mod-info"><span class="mod-title">❌ ' + esc(sg.titulo) + '</span><span class="mod-area">' + esc(sg.descricao) + '</span></span>';
          html += '<span class="mod-badges"><span class="badge-pill badge-err">Erros</span></span></button>';
        } else if (sg.modulo) {
          html += moduleCardHtml(sg.modulo);
        }
      }
      html += '</div>';
    }

    html += '<h2 class="section-title">Aviso desta versão</h2>';
    html += '<div class="notice">' +
      '<strong>Fase 9 — Dashboard avançado.</strong> ' +
      'Nova tela <strong>Estatísticas</strong> com evolução de 14 dias, desempenho por módulo/dificuldade/tipo, ' +
      'ranking de erros, domínio estimado por módulo, assuntos fortes e fracos e tempo de estudo estimado.' +
      '</div>';

    html += footerHtml();
    return html;
  }

  function statCard(label, value, hint) {
    return '<div class="stat-card"><div class="stat-label">' + esc(label) + '</div><div class="stat-value">' + esc(value) + '</div>' + (hint ? '<div class="stat-hint">' + esc(hint) + '</div>' : '') + '</div>';

  function summarizeResult(result) {
    var c = 0, d = 0, x = 0;
    var bs = result.bySubtopic || {};
    for (var k in bs) {
      if (!bs.hasOwnProperty(k)) continue;
      if (bs[k].status === 'conhecido') c++;
      else if (bs[k].status === 'duvida') d++;
      else if (bs[k].status === 'desconhecido') x++;
    }
    return { conhecido: c, duvida: d, desconhecido: x };
  }
  function infoRow(key, value) { return '<div class="info-row"><span class="info-key">' + esc(key) + '</span><span class="info-val">' + esc(value) + '</span></div>'; }
  function statusLabel(s) { var map = { 'nao_iniciado': 'Não iniciado', 'em_estudo': 'Em estudo', 'concluido': 'Concluído' }; return map[s] || s || 'Não iniciado'; }

  function renderDiagnosticRunning() {
    var moduleId = diagRunning.moduleId;
    var diag = getDiagnosticByModuleId(moduleId);
    if (!diag) return '<h1 class="page-title">Diagnóstico não encontrado</h1><button class="btn" data-nav="modulos">← Voltar</button>';
    var m = getModule(moduleId);
    var idx = diagRunning.itemIndex, total = diag.itens.length;
    if (idx < 0) idx = 0; if (idx >= total) idx = total - 1;
    var item = diag.itens[idx];
    var answered = Object.prototype.hasOwnProperty.call(diagRunning.answers, item.id);
    var userAnswer = diagRunning.answers[item.id];
    var percent = Math.round((idx / total) * 100);
    var html = '';
    html += '<div class="diag-progress"><div class="diag-progress-bar"><div class="diag-progress-fill" style="width:' + percent + '%"></div></div><div class="diag-progress-label">Item ' + (idx + 1) + ' / ' + total + '</div></div>';
    html += '<h1 class="page-title">Diagnóstico — ' + esc(m ? m.titulo : moduleId) + '</h1>';
    html += '<p class="page-subtitle">Módulo ' + esc(moduleId) + ' · ' + esc(DIAG_TYPE_LABELS[item.tipo] || item.tipo) + '</p>';
    html += '<div class="diag-meta"><span class="tag">Subtópico: ' + esc(item.subtopico) + '</span><span class="tag">' + esc(DIAG_TYPE_LABELS[item.tipo] || item.tipo) + '</span></div>';
    html += '<div class="diag-question"><h2>' + esc(item.pergunta) + '</h2>';

      html += '<div class="diag-options">';

      }
      html += '</div>';
      if (answered) {
        var acertou = userAnswer === item.gabarito;
        html += '<div class="diag-feedback ' + (acertou ? 'ok' : 'no') + '"><strong>' + (acertou ? '✓ Correto' : '✗ Incorreto') + '</strong>' + esc(item.explicacao) + '</div>';
      }
    } else if (item.tipo === 'autoavaliacao') {
      html += '<p style="color:var(--text-muted);font-size:14px;margin-bottom:8px;">Marque com sinceridade.</p>';

        html += '<div class="diag-feedback ' + (userAnswer === 'sabia' ? 'ok' : 'no') + '"><strong>' + (userAnswer === 'sabia' ? 'Você marcou: Eu sabia' : 'Você marcou: Eu não sabia') + '</strong>Gabarito conceitual: ' + esc(item.resposta) + '</div>';
      } else {
        html += '<div class="self-assess"><button class="btn btn-primary" data-action="diag-answer" data-alt="sabia">Eu sabia</button><button class="btn" data-action="diag-answer" data-alt="nao_sabia">Eu não sabia</button></div>';

    else if (answered && idx === total - 1) html += '<button class="btn btn-purple" data-action="diag-finish">Finalizar diagnóstico →</button>';

    html += footerHtml();

  function renderDiagnosticResult() {
    var moduleId = currentModuleId;

    var resumo = summarizeResult(r);

    html += resultStat('Em dúvida', resumo.duvida);
    html += resultStat('Desconhecidos', resumo.desconhecido);
    html += resultStat('Domínio estimado', Math.round((r.dominioEstimado || 0) * 100) + '%');
    html += '</div>';
    html += '<h2 class="section-title">Análise por subtópico</h2>';
    html += '<p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">O status é calculado cruzando acertos, erros e autoavaliação.</p>';
    for (var i = 0; i < subtopicos.length; i++) {
      var sub = subtopicos[i], d = bs[sub];
      html += '<div class="subtopic-result status-' + esc(d.status) + '">';
      html += '<h3>' + esc(sub) + '<span class="status-badge status-' + esc(d.status) + '">' + esc(STATUS_LABELS[d.status]) + '</span></h3>';
      html += '<div class="signals"><span>Acertos: <strong>' + d.acertos + '</strong></span><span>Erros: <strong>' + d.erros + '</strong></span>';
      if (d.sabia > 0 || d.nao_sabia > 0) html += '<span>Autoavaliação — sabia: <strong>' + d.sabia + '</strong> / não sabia: <strong>' + d.nao_sabia + '</strong></span>';
      html += '</div><div class="recommendation">' + esc(d.recommendation) + '</div></div>';
    }
    html += '<h2 class="section-title">Próximos passos</h2><div class="notice">';
    if (resumo.desconhecido > 0) html += '<strong>Prioridade alta.</strong> Você tem ' + resumo.desconhecido + ' subtópico(s) desconhecido(s). Estude a aula desde o início e refaça o diagnóstico.';
    else if (resumo.duvida > 0) html += '<strong>Reforço recomendado.</strong> ' + resumo.duvida + ' subtópico(s) em dúvida. Releia a aula e refaça este diagnóstico.';
    else html += '<strong>Bom desempenho.</strong> Todos os subtópicos foram classificados como conhecidos.';
    html += '</div>';
    html += '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">';

    html += '<button class="btn" data-action="start-diag" data-module-id="' + esc(moduleId) + '">Refazer agora</button>';
    html += '</div>';
    html += footerHtml();
    return html;

  function resultStat(label, value) { return '<div class="result-stat"><div class="rs-label">' + esc(label) + '</div><div class="rs-value">' + esc(value) + '</div></div>'; }

        }

  function renderQuestionRun() {
    if (!questionRunning) return '<h1 class="page-title">Sessão não iniciada</h1><button class="btn btn-primary" data-nav="questoes">Ir para Questões</button>';

    html += '<div class="q-card">';
    html += '<div class="q-head"><span class="q-id">' + esc(q.id) + '</span>';
    html += '<span class="badge-pill ' + typeBadgeClass(q.tipo) + '">' + esc(typeLabel(q.tipo)) + '</span>';
    if (q.tipo === 'REAL') html += '<span style="font-size:12px;color:var(--text-muted);">' + esc(q.banca + ' · ' + q.orgao + ' · ' + q.ano) + '</span>';
    else html += '<span style="font-size:12px;color:var(--text-muted);">' + esc(q.moduloId + ' · ' + q.subtema) + '</span>';
    html += '</div>';
    html += '<div class="q-statement">' + esc(q.enunciado) + '</div>';
    html += '<div class="q-options">';
    for (var a = 0; a < q.alternativas.length; a++) {
      var alt = q.alternativas[a];
      var cls = 'q-option';
      if (answered) { if (alt.id === q.gabarito) cls += ' correct'; else if (alt.id === userAnswer) cls += ' wrong'; }
      else if (alt.id === userAnswer) cls += ' selected';
      html += '<button class="' + cls + '" data-action="answer-question" data-alt="' + esc(alt.id) + '"' + (answered ? ' disabled' : '') + '><span class="opt-letter">' + esc(alt.id) + '</span><span>' + esc(alt.texto) + '</span></button>';
    }
    html += '</div>';
    if (answered) {
      var acertou = userAnswer === q.gabarito;
      html += '<div class="q-feedback ' + (acertou ? 'ok' : 'no') + '">';
      html += '<strong>' + (acertou ? '✓ Você acertou' : '✗ Você errou') + '</strong>';
      html += 'Resposta correta: <strong>' + esc(q.gabarito) + '</strong>. Sua resposta: <strong>' + esc(userAnswer) + '</strong>.';
      var fsInfo = AppState.questions[qid];
      if (fsInfo && fsInfo.proximaRevisao) html += ' Próxima revisão: <strong>' + esc(formatDateShort(fsInfo.proximaRevisao)) + '</strong>.';
      html += '</div>';
      var ex = q.explicacao || {};
      html += '<div class="explain-block"><h4>Por que a correta está correta</h4><p>' + esc(ex.correta || '') + '</p></div>';
      html += '<div class="explain-block"><h4>Por que as demais estão erradas</h4>';

  function renderQuestionResult() {
    var sess = window.__lastSession;
    if (!sess) return '<h1 class="page-title">Nenhum resultado disponível</h1><button class="btn btn-primary" data-nav="questoes">Ir para Questões</button>';
    var ids = sess.ids, total = ids.length;
    var acertos = 0, erros = 0;
    var porModulo = {}, porDificuldade = {}, porTipo = {};
    for (var i = 0; i < ids.length; i++) {
      var q = getQuestion(ids[i]);
      if (!q) continue;
      var resp = sess.respostas[ids[i]];
      var acertou = resp === q.gabarito;
      if (acertou) acertos++; else erros++;
      if (!porModulo[q.moduloId]) porModulo[q.moduloId] = { total: 0, acertos: 0 };
      porModulo[q.moduloId].total++; if (acertou) porModulo[q.moduloId].acertos++;
      var dl = difficultyLabel(q.dificuldade);
      if (!porDificuldade[dl]) porDificuldade[dl] = { total: 0, acertos: 0 };
      porDificuldade[dl].total++; if (acertou) porDificuldade[dl].acertos++;
      if (!porTipo[q.tipo]) porTipo[q.tipo] = { total: 0, acertos: 0 };
      porTipo[q.tipo].total++; if (acertou) porTipo[q.tipo].acertos++;
    }
    var pct = total > 0 ? Math.round((acertos / total) * 100) : 0;
    var modoLabel = '';
    if (sess.modo === 'revisao') modoLabel = 'Revisão';
    else if (sess.modo === 'erros') modoLabel = 'Caderno de Erros';
    var html = '';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;">';
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn" data-nav="questoes">← Questões</button>';
    if (modoLabel === 'Revisão') html += '<button class="btn" data-nav="revisao">🔁 Revisão</button>';
    if (modoLabel === 'Caderno de Erros') html += '<button class="btn" data-nav="erros">❌ Meus Erros</button>';
    html += '</div></div>';
    html += '<h1 class="page-title">Resultado da sessão' + (modoLabel ? ' — ' + esc(modoLabel) : '') + '</h1>';
    html += '<p class="page-subtitle">Sessão iniciada em ' + esc(formatDate(sess.startedAt)) + '</p>';
    html += '<div class="result-summary">';
    html += resultStat('Questões', total);
    html += resultStat('Acertos', acertos);
    html += resultStat('Erros', erros);
    html += resultStat('Aproveitamento', pct + '%');
    html += '</div>';
    html += '<h2 class="section-title">Desempenho por módulo</h2>';
    html += renderBreakdown(porModulo, function (k) { var m = getModule(k); return k + (m ? ' — ' + m.titulo : ''); });
    html += '<h2 class="section-title">Desempenho por dificuldade</h2>';
    html += renderBreakdown(porDificuldade, function (k) { return k; });
    html += '<h2 class="section-title">Desempenho por tipo de questão</h2>';
    html += renderBreakdown(porTipo, function (k) { return typeLabel(k); });
    html += '<h2 class="section-title">Detalhe por questão</h2>';
    for (var j = 0; j < ids.length; j++) {
      var qq = getQuestion(ids[j]);
      if (!qq) continue;
      var rr = sess.respostas[ids[j]];
      var ok = rr === qq.gabarito;
      html += '<div class="question-preview">';
      html += '<div class="qp-header"><span class="qp-id">' + esc(qq.id) + '</span>';
      html += '<span class="badge-pill ' + typeBadgeClass(qq.tipo) + '">' + esc(typeLabel(qq.tipo)) + '</span>';
      html += '<span class="qp-status ' + (ok ? 'qs-acerto' : 'qs-erro') + '">' + (ok ? '✓ Acerto' : '✗ Erro') + '</span></div>';
      html += '<div class="qp-text">' + esc(qq.enunciado) + '</div>';
      html += '<div class="qp-meta">Sua resposta: <strong>' + esc(rr || '—') + '</strong> · Gabarito: <strong>' + esc(qq.gabarito) + '</strong></div>';
      html += '</div>';
    }
    html += '<div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;">';
    html += '<button class="btn btn-primary" data-nav="questoes">Nova sessão →</button>';
    html += '</div>';
    html += footerHtml();
    return html;
  }
  function renderBreakdown(map, labelFn) {
    var html = '';
    for (var k in map) {
      if (!map.hasOwnProperty(k)) continue;
      var d = map[k];
      var pct = d.total > 0 ? Math.round((d.acertos / d.total) * 100) : 0;
      var status = pct >= 70 ? 'status-conhecido' : (pct >= 40 ? 'status-duvida' : 'status-desconhecido');
      html += '<div class="subtopic-result ' + status + '">';
      html += '<h3>' + esc(labelFn(k)) + '<span class="status-badge ' + status + '">' + pct + '%</span></h3>';
      html += '<div class="signals"><span>Acertos: <strong>' + d.acertos + '</strong> / ' + d.total + '</span></div>';
      html += '</div>';
    }
    return html;
  }

      if (!AppState.questions.hasOwnProperty(qid)) continue;

      acertos += qs.acertos;
    }
    var html = '';
    html += '<h1 class="page-title">Banco de Questões</h1>';

  function validateIncomingQuestion(q, existingIds) {
    var errors = [];
    if (!q || typeof q !== 'object') return ['Item não é objeto.'];
    if (!q.id) errors.push('Sem ID.');
    if (q.id && existingIds.indexOf(q.id) !== -1) errors.push('ID já existe (' + q.id + ').');
    if (q.tipo !== 'REAL' && q.tipo !== 'DIDATICA') errors.push('tipo deve ser REAL ou DIDATICA.');
    if (!q.enunciado) errors.push('Sem enunciado.');
    if (!Array.isArray(q.alternativas) || q.alternativas.length < 2) errors.push('Alternativas insuficientes.');
    else {
      var altIds = q.alternativas.map(function (a) { return a.id; });
      if (altIds.indexOf(q.gabarito) === -1) errors.push('Gabarito não corresponde a nenhuma alternativa.');
    }
    if (!q.explicacao || !q.explicacao.correta) errors.push('Explicação estruturada ausente (campo "correta").');
    if (!q.moduloId || !getModule(q.moduloId)) errors.push('moduloId inválido.');
    if (q.tipo === 'REAL') {
      if (!q.banca) errors.push('REAL sem banca.');
      if (!q.orgao) errors.push('REAL sem órgão.');
      if (!q.ano) errors.push('REAL sem ano.');
      if (!q.prova) errors.push('REAL sem prova.');
      if (!q.fonte || !q.fonte.descricao) errors.push('REAL sem fonte verificável.');
    }
    return errors;
  }
  function importQuestionsFromText(text) {
    var incoming;
    try { incoming = JSON.parse(text); }
    catch (e) { importReport = { status: 'err', title: 'JSON inválido', messages: [String(e.message)] }; render(); return; }
    if (!Array.isArray(incoming)) { importReport = { status: 'err', title: 'Esperado um array JSON', messages: [] }; render(); return; }
    var existingIds = QUESTIONS.map(function (q) { return q.id; });
    var aceitas = 0, rejeitadas = 0, messages = [];
    for (var i = 0; i < incoming.length; i++) {
      var q = incoming[i];
      var errs = validateIncomingQuestion(q, existingIds);
      if (errs.length > 0) { rejeitadas++; messages.push('Item ' + (i + 1) + ' (' + (q && q.id ? q.id : 'sem id') + '): ' + errs.join(' · ')); }
      else {
        if (!q.area && q.moduloId) { var mm = getModule(q.moduloId); if (mm) q.area = mm.area; }
        if (!q.subtema) q.subtema = '';
        if (!q.dificuldade) q.dificuldade = 2;
        if (!q.prioridade) q.prioridade = 'alta';
        if (!q.tags) q.tags = [];
        if (q.tipo === 'DIDATICA') { q.banca = undefined; q.orgao = undefined; q.ano = undefined; q.prova = undefined; q.fonte = undefined; }
        QUESTIONS.push(q); existingIds.push(q.id); aceitas++;
      }
    }
    if (aceitas > 0) importReport = { status: rejeitadas === 0 ? 'ok' : 'warn', title: aceitas + ' importada(s); ' + rejeitadas + ' rejeitada(s).', messages: messages };
    else importReport = { status: 'err', title: 'Nenhuma questão importada.', messages: messages };
    render();
  }

  function downloadJson(filename, dataObj) {
    try {
      var blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
    } catch (e) { window.alert('Falha ao exportar: ' + e.message); }
  }

  function renderSimulados() {
    var totalReal = qRealCount();

    var tipoOptions = '';

      var cls = 'sim-preview';

        cls += ' err';
        msg = '<strong>Defina uma quantidade válida.</strong>';

        cls += ' warn';

      } else {

      html += '<div style="margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;">';

      html += '<h3>Prova de concurso</h3>';

      html += '<label>Quantidade</label>';

      html += '<div class="sim-qty-pills">' + qtyPills + '</div>';

        html += '<div class="filter-row"><label>Quantidade</label>';

        html += '</div>';
      }
      html += '</div>';

      var clsR = 'sim-preview';
      var msgR = '';
      if (totalReal === 0) {
        clsR += ' err';
        msgR = '<strong>Nenhuma questão REAL cadastrada.</strong> Importe questões reais pelo <strong>Banco de Questões</strong> (com banca, órgão, ano, prova e fonte) para liberar esta modalidade.';
      } else if (realPool.length === 0) {
        clsR += ' warn';
        msgR = 'Existem ' + totalReal + ' questão(ões) REAL(is), mas nenhuma corresponde aos filtros atuais. Ajuste os filtros.';
      } else if (realPool.length < quantidadeAlvo()) {
        clsR += ' warn';
        msgR = 'Disponível: <strong>' + realPool.length + ' questão(ões) REAL(is)</strong>. Você pediu ' + quantidadeAlvo() + ' — serão usadas todas as disponíveis.';
      } else {
        msgR = 'Disponível: <strong>' + realPool.length + ' questão(ões) REAL(is)</strong>. Pronto para iniciar com ' + quantidadeAlvo() + '.';
      }
      html += '<div class="' + clsR + '">' + msgR + '</div>';

      html += '<div style="margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;">';
      html += '<button class="btn btn-primary btn-lg" data-action="start-prova-concurso"' + (realPool.length === 0 ? ' disabled' : '') + '>🏛️ Iniciar prova de concurso</button>';
      if (realPool.length === 0) {
        html += '<button class="btn btn-lg" data-action="start-simulado">🎯 Rodar como Simulado personalizado</button>';
      }
      html += '</div>';
    }

    html += '<h2 class="section-title">Histórico de simulados</h2>';

      html += '<div class="rev-empty">Nenhum simulado realizado ainda. Configure e clique em <strong>Iniciar simulado</strong>.</div>';

      html += '<div class="sim-hist-list">';
      for (var h = AppState.simulados.length - 1; h >= 0; h--) {
        var sim = AppState.simulados[h];
        var rr = sim.resultado;
        var clsScore = rr.percentual >= 70 ? 'good' : (rr.percentual >= 40 ? 'mid' : 'bad');

    html += footerHtml();

  function renderSimuladoRun() {
    if (!simuladoRunning) return '<h1 class="page-title">Simulado não iniciado</h1><button class="btn btn-primary" data-nav="simulados">Ir para Simulados</button>';
    var total = simuladoRunning.ids.length;
    var idx = simuladoRunning.index;
    var qid = simuladoRunning.ids[idx];
    var q = getQuestion(qid);
    if (!q) return '<h1 class="page-title">Questão não encontrada</h1><button class="btn" data-nav="simulados">← Simulados</button>';
    var userAnswer = simuladoRunning.respostas[qid];
    var respondidas = 0;
    for (var i = 0; i < total; i++) if (simuladoRunning.respostas[simuladoRunning.ids[i]] != null) respondidas++;
    var percent = Math.round((respondidas / total) * 100);
    var modoLbl = simuladoRunning.config.modo === 'PROVA_CONCURSO' ? 'Prova de concurso' : 'Simulado';

    var html = '';
    html += '<div class="run-toolbar">';
    html += '<div class="rt-info">';
    html += '<span class="sim-review-badge">' + esc(modoLbl) + '</span>';
    html += '<span>Questão ' + (idx + 1) + ' de ' + total + '</span>';
    html += '<span class="badge-pill ' + typeBadgeClass(q.tipo) + '">' + esc(typeLabel(q.tipo)) + '</span>';
    html += '<span class="badge-pill ' + (DIFFICULTY_CLASS[q.dificuldade] || '') + '">' + esc(difficultyLabel(q.dificuldade)) + '</span>';
    html += '<span style="color:var(--text-muted);">Respondidas: ' + respondidas + ' / ' + total + '</span>';
    html += '</div>';
    html += '<button class="btn" data-action="cancel-simulado">Cancelar simulado</button>';
    html += '</div>';

    html += '<div class="diag-progress"><div class="diag-progress-bar"><div class="diag-progress-fill sim" style="width:' + percent + '%"></div></div><div class="diag-progress-label">' + respondidas + ' / ' + total + '</div></div>';

    html += '<div class="q-card">';
    html += '<div class="q-head"><span class="q-id">' + esc(q.id) + '</span>';
    if (q.tipo === 'REAL') html += '<span style="font-size:12px;color:var(--text-muted);">' + esc(q.banca + ' · ' + q.orgao + ' · ' + q.ano + ' · ' + q.prova) + '</span>';
    else html += '<span style="font-size:12px;color:var(--text-muted);">' + esc(q.moduloId + ' · ' + q.subtema) + '</span>';
    html += '</div>';
    html += '<div class="q-statement">' + esc(q.enunciado) + '</div>';
    html += '<div class="q-options">';
    for (var a = 0; a < q.alternativas.length; a++) {
      var alt = q.alternativas[a];
      var cls = 'q-option';
      if (alt.id === userAnswer) cls += ' selected';
      html += '<button class="' + cls + '" data-action="sim-answer" data-alt="' + esc(alt.id) + '"><span class="opt-letter">' + esc(alt.id) + '</span><span>' + esc(alt.texto) + '</span></button>';
    }
    html += '</div>';
    if (userAnswer) {
      html += '<div style="margin-top:10px;font-size:13px;color:var(--text-muted);">Sua marcação: <strong>' + esc(userAnswer) + '</strong>. Você pode alterar enquanto o simulado não for finalizado. <button class="btn btn-ghost" style="font-size:12px;padding:4px 8px;" data-action="sim-clear-answer">Limpar marcação</button></div>';
    }

    html += '<div class="q-actions"><div>';
    if (idx > 0) html += '<button class="btn" data-action="sim-prev">← Anterior</button>';
    html += '</div><div>';
    if (idx < total - 1) html += '<button class="btn btn-primary" data-action="sim-next">Próxima →</button>';
    else html += '<button class="btn btn-purple" data-action="sim-finish">Finalizar simulado →</button>';
    html += '</div></div>';

    html += '</div>';

    html += '<div class="sim-card">';
    html += '<h3>Navegação rápida</h3>';
    html += '<p>Clique em um número para ir direto à questão. Em rosa: respondidas.</p>';
    html += '<div class="sim-quicknav">';
    for (var k = 0; k < total; k++) {
      var isAnswered = simuladoRunning.respostas[simuladoRunning.ids[k]] != null;
      var isCur = k === idx;
      var c = '';
      if (isAnswered) c += ' answered';
      if (isCur) c += ' current';
      html += '<button class="' + c.trim() + '" data-action="sim-goto" data-index="' + k + '">' + (k + 1) + '</button>';
    }
    html += '</div>';
    html += '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">';
    html += '<button class="btn btn-purple" data-action="sim-finish">Finalizar e corrigir →</button>';
    html += '</div>';
    html += '</div>';

    html += footerHtml();
    return html;
  }

    else if (r.percentual >= 60) reading = '<strong>Bom desempenho.</strong> ' + r.percentual + '% — você está na faixa competitiva. Revise os erros no <strong>Caderno de Erros</strong>.';
    else if (r.percentual >= 40) reading = '<strong>Atenção.</strong> Aproveitamento de ' + r.percentual + '%. Priorize revisão das questões erradas e das aulas dos módulos com pior desempenho.';
    else reading = '<strong>Foco urgente.</strong> Aproveitamento de ' + r.percentual + '%. Recomendo voltar às aulas e refazer os diagnósticos dos módulos com pior desempenho antes do próximo simulado.';

    html += '<h2 class="section-title">Desempenho por módulo</h2>';

    html += renderBreakdown(r.porTipo || {}, function (k) { return typeLabel(k); });

    html += '<h2 class="section-title">Detalhe por questão</h2>';
    for (var i = 0; i < sim.questoesIds.length; i++) {
      var q = getQuestion(sim.questoesIds[i]);
      if (!q) continue;
      var resp = sim.respostas[q.id];
      var correta = resp === q.gabarito;
      var clsStatus = resp == null ? 'qs-nova' : (correta ? 'qs-acerto' : 'qs-erro');
      var txtStatus = resp == null ? 'Em branco' : (correta ? '✓ Acerto' : '✗ Erro');
      html += '<div class="question-preview">';
      html += '<div class="qp-header"><span class="qp-id">' + esc(q.id) + '</span>';
      html += '<span class="badge-pill ' + typeBadgeClass(q.tipo) + '">' + esc(typeLabel(q.tipo)) + '</span>';
      html += '<span class="qp-status ' + clsStatus + '">' + esc(txtStatus) + '</span></div>';
      html += '<div class="qp-text">' + esc(q.enunciado) + '</div>';

      if (!correta && resp != null) {

        html += '<button class="btn btn-danger" data-action="revisar-questao-unica" data-question-id="' + esc(q.id) + '">Revisar esta questão</button>';
        html += '</div>';

      html += '</div>';
    }

    html += footerHtml();
    return html;
  }
