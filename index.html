    { id: 'Q-DID-DA-0051', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-09', subtema: 'Omissão', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a responsabilidade civil do Estado por OMISSÃO, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É sempre objetiva.' }, { id: 'B', texto: 'Em regra, é SUBJETIVA, exigindo comprovação de culpa do serviço (faute du service), salvo quando o Estado tinha o dever específico de agir para evitar o dano.' }, { id: 'C', texto: 'Não existe responsabilidade por omissão.' }, { id: 'D', texto: 'É sempre inexistente.' }], gabarito: 'B', explicacao: { correta: 'Em regra, a omissão gera responsabilidade SUBJETIVA (exige culpa do serviço). Exceção: quando há dever específico de agir (ex.: preso sob custódia do Estado) — aí é objetiva.', incorretas: { A: 'Em regra, não é objetiva.', C: 'Existe.', D: 'Existe.' }, conceitoCobrado: 'Responsabilidade por omissão.', pegadinha: 'Achar que é sempre objetiva.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'responsabilidade'] },
    { id: 'Q-DID-DA-0052', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-09', subtema: 'Pessoas abrangidas', dificuldade: 3, prioridade: 'média', enunciado: 'A responsabilidade objetiva do Estado (art. 37, §6º, CF) aplica-se:', alternativas: [{ id: 'A', texto: 'Apenas aos órgãos da Administração Direta.' }, { id: 'B', texto: 'Às pessoas jurídicas de direito público e às de direito privado prestadoras de serviços públicos.' }, { id: 'C', texto: 'A todas as empresas privadas.' }, { id: 'D', texto: 'Somente à União.' }], gabarito: 'B', explicacao: { correta: 'A responsabilidade objetiva aplica-se às pessoas jurídicas de DIREITO PÚBLICO e às de DIREITO PRIVADO prestadoras de SERVIÇOS PÚBLICOS (concessionárias, permissionárias).', incorretas: { A: 'Aplica-se também às entidades.', C: 'Só se prestam serviços públicos.', D: 'Aplica-se a todos os entes federativos.' }, conceitoCobrado: 'Abrangência da responsabilidade objetiva.', pegadinha: 'Achar que só a Direta responde.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'responsabilidade'] },
    { id: 'Q-DID-DA-0053', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-09', subtema: 'Culpa concorrente', dificuldade: 2, prioridade: 'media', enunciado: 'Sobre a culpa concorrente da vítima na responsabilidade civil do Estado, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Exclui totalmente a responsabilidade do Estado.' }, { id: 'B', texto: 'Não exclui a responsabilidade, mas reduz o valor da indenização.' }, { id: 'C', texto: 'Aumenta a indenização.' }, { id: 'D', texto: 'Não tem efeito.' }], gabarito: 'B', explicacao: { correta: 'CULPA CONCORRENTE: não exclui a responsabilidade; apenas REDUZ a indenização, pois a vítima também contribuiu para o dano.', incorretas: { A: 'Excluir totalmente só cabe com culpa EXCLUSIVA.', C: 'Reduz, não aumenta.', D: 'Tem efeito redutor.' }, conceitoCobrado: 'Culpa concorrente x exclusiva.', pegadinha: 'Confundir concorrente com exclusiva.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'responsabilidade'] },
    { id: 'Q-DID-DA-0054', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-10', subtema: 'Controle judicial', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre o controle judicial da Administração Pública, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'O Judiciário pode revogar atos administrativos por conveniência e oportunidade.' }, { id: 'B', texto: 'O Judiciário analisa apenas a LEGALIDADE do ato, não o mérito administrativo (salvo exceções legais).' }, { id: 'C', texto: 'O Judiciário substitui a Administração.' }, { id: 'D', texto: 'Não existe controle judicial.' }], gabarito: 'B', explicacao: { correta: 'O Judiciário examina apenas a LEGALIDADE, não o MÉRITO. O Judiciário ANULA atos ilegais, mas NÃO revoga atos por conveniência.', incorretas: { A: 'Judiciário não revoga.', C: 'Não substitui a Administração.', D: 'Existe.' }, conceitoCobrado: 'Limites do controle judicial.', pegadinha: 'Achar que o Judiciário analisa mérito.', comoApareceEmConcurso: 'Alta frequência em DA.' }, tags: ['DA', 'controle'] },
    { id: 'Q-DID-DA-0055', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-10', subtema: 'Tribunais de Contas', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre os Tribunais de Contas, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'São órgãos do Poder Judiciário.' }, { id: 'B', texto: 'São órgãos auxiliares do Poder Legislativo, com autonomia e funções próprias, exercendo controle externo técnico.' }, { id: 'C', texto: 'São subordinados ao Executivo.' }, { id: 'D', texto: 'São autarquias.' }], gabarito: 'B', explicacao: { correta: 'Tribunais de Contas: órgãos AUXILIARES do Poder LEGISLATIVO, com autonomia e competências próprias. Não são subordinados ao Legislativo nem integram o Judiciário.', incorretas: { A: 'Não são do Judiciário.', C: 'Não são subordinados ao Executivo.', D: 'Não são autarquias.' }, conceitoCobrado: 'Natureza dos Tribunais de Contas.', pegadinha: 'Achar que integram o Judiciário.', comoApareceEmConcurso: 'Cobrado em DA e AP.' }, tags: ['DA', 'controle', 'TC'] },
    { id: 'Q-DID-DA-0056', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-10', subtema: 'Controle legislativo', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre o controle legislativo, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'O Congresso julga as contas do Presidente sem auxílio de outro órgão.' }, { id: 'B', texto: 'O Congresso exerce o controle externo com auxílio do Tribunal de Contas, que emite parecer prévio sobre as contas do Presidente.' }, { id: 'C', texto: 'O controle legislativo substitui o controle judicial.' }, { id: 'D', texto: 'O Congresso pode revogar atos discricionários da Administração.' }], gabarito: 'B', explicacao: { correta: 'O Congresso exerce controle externo com AUXÍLIO do TC (art. 71, CF). O TC emite parecer prévio; o julgamento é do Congresso.', incorretas: { A: 'Depende do auxílio do TC.', C: 'Não substitui.', D: 'Revogação é competência da Administração.' }, conceitoCobrado: 'Controle legislativo e Tribunais de Contas.', pegadinha: 'Achar que o Congresso julga sozinho.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'controle'] },
    { id: 'Q-DID-DA-0057', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-10', subtema: 'Controle interno', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre o controle interno, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É exercido por outro Poder.' }, { id: 'B', texto: 'É exercido dentro da própria estrutura do órgão, por órgãos como corregedorias e controladorias.' }, { id: 'C', texto: 'É exercido apenas pelo Judiciário.' }, { id: 'D', texto: 'É exercido exclusivamente por Tribunal de Contas.' }], gabarito: 'B', explicacao: { correta: 'Controle INTERNO: dentro da própria estrutura (corregedoria, controladoria, CGU). É o autocontrole.', incorretas: { A: 'Isso é controle externo.', C: 'Não é pelo Judiciário.', D: 'TC é controle externo.' }, conceitoCobrado: 'Controle interno x externo.', pegadinha: 'Confundir com externo.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'controle'] },
    { id: 'Q-DID-DA-0058', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-10', subtema: 'Autotutela', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a autotutela administrativa, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Depende de autorização do Judiciário.' }, { id: 'B', texto: 'Permite à Administração anular seus atos ilegais e revogar os inconvenientes (Súmulas 346 e 473/STF), sem necessidade de autorização judicial.' }, { id: 'C', texto: 'Só existe na esfera federal.' }, { id: 'D', texto: 'É vedada pela CF.' }], gabarito: 'B', explicacao: { correta: 'AUTOTUTELA: a Administração pode ANULAR atos ilegais e REVOGAR atos inconvenientes (Súmulas 346 e 473/STF), sem autorização judicial.', incorretas: { A: 'Não depende de autorização judicial.', C: 'Aplica-se a todas as esferas.', D: 'É reconhecida e pacífica.' }, conceitoCobrado: 'Autotutela.', pegadinha: 'Achar que depende do Judiciário.', comoApareceEmConcurso: 'Cobrado em DA e AP.' }, tags: ['DA', 'controle', 'autotutela'] },
    { id: 'Q-DID-DA-0059', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-11', subtema: 'Modalidades', dificuldade: 2, prioridade: 'alta', enunciado: 'São modalidades de atos de improbidade administrativa previstas na Lei 8.429/1992:', alternativas: [{ id: 'A', texto: 'Enriquecimento ilícito, prejuízo ao erário e violação de princípios.' }, { id: 'B', texto: 'Crime de responsabilidade, prevaricação e peculato.' }, { id: 'C', texto: 'Dano ambiental, desvio de finalidade e abuso de autoridade.' }, { id: 'D', texto: 'Corrupção ativa, corrupção passiva e concussão.' }], gabarito: 'A', explicacao: { correta: 'Modalidades: ENRIQUECIMENTO ILÍCITO (art. 9º), PREJUÍZO AO ERÁRIO (art. 10) e VIOLAÇÃO DE PRINCÍPIOS (art. 11).', incorretas: { B: 'São crimes.', C: 'São conceitos diversos.', D: 'São crimes.' }, conceitoCobrado: 'Modalidades de improbidade.', pegadinha: 'Confundir com crimes.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'improbidade'] },
    { id: 'Q-DID-DA-0060', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-11', subtema: 'Dolo x culpa', dificuldade: 3, prioridade: 'alta', enunciado: 'Após a Lei 14.230/2021, a improbidade administrativa:', alternativas: [{ id: 'A', texto: 'Pode ser configurada por ato culposo, bastando a inobservância de dever legal.' }, { id: 'B', texto: 'Exige DOLO (intenção) — a modalidade culposa foi extinta.' }, { id: 'C', texto: 'Não existe mais no ordenamento.' }, { id: 'D', texto: 'Só se aplica a agentes políticos.' }], gabarito: 'B', explicacao: { correta: 'Após a Lei 14.230/2021, a improbidade exige DOLO. A modalidade CULPOSA foi EXTINTA.', incorretas: { A: 'Não basta culpa.', C: 'Continua existindo.', D: 'Aplica-se a agentes públicos em geral.' }, conceitoCobrado: 'Dolo após Lei 14.230/2021.', pegadinha: 'Achar que culpa basta.', comoApareceEmConcurso: 'Cobrado em DA pós-2021.' }, tags: ['DA', 'improbidade'] },
    { id: 'Q-DID-DA-0061', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-11', subtema: 'Sujeitos', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre os sujeitos da improbidade administrativa, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Apenas servidores efetivos respondem por improbidade.' }, { id: 'B', texto: 'Agentes públicos de qualquer natureza e terceiros que induzam, concorram ou se beneficiem podem ser responsabilizados.' }, { id: 'C', texto: 'Somente agentes políticos.' }, { id: 'D', texto: 'Particulares nunca respondem.' }], gabarito: 'B', explicacao: { correta: 'Sujeitos ativos: AGENTES PÚBLICOS de qualquer natureza e TERCEIROS que induzam, concorram ou se beneficiem.', incorretas: { A: 'Vai além de servidores efetivos.', C: 'Também servidores e terceiros.', D: 'Particulares podem responder.' }, conceitoCobrado: 'Sujeitos da improbidade.', pegadinha: 'Achar que só servidor efetivo.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'improbidade'] },
    { id: 'Q-DID-DA-0062', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-11', subtema: 'Sanções', dificuldade: 3, prioridade: 'alta', enunciado: 'São sanções previstas para atos de improbidade administrativa:', alternativas: [{ id: 'A', texto: 'Apenas multa.' }, { id: 'B', texto: 'Perda dos bens ilícitos, ressarcimento integral, perda da função pública, suspensão dos direitos políticos, multa civil e proibição de contratar com o poder público.' }, { id: 'C', texto: 'Prisão perpétua.' }, { id: 'D', texto: 'Nenhuma sanção está prevista.' }], gabarito: 'B', explicacao: { correta: 'Sanções: perda dos bens ilícitos, ressarcimento, perda da função, suspensão dos direitos políticos, multa civil e proibição de contratar com o poder público.', incorretas: { A: 'Vai muito além.', C: 'Prisão perpétua é vedada no Brasil.', D: 'Há sanções previstas.' }, conceitoCobrado: 'Sanções por improbidade.', pegadinha: 'Reduzir a apenas multa.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'improbidade'] },
    { id: 'Q-DID-DA-0063', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-11', subtema: 'Legitimidade', dificuldade: 3, prioridade: 'media', enunciado: 'Sobre a legitimidade para propor ação de improbidade administrativa, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Qualquer cidadão pode propor sozinho.' }, { id: 'B', texto: 'A ação é proposta pelo Ministério Público, admitindo-se a participação de pessoa jurídica interessada como assistente.' }, { id: 'C', texto: 'Só o Presidente da República pode propor.' }, { id: 'D', texto: 'Não há previsão legal.' }], gabarito: 'B', explicacao: { correta: 'Após a Lei 14.230/2021, a legitimidade ativa é do MINISTÉRIO PÚBLICO. A pessoa jurídica interessada pode atuar como assistente.', incorretas: { A: 'Cidadão não tem legitimidade isolada.', C: 'Não é do Presidente.', D: 'Há previsão legal.' }, conceitoCobrado: 'Legitimidade ativa na improbidade.', pegadinha: 'Achar que cidadão pode propor sozinho.', comoApareceEmConcurso: 'Cobrado em DA pós-2021.' }, tags: ['DA', 'improbidade'] },
    { id: 'Q-DID-DA-0064', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-11', subtema: 'Prescrição', dificuldade: 3, prioridade: 'media', enunciado: 'Sobre a prescrição da ação de improbidade administrativa, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Nunca prescreve.' }, { id: 'B', texto: 'Em regra, prescreve em 8 anos, contados do fato ou do término do mandato, conforme o caso.' }, { id: 'C', texto: 'Prescreve em 1 ano.' }, { id: 'D', texto: 'Prescreve em 20 anos.' }], gabarito: 'B', explicacao: { correta: 'Prescrição: em regra, 8 anos, contados do fato ou do término do mandato, conforme o caso (art. 23 da Lei 8.429/1992, com a Lei 14.230/2021).', incorretas: { A: 'Prescreve.', C: 'Não é 1 ano.', D: 'Não é 20 anos.' }, conceitoCobrado: 'Prescrição da improbidade.', pegadinha: 'Confundir prazos.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'improbidade'] },
    { id: 'Q-DID-DA-0065', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-12', subtema: 'Fases do processo administrativo', dificuldade: 2, prioridade: 'alta', enunciado: 'São fases típicas do processo administrativo:', alternativas: [{ id: 'A', texto: 'Instauração, instrução, defesa, relatório e decisão.' }, { id: 'B', texto: 'Súmula, acórdão, sentença e recurso.' }, { id: 'C', texto: 'Denúncia, julgamento e prisão.' }, { id: 'D', texto: 'Consulta, parecer e revogação.' }], gabarito: 'A', explicacao: { correta: 'Fases do processo administrativo: INSTAURAÇÃO, INSTRUÇÃO, DEFESA, RELATÓRIO e DECISÃO. O recurso é etapa posterior facultativa.', incorretas: { B: 'Termos judiciais.', C: 'Termos penais.', D: 'Termos diversos.' }, conceitoCobrado: 'Fases do processo administrativo.', pegadinha: 'Confundir com processo judicial.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'processo'] },
    { id: 'Q-DID-DA-0066', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-12', subtema: 'Contraditório e ampla defesa', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre o contraditório e a ampla defesa no processo administrativo, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'São dispensáveis quando a falta está comprovada por documentos.' }, { id: 'B', texto: 'São OBRIGATÓRIOS, conforme art. 5º, LV, da CF/88 e a Lei 9.784/1999.' }, { id: 'C', texto: 'Só se aplicam em processos judiciais.' }, { id: 'D', texto: 'Só se aplicam a servidores efetivos.' }], gabarito: 'B', explicacao: { correta: 'Contraditório e ampla defesa são OBRIGATÓRIOS no processo administrativo (art. 5º, LV, CF/88). A Súmula Vinculante 5 do STF reforça essa garantia.', incorretas: { A: 'São sempre obrigatórios.', C: 'Aplicam-se também ao administrativo.', D: 'Aplicam-se a todos os interessados.' }, conceitoCobrado: 'Contraditório e ampla defesa.', pegadinha: 'Achar que pode punir sem defesa.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'processo'] },
    { id: 'Q-DID-DA-0067', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-12', subtema: 'Recursos', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre o pedido de reconsideração e o recurso hierárquico, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'São sinônimos.' }, { id: 'B', texto: 'Pedido de reconsideração: dirigido à MESMA autoridade que praticou o ato. Recurso hierárquico: dirigido à autoridade SUPERIOR.' }, { id: 'C', texto: 'Ambos vão ao Judiciário.' }, { id: 'D', texto: 'Nenhum existe no processo administrativo.' }], gabarito: 'B', explicacao: { correta: 'RECONSIDERAÇÃO: mesma autoridade. RECURSO HIERÁRQUICO: autoridade superior.', incorretas: { A: 'São distintos.', C: 'São recursos administrativos, não judiciais.', D: 'Ambos existem.' }, conceitoCobrado: 'Recursos administrativos.', pegadinha: 'Confundir os dois.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'processo', 'recursos'] },
    { id: 'Q-DID-DA-0068', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-12', subtema: 'Prazo decadencial', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre o prazo decadencial para a Administração anular ato administrativo favorável ao destinatário, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É de 1 ano.' }, { id: 'B', texto: 'É de 5 anos, salvo comprovada má-fé (art. 54 da Lei 9.784/1999).' }, { id: 'C', texto: 'É de 10 anos.' }, { id: 'D', texto: 'Não há prazo.' }], gabarito: 'B', explicacao: { correta: 'Prazo DECADENCIAL: 5 ANOS (art. 54, Lei 9.784/1999), salvo má-fé. Após esse prazo, o ato se consolida.', incorretas: { A: 'Não é 1 ano.', C: 'Não é 10 anos.', D: 'Há prazo.' }, conceitoCobrado: 'Prazo decadencial.', pegadinha: 'Confundir com 10 anos.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'processo', 'prazo'] },
    { id: 'Q-DID-DA-0069', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-12', subtema: 'Princípios', dificuldade: 2, prioridade: 'alta', enunciado: 'São princípios previstos na Lei 9.784/1999:', alternativas: [{ id: 'A', texto: 'Apenas legalidade e eficiência.' }, { id: 'B', texto: 'Legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público e eficiência.' }, { id: 'C', texto: 'Somente contraditório e ampla defesa.' }, { id: 'D', texto: 'Sigilo absoluto e ausência de motivação.' }], gabarito: 'B', explicacao: { correta: 'A Lei 9.784/1999 (art. 2º) elenca: legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público e eficiência.', incorretas: { A: 'Vai além.', C: 'Vai além.', D: 'Sigilo absoluto é vedado.' }, conceitoCobrado: 'Princípios do processo administrativo.', pegadinha: 'Reduzir a poucos princípios.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'processo'] },
    { id: 'Q-DID-DA-0070', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-12', subtema: 'Instauração', dificuldade: 2, prioridade: 'media', enunciado: 'Sobre a instauração do processo administrativo, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Só pode ocorrer a requerimento do interessado.' }, { id: 'B', texto: 'Pode ocorrer de OFÍCIO ou a REQUERIMENTO do interessado.' }, { id: 'C', texto: 'Só pode ocorrer por ordem judicial.' }, { id: 'D', texto: 'Depende de autorização do Ministério Público.' }], gabarito: 'B', explicacao: { correta: 'O processo administrativo pode ser instaurado DE OFÍCIO (pela própria Administração) ou A REQUERIMENTO do interessado.', incorretas: { A: 'Também de ofício.', C: 'Não depende do Judiciário.', D: 'Não depende do MP.' }, conceitoCobrado: 'Instauração do processo.', pegadinha: 'Achar que só a requerimento.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'processo'] },
    { id: 'Q-DID-DA-0071', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-13', subtema: 'Classificação dos bens', dificuldade: 2, prioridade: 'alta', enunciado: 'Uma praça pública e um terreno abandonado sem destinação específica são, respectivamente, bens públicos:', alternativas: [{ id: 'A', texto: 'De uso especial e de uso comum.' }, { id: 'B', texto: 'De uso comum e dominical.' }, { id: 'C', texto: 'Dominical e de uso especial.' }, { id: 'D', texto: 'De uso especial e dominical.' }], gabarito: 'B', explicacao: { correta: 'Praça = bem de USO COMUM DO POVO. Terreno abandonado = bem DOMINICAL.', incorretas: { A: 'Inverte.', C: 'Inverte.', D: 'Inverte.' }, conceitoCobrado: 'Classificação dos bens quanto à destinação.', pegadinha: 'Confundir as categorias.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'bens'] },
    { id: 'Q-DID-DA-0072', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-13', subtema: 'Regime jurídico', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre o regime jurídico dos bens públicos, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'São, em regra, alienáveis, penhoráveis e usucapíveis.' }, { id: 'B', texto: 'São, em regra, INALIENÁVEIS (enquanto mantida a destinação), IMPENHORÁVEIS e IMPRESCRITÍVEIS (não podem ser usucapidos).' }, { id: 'C', texto: 'Podem ser usucapidos como bens privados.' }, { id: 'D', texto: 'Podem ser penhorados em qualquer hipótese.' }], gabarito: 'B', explicacao: { correta: 'Bens públicos: INALIENÁVEIS (enquanto mantida a destinação), IMPENHORÁVEIS e IMPRESCRITÍVEIS. Bens DOMINICAIS podem ser alienados, cumpridos os requisitos.', incorretas: { A: 'Isso vale para bens privados.', C: 'Não podem ser usucapidos.', D: 'Não podem ser penhorados.' }, conceitoCobrado: 'Regime jurídico dos bens públicos.', pegadinha: 'Confundir com bens privados.', comoApareceEmConcurso: 'Alta frequência em DA.' }, tags: ['DA', 'bens'] },
    { id: 'Q-DID-DA-0073', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-13', subtema: 'Uso por particulares', dificuldade: 3, prioridade: 'alta', enunciado: 'A instalação de banca de jornal em calçada pública, autorizada por ato unilateral, discricionário e precário, sem licitação, configura:', alternativas: [{ id: 'A', texto: 'Concessão de uso.' }, { id: 'B', texto: 'Permissão de uso.' }, { id: 'C', texto: 'Autorização de uso.' }, { id: 'D', texto: 'Cessão de uso.' }], gabarito: 'C', explicacao: { correta: 'AUTORIZAÇÃO DE USO: ato unilateral, discricionário, precário, SEM licitação, para uso episódico (ex.: banca de jornal).', incorretas: { A: 'Concessão é contrato, com licitação.', B: 'Permissão é ato unilateral, mas com licitação.', D: 'Cessão é uso gratuito entre órgãos.' }, conceitoCobrado: 'Uso de bem público por particular.', pegadinha: 'Confundir autorização com permissão.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'bens'] },
    { id: 'Q-DID-DA-0074', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-13', subtema: 'Alienação', dificuldade: 3, prioridade: 'alta', enunciado: 'A alienação de bens públicos imóveis exige, em regra:', alternativas: [{ id: 'A', texto: 'Apenas decisão do chefe do Executivo.' }, { id: 'B', texto: 'Desafetação (se necessário), avaliação prévia, autorização legal e licitação.' }, { id: 'C', texto: 'Apenas avaliação prévia.' }, { id: 'D', texto: 'Nada além de registro em cartório.' }], gabarito: 'B', explicacao: { correta: 'Alienação de bens imóveis exige: DESAFETAÇÃO (se afetado), AVALIAÇÃO, AUTORIZAÇÃO LEGAL e LICITAÇÃO (Lei 14.133/2021), salvo hipóteses legais específicas.', incorretas: { A: 'Vai muito além.', C: 'Falta autorização legal e licitação.', D: 'Vai além do registro.' }, conceitoCobrado: 'Requisitos para alienação.', pegadinha: 'Reduzir a uma só exigência.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'bens'] },
    { id: 'Q-DID-DA-0075', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-13', subtema: 'Afetação', dificuldade: 2, prioridade: 'media', enunciado: 'Sobre afetação e desafetação de bens públicos, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'São sinônimos.' }, { id: 'B', texto: 'AFETAÇÃO: o bem passa a ter destinação pública. DESAFETAÇÃO: o bem deixa de ter destinação pública.' }, { id: 'C', texto: 'Afetação é alienação.' }, { id: 'D', texto: 'Não existem esses conceitos.' }], gabarito: 'B', explicacao: { correta: 'AFETAÇÃO: dar destinação pública ao bem (ex.: terreno vira escola). DESAFETAÇÃO: retirar a destinação (ex.: escola desativada vira bem dominical).', incorretas: { A: 'São distintos.', C: 'Não é alienação.', D: 'São conceitos da doutrina.' }, conceitoCobrado: 'Afetação x desafetação.', pegadinha: 'Confundir com alienação.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'bens'] },
    { id: 'Q-DID-DA-0076', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-13', subtema: 'Bens de uso comum', dificuldade: 2, prioridade: 'media', enunciado: 'São exemplos de bens públicos de uso comum do povo:', alternativas: [{ id: 'A', texto: 'Escolas e hospitais públicos.' }, { id: 'B', texto: 'Ruas, praças, rios e praias.' }, { id: 'C', texto: 'Terrenos devolutos.' }, { id: 'D', texto: 'Veículos oficiais.' }], gabarito: 'B', explicacao: { correta: 'Bens de USO COMUM: destinados ao uso da coletividade em geral (ruas, praças, rios, praias).', incorretas: { A: 'Escolas e hospitais são de USO ESPECIAL.', C: 'Terrenos devolutos são DOMINICAIS.', D: 'Veículos oficiais são bens móveis de uso administrativo.' }, conceitoCobrado: 'Bens de uso comum.', pegadinha: 'Confundir uso comum com uso especial.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'bens'] },
    { id: 'Q-DID-DA-0077', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-14', subtema: 'Formas de intervenção', dificuldade: 2, prioridade: 'alta', enunciado: 'A restrição geral, gratuita e unilateral imposta pelo Estado ao uso da propriedade, em favor do interesse público, é chamada de:', alternativas: [{ id: 'A', texto: 'Desapropriação.' }, { id: 'B', texto: 'Limitação administrativa.' }, { id: 'C', texto: 'Servidão administrativa.' }, { id: 'D', texto: 'Requisição administrativa.' }], gabarito: 'B', explicacao: { correta: 'LIMITAÇÃO ADMINISTRATIVA: restrição GERAL, gratuita e unilateral (ex.: zoneamento, gabarito de altura). Não retira a propriedade.', incorretas: { A: 'Desapropriação retira a propriedade.', C: 'Servidão é ônus específico.', D: 'Requisição é uso temporário.' }, conceitoCobrado: 'Limitação administrativa.', pegadinha: 'Confundir limitação com servidão.', comoApareceEmConcurso: 'Alta frequência em DA.' }, tags: ['DA', 'intervenção'] },
    { id: 'Q-DID-DA-0078', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-14', subtema: 'Desapropriação extraordinária', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a desapropriação extraordinária (art. 243 da CF/88), é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É indenizada em dinheiro, com valor de mercado.' }, { id: 'B', texto: 'Recai sobre imóveis com cultivo de plantas psicotrópicas e NÃO gera indenização ao proprietário.' }, { id: 'C', texto: 'É indenizada com TDA.' }, { id: 'D', texto: 'É indenizada com títulos da dívida pública.' }], gabarito: 'B', explicacao: { correta: 'DESAPROPRIAÇÃO EXTRAORDINÁRIA (art. 243, CF): recai sobre imóveis com cultivo ilegal de plantas psicotrópicas e NÃO gera indenização. Também prevê confisco dos bens.', incorretas: { A: 'Não é indenizada em dinheiro.', C: 'TDA é da desapropriação sancionatória rural (art. 184).', D: 'Títulos da dívida pública são da urbanística (art. 182, §4º, III).' }, conceitoCobrado: 'Tipos de desapropriação.', pegadinha: 'Confundir com a ordinária.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'intervenção'] },
    { id: 'Q-DID-DA-0079', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-14', subtema: 'Requisição administrativa', dificuldade: 2, prioridade: 'alta', enunciado: 'Durante uma calamidade pública, o Estado usa temporariamente um galpão particular para abrigar vítimas. A forma de intervenção é:', alternativas: [{ id: 'A', texto: 'Desapropriação ordinária.' }, { id: 'B', texto: 'Tombamento.' }, { id: 'C', texto: 'Requisição administrativa.' }, { id: 'D', texto: 'Limitação administrativa.' }], gabarito: 'C', explicacao: { correta: 'REQUISIÇÃO ADMINISTRATIVA: uso TEMPORÁRIO de bem em caso de PERIGO PÚBLICO IMINENTE (art. 5º, XXV, CF), com indenização POSTERIOR se houver dano.', incorretas: { A: 'Desapropriação é definitiva.', B: 'Tombamento preserva patrimônio.', D: 'Limitação restringe genericamente.' }, conceitoCobrado: 'Requisição administrativa.', pegadinha: 'Confundir com desapropriação.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'intervenção'] },
    { id: 'Q-DID-DA-0080', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-14', subtema: 'Desapropriação sancionatória', dificuldade: 3, prioridade: 'alta', enunciado: 'A desapropriação de imóvel rural que não cumpre sua função social (art. 184, CF) é indenizada com:', alternativas: [{ id: 'A', texto: 'Dinheiro exclusivamente.' }, { id: 'B', texto: 'Títulos da Dívida Agrária (TDA), ressalvadas as benfeitorias úteis e necessárias em dinheiro.' }, { id: 'C', texto: 'Títulos da Dívida Pública.' }, { id: 'D', texto: 'Sem qualquer indenização.' }], gabarito: 'B', explicacao: { correta: 'Desapropriação SANCIONATÓRIA (art. 184): indenização com TDA, ressalvando as benfeitorias úteis e necessárias, que são pagas em dinheiro.', incorretas: { A: 'Não é em dinheiro, exceto benfeitorias.', C: 'Títulos da dívida pública são da urbanística (art. 182, §4º, III).', D: 'Sem indenização é só a extraordinária (art. 243).' }, conceitoCobrado: 'Tipos de desapropriação.', pegadinha: 'Confundir TDA com títulos da dívida pública.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'intervenção'] },
    { id: 'Q-DID-DA-0081', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-14', subtema: 'Servidão x limitação', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a diferença entre servidão administrativa e limitação administrativa, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'São sinônimos.' }, { id: 'B', texto: 'SERVIDÃO: ônus real ESPECÍFICO, imposto a um ou poucos proprietários, com indenização se houver dano. LIMITAÇÃO: restrição GERAL e gratuita.' }, { id: 'C', texto: 'Limitação é específica e servidão é geral.' }, { id: 'D', texto: 'Servidão sempre indeniza integralmente.' }], gabarito: 'B', explicacao: { correta: 'SERVIDÃO: ônus real específico (ex.: passagem de rede elétrica em terreno específico), indeniza se houver dano. LIMITAÇÃO: restrição geral (ex.: zoneamento) e, em regra, gratuita.', incorretas: { A: 'São distintas.', C: 'Inverte.', D: 'Indeniza apenas se houver dano.' }, conceitoCobrado: 'Servidão x limitação.', pegadinha: 'Confundir as duas.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'intervenção'] },
    { id: 'Q-DID-DA-0082', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-14', subtema: 'Tombamento', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre o tombamento, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Sempre gera indenização integral ao proprietário.' }, { id: 'B', texto: 'É a forma de intervenção que visa preservar bens de valor histórico, cultural, artístico ou paisagístico, em regra gratuita, com indenização apenas se houver esvaziamento do conteúdo econômico.' }, { id: 'C', texto: 'Só se aplica a bens móveis.' }, { id: 'D', texto: 'É sinônimo de desapropriação.' }], gabarito: 'B', explicacao: { correta: 'TOMBAMENTO: preservação de bens de valor histórico, cultural, artístico ou paisagístico (Decreto-Lei 25/1937). Em regra, gratuito; indeniza só se esvaziar o conteúdo econômico.', incorretas: { A: 'Não gera indenização integral.', C: 'Aplica-se a bens móveis e imóveis.', D: 'É diferente de desapropriação.' }, conceitoCobrado: 'Tombamento.', pegadinha: 'Achar que sempre indeniza.', comoApareceEmConcurso: 'Cobrado em DA.' }, tags: ['DA', 'intervenção'] },
  ];

  var FLASHCARDS = [
    { id: 'F-ADM-01-0001', moduloId: 'ADM-01', topicoId: 'ADM-01', frente: 'O que é Administração?', verso: 'Processo de tomar decisões sobre recursos (humanos, materiais, financeiros, informacionais e tecnológicos) para alcançar objetivos organizacionais.', dificuldade: 1, tags: ['fundamentos'] },
    { id: 'F-ADM-01-0002', moduloId: 'ADM-01', topicoId: 'ADM-01', frente: 'Defina eficiência.', verso: 'Fazer bem, com o mínimo de recursos e o menor desperdício possível. Está ligada ao COMO.', dificuldade: 1, tags: ['eficiência'] },
    { id: 'F-ADM-01-0003', moduloId: 'ADM-01', topicoId: 'ADM-01', frente: 'Defina eficácia.', verso: 'Atingir o objetivo/meta proposto. Está ligada ao QUÊ.', dificuldade: 1, tags: ['eficácia'] },
