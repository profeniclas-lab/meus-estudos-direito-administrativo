    'DA-03': {
      id: 'L-DA-03',
      moduloId: 'DA-03',
      objetivo: 'Compreender a organização administrativa do Estado: centralização, descentralização, concentração e desconcentração; distinguir Administração Direta e Indireta; e aplicar o regime jurídico de cada entidade.',
      prerequisitos: ['DA-01'],
      introducao: 'A Administração Pública não é um bloco único. Ela se organiza em órgãos e entidades, com diferentes regimes jurídicos. Compreender essa organização é base para entender licitação, contratos, pessoal e controle.',
      explicacaoSimples: 'Imagine que o Estado é uma empresa gigante. A matriz é a Administração Direta (ministérios, secretarias). Ela cria "filiais" com CNPJ próprio — as autarquias, fundações, empresas públicas e sociedades de economia mista — para executar serviços especializados. Todo esse conjunto organizado é a organização administrativa.',
      explicacaoTecnica: 'A organização administrativa estuda COMO o Estado se estrutura para executar suas funções. INSTITUTOS: (1) CENTRALIZAÇÃO — o Estado executa diretamente, sem criar outra pessoa jurídica. (2) DESCENTRALIZAÇÃO — o Estado cria outra pessoa jurídica (autarquia, empresa pública etc.) ou delega a particular (concessão, permissão). Subdivide-se em: OUTORGA (transfere a titularidade e a execução a uma entidade da Administração Indireta, criada por lei) e DELEGAÇÃO (transfere apenas a execução a um particular, mantendo a titularidade — ex.: concessão de serviço público). (3) CONCENTRAÇÃO — o Estado reúne competências em um único órgão (raro). (4) DESCONCENTRAÇÃO — distribuição interna de competências dentro da MESMA pessoa jurídica (ex.: ministério cria delegacias regionais — não cria nova pessoa jurídica). ADMINISTRAÇÃO DIRETA: órgãos internos dos Poderes (sem personalidade). ADMINISTRAÇÃO INDIRETA: entidades com personalidade jurídica própria (autarquias, fundações, empresas públicas, SEM).',
      exemplos: [
        'Desconcentração: o Ministério da Saúde cria uma Coordenação Regional no Nordeste — mesmo CNPJ, apenas divisão interna.',
        'Descentralização por outorga: criação do INSS como autarquia federal para gerir a previdência.',
        'Descentralização por delegação: concessão de serviço de transporte público a uma empresa privada.',
        'Administração Direta: Presidência, ministérios, secretarias.',
        'Administração Indireta: INSS, IBGE, Caixa, Petrobras.'
      ],
      comparacoes: [
        { termoA: 'Desconcentração', termoB: 'Descentralização', diferenca: 'DESCONCENTRAÇÃO: dentro da MESMA pessoa jurídica — apenas distribuição de competências (ministério cria delegacia regional). DESCENTRALIZAÇÃO: criação de NOVA pessoa jurídica (outorga) ou delegação a particular (delegação). Só há descentralização quando há MAIS DE UMA pessoa jurídica envolvida.' },
        { termoA: 'Outorga', termoB: 'Delegação', diferenca: 'OUTORGA: o Estado transfere a TITULARIDADE e a EXECUÇÃO a uma entidade da Administração Indireta (criada por lei) — ex.: autarquia. DELEGAÇÃO: o Estado transfere apenas a EXECUÇÃO a um particular, mantendo a titularidade — ex.: concessão e permissão de serviço público.' },
        { termoA: 'Administração Direta', termoB: 'Administração Indireta', diferenca: 'DIRETA: órgãos internos, sem personalidade jurídica (ministérios, secretarias). INDIRETA: entidades com personalidade própria (autarquias, fundações, empresas públicas, SEM). Ambas compõem a Administração Pública formal.' }
      ],
      aplicacaoAdministracaoPublica: 'A organização administrativa fundamenta todo o Direito Administrativo. O Decreto-Lei 200/1967 estabelece princípios de planejamento, coordenação, descentralização e controle. O art. 37, XIX e XX, CF exige lei para criação/autorização de entidades. As agências reguladoras (ANVISA, ANATEL, ANEEL) são autarquias em regime especial. As organizações sociais (OS) e as OSCIPs são entidades privadas que atuam em colaboração com o Estado — não integram a Administração Indireta.',
      pegadinhas: [
        'Confundir descentralização com desconcentração. Descentralização = outra pessoa jurídica. Desconcentração = dentro da mesma.',
        'Trocar outorga e delegação. Outorga: titularidade + execução a entidade pública. Delegação: só execução a particular.',
        'Dizer que TUDO o que está ligado ao Estado é Administração Indireta. OS e OSCIPs são privadas e NÃO integram a Administração Indireta.',
        'Achar que órgão tem personalidade jurídica. NÃO tem.',
        'Confundir tutela (controle da Indireta) com autotutela (controle dos próprios atos).'
      ],
      errosComuns: [
        'Decorar definições sem aplicar em situações práticas.',
        'Confundir criação de órgão (desconcentração) com criação de entidade (descentralização).',
        'Achar que concessão e permissão são formas de outorga — são de DELEGAÇÃO.'
      ],
      resumo: [
        'Desconcentração: dentro da mesma pessoa jurídica (criação de órgãos).',
        'Descentralização: cria nova pessoa jurídica (outorga) ou delega a particular (delegação).',
        'Outorga: titularidade + execução a entidade da Administração Indireta.',
        'Delegação: apenas execução a particular (concessão, permissão).',
        'Administração Direta: órgãos, sem personalidade.',
        'Administração Indireta: autarquias, fundações, empresas públicas e SEM.',
        'Tutela: controle da Administração Direta sobre a Indireta. Autotutela: controle dos próprios atos.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'Desconcentrar é dividir tarefas internamente (a empresa cria departamentos). Descentralizar é criar ou contratar outro CNPJ para fazer algo (a empresa cria uma subsidiária ou terceiriza). Outorga é criar a subsidiária; delegação é terceirizar.',
        outroExemplo: 'O Estado cria o INSS para pagar aposentadorias (descentralização por outorga). Contrata uma empresa de ônibus para transporte público (descentralização por delegação). Cria uma delegacia regional dentro do ministério (desconcentração).',
        compararConceitos: 'Desconcentração: mesma pessoa, órgãos diferentes. Descentralização: pessoas diferentes. Outorga: para entidade pública. Delegação: para particular. Tutela: Direta sobre Indireta. Autotutela: próprio órgão sobre seus atos.',
        mostrarPegadinha: 'Cuidado: "A criação de uma delegacia regional de ministério é exemplo de descentralização". ERRADO — é DESCONCENTRAÇÃO, pois não há nova pessoa jurídica. Só há descentralização quando se cria uma nova pessoa jurídica ou se delega a particular.',
        comoApareceEmConcurso: 'Cai como: (1) distinguir concentração, desconcentração, centralização e descentralização em situações; (2) classificar outorga e delegação; (3) relacionar órgão e entidade.',
        fazerPergunta: {
          pergunta: 'A concessão de serviço público de energia elétrica a uma empresa privada é exemplo de:',
          resposta: 'DESCENTRALIZAÇÃO POR DELEGAÇÃO — o Estado transfere apenas a EXECUÇÃO do serviço, mantendo a titularidade. Se fosse outorga, ele criaria uma entidade pública (autarquia, empresa pública).'
        }
      }
    },
    'AP-01': {
      id: 'L-AP-01',
      moduloId: 'AP-01',
      objetivo: 'Compreender o conceito de Administração Pública em sentido amplo e estrito, o campo de atuação do Estado, e o regime jurídico-administrativo (supremacia e indisponibilidade do interesse público).',
      prerequisitos: [],
      introducao: 'Antes de estudar princípios, modelos e estrutura, é preciso entender o que é Administração Pública. Ela tem sentido amplo (órgãos e entidades) e sentido estrito (função administrativa). Saber distinguir é base para todo o resto.',
      explicacaoSimples: 'Administração Pública pode ser vista de dois jeitos: como a máquina do Estado (todos os órgãos e entidades — Executivo, Legislativo, Judiciário) ou como a atividade administrativa em si (a função que o Estado exerce: prestar serviços, fiscalizar, contratar). O primeiro é sentido amplo; o segundo, sentido estrito.',
      explicacaoTecnica: 'Administração Pública em SENTIDO AMPLO (ou subjetivo/formal/orgânico): conjunto de órgãos e entidades de todos os Poderes (Executivo, Legislativo, Judiciário) e da Administração Direta e Indireta, no exercício de função administrativa. Em SENTIDO ESTRITO (ou objetivo/material/funcional): a própria FUNÇÃO ADMINISTRATIVA, ou seja, a atividade concreta e imediata que o Estado exerce, sob regime de direito público, para fins de interesse coletivo. Campo de atuação: o Estado atua como PODER PÚBLICO (imperium — poder de império, ex.: poder de polícia, desapropriação), como PRESTADOR DE SERVIÇOS PÚBLICOS (saúde, educação, transporte), como AGENTE ECONÔMICO (empresas estatais) e como REGULADOR da economia. Regime jurídico-administrativo: conjunto de princípios e regras que caracterizam o Direito Administrativo, formado por dois grandes pilares: (1) SUPREMACIA DO INTERESSE PÚBLICO — o interesse público prevalece sobre o privado (ex.: desapropriação, cláusulas exorbitantes). (2) INDISPONIBILIDADE DO INTERESSE PÚBLICO — o administrador é gestor, não dono do interesse público; não pode renunciar a ele (ex.: obrigatoriedade da licitação, concurso público).',
      exemplos: [
        'Sentido amplo: Congresso Nacional, STF, Presidência da República, ministérios, secretarias — todos exercem função administrativa.',
        'Sentido estrito: a atividade de fiscalização sanitária, de prestação de saúde, de emissão de certidões.',
        'Poder Público: a prefeitura interdita um estabelecimento por falta de alvará.',
        'Prestador de serviços: o SUS oferece consultas à população.',
        'Regulador da economia: a ANATEL regula o setor de telecomunicações.'
      ],
      comparacoes: [
        { termoA: 'Sentido amplo', termoB: 'Sentido estrito', diferenca: 'AMPLO (subjetivo/formal): conjunto de ÓRGÃOS e ENTIDADES (quem exerce) — inclui os três Poderes. ESTRITO (objetivo/material): a própria FUNÇÃO ADMINISTRATIVA (o que se exerce). O primeiro olha o sujeito; o segundo olha a atividade.' },
        { termoA: 'Supremacia do interesse público', termoB: 'Indisponibilidade do interesse público', diferenca: 'SUPREMACIA: o interesse público PREVALECE sobre o privado (ex.: desapropriação, autoexecutoriedade). INDISPONIBILIDADE: o administrador NÃO é dono do interesse público, apenas gestor — não pode renunciar a ele nem deixar de agir (ex.: obrigatoriedade da licitação e do concurso).' },
        { termoA: 'Administração Pública (AP)', termoB: 'Direito Administrativo (DA)', diferenca: 'AP é a ATIVIDADE (o que o Estado faz). DA é o RAMO DO DIREITO que regula essa atividade. A AP é objeto do DA — não são sinônimos.' }
      ],
      aplicacaoAdministracaoPublica: 'O regime jurídico-administrativo justifica todo o resto do Direito Administrativo: licitações (supremacia do interesse público), proibição de renúncia a competências (indisponibilidade), autotutela, poder de polícia, contratos administrativos com cláusulas exorbitantes. Sem esses dois pilares, não há Direito Administrativo. Em concursos, AP-01 serve de base para todos os outros módulos.',
      pegadinhas: [
        'Achar que só o Executivo compõe a Administração Pública em sentido amplo. Na verdade, TODOS os Poderes exercem função administrativa — logo, integram a AP em sentido amplo.',
        'Confundir Administração Pública com Direito Administrativo. AP é a atividade; DA é o ramo jurídico.',
        'Dizer que supremacia e indisponibilidade são princípios expressos. São IMPLÍCITOS.',
        'Achar que o administrador pode renunciar a uma competência. NÃO pode — indisponibilidade do interesse público.',
        'Confundir função administrativa com função legislativa ou jurisdicional. São funções típicas de cada Poder — os três Poderes exercem função administrativa atipicamente.'
      ],
      errosComuns: [
        'Decorar conceitos sem entender os dois pilares.',
        'Confundir Administração Pública com Direito Administrativo.',
        'Ignorar que os três Poderes exercem função administrativa.'
      ],
      resumo: [
        'Administração Pública em sentido AMPLO: todos os órgãos e entidades dos três Poderes.',
        'Em sentido ESTRITO: a própria função administrativa.',
        'Campo de atuação: poder público, prestador de serviços, agente econômico e regulador.',
        'Regime jurídico-administrativo: supremacIa do interesse público + indisponibilidade do interesse público.',
        'Supremacia: prevalece sobre o privado. Indisponibilidade: não se pode renunciar.',
        'AP é a atividade; DA é o ramo jurídico que regula essa atividade.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'AP em sentido amplo é toda a máquina do Estado (Congresso, STF, Presidência, ministérios). Em sentido estrito é a atividade administrativa em si (fiscalizar, atender, emitir certidões). O regime jurídico tem dois pilares: o interesse público prevalece (supremacia) e ninguém pode abrir mão dele (indisponibilidade).',
        outroExemplo: 'Uma campanha de vacinação pública combina os sentidos: o Ministério da Saúde (órgão da AP ampla) executa a vacinação (função administrativa estrita) para proteger o interesse público (supremacia), sem que o gestor possa recusar por conveniência (indisponibilidade).',
        compararConceitos: 'Amplo = órgão/entidade. Estrito = atividade. Supremacia = prevalência do interesse público. Indisponibilidade = não pode renunciar. AP = atividade; DA = ramo do direito.',
        mostrarPegadinha: 'Cuidado: "A Administração Pública em sentido amplo é composta exclusivamente pelo Poder Executivo". ERRADO — os três Poderes exercem função administrativa e integram a AP em sentido amplo.',
        comoApareceEmConcurso: 'Cai como: (1) distinguir sentido amplo e estrito; (2) reconhecer os dois pilares do regime jurídico-administrativo; (3) diferenciar AP de DA.',
        fazerPergunta: {
          pergunta: 'O Poder Judiciário exerce função administrativa?',
          resposta: 'SIM. Além da função típica (jurisdicional), o Judiciário exerce função ADMINISTRATIVA atípica quando, por exemplo, contrata servidores, compra material ou gerencia seus órgãos. Por isso, integra a Administração Pública em sentido amplo.'
        }
      }
    },
    'DA-01': {
      id: 'L-DA-01',
      moduloId: 'DA-01',
      objetivo: 'Compreender o conceito, o objeto, as fontes e o regime jurídico do Direito Administrativo. Base para todos os módulos seguintes de DA.',
      prerequisitos: [],
      introducao: 'O Direito Administrativo é o ramo do direito público que regula a atuação da Administração Pública. Sem entender seu conceito e suas fontes, é impossível compreender princípios, atos, poderes e licitações.',
      explicacaoSimples: 'Pense no Direito como um conjunto de regras que organizam a vida em sociedade. Uma parte dessas regras organiza o Estado e sua relação com o cidadão. Essa parte é o Direito Administrativo. Ele diz como o Estado deve contratar, como deve tratar o servidor, como deve fiscalizar, como deve prestar serviços.',
      explicacaoTecnica: 'Direito Administrativo é o ramo do direito público que estuda os princípios e normas que regem a Administração Pública e sua relação com os administrados. CONCEITO: conjunto de normas e princípios que disciplinam a função administrativa e a organização do Estado. OBJETO: a Administração Pública (órgãos, entidades, agentes) e a atividade administrativa (atos, contratos, poder de polícia, serviços públicos, responsabilidade, controle, licitações). FONTES: LEI (fonte primária), DOUTRINA (produção científica dos juristas), JURISPRUDÊNCIA (decisões reiteradas dos tribunais), PRINCÍPIOS GERAIS DO DIREITO e COSTUMES administrativos (fontes secundárias). Regime jurídico-administrativo: formado por dois pilares — SUPREMACIA do interesse público e INDISPONIBILIDADE do interesse público. Diferencia-se do direito privado porque envolve prerrogativas (poder de império) e restrições (deveres especiais) que não existem nas relações privadas.',
      exemplos: [
        'Lei como fonte primária: Lei 8.112/1990 (regime dos servidores federais).',
        'Doutrina: obras de Celso Antônio Bandeira de Mello, Hely Lopes Meirelles, Maria Sylvia Di Pietro.',
        'Jurisprudência: Súmula 473/STF (autotutela) e Súmula 346/STF (anulação de atos ilegais).',
        'Princípios gerais: legalidade, moralidade, ampla defesa.',
        'Costume: práticas reiteradas em determinado órgão (fonte subsidiária).'
      ],
      comparacoes: [
        { termoA: 'Direito Administrativo', termoB: 'Direito Constitucional', diferenca: 'DIREITO ADMINISTRATIVO: regula a função administrativa, os atos, contratos, servidores, serviços públicos. DIREITO CONSTITUCIONAL: regula a estrutura do Estado, os direitos fundamentais e a organização dos Poderes. Os dois se comunicam — muitas normas administrativas derivam diretamente da CF (ex.: art. 37, caput).' },
        { termoA: 'Direito Administrativo', termoB: 'Direito Privado', diferenca: 'DIREITO ADMINISTRATIVO: regido por normas de direito PÚBLICO, com prerrogativas do Estado (supremacia) e restrições (indisponibilidade). DIREITO PRIVADO: regido pela autonomia da vontade, com igualdade formal entre as partes. A Administração, quando atua como poder público, submete-se ao regime público.' },
        { termoA: 'Fontes primárias', termoB: 'Fontes secundárias', diferenca: 'PRIMÁRIAS: a LEI (em sentido amplo — CF, leis, decretos, regulamentos). SECUNDÁRIAS: doutrina, jurisprudência, princípios gerais e costumes — orientam a interpretação e aplicação da lei, mas não a substituem.' }
      ],
      aplicacaoAdministracaoPublica: 'Todo concurso público para área administrativa cobra Direito Administrativo. O DA está presente no dia a dia do servidor: ao praticar atos, ao atender o cidadão, ao participar de licitação, ao responder a um processo disciplinar. A base legal principal é a CF/88 (art. 37 a 41), a Lei 8.112/1990 (federal), a Lei 9.784/1999 (processo administrativo), a Lei 14.133/2021 (licitações), a Lei 8.429/1992 (improbidade).',
      pegadinhas: [
        'Dizer que a doutrina e a jurisprudência são fontes PRIMÁRIAS. São SECUNDÁRIAS. A lei é a fonte primária.',
        'Achar que o Direito Administrativo é o mesmo que Direito Constitucional. São ramos distintos, embora dialoguem.',
        'Dizer que o DA só se aplica ao Poder Executivo. Aplica-se a todos os Poderes quando exercem função administrativa.',
        'Confundir Direito Administrativo com Administração Pública. DA é o ramo jurídico; AP é a atividade.',
        'Achar que o costume não é fonte. É fonte SECUNDÁRIA (subsidiária).'
      ],
      errosComuns: [
        'Decorar fontes sem saber quem é primária e quem é secundária.',
        'Confundir objeto e conceito do DA.',
        'Ignorar o diálogo entre DA e Direito Constitucional.'
      ],
      resumo: [
        'DA é o ramo do direito público que regula a Administração Pública.',
        'Objeto: a Administração Pública e sua atividade.',
        'Fontes: lei (primária); doutrina, jurisprudência, princípios gerais e costumes (secundárias).',
        'Regime jurídico-administrativo: supremacia + indisponibilidade do interesse público.',

        'Aplica-se a todos os Poderes no exercício de função administrativa.'
