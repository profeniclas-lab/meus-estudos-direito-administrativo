      { id: 'D-ADM-09-04', tipo: 'autoavaliacao', subtopico: 'Elementos da comunicação', pergunta: 'Você sabe citar os elementos do processo de comunicação?', resposta: 'Emissor, codificação, mensagem, canal, decodificação, receptor, feedback e ruído.' },
      { id: 'D-ADM-09-05', tipo: 'multipla_escolha', subtopico: 'Tipos de comunicação', pergunta: 'Sobre a comunicação informal nas organizações, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É sempre prejudicial e deve ser eliminada.' }, { id: 'B', texto: 'Ocorre por canais oficiais, como memorandos e portarias.' }, { id: 'C', texto: 'Ocorre fora dos canais oficiais (rádio-peão, conversas de corredor) e pode ser rápida e complementar à comunicação formal.' }, { id: 'D', texto: 'É sinônimo de comunicação descendente.' }], gabarito: 'C', explicacao: 'Comunicação INFORMAL: fora dos canais oficiais (rádio-peão, conversas de corredor). Pode ser rápida e complementar, ajudando a resolver problemas. Não é sempre prejudicial nem sinônimo de descendente (que é uma comunicação formal vertical).' }
    ] },
    'DA-11': { id: 'D-DA-11', moduloId: 'DA-11', itens: [
      { id: 'D-DA-11-01', tipo: 'multipla_escolha', subtopico: 'Modalidades de improbidade', pergunta: 'São modalidades de atos de improbidade administrativa previstas na Lei 8.429/1992:', alternativas: [{ id: 'A', texto: 'Enriquecimento ilícito, prejuízo ao erário e violação de princípios da Administração Pública.' }, { id: 'B', texto: 'Crime de responsabilidade, prevaricação e peculato.' }, { id: 'C', texto: 'Dano ambiental, desvio de finalidade e abuso de autoridade.' }, { id: 'D', texto: 'Corrupção ativa, corrupção passiva e concussão.' }], gabarito: 'A', explicacao: 'São três as modalidades: ENRIQUECIMENTO ILÍCITO (art. 9º), PREJUÍZO AO ERÁRIO (art. 10) e VIOLAÇÃO DE PRINCÍPIOS (art. 11). As demais alternativas listam crimes, não atos de improbidade.' },
      { id: 'D-DA-11-02', tipo: 'verdadeiro_falso', subtopico: 'Dolo x culpa', pergunta: 'Após a Lei 14.230/2021, a improbidade administrativa pode ser configurada por ato culposo, bastando a inobservância de dever legal.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. Após a Lei 14.230/2021, a improbidade administrativa exige DOLO (intenção). A modalidade culposa foi EXCLUÍDA. Mera culpa pode gerar outras responsabilidades (administrativa, civil comum), mas não improbidade.' },
      { id: 'D-DA-11-03', tipo: 'situacao', subtopico: 'Prejuízo ao erário', pergunta: 'Um gestor público autoriza pagamento de obra superfaturada, causando prejuízo aos cofres públicos de R$ 500.000,00, com intenção de favorecer a empresa contratada. A modalidade de improbidade é:', alternativas: [{ id: 'A', texto: 'Enriquecimento ilícito (art. 9º).' }, { id: 'B', texto: 'Prejuízo ao erário (art. 10).' }, { id: 'C', texto: 'Violação de princípios (art. 11).' }, { id: 'D', texto: 'Não configura improbidade.' }], gabarito: 'B', explicacao: 'PREJUÍZO AO ERÁRIO (art. 10): causar perda patrimonial ao Estado mediante ação dolosa. Se o gestor tivesse obtido vantagem pessoal direta, poderia configurar também enriquecimento ilícito (art. 9º).' },
      { id: 'D-DA-11-04', tipo: 'autoavaliacao', subtopico: 'Sanções', pergunta: 'Você sabe citar as sanções previstas para atos de improbidade administrativa?', resposta: 'Perda dos bens ou valores acrescidos ilicitamente, ressarcimento integral do dano, perda da função pública, suspensão dos direitos políticos, multa civil, proibição de contratar com o poder público e de receber benefícios fiscais ou creditícios, por prazo determinado.' },
      { id: 'D-DA-11-05', tipo: 'multipla_escolha', subtopico: 'Sujeitos da improbidade', pergunta: 'Sobre os sujeitos da improbidade administrativa, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Apenas servidores efetivos podem ser responsabilizados.' }, { id: 'B', texto: 'Agentes públicos de qualquer natureza e terceiros que induzam, concorram ou se beneficiem do ato podem ser responsabilizados.' }, { id: 'C', texto: 'Somente agentes políticos podem ser responsabilizados.' }, { id: 'D', texto: 'Particulares nunca respondem por improbidade.' }], gabarito: 'B', explicacao: 'Sujeitos ativos: AGENTES PÚBLICOS de qualquer natureza (efetivos, comissionados, empregados públicos, políticos) e TERCEIROS que induzam, concorram ou se beneficiem do ato. O particular pode responder por improbidade.' }
    ] },
    'DA-12': { id: 'D-DA-12', moduloId: 'DA-12', itens: [
      { id: 'D-DA-12-01', tipo: 'multipla_escolha', subtopico: 'Fases do processo administrativo', pergunta: 'São fases do processo administrativo:', alternativas: [{ id: 'A', texto: 'Instauração, instrução, defesa, relatório e decisão.' }, { id: 'B', texto: 'Súmula, acórdão, sentença e recurso.' }, { id: 'C', texto: 'Investigação criminal, denúncia e julgamento penal.' }, { id: 'D', texto: 'Parecer, consulta e revogação.' }], gabarito: 'A', explicacao: 'As fases típicas do processo administrativo são: INSTAURAÇÃO, INSTRUÇÃO, DEFESA, RELATÓRIO e DECISÃO. O recurso é a etapa posterior, facultativa. As demais alternativas se referem a institutos judiciais ou outros conceitos.' },
      { id: 'D-DA-12-02', tipo: 'verdadeiro_falso', subtopico: 'Contraditório e ampla defesa', pergunta: 'No processo administrativo disciplinar, o servidor pode ser punido sem que lhe seja assegurado o direito de defesa, desde que a falta esteja comprovada por documentos.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. O contraditório e a ampla defesa são OBRIGATÓRIOS no processo administrativo (art. 5º, LV, CF/88). A Súmula Vinculante 5 do STF reforça essa garantia. Punir sem defesa é nulidade absoluta.' },
      { id: 'D-DA-12-03', tipo: 'situacao', subtopico: 'Recursos administrativos', pergunta: 'Após decisão desfavorável, o servidor pede nova análise à MESMA autoridade que praticou o ato. Esse recurso é:', alternativas: [{ id: 'A', texto: 'Recurso hierárquico.' }, { id: 'B', texto: 'Pedido de reconsideração.' }, { id: 'C', texto: 'Revisão.' }, { id: 'D', texto: 'Apelação.' }], gabarito: 'B', explicacao: 'PEDIDO DE RECONSIDERAÇÃO: dirigido à MESMA autoridade que praticou o ato. RECURSO HIERÁRQUICO: dirigido à autoridade SUPERIOR. REVISÃO: reapreciação de ato sancionatório. APELAÇÃO é recurso judicial.' },
      { id: 'D-DA-12-04', tipo: 'autoavaliacao', subtopico: 'Prazo decadencial', pergunta: 'Você sabe qual é o prazo decadencial para a Administração anular ato administrativo favorável ao destinatário?', resposta: 'Em regra, 5 anos a contar da data do ato, salvo comprovada má-fé (art. 54 da Lei 9.784/1999). Após esse prazo, o ato se consolida (não pode mais ser anulado administrativamente).' },
      { id: 'D-DA-12-05', tipo: 'multipla_escolha', subtopico: 'Princípios do processo administrativo', pergunta: 'São princípios aplicáveis ao processo administrativo (Lei 9.784/1999):', alternativas: [{ id: 'A', texto: 'Legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público e eficiência.' }, { id: 'B', texto: 'Somente legalidade e eficiência.' }, { id: 'C', texto: 'Apenas contraditório e ampla defesa.' }, { id: 'D', texto: 'Sigilo absoluto e ausência de motivação.' }], gabarito: 'A', explicacao: 'A Lei 9.784/1999 (art. 2º) prevê expressamente: legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público e eficiência. Sigilo absoluto é vedado (a regra é a publicidade).' }
    ] },
    'ADM-10': { id: 'D-ADM-10', moduloId: 'ADM-10', itens: [
      { id: 'D-ADM-10-01', tipo: 'multipla_escolha', subtopico: 'PDCA x PODC', pergunta: 'O ciclo PDCA (Plan, Do, Check, Act) foi desenvolvido por:', alternativas: [{ id: 'A', texto: 'Henri Fayol.' }, { id: 'B', texto: 'W. Edwards Deming.' }, { id: 'C', texto: 'Frederick Taylor.' }, { id: 'D', texto: 'Max Weber.' }], gabarito: 'B', explicacao: 'O ciclo PDCA é atribuído a W. EDWARDS DEMING, voltado à melhoria contínua da qualidade. O ciclo PODC (Planejamento, Organização, Direção e Controle) é de Henri Fayol. Não confundir os dois.' },
      { id: 'D-ADM-10-02', tipo: 'verdadeiro_falso', subtopico: 'Ferramentas da qualidade', pergunta: 'O Diagrama de Pareto baseia-se no princípio de que 80% dos efeitos são causados por 20% das causas, sendo usado para priorizar problemas.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'V', explicacao: 'Verdadeiro. O Diagrama de Pareto aplica o princípio 80/20, priorizando os problemas mais impactantes. O Diagrama de Ishikawa (causa e efeito) é usado para IDENTIFICAR causas; Pareto é usado para PRIORIZAR.' },
      { id: 'D-ADM-10-03', tipo: 'situacao', subtopico: 'Ferramentas da qualidade', pergunta: 'Um gestor quer identificar as possíveis causas da demora no atendimento ao cidadão, categorizando-as em máquina, método, mão de obra, material, medida e meio ambiente. A ferramenta adequada é:', alternativas: [{ id: 'A', texto: 'Diagrama de Pareto.' }, { id: 'B', texto: 'Diagrama de Ishikawa (causa e efeito).' }, { id: 'C', texto: 'Histograma.' }, { id: 'D', texto: 'Gráfico de controle.' }], gabarito: 'B', explicacao: 'O DIAGRAMA DE ISHIKAWA (espinha de peixe) é usado para identificar causas de um problema, classificando-as nas categorias: máquina, método, mão de obra, material, medida e meio ambiente (6M). PARETO prioriza; HISTOGRAMA distribui; GRÁFICO DE CONTROLE monitora.' },
      { id: 'D-ADM-10-04', tipo: 'autoavaliacao', subtopico: 'Ciclo PDCA', pergunta: 'Você sabe descrever as quatro etapas do ciclo PDCA?', resposta: 'P (Plan / Planejar): definir metas e métodos. D (Do / Executar): implementar e treinar. C (Check / Verificar): medir e comparar resultados. A (Act / Agir): corrigir desvios e padronizar melhorias.' },
      { id: 'D-ADM-10-05', tipo: 'multipla_escolha', subtopico: 'Foco no cliente', pergunta: 'Sobre a gestão da qualidade aplicada à Administração Pública, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'O foco no cliente não se aplica ao setor público.' }, { id: 'B', texto: 'O cliente é o CIDADÃO, usuário dos serviços públicos, e a qualidade envolve eficiência, cortesia e resultado útil.' }, { id: 'C', texto: 'A qualidade só se aplica ao setor privado.' }, { id: 'D', texto: 'O foco é apenas o lucro.' }], gabarito: 'B', explicacao: 'No setor público, o CLIENTE é o CIDADÃO. A qualidade envolve eficiência, cortesia, continuidade, resultado útil. A Carta de Serviços ao Usuário (Lei 13.460/2017) reforça o foco no cidadão. O objetivo NÃO é lucro, mas o interesse público.' }
    ] },
    'ADM-12': { id: 'D-ADM-12', moduloId: 'ADM-12', itens: [
      { id: 'D-ADM-12-01', tipo: 'multipla_escolha', subtopico: 'Processo x projeto', pergunta: 'Sobre a diferença entre processo e projeto na gestão organizacional, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Processo é temporário e único; projeto é contínuo e repetitivo.' }, { id: 'B', texto: 'Processo é contínuo, repetitivo e padronizado; projeto é temporário, único, com início e fim definidos.' }, { id: 'C', texto: 'São sinônimos.' }, { id: 'D', texto: 'Projeto é executado diariamente, sem prazo de encerramento.' }], gabarito: 'B', explicacao: 'PROCESSO: contínuo, repetitivo, padronizado (ex.: atendimento diário). PROJETO: temporário, único, com início e fim definidos (ex.: implantação de um sistema).' },
      { id: 'D-ADM-12-02', tipo: 'verdadeiro_falso', subtopico: 'Gestão por processos', pergunta: 'Na gestão por processos, a organização é vista como um conjunto de departamentos isolados, cada um cuidando das suas próprias atividades.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. Essa é a visão da gestão FUNCIONAL. Na gestão POR PROCESSOS, a organização é vista como um conjunto de FLUXOS que atravessam departamentos, com foco no resultado final entregue ao cliente.' },
      { id: 'D-ADM-12-03', tipo: 'situacao', subtopico: 'Elementos do processo', pergunta: 'Em um processo administrativo, o recurso, a informação ou a solicitação que entram no fluxo para serem transformados em produto ou serviço é chamado de:', alternativas: [{ id: 'A', texto: 'Saída.' }, { id: 'B', texto: 'Indicador.' }, { id: 'C', texto: 'Entrada (input).' }, { id: 'D', texto: 'Cliente.' }], gabarito: 'C', explicacao: 'ENTRADA (input): recurso, informação ou solicitação que inicia o processo. SAÍDA (output): produto/serviço gerado. INDICADOR: mede o desempenho. CLIENTE: quem recebe a saída.' },
      { id: 'D-ADM-12-04', tipo: 'autoavaliacao', subtopico: 'Tipos de processo', pergunta: 'Você sabe citar os tipos de processo na gestão por processos?', resposta: 'Processos primários (essenciais, geram valor direto ao cliente), processos de apoio (suportam os primários — ex.: compras, RH) e processos gerenciais (planejamento e controle).' },
      { id: 'D-ADM-12-05', tipo: 'multipla_escolha', subtopico: 'Ferramentas de mapeamento', pergunta: 'Sobre a notação BPMN, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É um sinônimo de fluxograma simples.' }, { id: 'B', texto: 'É uma notação padronizada e detalhada para modelagem de processos, com elementos como eventos, tarefas, gateways e raias.' }, { id: 'C', texto: 'Só é usada no setor privado.' }, { id: 'D', texto: 'Substitui a necessidade de indicadores.' }], gabarito: 'B', explicacao: 'BPMN (Business Process Model and Notation) é uma notação PADRONIZADA e detalhada para modelagem de processos, com eventos, tarefas, gateways (decisões), subprocessos e raias (swimlanes). É usada tanto no setor privado quanto no público. Não substitui indicadores.' }
    ] },
    'ADM-13': { id: 'D-ADM-13', moduloId: 'ADM-13', itens: [
      { id: 'D-ADM-13-01', tipo: 'multipla_escolha', subtopico: 'Qualidade no atendimento', pergunta: 'Sobre o atendimento ao público na Administração Pública, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Basta ser educado; a resolução do problema é secundária.' }, { id: 'B', texto: 'Envolve cortesia, clareza, empatia, precisão das informações e busca da resolução efetiva do problema do cidadão.' }, { id: 'C', texto: 'O atendimento deve ser seletivo, priorizando quem tem mais influência.' }, { id: 'D', texto: 'Informações sigilosas podem ser compartilhadas com qualquer parente do titular.' }], gabarito: 'B', explicacao: 'Bom atendimento combina cortesia, clareza, empatia, precisão e RESOLUÇÃO efetiva. Atendimento seletivo viola a impessoalidade; informações sigilosas só podem ser liberadas ao titular ou por ordem legal/judicial.' },
      { id: 'D-ADM-13-02', tipo: 'verdadeiro_falso', subtopico: 'Escuta ativa', pergunta: 'Escuta ativa no atendimento significa captar o som da fala do cidadão, sem necessariamente prestar atenção plena ao conteúdo.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. Escuta ATIVA significa prestar atenção plena, sem interromper, interpretando o conteúdo e as emoções, confirmando entendimento e respondendo com precisão. É muito mais que captar o som.' },
      { id: 'D-ADM-13-03', tipo: 'situacao', subtopico: 'Postura profissional', pergunta: 'Um cidadão chega exaltado reclamando de um serviço. A postura adequada do servidor é:', alternativas: [{ id: 'A', texto: 'Responder no mesmo tom para impor respeito.' }, { id: 'B', texto: 'Ouvir com atenção, manter a calma, confirmar o entendimento e buscar solução ou encaminhamento correto.' }, { id: 'C', texto: 'Ignorar a reclamação e atender o próximo.' }, { id: 'D', texto: 'Encerrar o atendimento imediatamente.' }], gabarito: 'B', explicacao: 'Diante de cidadão exaltado, a postura adequada é manter a calma (autocontrole), ouvir com atenção (escuta ativa), confirmar entendimento e buscar solução ou encaminhamento. Responder no mesmo tom, ignorar ou encerrar sem resolver são condutas inadequadas.' },
      { id: 'D-ADM-13-04', tipo: 'autoavaliacao', subtopico: 'Deveres do servidor', pergunta: 'Você sabe citar deveres do servidor no atendimento ao público?', resposta: 'Urbanidade, cortesia, presteza, sigilo das informações, impessoalidade no tratamento, clareza na comunicação e busca da solução dentro da lei (art. 116 da Lei 8.112/1990 e Código de Ética — Decreto 1.171/1994).' },
      { id: 'D-ADM-13-05', tipo: 'multipla_escolha', subtopico: 'Ouvidoria', pergunta: 'A ouvidoria, no serviço público, tem como função principal:', alternativas: [{ id: 'A', texto: 'Substituir o atendimento comum.' }, { id: 'B', texto: 'Ser canal específico para reclamações, denúncias, sugestões e elogios, com registro formal e encaminhamento para melhoria.' }, { id: 'C', texto: 'Apenas registrar elogios.' }, { id: 'D', texto: 'Julgar processos disciplinares.' }], gabarito: 'B', explicacao: 'A OUVIDORIA é o canal específico para reclamações, denúncias, sugestões e elogios, com registro formal e encaminhamento para melhoria. Não substitui o atendimento comum nem julga processos disciplinares.' }
    ] },
    'DA-13': { id: 'D-DA-13', moduloId: 'DA-13', itens: [
      { id: 'D-DA-13-01', tipo: 'multipla_escolha', subtopico: 'Classificação dos bens', pergunta: 'Uma praça pública e um terreno abandonado sem destinação específica são, respectivamente, bens públicos:', alternativas: [{ id: 'A', texto: 'De uso especial e de uso comum.' }, { id: 'B', texto: 'De uso comum e dominical.' }, { id: 'C', texto: 'Dominical e de uso especial.' }, { id: 'D', texto: 'De uso especial e dominical.' }], gabarito: 'B', explicacao: 'Praça pública é bem de USO COMUM DO POVO (destinado à coletividade). Terreno abandonado sem destinação é bem DOMINICAL (patrimônio disponível). Bens de uso ESPECIAL são afetados a um serviço específico (escola, hospital).' },
      { id: 'D-DA-13-02', tipo: 'verdadeiro_falso', subtopico: 'Regime jurídico dos bens públicos', pergunta: 'Os bens públicos são, em regra, alienáveis, penhoráveis e usucapíveis, como os bens privados.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. Os bens públicos têm regime especial: são, em regra, INALIENÁVEIS (enquanto mantida a destinação), IMPENHORÁVEIS e IMPRESCRITÍVEIS (não podem ser usucapidos). Bens DOMINICAIS podem ser alienados, cumpridos os requisitos legais.' },
      { id: 'D-DA-13-03', tipo: 'situacao', subtopico: 'Uso por particulares', pergunta: 'A instalação de uma banca de jornal em calçada pública, autorizada por ato unilateral, discricionário e precário do município, sem licitação, configura:', alternativas: [{ id: 'A', texto: 'Concessão de uso.' }, { id: 'B', texto: 'Permissão de uso.' }, { id: 'C', texto: 'Autorização de uso.' }, { id: 'D', texto: 'Cessão de uso.' }], gabarito: 'C', explicacao: 'AUTORIZAÇÃO DE USO: ato unilateral, discricionário, precário, SEM licitação, para uso episódico (ex.: banca de jornal). PERMISSÃO: ato unilateral. CONCESSÃO: contrato com licitação, uso mais estável. CESSÃO: uso gratuito entre órgãos.' },
      { id: 'D-DA-13-04', tipo: 'autoavaliacao', subtopico: 'Bens públicos', pergunta: 'Você sabe diferenciar afetação de desafetação?', resposta: 'AFETAÇÃO: ato pelo qual o bem passa a ter destinação pública específica (ex.: terreno vira escola). DESAFETAÇÃO: ato pelo qual o bem deixa de ter destinação pública (ex.: escola desativada passa a ser bem dominical e pode ser alienada).' },
      { id: 'D-DA-13-05', tipo: 'multipla_escolha', subtopico: 'Regime jurídico dos bens públicos', pergunta: 'A alienação de bens públicos imóveis exige, em regra:', alternativas: [{ id: 'A', texto: 'Apenas decisão do chefe do Executivo.' }, { id: 'B', texto: 'Desafetação (se necessário), avaliação prévia, autorização legal e licitação.' }, { id: 'C', texto: 'Apenas avaliação prévia.' }, { id: 'D', texto: 'Nada além de registro em cartório.' }], gabarito: 'B', explicacao: 'A alienação de bens públicos imóveis exige, em regra: DESAFETAÇÃO (se o bem era afetado), AVALIAÇÃO prévia, AUTORIZAÇÃO LEGAL (em lei específica) e LICITAÇÃO (na forma da Lei 14.133/2021), salvo hipóteses legais específicas.' }
    ] },
    'DA-14': { id: 'D-DA-14', moduloId: 'DA-14', itens: [
      { id: 'D-DA-14-01', tipo: 'multipla_escolha', subtopico: 'Formas de intervenção', pergunta: 'A restrição geral, gratuita e unilateral imposta pelo Estado ao uso da propriedade, em favor do interesse público, é chamada de:', alternativas: [{ id: 'A', texto: 'Desapropriação.' }, { id: 'B', texto: 'Limitação administrativa.' }, { id: 'C', texto: 'Servidão administrativa.' }, { id: 'D', texto: 'Requisição administrativa.' }], gabarito: 'B', explicacao: 'LIMITAÇÃO ADMINISTRATIVA: restrição GERAL, gratuita e unilateral (ex.: gabarito de altura, zoneamento). Não retira a propriedade e atinge genericamente todos os imóveis da região. Servidão é ônus ESPECÍFICO; desapropriação transfere a propriedade; requisição é uso temporário em perigo público iminente.' },
      { id: 'D-DA-14-02', tipo: 'verdadeiro_falso', subtopico: 'Desapropriação', pergunta: 'A desapropriação extraordinária, prevista no art. 243 da CF/88 para imóveis com cultivo de plantas psicotrópicas, é realizada sem indenização ao proprietário.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'V', explicacao: 'Verdadeiro. A desapropriação EXTRAORDINÁRIA (art. 243, CF) recai sobre imóveis com cultivo ilegal de plantas psicotrópicas e NÃO gera indenização. É forma sancionatória extrema. Também prevê o confisco dos bens.' },
      { id: 'D-DA-14-03', tipo: 'situacao', subtopico: 'Formas de intervenção', pergunta: 'Durante uma calamidade pública, o Estado usa temporariamente um galpão particular para abrigar vítimas. Qual forma de intervenção foi aplicada?', alternativas: [{ id: 'A', texto: 'Desapropriação ordinária.' }, { id: 'B', texto: 'Tombamento.' }, { id: 'C', texto: 'Requisição administrativa.' }, { id: 'D', texto: 'Limitação administrativa.' }], gabarito: 'C', explicacao: 'REQUISIÇÃO ADMINISTRATIVA: uso TEMPORÁRIO de bem (móvel ou imóvel) em caso de PERIGO PÚBLICO IMINENTE (art. 5º, XXV, CF), com indenização POSTERIOR se houver dano. Desapropriação transfere a propriedade definitivamente; tombamento preserva patrimônio; limitação restringe o uso genericamente.' },
      { id: 'D-DA-14-04', tipo: 'autoavaliacao', subtopico: 'Formas de intervenção', pergunta: 'Você sabe citar as principais formas de intervenção do Estado na propriedade?', resposta: 'Desapropriação, limitação administrativa, servidão administrativa, tombamento e requisição administrativa. Há ainda a ocupação temporária (uso temporário para obras públicas).' },
      { id: 'D-DA-14-05', tipo: 'multipla_escolha', subtopico: 'Tipos de desapropriação', pergunta: 'A desapropriação de imóvel rural que não cumpre sua função social, prevista no art. 184 da CF, é indenizada com:', alternativas: [{ id: 'A', texto: 'Dinheiro, exclusivamente.' }, { id: 'B', texto: 'Títulos da Dívida Agrária (TDA), ressalvadas as benfeitorias úteis e necessárias em dinheiro.' }, { id: 'C', texto: 'Títulos da Dívida Pública.' }, { id: 'D', texto: 'Sem qualquer indenização.' }], gabarito: 'B', explicacao: 'A desapropriação SANCIONATÓRIA para fins de reforma agrária (art. 184, CF) é indenizada com TÍTULOS DA DÍVIDA AGRÁRIA (TDA), ressalvando-se as benfeitorias úteis e necessárias, que são pagas em dinheiro. Sem indenização é a extraordinária (art. 243). Com títulos da dívida pública é a urbanística (art. 182, §4º, III).' }
    ] },    
  };

  var QUESTIONS = [
    { id: 'Q-DID-ADM-0001', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-01', subtema: 'Eficiência, eficácia e efetividade', dificuldade: 1, prioridade: 'alta', enunciado: 'Um setor público cumpriu integralmente todas as metas pactuadas no ano, mas gastou o dobro do orçamento previsto. Em relação a esse resultado, é correto afirmar que o setor foi:', alternativas: [{ id: 'A', texto: 'Eficiente, porque cumpriu as metas.' }, { id: 'B', texto: 'Eficaz, mas não eficiente.' }, { id: 'C', texto: 'Efetivo, porque houve impacto social.' }, { id: 'D', texto: 'Ineficaz e ineficiente, porque gastou mais que o previsto.' }], gabarito: 'B', explicacao: { correta: 'Eficácia é atingir o objetivo/meta. Eficiência é fazer bem, com o mínimo de recursos.', incorretas: { A: 'Confunde eficiência com eficácia.', C: 'Efetividade exige impacto real.', D: 'Inverte os conceitos.' }, conceitoCobrado: 'Distinção entre eficiência, eficácia e efetividade.', pegadinha: 'Trocar eficiência por eficácia.', comoApareceEmConcurso: 'Situação prática pedindo classificação.' }, tags: ['eficiência', 'eficácia'] },
    { id: 'Q-DID-ADM-0002', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-01', subtema: 'Funções administrativas', dificuldade: 2, prioridade: 'alta', enunciado: 'A Secretaria de Saúde definiu que reduzirá em 20% o tempo médio de espera e alocou equipes, equipamentos e orçamento. Qual função administrativa está sendo exercida?', alternativas: [{ id: 'A', texto: 'Controle.' }, { id: 'B', texto: 'Direção.' }, { id: 'C', texto: 'Planejamento.' }, { id: 'D', texto: 'Organização.' }], gabarito: 'C', explicacao: { correta: 'Definir objetivos e alocar recursos é PLANEJAMENTO.', incorretas: { A: 'Controle viria depois.', B: 'Direção lidaria com pessoas.', D: 'Organização estruturaria cargos.' }, conceitoCobrado: 'Identificação da função.', pegadinha: 'Alocar recursos pode parecer organização.', comoApareceEmConcurso: 'Correspondência exemplo-função.' }, tags: ['PODC'] },
    { id: 'Q-DID-ADM-0003', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-02', subtema: 'Integração das funções', dificuldade: 1, prioridade: 'alta', enunciado: 'Segundo a formulação clássica de Fayol, a ordem do ciclo administrativo é:', alternativas: [{ id: 'A', texto: 'Organização → Planejamento → Controle → Direção.' }, { id: 'B', texto: 'Controle → Planejamento → Organização → Direção.' }, { id: 'C', texto: 'Planejamento → Organização → Direção → Controle.' }, { id: 'D', texto: 'Direção → Planejamento → Organização → Controle.' }], gabarito: 'C', explicacao: { correta: 'O ciclo PODC segue Planejamento → Organização → Direção → Controle.', incorretas: { A: 'Inverte planejamento e organização.', B: 'Começa pelo controle, impossível.', D: 'Começa pela direção sem plano.' }, conceitoCobrado: 'Ordem das funções.', pegadinha: 'Bancas invertem a ordem.', comoApareceEmConcurso: 'Memória aplicada.' }, tags: ['PODC', 'Fayol'] },
    { id: 'Q-DID-ADM-0004', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-02', subtema: 'Direção', dificuldade: 2, prioridade: 'alta', enunciado: 'O gerente reúne a equipe, delega responsabilidades, orienta servidores e mantém o grupo motivado. Qual função?', alternativas: [{ id: 'A', texto: 'Planejamento.' }, { id: 'B', texto: 'Organização.' }, { id: 'C', texto: 'Direção.' }, { id: 'D', texto: 'Controle.' }], gabarito: 'C', explicacao: { correta: 'Liderar, motivar, comunicar é DIREÇÃO.', incorretas: { A: 'Planejamento define objetivos.', B: 'Organização é estrutural.', D: 'Controle compara desempenho.' }, conceitoCobrado: 'Função de direção.', pegadinha: 'Delegar pode parecer organização.', comoApareceEmConcurso: 'Correspondência situação-função.' }, tags: ['PODC'] },
    { id: 'Q-DID-ADM-0005', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-02', subtema: 'Controle', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a função administrativa de controle, assinale a alternativa correta:', alternativas: [{ id: 'A', texto: 'É etapa estanque, só no final.' }, { id: 'B', texto: 'Dispensa padrões.' }, { id: 'C', texto: 'É contínuo e retroalimenta o planejamento.' }, { id: 'D', texto: 'Substitui o planejamento.' }], gabarito: 'C', explicacao: { correta: 'O controle é contínuo: mede, compara com padrões e corrige desvios.', incorretas: { A: 'Controle é contínuo.', B: 'Não existe controle sem padrão.', D: 'Retroalimenta, não substitui.' }, conceitoCobrado: 'Caráter contínuo do controle.', pegadinha: 'Achar que controle é só no final.', comoApareceEmConcurso: 'Conceitual.' }, tags: ['PODC', 'controle'] },
    { id: 'Q-DID-ADM-0006', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-03', subtema: 'Níveis de planejamento', dificuldade: 2, prioridade: 'alta', enunciado: 'O planejamento que define missão, visão e objetivos de longo prazo é classificado como:', alternativas: [{ id: 'A', texto: 'Operacional.' }, { id: 'B', texto: 'Tático.' }, { id: 'C', texto: 'Estratégico.' }, { id: 'D', texto: 'Funcional.' }], gabarito: 'C', explicacao: { correta: 'Planejamento ESTRATÉGICO é nível institucional.', incorretas: { A: 'Operacional é execução.', B: 'Tático é intermediário.', D: 'Funcional não é nível clássico.' }, conceitoCobrado: 'Níveis do planejamento.', pegadinha: 'Inverter tático e estratégico.', comoApareceEmConcurso: 'ADM e AP.' }, tags: ['planejamento'] },
    { id: 'Q-DID-ADM-0007', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-03', subtema: 'Planejamento estratégico', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre o planejamento estratégico, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Tem foco no curto prazo.' }, { id: 'B', texto: 'É elaborado pela média gerência.' }, { id: 'C', texto: 'Envolve toda a organização, tem horizonte longo e é conduzido pela alta direção.' }, { id: 'D', texto: 'Substitui os planejamentos tático e operacional.' }], gabarito: 'C', explicacao: { correta: 'Estratégico: toda a organização, longo prazo, alta direção.', incorretas: { A: 'Curto prazo é operacional.', B: 'Média gerência elabora o tático.', D: 'Os três níveis coexistem.' }, conceitoCobrado: 'Características do planejamento estratégico.', pegadinha: 'Confundir horizonte com nível.', comoApareceEmConcurso: 'ADM Geral.' }, tags: ['planejamento', 'estratégico'] },
    { id: 'Q-DID-ADM-0008', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-04', subtema: 'Departamentalização', dificuldade: 2, prioridade: 'alta', enunciado: 'Uma prefeitura organiza suas secretarias por áreas como Saúde, Educação e Obras. Esse critério é departamentalização:', alternativas: [{ id: 'A', texto: 'Por clientes.' }, { id: 'B', texto: 'Funcional.' }, { id: 'C', texto: 'Geográfica.' }, { id: 'D', texto: 'Por produtos.' }], gabarito: 'B', explicacao: { correta: 'Agrupar por áreas de especialidade é FUNCIONAL.', incorretas: { A: 'Por clientes é por público-alvo.', C: 'Geográfica é por região.', D: 'Por produtos é por bem/serviço.' }, conceitoCobrado: 'Tipos de departamentalização.', pegadinha: 'Confundir funcional com por produtos.', comoApareceEmConcurso: 'ADM e AP.' }, tags: ['departamentalização'] },
    { id: 'Q-DID-ADM-0009', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-04', subtema: 'Centralização e descentralização', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a descentralização administrativa nas organizações, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Concentra a autoridade no topo.' }, { id: 'B', texto: 'Transfere a tomada de decisão para níveis mais próximos da execução.' }, { id: 'C', texto: 'Elimina a hierarquia.' }, { id: 'D', texto: 'É sinônimo de desconcentração.' }], gabarito: 'B', explicacao: { correta: 'Descentralização distribui autoridade decisória para níveis inferiores.', incorretas: { A: 'Concentrar é centralização.', C: 'Não elimina hierarquia.', D: 'Desconcentração é dentro da mesma pessoa jurídica.' }, conceitoCobrado: 'Centralização, descentralização e desconcentração.', pegadinha: 'Trocar descentralização por desconcentração.', comoApareceEmConcurso: 'ADM e DA.' }, tags: ['descentralização'] },
    { id: 'Q-DID-ADM-0010', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-07', subtema: 'Recrutamento e seleção', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre recrutamento e seleção em gestão de pessoas:', alternativas: [{ id: 'A', texto: 'Recrutamento é escolha; seleção é divulgação.' }, { id: 'B', texto: 'Recrutamento atrai candidatos; seleção escolhe o mais adequado.' }, { id: 'C', texto: 'São sinônimos.' }, { id: 'D', texto: 'Ambos ocorrem após o treinamento.' }], gabarito: 'B', explicacao: { correta: 'Recrutamento atrai; seleção escolhe.', incorretas: { A: 'Inverte as definições.', C: 'Não são sinônimos.', D: 'Treinamento é posterior.' }, conceitoCobrado: 'Etapas do processo de provisão.', pegadinha: 'Trocar as definições.', comoApareceEmConcurso: 'ADM.' }, tags: ['RH'] },
    { id: 'Q-DID-ADM-0011', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-07', subtema: 'Avaliação de desempenho', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a avaliação de desempenho nas organizações:', alternativas: [{ id: 'A', texto: 'Serve apenas para punir.' }, { id: 'B', texto: 'É processo sistemático de acompanhamento e mensuração, com fins de desenvolvimento.' }, { id: 'C', texto: 'Deve ser feita apenas pelo próprio avaliado.' }, { id: 'D', texto: 'É incompatível com gestão por competências.' }], gabarito: 'B', explicacao: { correta: 'Avaliação é processo sistemático de acompanhamento e mensuração.', incorretas: { A: 'Reduz a instrumento punitivo.', C: 'Autoavaliação é um método, não o único.', D: 'São complementares.' }, conceitoCobrado: 'Finalidade da avaliação.', pegadinha: 'Achar que é sinônimo de punição.', comoApareceEmConcurso: 'ADM/RH.' }, tags: ['RH', 'avaliação'] },
    { id: 'Q-DID-ADM-0012', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-11', subtema: 'Gestão de estoques', dificuldade: 2, prioridade: 'alta', enunciado: 'O estoque mínimo que deve ser mantido para cobrir atrasos ou picos de demanda é chamado de:', alternativas: [{ id: 'A', texto: 'Estoque máximo.' }, { id: 'B', texto: 'Estoque de segurança.' }, { id: 'C', texto: 'Ponto de pedido.' }, { id: 'D', texto: 'Estoque em trânsito.' }], gabarito: 'B', explicacao: { correta: 'Estoque de SEGURANÇA é quantidade adicional para variações imprevistas.', incorretas: { A: 'Máximo é limite superior.', C: 'Ponto de pedido dispara nova compra.', D: 'Em trânsito está entre fornecedor e recebedor.' }, conceitoCobrado: 'Tipos de estoque.', pegadinha: 'Confundir com ponto de pedido.', comoApareceEmConcurso: 'Provas administrativas.' }, tags: ['materiais'] },
    { id: 'Q-DID-AP-0001', tipo: 'DIDATICA', area: 'AP', moduloId: 'AP-02', subtema: 'Patrimonialismo', dificuldade: 1, prioridade: 'alta', enunciado: 'A confusão entre o patrimônio público e o privado, o nepotismo e a pessoalidade são características do modelo:', alternativas: [{ id: 'A', texto: 'Burocrático.' }, { id: 'B', texto: 'Gerencial.' }, { id: 'C', texto: 'Patrimonialista.' }, { id: 'D', texto: 'Nova Gestão Pública.' }], gabarito: 'C', explicacao: { correta: 'Patrimonialismo: sem distinção entre público e privado.', incorretas: { A: 'Burocracia combate isso.', B: 'Gerencial foca em resultado.', D: 'NGP é corrente internacional.' }, conceitoCobrado: 'Características do patrimonialismo.', pegadinha: 'Confundir com burocracia.', comoApareceEmConcurso: 'AP e DA.' }, tags: ['patrimonialismo'] },

    { id: 'Q-DID-DA-0014', tipo: 'DIDATICA', area: 'DA', moduloId: 'DA-10', subtema: 'Controle interno e externo', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre o controle da Administração Pública:', alternativas: [{ id: 'A', texto: 'O controle interno é exercido exclusivamente pelo Legislativo.' }, { id: 'B', texto: 'O controle externo é exercido pelo próprio órgão.' }, { id: 'C', texto: 'O controle interno é dentro do próprio órgão; o externo, por outro Poder ou instituição autônoma.' }, { id: 'D', texto: 'O controle judicial analisa o mérito administrativo.' }], gabarito: 'C', explicacao: { correta: 'Interno: dentro do órgão. Externo: por outro Poder ou instituição.', incorretas: { A: 'Interno é pelo próprio órgão.', B: 'Externo vem de fora.', D: 'Judiciário não analisa mérito, em regra.' }, conceitoCobrado: 'Classificação dos controles.', pegadinha: 'Judiciário analisar mérito.', comoApareceEmConcurso: 'DA e AP.' }, tags: ['controle'] },
    { id: 'Q-DID-ADM-0013', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-03', subtema: 'Níveis de planejamento', dificuldade: 2, prioridade: 'alta', enunciado: 'O planejamento que define a missão, a visão e os objetivos de longo prazo da organização, envolvendo toda a sua estrutura, é classificado como:', alternativas: [{ id: 'A', texto: 'Operacional.' }, { id: 'B', texto: 'Tático.' }, { id: 'C', texto: 'Estratégico.' }, { id: 'D', texto: 'Funcional.' }], gabarito: 'C', explicacao: { correta: 'O planejamento ESTRATÉGICO é o nível institucional (topo). Define missão, visão, valores e objetivos de longo prazo, envolvendo toda a organização.', incorretas: { A: 'Operacional é a execução do dia a dia, de curto prazo.', B: 'Tático é o nível intermediário (gerencial), por área.', D: 'Funcional não é um nível clássico de planejamento.' }, conceitoCobrado: 'Níveis do planejamento: estratégico, tático e operacional.', pegadinha: 'Bancas invertem tático com estratégico.', comoApareceEmConcurso: 'Cobrado em ADM e AP. Alta frequência.' }, tags: ['planejamento', 'estratégico'] },
    { id: 'Q-DID-ADM-0014', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-03', subtema: 'Objetivos e metas', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a diferença entre objetivo e meta no planejamento, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'São sinônimos e podem ser usados indistintamente.' }, { id: 'B', texto: 'Objetivo é a intenção genérica e qualitativa; meta é o objetivo quantificado, com prazo e valor definidos.' }, { id: 'C', texto: 'Objetivo é sempre mensurável; meta é sempre subjetiva.' }, { id: 'D', texto: 'Meta é a intenção ampla; objetivo é a quantificação específica.' }], gabarito: 'B', explicacao: { correta: 'Objetivo é a intenção genérica (ex.: reduzir evasão escolar). Meta é o objetivo quantificado com prazo e valor (ex.: reduzir em 15% até dezembro de 2026).', incorretas: { A: 'Não são sinônimos — são conceitos complementares e distintos.', C: 'Inverte os conceitos: objetivo é qualitativo, meta é quantificada.', D: 'Inverte os conceitos.' }, conceitoCobrado: 'Diferença entre objetivo e meta.', pegadinha: 'Bancas invertem as definições.', comoApareceEmConcurso: 'Cobrado em ADM e AP com exemplos.' }, tags: ['planejamento', 'objetivos', 'metas'] },
    { id: 'Q-DID-ADM-0015', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-03', subtema: 'Análise SWOT', dificuldade: 2, prioridade: 'alta', enunciado: 'A ferramenta do planejamento estratégico que analisa Forças, Fraquezas, Oportunidades e Ameaças é conhecida como:', alternativas: [{ id: 'A', texto: 'PDCA.' }, { id: 'B', texto: 'Análise SWOT (FOFA).' }, { id: 'C', texto: 'Diagrama de Pareto.' }, { id: 'D', texto: 'Matriz GUT.' }], gabarito: 'B', explicacao: { correta: 'SWOT (ou FOFA em português): Forças e Fraquezas (ambiente interno), Oportunidades e Ameaças (ambiente externo).', incorretas: { A: 'PDCA é o ciclo da qualidade (Plan, Do, Check, Act), ferramenta de melhoria contínua.', C: 'Pareto prioriza problemas (80/20).', D: 'Matriz GUT prioriza por Gravidade, Urgência e Tendência.' }, conceitoCobrado: 'Ferramentas do planejamento estratégico.', pegadinha: 'Confundir SWOT com PDCA.', comoApareceEmConcurso: 'Cobrado em ADM e AP.' }, tags: ['planejamento', 'SWOT'] },
    { id: 'Q-DID-ADM-0016', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-03', subtema: 'Planejamento estratégico', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre o planejamento estratégico, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Tem foco no curto prazo e nas tarefas do dia a dia.' }, { id: 'B', texto: 'É elaborado pela média gerência, com horizonte temporal anual.' }, { id: 'C', texto: 'Envolve toda a organização, tem horizonte de longo prazo e é conduzido pela alta direção.' }, { id: 'D', texto: 'Substitui o planejamento tático e operacional.' }], gabarito: 'C', explicacao: { correta: 'O planejamento estratégico envolve toda a organização, tem horizonte longo e é conduzido pela alta direção.', incorretas: { A: 'Curto prazo é característica do operacional.', B: 'Média gerência elabora o planejamento tático.', D: 'Os três níveis coexistem — o estratégico não substitui os outros.' }, conceitoCobrado: 'Características do planejamento estratégico.', pegadinha: 'Confundir horizonte temporal com nível hierárquico.', comoApareceEmConcurso: 'Muito comum em provas de ADM.' }, tags: ['planejamento', 'estratégico'] },
    { id: 'Q-DID-ADM-0017', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-03', subtema: 'Instrumentos públicos de planejamento', dificuldade: 3, prioridade: 'alta', enunciado: 'Na Administração Pública brasileira, o PPA (Plano Plurianual), a LDO (Lei de Diretrizes Orçamentárias) e a LOA (Lei Orçamentária Anual) correspondem, respectivamente, aos níveis:', alternativas: [{ id: 'A', texto: 'Operacional, tático e estratégico.' }, { id: 'B', texto: 'Estratégico, tático e operacional.' }, { id: 'C', texto: 'Tático, estratégico e operacional.' }, { id: 'D', texto: 'Operacional, estratégico e tático.' }], gabarito: 'B', explicacao: { correta: 'PPA: estratégico (4 anos). LDO: tático (diretrizes anuais). LOA: operacional (orçamento anual).', incorretas: { A: 'Inverte.', C: 'Inverte PPA e LDO.', D: 'Inverte PPA e LOA.' }, conceitoCobrado: 'Instrumentos orçamentários e níveis de planejamento.', pegadinha: 'Confundir os instrumentos com os níveis.', comoApareceEmConcurso: 'Cobrado em AP, DA e Direito Financeiro.' }, tags: ['planejamento', 'PPA', 'LDO', 'LOA'] },
    { id: 'Q-DID-ADM-0018', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-03', subtema: 'Conceito de planejamento', dificuldade: 1, prioridade: 'alta', enunciado: 'Sobre o conceito de planejamento, assinale a alternativa correta:', alternativas: [{ id: 'A', texto: 'É a função administrativa que executa as tarefas do dia a dia.' }, { id: 'B', texto: 'É a função administrativa que define objetivos, analisa o ambiente e escolhe cursos de ação antes da execução.' }, { id: 'C', texto: 'É sinônimo de previsão, pois se limita a estimar o futuro.' }, { id: 'D', texto: 'É a última etapa do ciclo PODC.' }], gabarito: 'B', explicacao: { correta: 'Planejamento define objetivos e meios, analisa o ambiente (interno e externo) e escolhe cursos de ação ANTES da execução.', incorretas: { A: 'Executar é a fase seguinte (organização/direção).', C: 'Prever é apenas estimar; planejar vai além — decide o que fazer.', D: 'É a PRIMEIRA etapa do ciclo PODC.' }, conceitoCobrado: 'Conceito e posição do planejamento no ciclo administrativo.', pegadinha: 'Confundir planejamento com previsão ou com execução.', comoApareceEmConcurso: 'Cobrado em questões conceituais de ADM.' }, tags: ['planejamento'] },
    { id: 'Q-DID-ADM-0019', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-04', subtema: 'Departamentalização', dificuldade: 2, prioridade: 'alta', enunciado: 'Uma prefeitura organiza suas secretarias por áreas como Saúde, Educação e Obras. Esse critério de agrupamento é departamentalização:', alternativas: [{ id: 'A', texto: 'Por clientes.' }, { id: 'B', texto: 'Funcional.' }, { id: 'C', texto: 'Geográfica.' }, { id: 'D', texto: 'Por produtos.' }], gabarito: 'B', explicacao: { correta: 'Agrupar por áreas de especialidade (Saúde, Educação, Obras) é departamentalização FUNCIONAL — cada departamento agrega funções especializadas.', incorretas: { A: 'Por clientes agrupa conforme o público-alvo (ex.: infantil, adulto).', C: 'Geográfica agrupa por região (zona Norte, zona Sul).', D: 'Por produtos agrupa conforme o bem ou serviço oferecido.' }, conceitoCobrado: 'Tipos de departamentalização.', pegadinha: 'Confundir funcional com por produtos.', comoApareceEmConcurso: 'Cobrado com frequência em ADM e AP.' }, tags: ['organização', 'departamentalização'] },
    { id: 'Q-DID-ADM-0020', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-04', subtema: 'Autoridade e responsabilidade', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre autoridade e responsabilidade na organização, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Ambas podem ser totalmente delegadas a subordinados.' }, { id: 'B', texto: 'A autoridade pode ser delegada, mas a responsabilidade, em regra, NÃO se transfere integralmente — quem delega continua responsável perante seus superiores.' }, { id: 'C', texto: 'São sinônimos.' }, { id: 'D', texto: 'A responsabilidade se delega integralmente e a autoridade não.' }], gabarito: 'B', explicacao: { correta: 'A autoridade é delegável. A responsabilidade, em regra, não se delega integralmente — quem delega continua responsável perante os superiores pela atuação do subordinado.', incorretas: { A: 'Só a autoridade se delega; a responsabilidade permanece.', C: 'Não são sinônimos.', D: 'Inverte os conceitos.' }, conceitoCobrado: 'Autoridade x responsabilidade.', pegadinha: 'Achar que a responsabilidade se transfere como a autoridade.', comoApareceEmConcurso: 'Cobrado em ADM e DA.' }, tags: ['organização', 'autoridade', 'responsabilidade'] },
    { id: 'Q-DID-ADM-0021', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-04', subtema: 'Amplitude de controle', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a amplitude de controle (ou de comando), é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Amplitude estreita significa muitos subordinados por chefe e poucos níveis hierárquicos.' }, { id: 'B', texto: 'Amplitude larga significa muitos subordinados por chefe e menos níveis hierárquicos.' }, { id: 'C', texto: 'Amplitude não se relaciona com o número de níveis hierárquicos.' }, { id: 'D', texto: 'Amplitude é sinônimo de hierarquia.' }], gabarito: 'B', explicacao: { correta: 'Amplitude LARGA: cada chefe tem muitos subordinados → estrutura mais achatada, MENOS níveis. Amplitude ESTREITA: poucos subordinados por chefe → MAIS níveis.', incorretas: { A: 'Inverte amplitude estreita.', C: 'Há relação direta com o número de níveis.', D: 'São conceitos distintos.' }, conceitoCobrado: 'Amplitude de controle.', pegadinha: 'Confundir amplitude estreita com menos níveis — é o contrário.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['organização', 'amplitude'] },
    { id: 'Q-DID-ADM-0022', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-04', subtema: 'Centralização e descentralização', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a descentralização administrativa nas organizações, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Concentra a autoridade decisória no topo da hierarquia.' }, { id: 'B', texto: 'Transfere a tomada de decisão para níveis mais próximos da execução, aumentando a autonomia local.' }, { id: 'C', texto: 'Elimina a necessidade de hierarquia.' }, { id: 'D', texto: 'É sinônimo de desconcentração.' }], gabarito: 'B', explicacao: { correta: 'Descentralização distribui autoridade decisória para níveis inferiores ou unidades locais, dando autonomia a quem está mais perto do problema.', incorretas: { A: 'Concentrar autoridade é centralização.', C: 'Descentralização não elimina a hierarquia.', D: 'Desconcentração é distribuição interna dentro da MESMA pessoa jurídica.' }, conceitoCobrado: 'Centralização, descentralização e desconcentração.', pegadinha: 'Trocar descentralização por desconcentração.', comoApareceEmConcurso: 'Cobrado em ADM e DA.' }, tags: ['organização', 'descentralização'] },
    { id: 'Q-DID-ADM-0023', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-04', subtema: 'Hierarquia', dificuldade: 1, prioridade: 'alta', enunciado: 'A cadeia de comando que define as relações de subordinação do topo até a base da organização é chamada de:', alternativas: [{ id: 'A', texto: 'Departamentalização.' }, { id: 'B', texto: 'Amplitude de controle.' }, { id: 'C', texto: 'Hierarquia.' }, { id: 'D', texto: 'Especialização.' }], gabarito: 'C', explicacao: { correta: 'HIERARQUIA é a cadeia de comando que define a relação superior-subordinado, do topo à base.', incorretas: { A: 'Departamentalização é o agrupamento de atividades.', B: 'Amplitude é o número de subordinados por chefe.', D: 'Especialização é a divisão do trabalho em tarefas específicas.' }, conceitoCobrado: 'Hierarquia.', pegadinha: 'Confundir hierarquia com amplitude.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['organização', 'hierarquia'] },
    { id: 'Q-DID-ADM-0024', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-04', subtema: 'Estrutura organizacional', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a departamentalização geográfica, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Agrupa atividades conforme o tipo de cliente atendido.' }, { id: 'B', texto: 'Agrupa atividades por região territorial (zona Norte, zona Sul, etc.).' }, { id: 'C', texto: 'Agrupa atividades por produto ou serviço oferecido.' }, { id: 'D', texto: 'É sinônimo de departamentalização funcional.' }], gabarito: 'B', explicacao: { correta: 'Departamentalização GEOGRÁFICA (ou territorial): agrupa por região — comum em empresas com atuação em várias localidades e em órgãos públicos descentralizados regionalmente.', incorretas: { A: 'Por clientes é outra classificação.', C: 'Por produtos é agrupamento por bem/serviço.', D: 'Funcional é por especialidade (Saúde, Educação).' }, conceitoCobrado: 'Tipos de departamentalização.', pegadinha: 'Confundir geográfica com funcional.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['organização', 'departamentalização', 'geográfica'] },
    { id: 'Q-DID-ADM-0025', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-05', subtema: 'Estilos de liderança', dificuldade: 2, prioridade: 'alta', enunciado: 'Um gestor reúne a equipe, ouve sugestões e decide em conjunto com os servidores. Esse estilo de liderança é classificado como:', alternativas: [{ id: 'A', texto: 'Autocrático.' }, { id: 'B', texto: 'Democrático.' }, { id: 'C', texto: 'Liberal (laissez-faire).' }, { id: 'D', texto: 'Paternalista.' }], gabarito: 'B', explicacao: { correta: 'Liderança DEMOCRÁTICA (participativa): decisões compartilhadas, comunicação aberta, foco no grupo.', incorretas: { A: 'Autocrático decide sozinho.', C: 'Liberal deixa a equipe decidir livremente, com pouca interferência.', D: 'Paternalista não é um estilo clássico da tipologia básica.' }, conceitoCobrado: 'Estilos de liderança.', pegadinha: 'Trocar democrático com liberal.', comoApareceEmConcurso: 'Alta frequência em ADM e RH.' }, tags: ['direção', 'liderança'] },
    { id: 'Q-DID-ADM-0026', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-05', subtema: 'Chefe e líder', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a diferença entre chefe e líder, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Todo chefe é necessariamente líder.' }, { id: 'B', texto: 'Chefe é uma posição formal na hierarquia; líder é quem influencia pessoas, podendo não ter cargo formal.' }, { id: 'C', texto: 'Líder é sempre aquele que ocupa o cargo mais alto.' }, { id: 'D', texto: 'São sinônimos.' }], gabarito: 'B', explicacao: { correta: 'Chefia é posição formal (autoridade legal). Liderança é influência — o líder pode não ter cargo, e o chefe pode não ser líder.', incorretas: { A: 'Chefia e liderança não se confundem.', C: 'Liderança não depende do cargo formal.', D: 'Não são sinônimos.' }, conceitoCobrado: 'Chefe x líder.', pegadinha: 'Achar que todo chefe é líder.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['direção', 'liderança'] },
    { id: 'Q-DID-ADM-0027', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-05', subtema: 'Motivação', dificuldade: 2, prioridade: 'alta', enunciado: 'Um servidor se esforça no trabalho principalmente porque se sente realizado com a atividade em si e com o propósito do serviço público. Esse é um exemplo de motivação:', alternativas: [{ id: 'A', texto: 'Extrínseca.' }, { id: 'B', texto: 'Intrínseca.' }, { id: 'C', texto: 'Coercitiva.' }, { id: 'D', texto: 'Instrumental.' }], gabarito: 'B', explicacao: { correta: 'Motivação INTRÍNSECA: vem de dentro (satisfação, propósito, realização). O esforço está ligado ao prazer pelo trabalho em si.', incorretas: { A: 'Extrínseca: vem de fora (bônus, promoção, medo de punição).', C: 'Motivação coercitiva não é uma categoria clássica.', D: 'Instrumental também não é categoria clássica da motivação.' }, conceitoCobrado: 'Motivação intrínseca x extrínseca.', pegadinha: 'Trocar intrínseca com extrínseca.', comoApareceEmConcurso: 'Cobrado em ADM e RH.' }, tags: ['direção', 'motivação'] },
    { id: 'Q-DID-ADM-0028', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-05', subtema: 'Funções da direção', dificuldade: 1, prioridade: 'alta', enunciado: 'São funções típicas da Direção:', alternativas: [{ id: 'A', texto: 'Padronizar e controlar.' }, { id: 'B', texto: 'Liderar, motivar, comunicar e coordenar.' }, { id: 'C', texto: 'Definir objetivos de longo prazo e analisar o ambiente.' }, { id: 'D', texto: 'Estruturar cargos e definir hierarquia.' }], gabarito: 'B', explicacao: { correta: 'Direção: liderar, motivar, comunicar e coordenar pessoas para executar o planejado.', incorretas: { A: 'Padronizar e controlar é CONTROLE.', C: 'Definir objetivos e analisar ambiente é PLANEJAMENTO.', D: 'Estruturar cargos e hierarquia é ORGANIZAÇÃO.' }, conceitoCobrado: 'Funções da Direção no ciclo PODC.', pegadinha: 'Confundir Direção com Controle ou Organização.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['direção'] },
    { id: 'Q-DID-ADM-0029', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-05', subtema: 'Estilos de liderança', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a liderança transformacional, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Baseia-se apenas em troca de recompensas por desempenho.' }, { id: 'B', texto: 'O líder inspira, cria visão de futuro e desenvolve as pessoas, elevando a equipe a um patamar superior.' }, { id: 'C', texto: 'É sinônimo de liderança liberal.' }, { id: 'D', texto: 'É incompatível com o serviço público.' }], gabarito: 'B', explicacao: { correta: 'Liderança TRANSFORMACIONAL: inspira, cria visão de futuro, desenvolve pessoas. Baseia-se em valores e propósito, não apenas em troca.', incorretas: { A: 'Isso descreve a liderança TRANSACIONAL.', C: 'Liberal é um estilo diferente (laissez-faire).', D: 'É plenamente compatível com o setor público.' }, conceitoCobrado: 'Liderança transacional x transformacional.', pegadinha: 'Confundir transacional com transformacional.', comoApareceEmConcurso: 'Cobrado em ADM e RH.' }, tags: ['direção', 'liderança'] },
    { id: 'Q-DID-ADM-0030', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-05', subtema: 'Coordenação', dificuldade: 2, prioridade: 'media', enunciado: 'A função de Direção que busca integrar os esforços de diferentes áreas para que atuem de forma harmônica é chamada de:', alternativas: [{ id: 'A', texto: 'Comunicação.' }, { id: 'B', texto: 'Motivação.' }, { id: 'C', texto: 'Coordenação.' }, { id: 'D', texto: 'Liderança.' }], gabarito: 'C', explicacao: { correta: 'COORDENAÇÃO: integra os esforços das diferentes áreas/unidades, buscando harmonia e alinhamento com os objetivos organizacionais.', incorretas: { A: 'Comunicação é o processo de transmitir informação.', B: 'Motivação é o estímulo ao comportamento.', D: 'Liderança é a influência sobre pessoas.' }, conceitoCobrado: 'Funções da Direção.', pegadinha: 'Confundir coordenação com comunicação.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['direção', 'coordenação'] },
    { id: 'Q-DID-ADM-0031', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-06', subtema: 'Etapas do controle', dificuldade: 2, prioridade: 'alta', enunciado: 'Assinale a alternativa que apresenta a ordem correta das etapas do controle administrativo:', alternativas: [{ id: 'A', texto: 'Ação corretiva → padrão → monitoramento → comparação.' }, { id: 'B', texto: 'Padrão → monitoramento → comparação → ação corretiva.' }, { id: 'C', texto: 'Monitoramento → padrão → ação corretiva → comparação.' }, { id: 'D', texto: 'Comparação → padrão → monitoramento → ação corretiva.' }], gabarito: 'B', explicacao: { correta: 'Controle: (1) estabelecer PADRÃO; (2) MONITORAR o desempenho real; (3) COMPARAR real x padrão; (4) aplicar AÇÃO CORRETIVA.', incorretas: { A: 'Começa pela ação corretiva, sem padrão prévio.', C: 'Inverte padrão e monitoramento.', D: 'Começa pela comparação, impossível sem padrão e monitoramento.' }, conceitoCobrado: 'Etapas do controle.', pegadinha: 'Bancas invertem a ordem.', comoApareceEmConcurso: 'Muito cobrado em ADM.' }, tags: ['controle'] },
    { id: 'Q-DID-ADM-0032', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-06', subtema: 'Tipos de controle', dificuldade: 2, prioridade: 'alta', enunciado: 'Um Tribunal de Contas realiza auditoria em contratos já encerrados e identifica irregularidades. Esse tipo de controle é classificado como:', alternativas: [{ id: 'A', texto: 'Preventivo.' }, { id: 'B', texto: 'Simultâneo.' }, { id: 'C', texto: 'Posterior.' }, { id: 'D', texto: 'Prévio.' }], gabarito: 'C', explicacao: { correta: 'Controle POSTERIOR (a posteriori): ocorre após a execução dos atos, examinando o que já foi feito.', incorretas: { A: 'Preventivo (a priori): antes, para evitar o desvio.', B: 'Simultâneo: durante a execução.', D: 'Prévio é sinônimo de preventivo.' }, conceitoCobrado: 'Tipos de controle quanto ao momento.', pegadinha: 'Confundir preventivo com posterior.', comoApareceEmConcurso: 'Cobrado em ADM, DA e AP.' }, tags: ['controle', 'posterior'] },
    { id: 'Q-DID-ADM-0033', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-06', subtema: 'Controle e planejamento', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a relação entre controle e planejamento, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'São independentes: o controle não depende de padrões do planejamento.' }, { id: 'B', texto: 'O controle pressupõe o planejamento, pois compara o desempenho real com padrões definidos no planejamento e retroalimenta as decisões.' }, { id: 'C', texto: 'O controle substitui o planejamento quando há desvios.' }, { id: 'D', texto: 'O planejamento é dispensável quando há controle rigoroso.' }], gabarito: 'B', explicacao: { correta: 'O controle depende de PADRÕES que vêm do planejamento. Sem planejamento, não há parâmetro de comparação. O controle retroalimenta o planejamento.', incorretas: { A: 'São interdependentes.', C: 'Controle não substitui planejamento — alimenta.', D: 'Planejamento é essencial.' }, conceitoCobrado: 'Interdependência controle x planejamento.', pegadinha: 'Achar que controle é só no final.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['controle', 'planejamento'] },
    { id: 'Q-DID-ADM-0034', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-06', subtema: 'Indicadores', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre os indicadores de desempenho no controle, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Devem ser vagos e subjetivos, para permitir interpretações flexíveis.' }, { id: 'B', texto: 'Devem ser mensuráveis, relevantes e alinhados aos objetivos organizacionais, servindo de parâmetro de comparação.' }, { id: 'C', texto: 'Indicadores não se relacionam ao planejamento.' }, { id: 'D', texto: 'Devem sempre ser financeiros.' }], gabarito: 'B', explicacao: { correta: 'Bons indicadores são MENSURÁVEIS, RELEVANTES e ALINHADOS aos objetivos. Servem de parâmetro para o controle comparar desempenho real com o esperado.', incorretas: { A: 'Indicadores vagos não permitem controle.', C: 'Indicadores derivam dos objetivos do planejamento.', D: 'Podem ser de qualidade, prazo, produtividade etc., não só financeiros.' }, conceitoCobrado: 'Indicadores de desempenho.', pegadinha: 'Achar que indicador é só financeiro.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['controle', 'indicadores'] },
    { id: 'Q-DID-ADM-0035', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-06', subtema: 'Ação corretiva', dificuldade: 2, prioridade: 'alta', enunciado: 'Após comparar o desempenho real com o padrão e identificar desvios, a próxima etapa do controle é:', alternativas: [{ id: 'A', texto: 'Definir novos padrões.' }, { id: 'B', texto: 'Aplicar ação corretiva.' }, { id: 'C', texto: 'Reiniciar o planejamento estratégico.' }, { id: 'D', texto: 'Arquivar o processo.' }], gabarito: 'B', explicacao: { correta: 'Após a comparação e identificação de desvios, aplica-se a AÇÃO CORRETIVA — ajustar o desempenho ao padrão ou revisar o padrão, se necessário.', incorretas: { A: 'Definir padrões é a PRIMEIRA etapa do controle.', C: 'O reinício do planejamento pode ser consequência, mas não é a etapa imediata.', D: 'Arquivar ignora o propósito do controle.' }, conceitoCobrado: 'Etapas do controle.', pegadinha: 'Inverter ordem das etapas.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['controle', 'ação corretiva'] },
    { id: 'Q-DID-ADM-0036', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-06', subtema: 'Controle no setor público', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre o controle na Administração Pública, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'O controle externo é exercido exclusivamente pelo Judiciário.' }, { id: 'B', texto: 'O controle externo é exercido pelo Legislativo com auxílio dos Tribunais de Contas, além do Judiciário e do Ministério Público.' }, { id: 'C', texto: 'O controle interno é exercido apenas pelo Legislativo.' }, { id: 'D', texto: 'Não há controle no setor público.' }], gabarito: 'B', explicacao: { correta: 'Controle EXTERNO: Legislativo com auxílio dos Tribunais de Contas, além do Judiciário (legalidade) e do Ministério Público. Controle INTERNO: dentro do próprio órgão (corregedoria, controladoria).', incorretas: { A: 'O Judiciário é apenas um dos agentes do controle externo.', C: 'Controle interno é exercido pelo próprio órgão.', D: 'O controle é intenso e obrigatório.' }, conceitoCobrado: 'Controle interno x externo.', pegadinha: 'Achar que só o Judiciário faz controle externo.', comoApareceEmConcurso: 'Cobrado em ADM, DA e AP.' }, tags: ['controle', 'controle externo'] },
    { id: 'Q-DID-ADM-0037', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-07', subtema: 'Recrutamento e seleção', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre recrutamento e seleção em gestão de pessoas, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Recrutamento é a fase de escolha do candidato; seleção é a divulgação da vaga.' }, { id: 'B', texto: 'Recrutamento atrai candidatos; seleção escolhe o mais adequado ao cargo.' }, { id: 'C', texto: 'São sinônimos.' }, { id: 'D', texto: 'Ambos ocorrem após o treinamento inicial.' }], gabarito: 'B', explicacao: { correta: 'Recrutamento atrai candidatos (interno ou externo). Seleção escolhe, entre os candidatos, o mais adequado ao perfil do cargo.', incorretas: { A: 'Inverte as definições.', C: 'São etapas distintas.', D: 'Treinamento é posterior à contratação.' }, conceitoCobrado: 'Etapas do processo de provisão.', pegadinha: 'Trocar as definições.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['RH', 'recrutamento', 'seleção'] },
    { id: 'Q-DID-ADM-0038', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-07', subtema: 'Treinamento x desenvolvimento', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre treinamento e desenvolvimento em gestão de pessoas, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Treinamento foca a carreira futura; desenvolvimento foca o cargo atual.' }, { id: 'B', texto: 'Treinamento foca o cargo atual (curto prazo); desenvolvimento foca a carreira e o futuro (longo prazo).' }, { id: 'C', texto: 'São sinônimos.' }, { id: 'D', texto: 'Ambos são exclusivos da alta direção.' }], gabarito: 'B', explicacao: { correta: 'Treinamento: curto prazo, prepara para as tarefas do CARGO ATUAL. Desenvolvimento: longo prazo, prepara para a CARREIRA e para funções futuras.', incorretas: { A: 'Inverte os conceitos.', C: 'Não são sinônimos.', D: 'Aplicam-se a todos os níveis.' }, conceitoCobrado: 'Treinamento x desenvolvimento.', pegadinha: 'Inverter os conceitos.', comoApareceEmConcurso: 'Cobrado em ADM e RH.' }, tags: ['RH', 'treinamento', 'desenvolvimento'] },
    { id: 'Q-DID-ADM-0039', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-07', subtema: 'Avaliação de desempenho', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a avaliação de desempenho nas organizações, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Serve apenas para punir servidores com baixo desempenho.' }, { id: 'B', texto: 'É processo sistemático de acompanhamento e mensuração, com fins de desenvolvimento e melhoria contínua.' }, { id: 'C', texto: 'Deve ser feita apenas pelo próprio avaliado.' }, { id: 'D', texto: 'É incompatível com a gestão por competências.' }], gabarito: 'B', explicacao: { correta: 'Avaliação de desempenho é processo sistemático de acompanhamento e mensuração, orientado ao desenvolvimento e à melhoria — não apenas punição.', incorretas: { A: 'Reduz a instrumento punitivo.', C: 'Autoavaliação é um dos métodos, não o único.', D: 'São complementares.' }, conceitoCobrado: 'Avaliação de desempenho.', pegadinha: 'Achar que avaliação é sinônimo de punição.', comoApareceEmConcurso: 'Cobrado em ADM e RH.' }, tags: ['RH', 'avaliação'] },
    { id: 'Q-DID-ADM-0040', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-07', subtema: 'Gestão por competências', dificuldade: 3, prioridade: 'alta', enunciado: 'A sigla CHA, na gestão por competências, refere-se a:', alternativas: [{ id: 'A', texto: 'Controle, Hierarquia e Autoridade.' }, { id: 'B', texto: 'Conhecimento, Habilidade e Atitude.' }, { id: 'C', texto: 'Cargo, Horário e Atribuição.' }, { id: 'D', texto: 'Coordenação, Hierarquia e Avaliação.' }], gabarito: 'B', explicacao: { correta: 'CHA = Conhecimento (saber), Habilidade (saber fazer) e Atitude (querer fazer). É a base da gestão por competências.', incorretas: { A: 'Não é CHA.', C: 'Não é CHA.', D: 'Não é CHA.' }, conceitoCobrado: 'Gestão por competências (CHA).', pegadinha: 'Inventar significados para a sigla.', comoApareceEmConcurso: 'Cobrado em ADM e RH.' }, tags: ['RH', 'competências', 'CHA'] },
    { id: 'Q-DID-ADM-0041', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-07', subtema: 'Concurso público', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre o provimento de cargos efetivos na Administração Pública, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É livre, sem exigência de concurso.' }, { id: 'B', texto: 'Depende de aprovação prévia em concurso público de provas ou de provas e títulos, salvo cargos em comissão (livre nomeação).' }, { id: 'C', texto: 'Só se aplica a cargos federais.' }, { id: 'D', texto: 'Pode ser feito por indicação política.' }], gabarito: 'B', explicacao: { correta: 'Art. 37, II, CF/88: a investidura em cargo ou emprego público depende de aprovação prévia em CONCURSO PÚBLICO, ressalvadas as nomeações para cargo em comissão declarado em lei de livre nomeação e exoneração.', incorretas: { A: 'Concurso é a regra.', C: 'Aplica-se à União, Estados, DF e Municípios.', D: 'Indicação política não substitui concurso para cargo efetivo.' }, conceitoCobrado: 'Concurso público como regra de provimento.', pegadinha: 'Achar que cargo em comissão exige concurso — NÃO exige.', comoApareceEmConcurso: 'Cobrado em ADM, AP e DA.' }, tags: ['RH', 'concurso público'] },
    { id: 'Q-DID-ADM-0042', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-07', subtema: 'Etapas de RH', dificuldade: 2, prioridade: 'alta', enunciado: 'São etapas clássicas da gestão de pessoas:', alternativas: [{ id: 'A', texto: 'Apenas recrutamento e seleção.' }, { id: 'B', texto: 'Provisão, aplicação, manutenção, desenvolvimento e monitoração de pessoas.' }, { id: 'C', texto: 'Apenas treinamento e avaliação.' }, { id: 'D', texto: 'Somente recrutamento, treinamento e desligamento.' }], gabarito: 'B', explicacao: { correta: 'A gestão de pessoas abrange: PROVISÃO (recrutamento e seleção), APLICAÇÃO (cargos e funções), MANUTENÇÃO (benefícios, higiene), DESENVOLVIMENTO (treinamento, carreira) e MONITORAÇÃO (avaliação de desempenho).', incorretas: { A: 'Reduz a duas etapas.', C: 'Reduz a duas etapas.', D: 'Exclui etapas essenciais.' }, conceitoCobrado: 'Etapas da gestão de pessoas.', pegadinha: 'Achar que RH é só recrutamento e seleção.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['RH'] },    
    { id: 'Q-DID-ADM-0043', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-08', subtema: 'Teorias da motivação', dificuldade: 2, prioridade: 'alta', enunciado: 'A teoria que classifica as necessidades humanas em cinco níveis (fisiológicas, segurança, sociais, estima e autorrealização) é de:', alternativas: [{ id: 'A', texto: 'Herzberg.' }, { id: 'B', texto: 'Maslow.' }, { id: 'C', texto: 'McGregor.' }, { id: 'D', texto: 'Vroom.' }], gabarito: 'B', explicacao: { correta: 'MASLOW criou a hierarquia das necessidades em 5 níveis: fisiológicas, segurança, sociais, estima e autorrealização.', incorretas: { A: 'Herzberg: teoria dos dois fatores (higiênicos x motivacionais).', C: 'McGregor: Teoria X e Teoria Y.', D: 'Vroom: teoria da expectativa.' }, conceitoCobrado: 'Teorias da motivação.', pegadinha: 'Confundir Maslow com Herzberg.', comoApareceEmConcurso: 'Alta frequência em ADM e RH.' }, tags: ['motivação', 'Maslow'] },
    { id: 'Q-DID-ADM-0044', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-08', subtema: 'Teorias da motivação', dificuldade: 3, prioridade: 'alta', enunciado: 'Segundo Herzberg, o salário é classificado como:', alternativas: [{ id: 'A', texto: 'Fator motivacional, pois gera satisfação e engajamento.' }, { id: 'B', texto: 'Fator higiênico, pois evita insatisfação, mas NÃO gera motivação.' }, { id: 'C', texto: 'Fator de autorrealização.' }, { id: 'D', texto: 'Fator de expectativa.' }], gabarito: 'B', explicacao: { correta: 'Herzberg: SALÁRIO é fator HIGIÊNICO. Evita insatisfação, mas NÃO motiva. Fatores motivacionais: realização, reconhecimento, responsabilidade, crescimento.', incorretas: { A: 'Salário não é fator motivacional na teoria de Herzberg.', C: 'Autorrealização é um nível de Maslow.', D: 'Expectativa é da teoria de Vroom.' }, conceitoCobrado: 'Fatores higiênicos x motivacionais.', pegadinha: 'Achar que salário motiva. Cai muito.', comoApareceEmConcurso: 'Alta frequência em ADM e RH.' }, tags: ['motivação', 'Herzberg'] },
    { id: 'Q-DID-ADM-0045', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-08', subtema: 'Liderança', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a liderança democrática, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'O líder centraliza as decisões e comunica de cima para baixo.' }, { id: 'B', texto: 'O líder compartilha decisões, ouve a equipe e mantém comunicação aberta.' }, { id: 'C', texto: 'O líder deixa a equipe totalmente livre, sem interferir.' }, { id: 'D', texto: 'O líder pune severamente os erros.' }], gabarito: 'B', explicacao: { correta: 'Liderança DEMOCRÁTICA (participativa): decisões compartilhadas, comunicação aberta, foco no grupo.', incorretas: { A: 'Isso é liderança autocrática.', C: 'Isso é liderança liberal (laissez-faire).', D: 'Punição severa não caracteriza estilo democrático.' }, conceitoCobrado: 'Estilos de liderança.', pegadinha: 'Trocar democrático com liberal.', comoApareceEmConcurso: 'Cobrado em ADM e RH.' }, tags: ['liderança', 'democrática'] },
    { id: 'Q-DID-ADM-0046', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-08', subtema: 'Liderança', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a liderança situacional (Hersey e Blanchard), é correto afirmar que:', alternativas: [{ id: 'A', texto: 'O líder deve adotar sempre o mesmo estilo, independentemente da equipe.' }, { id: 'B', texto: 'O líder adapta seu estilo ao nível de maturidade e competência da equipe para cada tarefa.' }, { id: 'C', texto: 'O estilo liberal é sempre o mais eficaz.' }, { id: 'D', texto: 'A liderança situacional não existe na literatura.' }], gabarito: 'B', explicacao: { correta: 'Liderança SITUACIONAL: o líder ajusta o estilo conforme a maturidade da equipe para cada tarefa (dirigir, treinar, apoiar ou delegar).', incorretas: { A: 'O estilo varia conforme a situação.', C: 'Não há estilo sempre melhor.', D: 'É teoria clássica (Hersey e Blanchard).' }, conceitoCobrado: 'Liderança situacional.', pegadinha: 'Achar que existe estilo único ideal.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['liderança', 'situacional'] },
    { id: 'Q-DID-ADM-0047', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-08', subtema: 'Motivação', dificuldade: 3, prioridade: 'alta', enunciado: 'Sobre a Teoria X e a Teoria Y de McGregor, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Teoria X: o trabalhador gosta do trabalho e busca responsabilidade. Teoria Y: precisa ser controlado.' }, { id: 'B', texto: 'Teoria X: o trabalhador é preguiçoso e precisa ser controlado. Teoria Y: o trabalhador gosta do trabalho e busca responsabilidade.' }, { id: 'C', texto: 'Ambas defendem a mesma visão sobre o trabalhador.' }, { id: 'D', texto: 'A Teoria Y nega a necessidade de qualquer estrutura organizacional.' }], gabarito: 'B', explicacao: { correta: 'X: visão negativa (trabalhador preguiçoso, precisa ser controlado). Y: visão positiva (trabalhador gosta do trabalho, busca responsabilidade).', incorretas: { A: 'Inverte as teorias.', C: 'São visões opostas.', D: 'A Teoria Y não nega estrutura, apenas confia mais no trabalhador.' }, conceitoCobrado: 'Teoria X e Teoria Y.', pegadinha: 'Inverter X e Y.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['motivação', 'McGregor'] },
    { id: 'Q-DID-ADM-0048', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-08', subtema: 'Liderança', dificuldade: 3, prioridade: 'media', enunciado: 'Sobre a liderança transacional, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Baseia-se em inspiração, visão de futuro e desenvolvimento das pessoas.' }, { id: 'B', texto: 'Baseia-se na troca: recompensa pelo desempenho e punição pelo erro.' }, { id: 'C', texto: 'É incompatível com o serviço público.' }, { id: 'D', texto: 'É sinônimo de liderança liberal.' }], gabarito: 'B', explicacao: { correta: 'Liderança TRANSACIONAL: baseada em troca (recompensa pelo desempenho, punição pelo erro). É a gestão pela transação.', incorretas: { A: 'Isso descreve a liderança TRANSFORMACIONAL.', C: 'É aplicável ao setor público.', D: 'Liberal é diferente (laissez-faire).' }, conceitoCobrado: 'Transacional x transformacional.', pegadinha: 'Trocar transacional com transformacional.', comoApareceEmConcurso: 'Cobrado em ADM e RH.' }, tags: ['liderança', 'transacional'] },
    { id: 'Q-DID-ADM-0049', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-09', subtema: 'Elementos da comunicação', dificuldade: 2, prioridade: 'alta', enunciado: 'No processo de comunicação, o retorno que o receptor dá ao emissor, confirmando o entendimento da mensagem, é chamado de:', alternativas: [{ id: 'A', texto: 'Codificação.' }, { id: 'B', texto: 'Canal.' }, { id: 'C', texto: 'Feedback.' }, { id: 'D', texto: 'Ruído.' }], gabarito: 'C', explicacao: { correta: 'FEEDBACK é o retorno do receptor ao emissor. Confirma se a mensagem foi compreendida.', incorretas: { A: 'Codificação é transformar a ideia em linguagem.', B: 'Canal é o meio de transmissão.', D: 'Ruído é qualquer interferência que distorce.' }, conceitoCobrado: 'Elementos da comunicação.', pegadinha: 'Confundir feedback com canal.', comoApareceEmConcurso: 'Cobrado em ADM e Atendimento.' }, tags: ['comunicação', 'feedback'] },
    { id: 'Q-DID-ADM-0050', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-09', subtema: 'Tipos de comunicação', dificuldade: 2, prioridade: 'alta', enunciado: 'Quando um servidor envia um relatório mensal à sua chefia, essa comunicação é classificada como:', alternativas: [{ id: 'A', texto: 'Descendente.' }, { id: 'B', texto: 'Ascendente.' }, { id: 'C', texto: 'Horizontal.' }, { id: 'D', texto: 'Diagonal.' }], gabarito: 'B', explicacao: { correta: 'Comunicação ASCENDENTE: do subordinado para a chefia (relatórios, sugestões, reclamações).', incorretas: { A: 'Descendente: da chefia para o subordinado.', C: 'Horizontal: entre pares de mesmo nível.', D: 'Diagonal: cruza níveis e áreas.' }, conceitoCobrado: 'Tipos de comunicação.', pegadinha: 'Inverter ascendente e descendente.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['comunicação', 'ascendente'] },
    { id: 'Q-DID-ADM-0051', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-09', subtema: 'Barreiras', dificuldade: 3, prioridade: 'alta', enunciado: 'Um gestor usa expressões ambíguas em um memorando, e alguns servidores interpretam de formas diferentes. A barreira de comunicação presente é:', alternativas: [{ id: 'A', texto: 'Física.' }, { id: 'B', texto: 'Fisiológica.' }, { id: 'C', texto: 'Semântica.' }, { id: 'D', texto: 'Cultural.' }], gabarito: 'C', explicacao: { correta: 'Barreira SEMÂNTICA: relacionada ao SIGNIFICADO das palavras (ambiguidade, jargões, termos técnicos).', incorretas: { A: 'Física: ruído do ambiente.', B: 'Fisiológica: problemas de audição/visão.', D: 'Cultural: diferenças culturais.' }, conceitoCobrado: 'Barreiras de comunicação.', pegadinha: 'Confundir semântica com fisiológica.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['comunicação', 'barreiras', 'semântica'] },
    { id: 'Q-DID-ADM-0052', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-09', subtema: 'Comunicação informal', dificuldade: 2, prioridade: 'alta', enunciado: 'Sobre a comunicação informal nas organizações, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É sempre prejudicial e deve ser eliminada.' }, { id: 'B', texto: 'Ocorre fora dos canais oficiais (rádio-peão, conversas de corredor) e pode ser rápida e complementar à comunicação formal.' }, { id: 'C', texto: 'Só ocorre por escrito.' }, { id: 'D', texto: 'É sinônimo de comunicação descendente.' }], gabarito: 'B', explicacao: { correta: 'Comunicação INFORMAL: fora dos canais oficiais. Pode ser rápida e complementar, ajudando a resolver problemas do dia a dia.', incorretas: { A: 'Não é sempre prejudicial.', C: 'Pode ser oral ou escrita.', D: 'Descendente é uma comunicação formal vertical.' }, conceitoCobrado: 'Comunicação formal x informal.', pegadinha: 'Achar que informal é ruim.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['comunicação', 'informal'] },
    { id: 'Q-DID-ADM-0053', tipo: 'DIDATICA', area: 'ADM', moduloId: 'ADM-09', subtema: 'Elementos da comunicação', dificuldade: 1, prioridade: 'alta', enunciado: 'São elementos do processo de comunicação:', alternativas: [{ id: 'A', texto: 'Apenas emissor e receptor.' }, { id: 'B', texto: 'Emissor, codificação, mensagem, canal, decodificação, receptor, feedback e ruído.' }, { id: 'C', texto: 'Somente mensagem e canal.' }, { id: 'D', texto: 'Emissor, receptor e lucro.' }], gabarito: 'B', explicacao: { correta: 'O processo de comunicação envolve: emissor, codificação, mensagem, canal, decodificação, receptor, feedback e ruído.', incorretas: { A: 'Falta a maioria dos elementos.', C: 'Falta a maioria dos elementos.', D: 'Lucro não é elemento de comunicação.' }, conceitoCobrado: 'Elementos da comunicação.', pegadinha: 'Esquecer o feedback ou o ruído.', comoApareceEmConcurso: 'Cobrado em ADM.' }, tags: ['comunicação'] },
