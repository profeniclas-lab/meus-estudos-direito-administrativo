    'DA-14': {
      id: 'L-DA-14',
      moduloId: 'DA-14',
      objetivo: 'Compreender as formas de intervenção do Estado na propriedade: desapropriação (ordinária, extraordinária, sancionatória e urbanística), limitação administrativa, servidão administrativa, tombamento e requisição administrativa. Fechamento do Direito Administrativo.',
      prerequisitos: ['DA-03'],
      introducao: 'A propriedade privada é garantida pela Constituição, mas não é absoluta. O Estado pode intervir na propriedade em favor do interesse público por várias formas, cada uma com regime jurídico próprio. É o último grande tema do Direito Administrativo e cai com frequência em concursos.',
      explicacaoSimples: 'Imagine que o Estado precisa construir uma estrada, preservar um patrimônio histórico, conter uma enchente ou usar temporariamente um imóvel para socorrer vítimas. Em cada caso, ele interfere na propriedade de alguém, mas de forma diferente. Às vezes tira a propriedade definitivamente (desapropriação). Às vezes só impõe uma restrição (limitação). Às vezes usa temporariamente (requisição). Cada tipo de intervenção tem regras próprias.',
      explicacaoTecnica: 'A propriedade é garantida pela CF (art. 5º, XXII), mas deve cumprir função social (art. 5º, XXIII; art. 170; art. 182; art. 186). Formas de intervenção: (1) DESAPROPRIAÇÃO — transferência coativa da propriedade ao Estado, por necessidade ou utilidade pública, ou interesse social, mediante indenização prévia, justa e em dinheiro (art. 5º, XXIV). Tipos: ORDINÁRIA (art. 5º, XXIV — indenização em dinheiro); EXTRAORDINÁRIA (art. 243 — cultivo de psicotrópicos, SEM indenização); SANCIONATÓRIA (art. 184 — imóvel rural que não cumpre função social, indenização com TDA); URBANÍSTICA (art. 182, §4º, III — imóvel urbano que não cumpre função social, indenização com títulos da dívida pública). (2) LIMITAÇÃO ADMINISTRATIVA — restrições gerais, gratuitas e unilaterais impostas ao uso da propriedade em favor do interesse público (ex.: gabarito de altura, zoneamento). (3) SERVIDÃO ADMINISTRATIVA — ônus real sobre imóvel, de caráter específico, imposto a um ou poucos proprietários, em favor de um serviço público (ex.: passagem de rede elétrica por terreno particular). Em regra, indenização apenas se houver dano efetivo. (4) TOMBAMENTO — preservação de bens de valor histórico, cultural, artístico ou paisagístico (Decreto-Lei 25/1937). Pode ser voluntário ou compulsório; em regra, gratuito, com indenização apenas se houver esvaziamento do conteúdo econômico. (5) REQUISIÇÃO ADMINISTRATIVA — uso temporário de bem imóvel ou móvel em caso de PERIGO PÚBLICO IMINENTE (art. 5º, XXV). Indenização posterior, se houver dano. (6) OCUPAÇÃO TEMPORÁRIA — uso temporário de imóvel para obras públicas ou serviço público, com indenização ao final.',
      exemplos: [
        'Desapropriação ordinária: Estado desapropria terreno para construir hospital público, pagando em dinheiro.',
        'Desapropriação extraordinária: imóvel usado para cultivo de psicotrópicos, SEM indenização.',
        'Limitação administrativa: lei municipal limita a altura de prédios em bairro histórico.',
        'Servidão administrativa: passagem de rede elétrica sobre terreno particular, com indenização se houver dano.',
        'Tombamento: preservação de um casarão histórico, em regra sem indenização.',
        'Requisição: Estado requisita um caminhão em situação de calamidade pública, com indenização posterior se houver dano.'
      ],
      comparacoes: [
        { termoA: 'Desapropriação', termoB: 'Limitação administrativa', diferenca: 'DESAPRIPTAÇÃO: transfere a PROPRIEDADE do bem ao Estado, com indenização prévia em dinheiro (regra geral). LIMITAÇÃO ADMINISTRATIVA: NÃO retira a propriedade; apenas impõe RESTRIÇÕES gerais e gratuitas ao seu uso (ex.: zoneamento, gabarito de altura). A limitação é geral; a desapropriação é específica.' },
        { termoA: 'Servidão administrativa', termoB: 'Limitação administrativa', diferenca: 'SERVIDÃO: ônus real, ESPECÍFICO, imposto a um ou poucos proprietários (ex.: passagem de rede elétrica). LIMITAÇÃO: restrição GERAL, aplicável a todos os imóveis de uma região (ex.: limite de altura). A servidão pode gerar indenização se houver dano; a limitação, em regra, não indeniza.' },
        { termoA: 'Requisição administrativa', termoB: 'Desapropriação', diferenca: 'REQUISIÇÃO: uso TEMPORÁRIO de bem (móvel ou imóvel) em caso de PERIGO PÚBLICO IMINENTE, com indenização POSTERIOR. DESAPROPRIAÇÃO: transferência DEFINITIVA da propriedade, com indenização PRÉVIA em dinheiro. A requisição é emergencial e temporária; a desapropriação é definitiva.' }
      ],
      aplicacaoAdministracaoPublica: 'A intervenção do Estado na propriedade é aplicada em vários contextos: construção de rodovias (desapropriação), preservação de patrimônio (tombamento), resposta a desastres (requisição), obras de infraestrutura (servidão administrativa), planejamento urbano (limitação administrativa). O Decreto-Lei 3.365/1941 regula a desapropriação por utilidade pública; a Lei 4.132/1962 trata do interesse social; a Lei Complementar 76/1993 regula a desapropriação para reforma agrária; o Decreto-Lei 25/1937 regula o tombamento; o Estatuto da Cidade (Lei 10.257/2001) trata da função social da propriedade urbana. Concurso de nível médio cobra, sobretudo, os tipos de desapropriação e a distinção entre as cinco formas de intervenção.',
      pegadinhas: [
        'Achar que TODA desapropriação é indenizada em dinheiro. A extraordinária (art. 243) NÃO indeniza; a sancionatória (art. 184) indeniza com TDA; a urbanística (art. 182, §4º, III) indeniza com títulos da dívida pública.',
        'Confundir desapropriação com requisição. Desapropriação = definitiva. Requisição = temporária, em perigo público iminente.',
        'Dizer que a limitação administrativa gera indenização. Em regra, NÃO gera — é gratuita.',
        'Achar que o tombamento sempre indeniza. Em regra, NÃO indeniza; só se esvaziar o conteúdo econômico do bem.',
        'Confundir servidão administrativa (ônus específico) com limitação administrativa (restrição geral).',
        'Confundir desapropriação sancionatória (rural — art. 184) com urbanística (art. 182, §4º, III).'
      ],
      errosComuns: [
        'Decorar as modalidades sem entender as diferenças de regime.',
        'Confundir os tipos de desapropriação e a forma de indenização.',
        'Ignorar que a requisição é temporária e ocorre em perigo público iminente.',
        'Achar que a limitação administrativa transfere a propriedade.'
      ],
      resumo: [
        'A propriedade é garantida, mas deve cumprir função social.',
        'Desapropriação: transferência coativa, indenização prévia justa (regra geral, em dinheiro). Tipos: ordinária, extraordinária (sem indenização), sancionatória (TDA) e urbanística (títulos da dívida pública).',
        'Limitação administrativa: restrição geral e gratuita (ex.: zoneamento).',
        'Servidão administrativa: ônus real específico (ex.: passagem de rede elétrica), com indenização apenas se houver dano.',
        'Tombamento: preservação de patrimônio cultural (Decreto-Lei 25/1937); em regra, gratuito.',
        'Requisição administrativa: uso temporário em perigo público iminente (art. 5º, XXV), indenização posterior.',
        'Ocupação temporária: uso temporário para obras públicas.'
      ],
      modoProfessor: {
        explicarMaisSimples: 'O Estado pode "mexer" na propriedade das pessoas de várias formas: tirar (desapropriação), restringir o uso (limitação), atravessar com uma rede (servidão), preservar (tombamento), usar temporariamente em emergência (requisição). Cada uma tem regras próprias, e nem toda intervenção gera indenização.',
        outroExemplo: 'O Estado quer construir uma linha de metrô. Desapropria os imóveis na rota (com indenização em dinheiro). Se um terreno vizinho tiver servidão para passagem de tubulação, é servidão administrativa. Se houver um prédio histórico na área, ele é preservado por tombamento. Se houver enchente durante a obra, o Estado pode requisitar temporariamente um galpão.',
        compararConceitos: 'Desapropriação: tira a propriedade, indeniza em dinheiro (regra). Limitação: restringe, gratuita. Servidão: ônus específico, indeniza se houver dano. Tombamento: preserva, em regra gratuito. Requisição: usa temporariamente, em perigo público iminente. Sancionatória x Urbanística: rural com TDA x urbano com títulos da dívida pública.',
        mostrarPegadinha: 'Cuidado com duas pegadinhas clássicas: (1) "A desapropriação extraordinária (art. 243) gera indenização em dinheiro". ERRADO — NÃO gera indenização. (2) "A limitação administrativa obriga o Estado a indenizar o proprietário". ERRADO — em regra, é gratuita, pois atinge generalizadamente todos os imóveis da região.',
        comoApareceEmConcurso: 'Cai como: (1) identificar o tipo de intervenção em uma situação; (2) distinguir desapropriação de requisição; (3) reconhecer os tipos de desapropriação e suas formas de indenização; (4) diferenciar servidão de limitação.',
        fazerPergunta: {
          pergunta: 'O Estado precisa usar um caminhão particular para transportar vacinas durante uma epidemia, dado o risco iminente à saúde pública. Qual intervenção cabe?',
          resposta: 'REQUISIÇÃO ADMINISTRATIVA — uso temporário de bem móvel (caminhão) em caso de PERIGO PÚBLICO IMINENTE (art. 5º, XXV, CF). A indenização é POSTERIOR, se houver dano. Não cabe desapropriação, porque não se transfere a propriedade definitivamente.'
        }
      }
    },    
  };

      { id: 'D-ADM-01-03', tipo: 'situacao', subtopico: 'Funções administrativas', pergunta: 'A Secretaria de Saúde definiu que reduzirá em 20% o tempo médio de espera e alocou equipes, equipamentos e orçamento. Qual função?', alternativas: [{ id: 'A', texto: 'Controle.' }, { id: 'B', texto: 'Direção.' }, { id: 'C', texto: 'Planejamento.' }, { id: 'D', texto: 'Organização.' }], gabarito: 'C', explicacao: 'Definir objetivos e alocar recursos é PLANEJAMENTO.' },
      { id: 'D-ADM-01-04', tipo: 'autoavaliacao', subtopico: 'Níveis organizacionais', pergunta: 'Você sabe diferenciar os níveis estratégico, tático e operacional na Administração?', resposta: 'Estratégico: nível institucional. Tático: nível gerencial. Operacional: execução.' },
      { id: 'D-ADM-01-05', tipo: 'multipla_escolha', subtopico: 'Recursos organizacionais', pergunta: 'Sobre os recursos organizacionais, assinale a alternativa que NÃO corresponde a uma categoria tradicionalmente reconhecida:', alternativas: [{ id: 'A', texto: 'Recursos humanos.' }, { id: 'B', texto: 'Recursos materiais e financeiros.' }, { id: 'C', texto: 'Recursos informacionais e tecnológicos.' }, { id: 'D', texto: 'Recursos sobrenaturais.' }], gabarito: 'D', explicacao: 'Categorias clássicas: humanos, materiais, financeiros, informacionais e tecnológicos.' }
    ] },
    'ADM-02': { id: 'D-ADM-02', moduloId: 'ADM-02', itens: [
      { id: 'D-ADM-02-01', tipo: 'multipla_escolha', subtopico: 'Integração das funções', pergunta: 'Segundo Fayol, a ordem do ciclo administrativo é:', alternativas: [{ id: 'A', texto: 'Organização → Planejamento → Controle → Direção.' }, { id: 'B', texto: 'Controle → Planejamento → Organização → Direção.' }, { id: 'C', texto: 'Planejamento → Organização → Direção → Controle.' }, { id: 'D', texto: 'Direção → Planejamento → Organização → Controle.' }], gabarito: 'C', explicacao: 'O ciclo PODC é: Planejamento, Organização, Direção e Controle.' },
      { id: 'D-ADM-02-02', tipo: 'verdadeiro_falso', subtopico: 'Controle', pergunta: 'O controle é etapa estanque, aplicada apenas ao final do processo administrativo.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. O controle é contínuo e retroalimenta o planejamento.' },
      { id: 'D-ADM-02-03', tipo: 'situacao', subtopico: 'Direção', pergunta: 'O gerente reúne a equipe, delega responsabilidades, orienta servidores e mantém o grupo motivado. Qual função?', alternativas: [{ id: 'A', texto: 'Planejamento.' }, { id: 'B', texto: 'Organização.' }, { id: 'C', texto: 'Direção.' }, { id: 'D', texto: 'Controle.' }], gabarito: 'C', explicacao: 'Liderar, motivar, comunicar é DIREÇÃO.' },
      { id: 'D-ADM-02-04', tipo: 'autoavaliacao', subtopico: 'Integração das funções', pergunta: 'Você sabe diferenciar PODC de PDCA?', resposta: 'PODC: Planejamento, Organização, Direção e Controle. PDCA: Plan, Do, Check, Act.' },
      { id: 'D-ADM-02-05', tipo: 'multipla_escolha', subtopico: 'Organização', pergunta: 'Sobre a função de organização:', alternativas: [{ id: 'A', texto: 'Define objetivos de longo prazo.' }, { id: 'B', texto: 'Estrutura recursos, define autoridade, responsabilidade e departamentalização.' }, { id: 'C', texto: 'Mede desempenho e corrige desvios.' }, { id: 'D', texto: 'Lida exclusivamente com motivação.' }], gabarito: 'B', explicacao: 'Organização é estrutural: define órgãos, cargos, hierarquia, autoridade, responsabilidade.' }
    ] },
    'ADM-03': { id: 'D-ADM-03', moduloId: 'ADM-03', itens: [
      { id: 'D-ADM-03-01', tipo: 'multipla_escolha', subtopico: 'Níveis de planejamento', pergunta: 'O planejamento que define a missão, a visão e os objetivos de longo prazo da organização é classificado como:', alternativas: [{ id: 'A', texto: 'Operacional.' }, { id: 'B', texto: 'Tático.' }, { id: 'C', texto: 'Estratégico.' }, { id: 'D', texto: 'Departamental.' }], gabarito: 'C', explicacao: 'Planejamento ESTRATÉGICO é nível institucional (topo), define missão/visão e tem horizonte de longo prazo.' },
      { id: 'D-ADM-03-02', tipo: 'verdadeiro_falso', subtopico: 'Objetivos e metas', pergunta: 'Objetivo e meta são sinônimos: ambos se referem à quantificação exata de resultados com prazo definido.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. Objetivo é qualitativo (intenção ampla); meta é quantificada com prazo e valor.' },
      { id: 'D-ADM-03-03', tipo: 'situacao', subtopico: 'Níveis de planejamento', pergunta: 'A Secretaria de Educação desdobra a meta municipal de redução de evasão escolar entre as escolas da rede, definindo quanto cada unidade deve contribuir no próximo ano. Esse é o nível:', alternativas: [{ id: 'A', texto: 'Estratégico.' }, { id: 'B', texto: 'Tático.' }, { id: 'C', texto: 'Operacional.' }, { id: 'D', texto: 'Institucional.' }], gabarito: 'B', explicacao: 'O nível TÁTICO traduz o estratégico em metas por área/departamento. O operacional é a execução do dia a dia.' },
      { id: 'D-ADM-03-04', tipo: 'autoavaliacao', subtopico: 'Instrumentos públicos', pergunta: 'Você sabe relacionar o PPA, a LDO e a LOA aos níveis de planejamento?', resposta: 'PPA: estratégico (4 anos). LDO: tático (diretrizes anuais). LOA: operacional (orçamento anual).' },
      { id: 'D-ADM-03-05', tipo: 'multipla_escolha', subtopico: 'Análise SWOT', pergunta: 'Sobre a análise SWOT, assinale a alternativa correta:', alternativas: [{ id: 'A', texto: 'SWOT analisa somente o ambiente externo.' }, { id: 'B', texto: 'SWOT avalia forças e fraquezas (internas) e oportunidades e ameaças (externas).' }, { id: 'C', texto: 'SWOT substitui o planejamento operacional.' }, { id: 'D', texto: 'SWOT é ferramenta exclusiva da Administração Pública.' }], gabarito: 'B', explicacao: 'SWOT: Forças e Fraquezas (ambiente interno); Oportunidades e Ameaças (ambiente externo). É ferramenta do planejamento estratégico.' }
    ] },
    'ADM-04': { id: 'D-ADM-04', moduloId: 'ADM-04', itens: [
      { id: 'D-ADM-04-01', tipo: 'multipla_escolha', subtopico: 'Departamentalização', pergunta: 'Uma prefeitura organiza suas secretarias em Saúde, Educação e Obras. Esse critério é departamentalização:', alternativas: [{ id: 'A', texto: 'Por clientes.' }, { id: 'B', texto: 'Funcional.' }, { id: 'C', texto: 'Geográfica.' }, { id: 'D', texto: 'Por produtos.' }], gabarito: 'B', explicacao: 'Agrupar por especialidade (Saúde, Educação, Obras) é departamentalização FUNCIONAL.' },
      { id: 'D-ADM-04-02', tipo: 'verdadeiro_falso', subtopico: 'Autoridade e responsabilidade', pergunta: 'A responsabilidade pode ser delegada da mesma forma que a autoridade, transferindo integralmente ao subordinado o dever de responder pelos resultados.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. A autoridade se delega; a responsabilidade permanece com quem delegou perante seus superiores.' },
      { id: 'D-ADM-04-03', tipo: 'situacao', subtopico: 'Amplitude de controle', pergunta: 'Um supervisor com 4 subordinados diretos e outro com 15 subordinados diretos são comparados. Sobre a amplitude de controle:', alternativas: [{ id: 'A', texto: 'O primeiro tem amplitude maior.' }, { id: 'B', texto: 'O segundo tem amplitude maior.' }, { id: 'C', texto: 'Ambos têm a mesma amplitude.' }, { id: 'D', texto: 'Amplitude de controle não se relaciona com número de subordinados.' }], gabarito: 'B', explicacao: 'Amplitude de controle é o número de subordinados por chefe. 15 > 4, logo o segundo tem amplitude MAIOR.' },
      { id: 'D-ADM-04-04', tipo: 'autoavaliacao', subtopico: 'Centralização e descentralização', pergunta: 'Você sabe diferenciar centralização de descentralização administrativa?', resposta: 'Centralização: decisões concentradas no topo. Descentralização: decisões delegadas a níveis inferiores ou a unidades locais.' },
      { id: 'D-ADM-04-05', tipo: 'multipla_escolha', subtopico: 'Estrutura organizacional', pergunta: 'Sobre autoridade, responsabilidade e hierarquia na organização:', alternativas: [{ id: 'A', texto: 'Autoridade e responsabilidade são sinônimos.' }, { id: 'B', texto: 'Autoridade é o direito de mandar; responsabilidade é o dever de responder; hierarquia é a cadeia de comando.' }, { id: 'C', texto: 'Hierarquia é o mesmo que disciplina.' }, { id: 'D', texto: 'Responsabilidade pode ser totalmente transferida ao subordinado.' }], gabarito: 'B', explicacao: 'Autoridade (mandar), responsabilidade (responder) e hierarquia (cadeia de comando) são conceitos distintos.' }
    ] },
    'ADM-05': { id: 'D-ADM-05', moduloId: 'ADM-05', itens: [
      { id: 'D-ADM-05-01', tipo: 'multipla_escolha', subtopico: 'Estilos de liderança', pergunta: 'Um gestor reúne a equipe, ouve sugestões e decide em conjunto com os servidores. Esse estilo de liderança é classificado como:', alternativas: [{ id: 'A', texto: 'Autocrático.' }, { id: 'B', texto: 'Democrático.' }, { id: 'C', texto: 'Liberal (laissez-faire).' }, { id: 'D', texto: 'Paternalista.' }], gabarito: 'B', explicacao: 'Liderança DEMOCRÁTICA (participativa): decisões compartilhadas e comunicação aberta. Autocrático decide sozinho; liberal deixa a equipe à vontade.' },
      { id: 'D-ADM-05-02', tipo: 'verdadeiro_falso', subtopico: 'Chefe e líder', pergunta: 'Todo chefe é necessariamente líder, pois ocupa posição formal de comando na hierarquia.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. Chefia é posição formal. Liderança é influência e pode não acompanhar o cargo.' },
      { id: 'D-ADM-05-03', tipo: 'situacao', subtopico: 'Motivação', pergunta: 'Um servidor se esforça no trabalho principalmente porque se sente realizado com a atividade em si e com o propósito do serviço público. Esse é um exemplo de motivação:', alternativas: [{ id: 'A', texto: 'Extrínseca.' }, { id: 'B', texto: 'Intrínseca.' }, { id: 'C', texto: 'Coercitiva.' }, { id: 'D', texto: 'Instrumental.' }], gabarito: 'B', explicacao: 'Motivação INTRÍNSECA vem de dentro (satisfação, propósito). Extrínseca vem de fora (bônus, promoção, punição).' },
      { id: 'D-ADM-05-04', tipo: 'autoavaliacao', subtopico: 'Funções da direção', pergunta: 'Você sabe citar as quatro principais funções/áreas da Direção?', resposta: 'Liderança, motivação, comunicação e coordenação.' },
      { id: 'D-ADM-05-05', tipo: 'multipla_escolha', subtopico: 'Funções da direção', pergunta: 'Sobre a função administrativa de Direção, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É a função que define objetivos de longo prazo.' }, { id: 'B', texto: 'É a função que conduz e coordena pessoas para executar o planejado, envolvendo liderança, motivação e comunicação.' }, { id: 'C', texto: 'É a função que mede desempenho e corrige desvios.' }, { id: 'D', texto: 'É a função que estrutura cargos e hierarquia.' }], gabarito: 'B', explicacao: 'Direção conduz pessoas. Envolve liderança, motivação, comunicação e coordenação. A: planejamento. C: controle. D: organização.' }
    ] },
    'AP-02': { id: 'D-AP-02', moduloId: 'AP-02', itens: [
      { id: 'D-AP-02-01', tipo: 'multipla_escolha', subtopico: 'Patrimonialismo', pergunta: 'Confusão entre patrimônio público e privado, nepotismo e pessoalidade. Modelo:', alternativas: [{ id: 'A', texto: 'Burocrático.' }, { id: 'B', texto: 'Gerencial.' }, { id: 'C', texto: 'Patrimonialista.' }, { id: 'D', texto: 'Nova Gestão Pública.' }], gabarito: 'C', explicacao: 'Patrimonialismo: sem distinção entre público e privado.' },
      { id: 'D-AP-02-02', tipo: 'verdadeiro_falso', subtopico: 'Administração gerencial', pergunta: 'A Reforma Gerencial brasileira foi consolidada pela EC 19/1998, com Bresser-Pereira e Plano Diretor de 1995.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'V', explicacao: 'Verdadeiro. EC 19/1998 inseriu eficiência como princípio expresso.' },
      { id: 'D-AP-02-03', tipo: 'situacao', subtopico: 'Administração gerencial', pergunta: 'Um hospital público firma contrato de gestão com metas e bônus. Modelo:', alternativas: [{ id: 'A', texto: 'Patrimonialista.' }, { id: 'B', texto: 'Burocrático.' }, { id: 'C', texto: 'Gerencial.' }, { id: 'D', texto: 'Pré-burocrático.' }], gabarito: 'C', explicacao: 'Contrato de gestão, metas e bônus são GERENCIAIS.' },
      { id: 'D-AP-02-04', tipo: 'autoavaliacao', subtopico: 'Burocracia', pergunta: 'Você sabe identificar características do modelo burocrático weberiano?', resposta: 'Impessoalidade, formalismo, hierarquia, meritocracia, regras escritas. Weber. Brasil: 1936-1938 (Vargas).' },
      { id: 'D-AP-02-05', tipo: 'multipla_escolha', subtopico: 'Burocracia', pergunta: 'Sobre o modelo burocrático, assinale a INCORRETA:', alternativas: [{ id: 'A', texto: 'Tem em Max Weber um de seus teóricos.' }, { id: 'B', texto: 'No Brasil consolidou-se a partir de 1936, com DASP em 1938.' }, { id: 'C', texto: 'Tem como marca impessoalidade e meritocracia.' }, { id: 'D', texto: 'Foi introduzido no Brasil pela Reforma Gerencial de 1995.' }], gabarito: 'D', explicacao: 'A reforma de 1995 foi GERENCIAL. A BUROCRÁTICA foi 1936-1938.' }
    ] },
    'DA-02': { id: 'D-DA-02', moduloId: 'DA-02', itens: [
      { id: 'D-DA-02-01', tipo: 'multipla_escolha', subtopico: 'Princípios expressos', pergunta: 'São princípios expressos no caput do art. 37 da CF/88:', alternativas: [{ id: 'A', texto: 'Legalidade, impessoalidade, moralidade, publicidade e eficiência.' }, { id: 'B', texto: 'Legalidade, imparcialidade, moralidade, publicidade e eficiência.' }, { id: 'C', texto: 'Legalidade, impessoalidade, moralidade, transparência e economicidade.' }, { id: 'D', texto: 'Razoabilidade, proporcionalidade, moralidade, publicidade e eficiência.' }], gabarito: 'A', explicacao: 'LIMPE.' },
      { id: 'D-DA-02-02', tipo: 'verdadeiro_falso', subtopico: 'Princípios expressos', pergunta: 'O princípio da eficiência foi inserido no caput do art. 37 da CF pela EC 19/1998.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'V', explicacao: 'Verdadeiro. EC 19/1998 (Reforma Gerencial).' },
      { id: 'D-DA-02-03', tipo: 'situacao', subtopico: 'Princípios expressos', pergunta: 'Prefeito afixa outdoors com sua foto ao lado de obras municipais pagos com verba pública. Viola:', alternativas: [{ id: 'A', texto: 'Legalidade.' }, { id: 'B', texto: 'Impessoalidade.' }, { id: 'C', texto: 'Publicidade.' }, { id: 'D', texto: 'Continuidade do serviço público.' }], gabarito: 'B', explicacao: 'Art. 37, §1º, CF veda promoção pessoal. Violação direta da IMPESSOALIDADE.' },
      { id: 'D-DA-02-04', tipo: 'autoavaliacao', subtopico: 'Princípios expressos', pergunta: 'Você sabe explicar por que a legalidade administrativa é diferente da legalidade do particular?', resposta: 'Particular: pode tudo que a lei não proíbe. Administração: só o que a lei autoriza ou determina.' },
      { id: 'D-DA-02-05', tipo: 'multipla_escolha', subtopico: 'Princípios implícitos', pergunta: 'São exemplos de princípios IMPLÍCITOS:', alternativas: [{ id: 'A', texto: 'Legalidade e impessoalidade.' }, { id: 'B', texto: 'Supremacia do interesse público, indisponibilidade e autotutela.' }, { id: 'C', texto: 'Moralidade e publicidade.' }, { id: 'D', texto: 'Eficiência e publicidade.' }], gabarito: 'B', explicacao: 'Supremacia, indisponibilidade e autotutela (Súmulas 346/473 STF) são implícitos.' }
    ] },
    'ADM-06': { id: 'D-ADM-06', moduloId: 'ADM-06', itens: [
      { id: 'D-ADM-06-01', tipo: 'multipla_escolha', subtopico: 'Etapas do controle', pergunta: 'Assinale a alternativa que apresenta a ordem correta das etapas do controle administrativo:', alternativas: [{ id: 'A', texto: 'Ação corretiva → padrão → monitoramento → comparação.' }, { id: 'B', texto: 'Padrão → monitoramento → comparação → ação corretiva.' }, { id: 'C', texto: 'Monitoramento → padrão → ação corretiva → comparação.' }, { id: 'D', texto: 'Comparação → padrão → monitoramento → ação corretiva.' }], gabarito: 'B', explicacao: 'Controle segue: (1) estabelecer PADRÃO; (2) MONITORAR desempenho real; (3) COMPARAR real com padrão; (4) aplicar AÇÃO CORRETIVA se houver desvio.' },
      { id: 'D-ADM-06-02', tipo: 'verdadeiro_falso', subtopico: 'Controle', pergunta: 'O controle é uma etapa estanque, aplicada apenas ao final do processo administrativo, sem retorno às fases anteriores.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. O controle é contínuo e retroalimenta o planejamento — o ciclo PODC é contínuo.' },
      { id: 'D-ADM-06-03', tipo: 'situacao', subtopico: 'Tipos de controle', pergunta: 'Um Tribunal de Contas realiza auditoria em contratos já encerrados e identifica irregularidades. O tipo de controle exercido é:', alternativas: [{ id: 'A', texto: 'Preventivo.' }, { id: 'B', texto: 'Simultâneo.' }, { id: 'C', texto: 'Posterior.' }, { id: 'D', texto: 'Prévio.' }], gabarito: 'C', explicacao: 'Controle POSTERIOR (a posteriori): ocorre depois da execução dos atos. O preventivo (a priori) seria antes (ex.: treinamento); o simultâneo, durante (ex.: supervisão).' },
      { id: 'D-ADM-06-04', tipo: 'autoavaliacao', subtopico: 'Etapas do controle', pergunta: 'Você sabe citar as quatro etapas do controle administrativo?', resposta: 'Padrão (estabelecer), monitoramento (medir o desempenho), comparação (real x padrão) e ação corretiva (ajustar).' },
      { id: 'D-ADM-06-05', tipo: 'multipla_escolha', subtopico: 'Controle e planejamento', pergunta: 'Sobre a relação entre controle e planejamento, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'São independentes: o controle não depende de padrões do planejamento.' }, { id: 'B', texto: 'O controle pressupõe o planejamento, pois compara o desempenho real com os padrões definidos no planejamento e retroalimenta as decisões.' }, { id: 'C', texto: 'O controle substitui o planejamento quando há desvios.' }, { id: 'D', texto: 'O planejamento é dispensável quando há controle rigoroso.' }], gabarito: 'B', explicacao: 'O controle depende de PADRÕES que vêm do planejamento. Sem planejamento, não há parâmetro para comparar. E o controle retroalimenta o planejamento (o ciclo PODC é contínuo).' }
    ] },
    'ADM-07': { id: 'D-ADM-07', moduloId: 'ADM-07', itens: [
      { id: 'D-ADM-07-01', tipo: 'multipla_escolha', subtopico: 'Recrutamento e seleção', pergunta: 'Sobre recrutamento e seleção em gestão de pessoas, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Recrutamento é a fase de escolha do candidato; seleção é a divulgação da vaga.' }, { id: 'B', texto: 'Recrutamento atrai e divulga a vaga, buscando candidatos; seleção escolhe, entre eles, o mais adequado ao cargo.' }, { id: 'C', texto: 'São sinônimos e podem ser usados como equivalentes.' }, { id: 'D', texto: 'Ambos ocorrem somente após o treinamento inicial.' }], gabarito: 'B', explicacao: 'Recrutamento atrai e divulga; seleção escolhe o mais adequado. A letra A inverte; C está errada (não são sinônimos); D está errada (treinamento é posterior à contratação).' },
      { id: 'D-ADM-07-02', tipo: 'verdadeiro_falso', subtopico: 'Treinamento x desenvolvimento', pergunta: 'Treinamento prepara o servidor para funções futuras na carreira; desenvolvimento foca as tarefas atuais do cargo ocupado.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso — é o INVERSO. Treinamento foca o cargo ATUAL (curto prazo). Desenvolvimento foca a CARREIRA (longo prazo).' },
      { id: 'D-ADM-07-03', tipo: 'situacao', subtopico: 'Etapas da gestão de pessoas', pergunta: 'Uma prefeitura publica edital de concurso público com vagas para assistente administrativo. Essa etapa corresponde a:', alternativas: [{ id: 'A', texto: 'Seleção.' }, { id: 'B', texto: 'Treinamento.' }, { id: 'C', texto: 'Recrutamento.' }, { id: 'D', texto: 'Avaliação de desempenho.' }], gabarito: 'C', explicacao: 'Publicar edital é RECRUTAMENTO: atrai candidatos e divulga a vaga. A seleção é a fase seguinte (provas, títulos, escolha).' },
      { id: 'D-ADM-07-04', tipo: 'autoavaliacao', subtopico: 'Gestão por competências', pergunta: 'Você sabe o que significa CHA na gestão por competências?', resposta: 'CHA = Conhecimento (saber), Habilidade (saber fazer) e Atitude (querer fazer). Alinhar os três ao cargo é a base da gestão por competências.' },
      { id: 'D-ADM-07-05', tipo: 'multipla_escolha', subtopico: 'Avaliação de desempenho', pergunta: 'Sobre a avaliação de desempenho nas organizações, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Serve apenas para punir servidores com baixo desempenho.' }, { id: 'B', texto: 'É um processo sistemático de acompanhamento e mensuração da atuação do servidor, com fins de desenvolvimento e melhoria.' }, { id: 'C', texto: 'Deve ser feita apenas pelo próprio avaliado (autoavaliação).' }, { id: 'D', texto: 'É incompatível com a gestão por competências.' }], gabarito: 'B', explicacao: 'A avaliação de desempenho é processo sistemático de acompanhamento e mensuração, orientado ao desenvolvimento e à melhoria contínua. A autoavaliação é um dos métodos, não o único. Gestão por competências e avaliação são complementares.' }
    ] },
    'DA-06': { id: 'D-DA-06', moduloId: 'DA-06', itens: [
      { id: 'D-DA-06-01', tipo: 'multipla_escolha', subtopico: 'Atributos do ato', pergunta: 'São atributos do ato administrativo:', alternativas: [{ id: 'A', texto: 'Presunção de legitimidade, autoexecutoriedade, tipicidade e imperatividade.' }, { id: 'B', texto: 'Legalidade, moralidade e impessoalidade.' }, { id: 'C', texto: 'Anulação, revogação e convalidação.' }, { id: 'D', texto: 'Competência, finalidade e forma.' }], gabarito: 'A', explicacao: 'Atributos do ato administrativo (PATI): Presunção de legitimidade, Autoexecutoriedade, Tipicidade e Imperatividade. As letras B e D trazem princípios e elementos; C traz formas de extinção/retificação.' },
      { id: 'D-DA-06-02', tipo: 'verdadeiro_falso', subtopico: 'Anulação x revogação', pergunta: 'A revogação do ato administrativo produz efeitos retroativos (ex tunc), enquanto a anulação produz efeitos apenas a partir de agora (ex nunc).', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso — é o INVERSO. A ANULAÇÃO tem efeitos EX TUNC (retroage, pois o ato era ilegal). A REVOGAÇÃO tem efeitos EX NUNC (não retroage, pois o ato era válido e apenas deixou de ser conveniente).' },
      { id: 'D-DA-06-03', tipo: 'situacao', subtopico: 'Anulação x revogação', pergunta: 'Um prefeito constata que nomeou um candidato fora da ordem de classificação do concurso. A medida cabível é:', alternativas: [{ id: 'A', texto: 'Revogar o ato por conveniência e oportunidade.' }, { id: 'B', texto: 'Anular o ato, por ilegalidade, com efeitos retroativos (ex tunc).' }, { id: 'C', texto: 'Convalidar o ato, pois não houve prejuízo.' }, { id: 'D', texto: 'Manter o ato e apenas comunicar ao Tribunal de Contas.' }], gabarito: 'B', explicacao: 'Nomeação fora da ordem é ato ILEGAL → deve ser ANULADO, com efeitos EX TUNC (retroagem à data do ato). Revogação só cabe em ato discricionário por mérito; convalidação só cabe em vício sanável.' },
      { id: 'D-DA-06-04', tipo: 'autoavaliacao', subtopico: 'Elementos do ato', pergunta: 'Você sabe citar os cinco elementos do ato administrativo (COFOMOB)?', resposta: 'Competência, Finalidade, Forma, Motivo e Objeto. Se faltar um dos cinco, o ato é inválido.' },
      { id: 'D-DA-06-05', tipo: 'multipla_escolha', subtopico: 'Anulação x revogação', pergunta: 'Sobre a anulação e a revogação do ato administrativo, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'A anulação é feita por conveniência e oportunidade; a revogação, por ilegalidade.' }, { id: 'B', texto: 'A anulação decorre de ilegalidade e produz efeitos retroativos (ex tunc); a revogação decorre de conveniência e oportunidade e não retroage (ex nunc).' }, { id: 'C', texto: 'Ambas só podem ser feitas pelo Poder Judiciário.' }, { id: 'D', texto: 'A revogação é possível para atos vinculados e discricionários.' }], gabarito: 'B', explicacao: 'Anulação: ilegalidade, efeitos EX TUNC. Revogação: mérito (conveniência e oportunidade), efeitos EX NUNC. A letra A inverte; C está errada (a Administração pode anular e revogar seus próprios atos — Súmula 473/STF); D está errada (atos VINCULADOS não podem ser revogados).' }
    ] },
    'DA-08': { id: 'D-DA-08', moduloId: 'DA-08', itens: [
      { id: 'D-DA-08-01', tipo: 'multipla_escolha', subtopico: 'Modalidades Lei 14.133/2021', pergunta: 'São modalidades de licitação previstas na Lei 14.133/2021:', alternativas: [{ id: 'A', texto: 'Concorrência, tomada de preços, convite, concurso e leilão.' }, { id: 'B', texto: 'Pregão, concorrência, concurso, leilão e diálogo competitivo.' }, { id: 'C', texto: 'Convite, tomada de preços e pregão.' }, { id: 'D', texto: 'Leilão, convite e concorrência.' }], gabarito: 'B', explicacao: 'Modalidades da Nova Lei: PREGÃO, CONCORRÊNCIA, CONCURSO, LEILÃO e DIÁLOGO COMPETITIVO. Tomada de preços e convite eram da Lei 8.666/1993 e foram EXTINTOS.' },
      { id: 'D-DA-08-02', tipo: 'verdadeiro_falso', subtopico: 'Dispensa x inexigibilidade', pergunta: 'A dispensa de licitação ocorre quando há impossibilidade de competição; a inexigibilidade ocorre quando a competição é possível, mas a lei autoriza não licitar.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso — é o INVERSO. INEXIGIBILIDADE: impossibilidade de competição (fornecedor exclusivo, artista consagrado). DISPENSA: competição possível, mas a lei autoriza não licitar (valores baixos, emergência).' },
      { id: 'D-DA-08-03', tipo: 'situacao', subtopico: 'Contratação direta', pergunta: 'Uma prefeitura contrata um cantor consagrado pela crítica especializada para apresentação em evento oficial. A hipótese legal é:', alternativas: [{ id: 'A', texto: 'Dispensa de licitação.' }, { id: 'B', texto: 'Inexigibilidade de licitação.' }, { id: 'C', texto: 'Dispensa por valor.' }, { id: 'D', texto: 'Pregão eletrônico.' }], gabarito: 'B', explicacao: 'Artista consagrado é hipótese de INEXIGIBILIDADE — a competição é impossível porque o serviço é pessoal e único. A dispensa seria para casos em que a competição é possível (valores baixos, emergência).' },
      { id: 'D-DA-08-04', tipo: 'autoavaliacao', subtopico: 'Sanções', pergunta: 'Você sabe citar as sanções previstas na Lei 14.133/2021?', resposta: 'Advertência, multa, impedimento de licitar e contratar (até 3 anos) e declaração de inidoneidade (até 6 anos).' },
      { id: 'D-DA-08-05', tipo: 'multipla_escolha', subtopico: 'Modalidades', pergunta: 'Sobre a modalidade pregão na Lei 14.133/2021, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É usada exclusivamente para obras.' }, { id: 'B', texto: 'É obrigatória para aquisição de bens e contratação de serviços COMUNS.' }, { id: 'C', texto: 'Substituiu a concorrência.' }, { id: 'D', texto: 'Não admite disputa eletrônica.' }], gabarito: 'B', explicacao: 'Pregão é OBRIGATÓRIO para bens e serviços COMUNS (aqueles que podem ser objetivamente definidos no edital). Não é exclusivo para obras nem substitui a concorrência. Admite (e prioriza) a forma eletrônica.' }
    ] },
    'DA-05': { id: 'D-DA-05', moduloId: 'DA-05', itens: [
      { id: 'D-DA-05-01', tipo: 'multipla_escolha', subtopico: 'Poder de polícia', pergunta: 'A Vigilância Sanitária interdita um restaurante que vendia alimentos vencidos. O poder administrativo exercido é:', alternativas: [{ id: 'A', texto: 'Poder disciplinar.' }, { id: 'B', texto: 'Poder hierárquico.' }, { id: 'C', texto: 'Poder de polícia.' }, { id: 'D', texto: 'Poder regulamentar.' }], gabarito: 'C', explicacao: 'Poder DE POLÍCIA: a Administração condiciona e limita o exercício de atividade econômica (restaurante) em favor do interesse público (saúde coletiva), atingindo PARTICULAR. Não se confunde com disciplinar (que atinge servidores).' },
      { id: 'D-DA-05-02', tipo: 'verdadeiro_falso', subtopico: 'Poder de polícia x disciplinar', pergunta: 'O poder disciplinar atinge particulares em geral, e o poder de polícia atinge servidores públicos.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso — é o INVERSO. POLÍCIA: atinge particulares em geral. DISCIPLINAR: atinge servidores e particulares com vínculo específico (concessionárias).' },
      { id: 'D-DA-05-03', tipo: 'situacao', subtopico: 'Abuso de poder', pergunta: 'Um fiscal aplica multa a um comerciante por vender produto vencido, mas o faz para retaliar uma denúncia que o comerciante havia feito contra o próprio fiscal. O fiscal tinha competência para aplicar multas, mas usou a prerrogativa com finalidade pessoal. Isso é:', alternativas: [{ id: 'A', texto: 'Excesso de poder.' }, { id: 'B', texto: 'Desvio de finalidade.' }, { id: 'C', texto: 'Legalidade estrita.' }, { id: 'D', texto: 'Poder vinculado.' }], gabarito: 'B', explicacao: 'DESVIO DE FINALIDADE: a autoridade atua DENTRO da sua competência, mas com finalidade diferente do interesse público (retaliação pessoal). O EXCESSO de poder seria atuação FORA da competência.' },
      { id: 'D-DA-05-04', tipo: 'autoavaliacao', subtopico: 'Poderes administrativos', pergunta: 'Você sabe listar os poderes administrativos?', resposta: 'Hierárquico, disciplinar, regulamentar, de polícia, vinculado e discricionário.' },
      { id: 'D-DA-05-05', tipo: 'multipla_escolha', subtopico: 'Vinculado x discricionário', pergunta: 'Sobre o poder vinculado e o poder discricionário, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Atos vinculados podem ser revogados por conveniência e oportunidade.' }, { id: 'B', texto: 'Atos discricionários têm mérito administrativo e podem ser revogados; atos vinculados não podem ser revogados.' }, { id: 'C', texto: 'Ambos podem ser revogados.' }, { id: 'D', texto: 'Discricionariedade se confunde com arbitrariedade.' }], gabarito: 'B', explicacao: 'Só atos DISCRICIONÁRIOS (com mérito administrativo) podem ser revogados. Atos VINCULADOS não podem ser revogados — apenas anulados se ilegais. Discricionariedade é legal e limitada; arbitrariedade é ilegal.' }
    ] },
    'DA-04': { id: 'D-DA-04', moduloId: 'DA-04', itens: [
      { id: 'D-DA-04-01', tipo: 'multipla_escolha', subtopico: 'Cargo x emprego', pergunta: 'Sobre cargo e emprego público, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Cargo público é ocupado por empregado celetista; emprego público, por servidor estatutário.' }, { id: 'B', texto: 'Cargo público é criado por lei e ocupado por servidor estatutário; emprego público é ocupado por empregado celetista.' }, { id: 'C', texto: 'Ambos são sinônimos.' }, { id: 'D', texto: 'Cargo em comissão exige aprovação prévia em concurso público.' }], gabarito: 'B', explicacao: 'Cargo = criado por lei, ocupado por servidor ESTATUTÁRIO. Emprego = ocupado por empregado CELETISTA. Cargo em comissão é de LIVRE nomeação, sem concurso.' },
      { id: 'D-DA-04-02', tipo: 'verdadeiro_falso', subtopico: 'Agentes públicos', pergunta: 'A expressão "agentes públicos" é gênero, abrangendo agentes políticos, servidores públicos, empregados públicos, temporários, honoríficos e delegados.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'V', explicacao: 'Verdadeiro. Agente público é gênero. Servidor público é apenas uma das espécies. Políticos, empregados públicos, temporários, honoríficos e delegados também são agentes públicos.' },
      { id: 'D-DA-04-03', tipo: 'situacao', subtopico: 'Classificação de agente', pergunta: 'Um cidadão convocado para atuar como mesário em uma eleição, sem remuneração, é classificado como:', alternativas: [{ id: 'A', texto: 'Servidor público efetivo.' }, { id: 'B', texto: 'Agente político.' }, { id: 'C', texto: 'Agente honorífico.' }, { id: 'D', texto: 'Empregado público.' }], gabarito: 'C', explicacao: 'Agente HONORÍFICO: presta serviço relevante ao Estado SEM remuneração (mesário, jurado). Não se confunde com servidor efetivo (concursado) nem com agente político (cargos estruturais).' },
      { id: 'D-DA-04-04', tipo: 'autoavaliacao', subtopico: 'Espécies de agentes públicos', pergunta: 'Você sabe citar as principais espécies de agentes públicos?', resposta: 'Agentes políticos, servidores públicos (efetivos e em comissão), empregados públicos (celetistas), agentes temporários, honoríficos e delegados.' },
      { id: 'D-DA-04-05', tipo: 'multipla_escolha', subtopico: 'Responsabilidade do servidor', pergunta: 'Sobre as responsabilidades civil, penal e administrativa do servidor público, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'São mutuamente excludentes: se houver condenação penal, não cabe responsabilidade administrativa.' }, { id: 'B', texto: 'São independentes e CUMULATIVAS: o servidor pode responder simultaneamente nas três esferas.' }, { id: 'C', texto: 'Somente a administrativa se aplica ao servidor.' }, { id: 'D', texto: 'A absolvição penal sempre afasta a punição administrativa.' }], gabarito: 'B', explicacao: 'As três esferas são INDEPENDENTES e podem ser CUMULATIVAS. Absolvição penal, em regra, não afasta automaticamente a punição administrativa (há exceções quando a absolvição nega o fato ou a autoria).' }
    ] },
    'AP-03': { id: 'D-AP-03', moduloId: 'AP-03', itens: [
      { id: 'D-AP-03-01', tipo: 'multipla_escolha', subtopico: 'Princípios expressos', pergunta: 'São princípios expressos da Administração Pública no caput do art. 37 da CF/88:', alternativas: [{ id: 'A', texto: 'Legalidade, impessoalidade, moralidade, publicidade e eficiência.' }, { id: 'B', texto: 'Legalidade, imparcialidade, moralidade, publicidade e eficiência.' }, { id: 'C', texto: 'Razoabilidade, proporcionalidade, moralidade, publicidade e eficiência.' }, { id: 'D', texto: 'Legalidade, impessoalidade, motivação, publicidade e economicidade.' }], gabarito: 'A', explicacao: 'LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência. Imparcialidade não é princípio expresso (é dever do agente); motivação, razoabilidade e proporcionalidade são IMPLÍCITOS.' },
      { id: 'D-AP-03-02', tipo: 'verdadeiro_falso', subtopico: 'Legalidade', pergunta: 'Segundo o princípio da legalidade, o administrador público pode fazer tudo aquilo que a lei não proíbe, tal como ocorre com o particular.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. Para a Administração Pública vale a LEGALIDADE ESTRITA: só pode fazer o que a lei AUTORIZA ou DETERMINA. A ideia de "fazer tudo que a lei não proíbe" aplica-se ao PARTICULAR, não à Administração.' },
      { id: 'D-AP-03-03', tipo: 'situacao', subtopico: 'Impessoalidade', pergunta: 'Um prefeito manda afixar, em outdoors pagos com verba pública, sua foto e seu nome ao lado de obras municipais recém-concluídas. Essa conduta viola frontalmente o princípio da:', alternativas: [{ id: 'A', texto: 'Legalidade.' }, { id: 'B', texto: 'Impessoalidade.' }, { id: 'C', texto: 'Publicidade.' }, { id: 'D', texto: 'Continuidade do serviço público.' }], gabarito: 'B', explicacao: 'A promoção pessoal de agentes públicos em obras, serviços e campanhas é vedada pelo art. 37, §1º, CF. A violação é direta ao princípio da IMPESSOALIDADE. Secundariamente, também viola a moralidade administrativa.' },
      { id: 'D-AP-03-04', tipo: 'autoavaliacao', subtopico: 'Princípios expressos', pergunta: 'Você sabe explicar por que a eficiência é considerada princípio expresso?', resposta: 'Porque foi inserida no caput do art. 37 da CF pela EC 19/1998 (Reforma Gerencial), formando a sigla LIMPE. Antes disso, o art. 37 trazia apenas legalidade, impessoalidade, moralidade e publicidade.' },
      { id: 'D-AP-03-05', tipo: 'multipla_escolha', subtopico: 'Princípios implícitos', pergunta: 'São exemplos de princípios IMPLÍCITOS da Administração Pública:', alternativas: [{ id: 'A', texto: 'Legalidade e impessoalidade.' }, { id: 'B', texto: 'Supremacia do interesse público, indisponibilidade do interesse público e autotutela.' }, { id: 'C', texto: 'Moralidade e publicidade.' }, { id: 'D', texto: 'Eficiência e publicidade.' }], gabarito: 'B', explicacao: 'Supremacia do interesse público, indisponibilidade do interesse público e autotutela (Súmulas 346 e 473/STF) são IMPLÍCITOS. As demais opções listam princípios EXPRESSOS (LIMPE).' }
    ] },
    'AP-04': { id: 'D-AP-04', moduloId: 'AP-04', itens: [
      { id: 'D-AP-04-01', tipo: 'multipla_escolha', subtopico: 'Composição da Administração Indireta', pergunta: 'São entidades que integram a Administração Pública Indireta:', alternativas: [{ id: 'A', texto: 'Ministérios e secretarias.' }, { id: 'B', texto: 'Autarquias, fundações públicas, empresas públicas e sociedades de economia mista.' }, { id: 'C', texto: 'Tribunais de Contas e Ministério Público.' }, { id: 'D', texto: 'Presidência da República e Congresso Nacional.' }], gabarito: 'B', explicacao: 'A Administração INDIRETA é composta por entidades com personalidade jurídica própria: AUTARQUIAS, FUNDAÇÕES PÚBLICAS, EMPRESAS PÚBLICAS e SOCIEDADES DE ECONOMIA MISTA. Ministérios e secretarias são órgãos da Administração Direta.' },
      { id: 'D-AP-04-02', tipo: 'verdadeiro_falso', subtopico: 'Empresa pública x SEM', pergunta: 'A empresa pública é constituída com capital 100% público, enquanto a sociedade de economia mista tem capital misto, com maioria pública, e é obrigatoriamente constituída como S.A.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'V', explicacao: 'Verdadeiro. Empresa pública: capital 100% público, qualquer forma societária. Sociedade de economia mista: capital MISTO com maioria pública, obrigatoriamente S.A. Ambas são pessoas jurídicas de direito PRIVADO.' },
      { id: 'D-AP-04-03', tipo: 'situacao', subtopico: 'Classificação de entidade', pergunta: 'O INSS (Instituto Nacional do Seguro Social) é uma entidade da Administração Indireta. Sua natureza jurídica é:', alternativas: [{ id: 'A', texto: 'Empresa pública.' }, { id: 'B', texto: 'Autarquia federal.' }, { id: 'C', texto: 'Sociedade de economia mista.' }, { id: 'D', texto: 'Fundação pública.' }], gabarito: 'B', explicacao: 'O INSS é AUTARQUIA FEDERAL — pessoa jurídica de direito público, criada por lei específica, para exercer atividade típica de Estado (previdência social). Seu regime de pessoal é estatutário, com concurso público.' },
      { id: 'D-AP-04-04', tipo: 'autoavaliacao', subtopico: 'Administração Direta e Indireta', pergunta: 'Você sabe diferenciar órgão de entidade?', resposta: 'ÓRGÃO: unidade interna, SEM personalidade jurídica própria (ex.: ministérios, secretarias) — pertence à Administração Direta. ENTIDADE: pessoa jurídica com personalidade própria, criada por lei (ex.: autarquias, fundações, empresas públicas, SEM) — Administração Indireta.' },
      { id: 'D-AP-04-05', tipo: 'multipla_escolha', subtopico: 'Criação de entidades', pergunta: 'Sobre a criação das entidades da Administração Indireta, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Todas são criadas por decreto do Executivo.' }, { id: 'B', texto: 'Autarquias e fundações são criadas por lei específica; empresas públicas e sociedades de economia mista são AUTORIZADAS por lei específica.' }, { id: 'C', texto: 'Podem ser criadas sem lei, por ato administrativo.' }, { id: 'D', texto: 'Somente as autarquias dependem de lei.' }], gabarito: 'B', explicacao: 'Autarquias e fundações públicas são CRIADAS por lei específica (a personalidade surge com a lei). Empresas públicas e sociedades de economia mista são AUTORIZADAS por lei (a personalidade surge com o registro).' }
    ] },
    'AP-05': { id: 'D-AP-05', moduloId: 'AP-05', itens: [
      { id: 'D-AP-05-01', tipo: 'multipla_escolha', subtopico: 'Órgão x entidade', pergunta: 'Sobre órgãos públicos, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Têm personalidade jurídica própria e capacidade contratual plena.' }, { id: 'B', texto: 'São unidades de atuação sem personalidade jurídica própria, integrando a estrutura da Administração Direta.' }, { id: 'C', texto: 'Equivalem a entidades da Administração Indireta.' }, { id: 'D', texto: 'Sempre podem ser criados por decreto do Executivo, sem lei.' }], gabarito: 'B', explicacao: 'Órgão é unidade de atuação SEM personalidade jurídica própria, integrando a Administração Direta. Não tem capacidade contratual (quem contrata é a pessoa jurídica). A criação se dá por lei ou por decreto, conforme o tipo de órgão.' },
      { id: 'D-AP-05-02', tipo: 'verdadeiro_falso', subtopico: 'Capacidade processual', pergunta: 'Em regra, os órgãos públicos não têm capacidade processual. Exceção: órgãos independentes e autônomos podem impetrar mandado de segurança em defesa de suas prerrogativas institucionais.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'V', explicacao: 'Verdadeiro. A regra é que os órgãos não têm capacidade processual (quem processa é a pessoa jurídica). A EXCEÇÃO é a impetração de mandado de segurança por órgãos independentes e autônomos em defesa de suas prerrogativas.' },
      { id: 'D-AP-05-03', tipo: 'situacao', subtopico: 'Classificação dos órgãos', pergunta: 'O Ministério da Educação, subordinado à Presidência da República, mas com autonomia administrativa e financeira para gerir seus recursos, é classificado, quanto à posição estatal, como órgão:', alternativas: [{ id: 'A', texto: 'Independente.' }, { id: 'B', texto: 'Autônomo.' }, { id: 'C', texto: 'Superior.' }, { id: 'D', texto: 'Subalterno.' }], gabarito: 'B', explicacao: 'Órgão AUTÔNOMO: subordinado à cúpula (Presidência), mas com autonomia administrativa e financeira. Órgãos INDEPENDENTES são a cúpula (Presidência, Congresso, STF); SUPERIORES são coordenadorias e procuradorias; SUBALTERNOS são de execução.' },
      { id: 'D-AP-05-04', tipo: 'autoavaliacao', subtopico: 'Classificação dos órgãos', pergunta: 'Você sabe citar as classificações dos órgãos quanto à posição estatal?', resposta: 'Independentes (cúpula dos Poderes), autônomos (subordinados à cúpula, com autonomia administrativa e financeira), superiores (com poder de decisão, mas subordinados a um autônomo) e subalternos (execução).' },
      { id: 'D-AP-05-05', tipo: 'multipla_escolha', subtopico: 'Classificação dos órgãos', pergunta: 'Um Tribunal, órgão formado por vários ministros que decidem em conjunto, é classificado quanto à atuação como órgão:', alternativas: [{ id: 'A', texto: 'Singular.' }, { id: 'B', texto: 'Colegiado.' }, { id: 'C', texto: 'Simples.' }, { id: 'D', texto: 'Subalterno.' }], gabarito: 'B', explicacao: 'Órgão COLEGIADO: vários titulares decidem em conjunto (Tribunais, Conselhos). SINGULAR: um único titular (ex.: Presidência). As classificações quanto à ESTRUTURA (simples/composto) e ATUAÇÃO (singular/colegiado) são distintas.' }
    ] },
    'DA-10': { id: 'D-DA-10', moduloId: 'DA-10', itens: [
      { id: 'D-DA-10-01', tipo: 'multipla_escolha', subtopico: 'Controle interno x externo', pergunta: 'Sobre o controle da Administração Pública, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'O controle interno é exercido exclusivamente pelo Poder Legislativo.' }, { id: 'B', texto: 'O controle externo é exercido pelo próprio órgão sobre seus atos.' }, { id: 'C', texto: 'O controle interno é realizado dentro da própria estrutura do órgão; o externo, por outro Poder ou instituição autônoma.' }, { id: 'D', texto: 'O controle judicial analisa o mérito administrativo.' }], gabarito: 'C', explicacao: 'Controle INTERNO: dentro do próprio órgão (ex.: corregedoria, controladoria). Controle EXTERNO: por outro Poder ou instituição (Tribunal de Contas, Judiciário, Legislativo, MP). O Judiciário, em regra, NÃO analisa mérito administrativo — só a legalidade.' },
      { id: 'D-DA-10-02', tipo: 'verdadeiro_falso', subtopico: 'Controle judicial', pergunta: 'O Poder Judiciário pode revogar ato administrativo por conveniência e oportunidade, substituindo o juízo do administrador público.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. O Judiciário NÃO revoga atos administrativos — revogação por mérito é competência exclusiva da própria Administração (autotutela). O Judiciário pode apenas ANULAR atos ilegais (controle de legalidade).' },
      { id: 'D-DA-10-03', tipo: 'situacao', subtopico: 'Tribunais de Contas', pergunta: 'O Tribunal de Contas da União (TCU) julga as contas do Presidente da República e fiscaliza a aplicação de recursos federais. Sua natureza é:', alternativas: [{ id: 'A', texto: 'Órgão do Poder Judiciário.' }, { id: 'B', texto: 'Órgão do Poder Executivo.' }, { id: 'C', texto: 'Órgão auxiliar do Poder Legislativo, com autonomia e funções próprias.' }, { id: 'D', texto: 'Autarquia da Administração Indireta.' }], gabarito: 'C', explicacao: 'O TCU é órgão AUXILIAR do Poder LEGISLATIVO, com autonomia e competências próprias — não é subordinado ao Legislativo e NÃO integra o Judiciário nem o Executivo. Exerce controle externo técnico.' },
      { id: 'D-DA-10-04', tipo: 'autoavaliacao', subtopico: 'Controle da Administração', pergunta: 'Você sabe diferenciar controle de legalidade de controle de mérito?', resposta: 'LEGALIDADE: verifica se o ato está conforme a lei — pode ser feito pela Administração (autotutela) e pelo Judiciário. MÉRITO: verifica conveniência e oportunidade — só pode ser feito pela própria Administração, NUNCA pelo Judiciário.' },
      { id: 'D-DA-10-05', tipo: 'multipla_escolha', subtopico: 'Controle legislativo', pergunta: 'Sobre o controle legislativo exercido pelo Congresso Nacional, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'O Congresso julga diretamente as contas do Presidente, sem auxílio de outro órgão.' }, { id: 'B', texto: 'O Congresso exerce o controle externo com o auxílio do Tribunal de Contas da União.' }, { id: 'C', texto: 'O controle legislativo substitui o controle judicial.' }, { id: 'D', texto: 'O Congresso pode revogar atos administrativos discricionários.' }], gabarito: 'B', explicacao: 'O Congresso exerce controle externo com AUXÍLIO do TCU (art. 71, CF). O TCU aprecia e emite parecer prévio sobre as contas do Presidente; o julgamento é do Congresso. O controle legislativo NÃO substitui o judicial e não se confunde com revogação.' }
    ] },
    'DA-03': { id: 'D-DA-03', moduloId: 'DA-03', itens: [
      { id: 'D-DA-03-01', tipo: 'multipla_escolha', subtopico: 'Desconcentração x descentralização', pergunta: 'A criação de uma delegacia regional de um órgão público federal, subordinada hierarquicamente ao órgão central, é exemplo de:', alternativas: [{ id: 'A', texto: 'Descentralização administrativa por outorga.' }, { id: 'B', texto: 'Descentralização por delegação.' }, { id: 'C', texto: 'Desconcentração administrativa.' }, { id: 'D', texto: 'Criação de entidade da administração indireta.' }], gabarito: 'C', explicacao: 'DESCONCENTRAÇÃO: distribuição interna de competências dentro da MESMA pessoa jurídica. Delegacia regional é um ÓRGÃO do ministério, sem CNPJ próprio. Não confundir com descentralização (cria nova pessoa jurídica).' },
      { id: 'D-DA-03-02', tipo: 'verdadeiro_falso', subtopico: 'Outorga x delegação', pergunta: 'A concessão de serviço público a uma empresa privada é exemplo de descentralização por OUTORGA, pois o Estado transfere a titularidade do serviço.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. Concessão é DELEGAÇÃO — o Estado transfere apenas a EXECUÇÃO, mantendo a TITULARIDADE. Outorga transfere titularidade e execução a uma ENTIDADE da Administração Indireta (criada por lei).' },
      { id: 'D-DA-03-03', tipo: 'situacao', subtopico: 'Administração Direta x Indireta', pergunta: 'Uma secretaria municipal de saúde é classificada como:', alternativas: [{ id: 'A', texto: 'Entidade da Administração Indireta.' }, { id: 'B', texto: 'Órgão da Administração Direta.' }, { id: 'C', texto: 'Autarquia municipal.' }, { id: 'D', texto: 'Empresa pública municipal.' }], gabarito: 'B', explicacao: 'Secretaria é ÓRGÃO da Administração DIRETA — sem personalidade jurídica própria. Autarquias, empresas públicas e SEM são ENTIDADES da Indireta, com personalidade própria.' },
      { id: 'D-DA-03-04', tipo: 'autoavaliacao', subtopico: 'Organização administrativa', pergunta: 'Você sabe diferenciar outorga de delegação?', resposta: 'OUTORGA: transferência de titularidade + execução a uma ENTIDADE da Administração Indireta, criada por lei (ex.: autarquia). DELEGAÇÃO: transferência apenas da EXECUÇÃO a um PARTICULAR, mantendo a titularidade (ex.: concessão, permissão).' },
      { id: 'D-DA-03-05', tipo: 'multipla_escolha', subtopico: 'Órgãos x entidades', pergunta: 'Sobre os órgãos públicos, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Têm personalidade jurídica própria e podem contratar em nome próprio.' }, { id: 'B', texto: 'Não têm personalidade jurídica própria; integram a Administração Direta e não contratam em nome próprio.' }, { id: 'C', texto: 'São criados apenas por lei, nunca por decreto.' }, { id: 'D', texto: 'Integram a Administração Indireta.' }], gabarito: 'B', explicacao: 'Órgãos NÃO têm personalidade jurídica própria. Integram a Administração DIRETA. Não contratam em nome próprio (quem contrata é a pessoa jurídica). Podem ser criados por lei ou por decreto, conforme o tipo de órgão.' }
    ] },
    'AP-01': { id: 'D-AP-01', moduloId: 'AP-01', itens: [
      { id: 'D-AP-01-01', tipo: 'multipla_escolha', subtopico: 'Sentidos de Administração Pública', pergunta: 'Em sentido amplo, a Administração Pública compreende:', alternativas: [{ id: 'A', texto: 'Somente os órgãos e entidades do Poder Executivo.' }, { id: 'B', texto: 'Apenas a função administrativa exercida pelo Estado.' }, { id: 'C', texto: 'O conjunto de órgãos e entidades de todos os Poderes, no desempenho de funções administrativas, além da própria atividade administrativa.' }, { id: 'D', texto: 'Exclusivamente o Legislativo e o Judiciário.' }], gabarito: 'C', explicacao: 'Em sentido AMPLO (subjetivo/formal), a Administração Pública abrange TODOS os órgãos e entidades dos três Poderes, no exercício de função administrativa, além da própria atividade. A opção A exclui os demais Poderes; a B refere-se ao sentido estrito; a D reduz indevidamente.' },
      { id: 'D-AP-01-02', tipo: 'verdadeiro_falso', subtopico: 'Sentido estrito', pergunta: 'Em sentido estrito (objetivo/material), a Administração Pública corresponde à própria função administrativa exercida pelo Estado, sob regime de direito público.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'V', explicacao: 'Verdadeiro. Sentido ESTRITO (objetivo/material): é a FUNÇÃO ADMINISTRATIVA em si — a atividade concreta e imediata do Estado, sob regime de direito público, para atender ao interesse coletivo.' },
      { id: 'D-AP-01-03', tipo: 'situacao', subtopico: 'Regime jurídico-administrativo', pergunta: 'A desapropriação de um imóvel particular para construção de uma escola pública, com indenização prévia, exemplifica o princípio da:', alternativas: [{ id: 'A', texto: 'Indisponibilidade do interesse público.' }, { id: 'B', texto: 'Supremacia do interesse público.' }, { id: 'C', texto: 'Autotutela.' }, { id: 'D', texto: 'Eficiência.' }], gabarito: 'B', explicacao: 'SUPREMACIA do interesse público: quando o interesse público se contrapõe ao privado, ele PREVALECE. A desapropriação é o exemplo clássico — o Estado impõe ao particular a perda do bem mediante indenização.' },
      { id: 'D-AP-01-04', tipo: 'autoavaliacao', subtopico: 'Pilares do regime jurídico-administrativo', pergunta: 'Você sabe citar os dois pilares do regime jurídico-administrativo?', resposta: '1) Supremacia do interesse público: o interesse público prevalece sobre o privado. 2) Indisponibilidade do interesse público: o administrador é gestor, não dono — não pode renunciar ao interesse público.' },
      { id: 'D-AP-01-05', tipo: 'multipla_escolha', subtopico: 'Administração Pública x Direito Administrativo', pergunta: 'Sobre a relação entre Administração Pública (AP) e Direito Administrativo (DA), é correto afirmar que:', alternativas: [{ id: 'A', texto: 'São sinônimos.' }, { id: 'B', texto: 'AP é a atividade administrativa exercida pelo Estado; DA é o ramo do direito que regula essa atividade.' }, { id: 'C', texto: 'DA é a atividade; AP é o ramo jurídico.' }, { id: 'D', texto: 'AP existe apenas no Poder Executivo.' }], gabarito: 'B', explicacao: 'AP é a ATIVIDADE administrativa (o que o Estado faz). DA é o RAMO DO DIREITO que regula essa atividade (conjunto de normas e princípios). Não são sinônimos.' }
    ] },
    'DA-01': { id: 'D-DA-01', moduloId: 'DA-01', itens: [
      { id: 'D-DA-01-01', tipo: 'multipla_escolha', subtopico: 'Fontes do Direito Administrativo', pergunta: 'São fontes do Direito Administrativo:', alternativas: [{ id: 'A', texto: 'Somente a lei em sentido estrito.' }, { id: 'B', texto: 'Lei (fonte primária), doutrina, jurisprudência e princípios gerais do direito (fontes secundárias).' }, { id: 'C', texto: 'Apenas a jurisprudência dos tribunais superiores.' }, { id: 'D', texto: 'Somente os costumes administrativos.' }], gabarito: 'B', explicacao: 'O DA tem como fonte PRIMÁRIA a lei. Doutrina, jurisprudência, princípios gerais e costumes são fontes SECUNDÁRIAS que orientam a interpretação, mas não substituem a lei.' },
      { id: 'D-DA-01-02', tipo: 'verdadeiro_falso', subtopico: 'Objeto do DA', pergunta: 'O Direito Administrativo tem como objeto o estudo da Administração Pública, dos órgãos e entidades do Estado, e de sua atividade administrativa.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'V', explicacao: 'Verdadeiro. O DA estuda a Administração Pública (órgãos, entidades, agentes) e a atividade administrativa (atos, contratos, licitação, poder de polícia, serviços públicos, responsabilidade, controle).' },
      { id: 'D-DA-01-03', tipo: 'situacao', subtopico: 'Regime jurídico-administrativo', pergunta: 'Quando o Estado desapropria um imóvel particular para construção de hospital público, com indenização prévia, está exercendo prerrogativa decorrente do princípio da:', alternativas: [{ id: 'A', texto: 'Indisponibilidade do interesse público.' }, { id: 'B', texto: 'Supremacia do interesse público.' }, { id: 'C', texto: 'Legalidade estrita.' }, { id: 'D', texto: 'Autotutela.' }], gabarito: 'B', explicacao: 'SUPREMACIA do interesse público: quando o interesse público se contrapõe ao privado, ele prevalece. A desapropriação é o exemplo clássico dessa prerrogativa (com indenização prévia, conforme art. 5º, XXIV, CF).' },
      { id: 'D-DA-01-04', tipo: 'autoavaliacao', subtopico: 'Regime jurídico-administrativo', pergunta: 'Você sabe citar os dois pilares do regime jurídico-administrativo?', resposta: '1) Supremacia do interesse público: prevalece sobre o privado. 2) Indisponibilidade do interesse público: o administrador é gestor, não dono; não pode renunciar ao interesse público.' },
      { id: 'D-DA-01-05', tipo: 'multipla_escolha', subtopico: 'Conceito de DA', pergunta: 'Sobre o Direito Administrativo, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É o mesmo que Administração Pública.' }, { id: 'B', texto: 'É o ramo do direito público que regula a Administração Pública e sua atividade, submetendo-a a regime jurídico próprio.' }, { id: 'C', texto: 'É um ramo do direito privado.' }, { id: 'D', texto: 'Aplica-se apenas ao Poder Executivo.' }], gabarito: 'B', explicacao: 'DA é o RAMO DO DIREITO PÚBLICO que regula a Administração Pública e sua atividade. Não se confunde com Administração Pública (que é a atividade). Aplica-se a todos os Poderes no exercício de função administrativa.' }
    ] },
    'DA-07': { id: 'D-DA-07', moduloId: 'DA-07', itens: [
      { id: 'D-DA-07-01', tipo: 'multipla_escolha', subtopico: 'Formas de prestação', pergunta: 'Sobre as formas de delegação de serviços públicos, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'A concessão é ato administrativo precário e discricionário.' }, { id: 'B', texto: 'A permissão é contrato administrativo por prazo determinado.' }, { id: 'C', texto: 'A concessão é contrato administrativo, por prazo determinado, precedido de licitação; a permissão é ato administrativo, unilateral, discricionário e precário, também precedido de licitação.' }, { id: 'D', texto: 'A autorização exige licitação prévia e prazo determinado.' }], gabarito: 'C', explicacao: 'CONCESSÃO: contrato administrativo, prazo determinado, licitação. PERMISSÃO: ato administrativo, discricionário, precário, com licitação. AUTORIZAÇÃO: ato unilateral, precário, sem licitação, para serviços de pequeno porte.' },
      { id: 'D-DA-07-02', tipo: 'verdadeiro_falso', subtopico: 'Continuidade do serviço público', pergunta: 'A continuidade do serviço público é absoluta, sendo vedada qualquer interrupção, mesmo em caso de inadimplemento do usuário.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. A continuidade tem EXCEÇÕES legais: razões de ordem técnica, segurança das instalações, inadimplemento do usuário (após aviso prévio). Não é absoluta.' },
      { id: 'D-DA-07-03', tipo: 'situacao', subtopico: 'Formas de prestação', pergunta: 'Um motorista de táxi que presta serviço de transporte individual de passageiros, mediante autorização do poder público, exerce atividade sob qual regime?', alternativas: [{ id: 'A', texto: 'Concessão de serviço público.' }, { id: 'B', texto: 'Permissão de serviço público.' }, { id: 'C', texto: 'Autorização de serviço público.' }, { id: 'D', texto: 'Serviço público direto.' }], gabarito: 'B', explicacao: 'Táxi é PERMISSÃO de serviço público — ato administrativo, unilateral, discricionário e precário, precedido de licitação. A concessão é contrato de maior porte; a autorização é para serviços de pequeno porte, sem licitação.' },
      { id: 'D-DA-07-04', tipo: 'autoavaliacao', subtopico: 'Princípios dos serviços públicos', pergunta: 'Você sabe citar os principais princípios dos serviços públicos?', resposta: 'Generalidade, continuidade, modicidade tarifária, cortesia, atualidade, segurança, eficiência, regularidade e universalidade.' },
      { id: 'D-DA-07-05', tipo: 'multipla_escolha', subtopico: 'Princípios dos serviços públicos', pergunta: 'O princípio que determina que o serviço público deve ser prestado a todos, sem discriminação ou privilégios, é o da:', alternativas: [{ id: 'A', texto: 'Continuidade.' }, { id: 'B', texto: 'Generalidade (ou universalidade).' }, { id: 'C', texto: 'Modicidade tarifária.' }, { id: 'D', texto: 'Cortesia.' }], gabarito: 'B', explicacao: 'GENERALIDADE (ou UNIVERSALIDADE): o serviço deve atender a todos, sem discriminação. CONTINUIDADE: não pode parar (com exceções). MODICIDADE: tarifas acessíveis. CORTESIA: tratamento educado.' }
    ] },
    'DA-09': { id: 'D-DA-09', moduloId: 'DA-09', itens: [
      { id: 'D-DA-09-01', tipo: 'multipla_escolha', subtopico: 'Responsabilidade objetiva', pergunta: 'Sobre a responsabilidade civil do Estado, é correto afirmar que, como regra geral em atos comissivos:', alternativas: [{ id: 'A', texto: 'Exige prova de culpa do agente público.' }, { id: 'B', texto: 'É objetiva, bastando dano + nexo causal + conduta, conforme art. 37, §6º, da CF/88.' }, { id: 'C', texto: 'Não existe responsabilidade do Estado.' }, { id: 'D', texto: 'Depende sempre de decisão judicial prévia.' }], gabarito: 'B', explicacao: 'Art. 37, §6º, CF: pessoas jurídicas de direito público e de direito privado prestadoras de serviços públicos respondem OBJETIVAMENTE pelos danos de seus agentes a terceiros. Basta DANO + NEXO CAUSAL + CONDUTA, sem necessidade de prova de culpa.' },
      { id: 'D-DA-09-02', tipo: 'verdadeiro_falso', subtopico: 'Ação regressiva', pergunta: 'Após indenizar o terceiro lesado, o Estado pode entrar com ação regressiva contra o agente público independentemente de dolo ou culpa.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. O art. 37, §6º, CF exige DOLO ou CULPA do agente para a ação regressiva. A responsabilidade do agente perante o Estado é SUBJETIVA.' },
      { id: 'D-DA-09-03', tipo: 'situacao', subtopico: 'Excludentes de responsabilidade', pergunta: 'Um pedestre atravessa a rua sem olhar e é atropelado por uma viatura oficial que seguia dentro do limite de velocidade. Ficou comprovado que a causa exclusiva do acidente foi a conduta do pedestre. Nesse caso:', alternativas: [{ id: 'A', texto: 'O Estado responde objetivamente, pois a viatura é oficial.' }, { id: 'B', texto: 'A responsabilidade do Estado é afastada, por culpa exclusiva da vítima.' }, { id: 'C', texto: 'O Estado responde apenas parcialmente.' }, { id: 'D', texto: 'O Estado responde com base em responsabilidade subjetiva.' }], gabarito: 'B', explicacao: 'CULPA EXCLUSIVA DA VÍTIMA é excludente de responsabilidade. Afasta totalmente o nexo causal. Se fosse culpa CONCORRENTE, a indenização seria apenas reduzida.' },
      { id: 'D-DA-09-04', tipo: 'autoavaliacao', subtopico: 'Responsabilidade do Estado', pergunta: 'Você sabe diferenciar responsabilidade objetiva de subjetiva?', resposta: 'OBJETIVA: independe de culpa — bastam dano + nexo causal + conduta (art. 37, §6º, CF, atos comissivos). SUBJETIVA: exige prova de culpa (aplicada em regra nas omissões, pela teoria da culpa do serviço).' },
      { id: 'D-DA-09-05', tipo: 'multipla_escolha', subtopico: 'Excludentes de responsabilidade', pergunta: 'São excludentes da responsabilidade civil do Estado:', alternativas: [{ id: 'A', texto: 'Culpa exclusiva da vítima, fato exclusivo de terceiro e caso fortuito ou força maior.' }, { id: 'B', texto: 'Somente a culpa exclusiva da vítima.' }, { id: 'C', texto: 'Qualquer ato do agente público.' }, { id: 'D', texto: 'A falta de dolo do agente.' }], gabarito: 'A', explicacao: 'As excludentes clássicas são: culpa EXCLUSIVA da vítima, fato EXCLUSIVO de terceiro e caso fortuito/força maior. Culpa CONCORRENTE reduz a indenização, mas não exclui. Falta de dolo não afasta a responsabilidade objetiva do Estado.' }
    ] },
    'ADM-11': { id: 'D-ADM-11', moduloId: 'ADM-11', itens: [
      { id: 'D-ADM-11-01', tipo: 'multipla_escolha', subtopico: 'Gestão de estoques', pergunta: 'O estoque mínimo que deve ser mantido para cobrir eventuais atrasos de fornecedores ou aumentos inesperados de demanda é chamado de:', alternativas: [{ id: 'A', texto: 'Estoque máximo.' }, { id: 'B', texto: 'Estoque de segurança.' }, { id: 'C', texto: 'Ponto de pedido.' }, { id: 'D', texto: 'Estoque em trânsito.' }], gabarito: 'B', explicacao: 'Estoque de SEGURANÇA: quantidade ADICIONAL mantida para cobrir variações imprevistas (atrasos, picos de demanda). PONTO DE PEDIDO é o nível que dispara nova compra; ESTOQUE MÁXIMO é o limite superior; ESTOQUE EM TRÂNSITO é mercadoria já adquirida mas ainda não recebida.' },
      { id: 'D-ADM-11-02', tipo: 'verdadeiro_falso', subtopico: 'Material de consumo x bem permanente', pergunta: 'Material de consumo, como papel e caneta, é classificado como bem permanente e registrado no patrimônio da organização.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. Material de CONSUMO (papel, caneta, grampeador) é despesa de CUSTEIO, não vai para o patrimônio. Bem PERMANENTE (computador, cadeira, veículo) tem vida útil superior a 2 anos e é registrado no patrimônio como INVESTIMENTO.' },
      { id: 'D-ADM-11-03', tipo: 'situacao', subtopico: 'Ciclo de materiais', pergunta: 'Uma prefeitura recebe 500 resmas de papel do fornecedor, confere a nota fiscal e armazena no almoxarifado. Essas etapas correspondem, no ciclo de materiais, a:', alternativas: [{ id: 'A', texto: 'Identificação de necessidade e compra.' }, { id: 'B', texto: 'Recebimento e armazenagem.' }, { id: 'C', texto: 'Distribuição e inventário.' }, { id: 'D', texto: 'Baixa patrimonial.' }], gabarito: 'B', explicacao: 'As etapas do ciclo são: identificação → compra → RECEBIMENTO (conferência) → ARMAZENAGEM → distribuição → controle → inventário. O enunciado descreve exatamente recebimento e armazenagem.' },
      { id: 'D-ADM-11-04', tipo: 'autoavaliacao', subtopico: 'Gestão de estoques', pergunta: 'Você sabe diferenciar estoque mínimo, ponto de pedido e estoque de segurança?', resposta: 'Estoque MÍNIMO: menor quantidade aceitável. Estoque de SEGURANÇA: reserva adicional para imprevistos. PONTO DE PEDIDO: nível que dispara nova compra.' },
      { id: 'D-ADM-11-05', tipo: 'multipla_escolha', subtopico: 'Patrimônio', pergunta: 'Sobre o inventário de bens patrimoniais no setor público, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'É vedado pela legislação.' }, { id: 'B', texto: 'Consiste no levantamento físico dos bens, comparando os registros contábeis com a existência real, permitindo ajustes e baixas.' }, { id: 'C', texto: 'Aplica-se apenas a bens imóveis.' }, { id: 'D', texto: 'Dispensa a participação de comissão específica.' }], gabarito: 'B', explicacao: 'O INVENTÁRIO é o levantamento físico dos bens, comparando registros com a realidade, permitindo ajustes e baixa de itens inservíveis. Aplica-se a bens móveis e imóveis. Costuma ser feito por comissão específica.' }
    ] },
    'ADM-08': { id: 'D-ADM-08', moduloId: 'ADM-08', itens: [
      { id: 'D-ADM-08-01', tipo: 'multipla_escolha', subtopico: 'Teorias da motivação', pergunta: 'A teoria que classifica as necessidades humanas em cinco níveis (fisiológicas, segurança, sociais, estima e autorrealização) é de:', alternativas: [{ id: 'A', texto: 'Herzberg.' }, { id: 'B', texto: 'Maslow.' }, { id: 'C', texto: 'McGregor.' }, { id: 'D', texto: 'Vroom.' }], gabarito: 'B', explicacao: 'MASLOW criou a hierarquia das necessidades em 5 níveis. HERZBERG: dois fatores (higiênicos x motivacionais). McGREGOR: Teoria X e Y. VROOM: teoria da expectativa.' },
      { id: 'D-ADM-08-02', tipo: 'verdadeiro_falso', subtopico: 'Herzberg', pergunta: 'Segundo Herzberg, o salário é um fator motivacional, capaz de gerar satisfação e engajamento no trabalho.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. Para Herzberg, salário é fator HIGIÊNICO — evita insatisfação, mas NÃO gera motivação. Fatores motivacionais são reconhecimento, responsabilidade, crescimento, realização.' },
      { id: 'D-ADM-08-03', tipo: 'situacao', subtopico: 'Estilos de liderança', pergunta: 'Um gestor reúne a equipe, ouve sugestões e decide em conjunto com os servidores. Esse estilo de liderança é classificado como:', alternativas: [{ id: 'A', texto: 'Autocrático.' }, { id: 'B', texto: 'Democrático.' }, { id: 'C', texto: 'Liberal (laissez-faire).' }, { id: 'D', texto: 'Paternalista.' }], gabarito: 'B', explicacao: 'Liderança DEMOCRÁTICA (participativa): decisões compartilhadas. Autocrático decide sozinho; liberal deixa a equipe à vontade, quase sem interferência.' },
      { id: 'D-ADM-08-04', tipo: 'autoavaliacao', subtopico: 'Teorias da motivação', pergunta: 'Você sabe diferenciar Maslow de Herzberg?', resposta: 'MASLOW: hierarquia de 5 necessidades (fisiológicas, segurança, sociais, estima, autorrealização). HERZBERG: dois fatores — higiênicos (evitam insatisfação) e motivacionais (geram satisfação).' },
      { id: 'D-ADM-08-05', tipo: 'multipla_escolha', subtopico: 'Estilos de liderança', pergunta: 'Sobre a liderança transformacional, é correto afirmar que:', alternativas: [{ id: 'A', texto: 'Baseia-se apenas em troca de recompensas por desempenho.' }, { id: 'B', texto: 'O líder inspira, cria visão de futuro e desenvolve as pessoas, elevando a equipe a um patamar superior.' }, { id: 'C', texto: 'É sinônimo de liderança liberal.' }, { id: 'D', texto: 'É incompatível com o serviço público.' }], gabarito: 'B', explicacao: 'Liderança TRANSFORMACIONAL: inspira, cria visão de futuro, desenvolve pessoas. Diferente da TRANSACIONAL (baseada em troca de recompensa por desempenho). Não é sinônimo de liberal (que quase não interfere).' }
    ] },
    'ADM-09': { id: 'D-ADM-09', moduloId: 'ADM-09', itens: [
      { id: 'D-ADM-09-01', tipo: 'multipla_escolha', subtopico: 'Elementos da comunicação', pergunta: 'No processo de comunicação, o retorno que o receptor dá ao emissor, confirmando o entendimento da mensagem, é chamado de:', alternativas: [{ id: 'A', texto: 'Codificação.' }, { id: 'B', texto: 'Canal.' }, { id: 'C', texto: 'Feedback.' }, { id: 'D', texto: 'Ruído.' }], gabarito: 'C', explicacao: 'FEEDBACK é o retorno do receptor ao emissor — confirma se a mensagem foi compreendida. Sem feedback, não se sabe se a comunicação foi efetiva. CODIFICAÇÃO é transformar a ideia em linguagem; CANAL é o meio; RUÍDO é interferência.' },
      { id: 'D-ADM-09-02', tipo: 'verdadeiro_falso', subtopico: 'Tipos de comunicação', pergunta: 'A comunicação ascendente ocorre quando o superior transmite ordens e instruções ao subordinado.', alternativas: [{ id: 'V', texto: 'Verdadeiro' }, { id: 'F', texto: 'Falso' }], gabarito: 'F', explicacao: 'Falso. Comunicação ASCENDENTE é do SUBORDINADO para a chefia (relatórios, sugestões). Comunicação DESCENDENTE é da chefia para o subordinado (ordens, instruções).' },
      { id: 'D-ADM-09-03', tipo: 'situacao', subtopico: 'Barreiras de comunicação', pergunta: 'Um gestor usa expressões ambíguas em um memorando, e alguns servidores interpretam de formas diferentes. A barreira de comunicação presente é:', alternativas: [{ id: 'A', texto: 'Física.' }, { id: 'B', texto: 'Fisiológica.' }, { id: 'C', texto: 'Semântica.' }, { id: 'D', texto: 'Cultural.' }], gabarito: 'C', explicacao: 'Barreira SEMÂNTICA: relacionada ao SIGNIFICADO das palavras (ambiguidade, termos técnicos, jargões). FÍSICA: ruído do ambiente. FISIOLÓGICA: problemas de audição/visão. CULTURAL: diferenças culturais.' },
