<!DOCTYPE html>
<!--
Aplicativo: Administração e Direito Administrativo para Concursos
Versão: 0.2
Fase: 2
Status: funcional
Changelog v0.2:
- Novo objeto estatico LESSONS com 4 aulas de alta prioridade
  (ADM-01, ADM-02, AP-02, DA-02)
- Nova tela "licao" no roteador
- Botao "Estudar aula" no detalhe do modulo quando houver aula
- Marcacao de aula lida no estado do usuario (aulasLidas)
- Modo professor programado com 6 acoes pre-cadastradas
- Nenhuma funcionalidade da v0.1 foi removida ou alterada
Changelog v0.1:
- Estrutura base HTML/CSS/JS em arquivo unico
- Fonte unica de verdade (AppState) + persistencia localStorage
- Navegacao por telas (Dashboard, Modulos, Detalhe, Config, Sobre)
- Catalogo estatico de modulos ADM/AP/DA com IDs permanentes
- Painel inicial, filtros por area, prioridade e versao
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN-DIR v0.2 — Administração e Direito Administrativo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface-alt: #f8fafc;
    --text: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-soft: #dbeafe;
    --success: #16a34a;
    --success-soft: #dcfce7;
    --warning: #d97706;
    --warning-soft: #fef3c7;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 6px 20px rgba(15,23,42,.10);
  }

  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    display: grid;
    grid-template-columns: 250px 1fr;
    grid-template-rows: 56px 1fr;
    grid-template-areas:
      "header header"
      "sidebar main";
    min-height: 100vh;
  }

  .app-header {
    grid-area: header;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .menu-toggle {
    display: none;
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    color: var(--text);
  }
  .menu-toggle:hover { background: var(--surface-alt); }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-weight: 700;
    font-size: 15px;
  }
  .brand .brand-sub {
    color: var(--text-muted);
    font-weight: 400;
    font-size: 12px;
  }
  .header-spacer { flex: 1; }
  .version-badge {
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
    letter-spacing: .3px;
  }

  .sidebar {
    grid-area: sidebar;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 14px 10px;
    overflow-y: auto;
  }
  .nav-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--text-muted);
    padding: 14px 12px 6px;
    font-weight: 700;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 2px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
    transition: background .12s ease;
  }
  .nav-item:hover { background: var(--surface-alt); }
  .nav-item.active {
    background: var(--primary-soft);
    color: var(--primary);
    font-weight: 600;
  }
  .nav-item .nav-icon {
    width: 18px;
    text-align: center;
    font-size: 15px;
    flex-shrink: 0;
  }

  .main {
    grid-area: main;
    padding: 26px;
    overflow-y: auto;
    max-width: 1200px;
    width: 100%;
  }

  .page-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; letter-spacing: -.3px; }
  .page-subtitle { color: var(--text-muted); margin-bottom: 22px; font-size: 14px; }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    margin: 26px 0 12px;
    letter-spacing: -.1px;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 12px;
    margin-bottom: 6px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .stat-card .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    font-weight: 600;
  }
  .stat-card .stat-value {
    font-size: 26px;
    font-weight: 700;
    margin-top: 6px;
    letter-spacing: -.5px;
  }
  .stat-card .stat-hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .filter-pill {
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    font-weight: 500;
  }
  .filter-pill:hover { background: var(--surface-alt); }
  .filter-pill.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  .module-list { display: grid; gap: 8px; }
  .module-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: border-color .12s ease, box-shadow .12s ease;
    text-align: left;
    width: 100%;
    font-family: inherit;
    color: inherit;
  }
  .module-card:hover {
    border-color: var(--primary);
    box-shadow: var(--shadow);
  }
  .module-card .mod-id {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    min-width: 62px;
  }
  .module-card .mod-info { flex: 1; min-width: 0; }
  .module-card .mod-title {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .module-card .mod-area {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .module-card .mod-badges {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-shrink: 0;
  }
  .module-card .mod-priority {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .priority-alta { background: #fee2e2; color: #b91c1c; }
  .priority-media { background: #fed7aa; color: #c2410c; }
  .priority-baixa { background: #e2e8f0; color: #475569; }

  .lesson-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--success-soft);
    color: var(--success);
    text-transform: uppercase;
    letter-spacing: .4px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    font-weight: 500;
    transition: background .12s ease;
  }
  .btn:hover { background: var(--surface-alt); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn-danger:hover { filter: brightness(.94); }
  .btn-ghost { background: transparent; }

  .notice {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .notice strong { color: var(--text); }

  .info-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 18px;
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .info-row:last-child { border-bottom: none; }
  .info-row .info-key { color: var(--text-muted); }
  .info-row .info-val { font-weight: 600; text-align: right; }

  .subtopic-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .subtopic-chip {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ===== Conteúdo de aula ===== */
  .lesson-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 12px;
  }
  .lesson-block h3 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .lesson-block h3 .lb-icon { font-size: 16px; }
  .lesson-block p { margin-bottom: 10px; font-size: 14.5px; }
  .lesson-block p:last-child { margin-bottom: 0; }
  .lesson-block ul, .lesson-block ol { padding-left: 22px; margin-bottom: 8px; }
  .lesson-block li { margin-bottom: 6px; font-size: 14.5px; }

  .lesson-block.block-objetivo { border-left: 4px solid var(--primary); }
  .lesson-block.block-pegadinha { border-left: 4px solid var(--warning); background: #fffbeb; }
  .lesson-block.block-erros { border-left: 4px solid var(--danger); background: #fef2f2; }
  .lesson-block.block-resumo { border-left: 4px solid var(--success); background: #f0fdf4; }
  .lesson-block.block-aplicacao { border-left: 4px solid #7c3aed; background: #f5f3ff; }

  .compare-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
    font-size: 14px;
  }
  .compare-table th, .compare-table td {
    text-align: left;
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .compare-table th {
    background: var(--surface-alt);
    font-weight: 700;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: .4px;
    color: var(--text-muted);
  }
  .compare-table tr:last-child td { border-bottom: none; }

  .prereq-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }
  .prereq-tag {
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .professor-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .professor-answer {
    margin-top: 14px;
    padding: 14px 16px;
    border-left: 3px solid var(--primary);
    background: var(--surface-alt);
    border-radius: 6px;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .professor-answer strong { display: block; margin-bottom: 6px; color: var(--primary); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }

  .lesson-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .lesson-toolbar .lt-left { display: flex; gap: 8px; flex-wrap: wrap; }
  .lesson-read-indicator {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--success-soft);
    color: var(--success);
  }
  .lesson-read-indicator.pending {
    background: var(--warning-soft);
    color: var(--warning);
  }

  .app-footer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  @media (max-width: 780px) {
    #app {
      grid-template-columns: 1fr;
      grid-template-areas: "header" "main";
    }
    .sidebar {
      position: fixed;
      top: 56px;
      left: 0;
      bottom: 0;
      width: 250px;
      z-index: 15;
      transform: translateX(-100%);
      transition: transform .2s ease;
      box-shadow: var(--shadow-lg);
    }
    body.sidebar-open .sidebar { transform: translateX(0); }
    .menu-toggle { display: block; }
    .main { padding: 18px; }
    .page-title { font-size: 20px; }
    .compare-table { font-size: 13px; }
    .compare-table th, .compare-table td { padding: 7px 8px; }
  }
</style>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button class="menu-toggle" data-action="toggle-sidebar" aria-label="Abrir menu">☰</button>
      <div class="brand">
        ADMIN-DIR
        <span class="brand-sub">Administração &amp; Direito Administrativo</span>
      </div>
      <div class="header-spacer"></div>

    <aside class="sidebar" id="sidebar">
      <div class="nav-section-title">Estudo</div>

        <span class="nav-icon">ℹ️</span><span>Sobre</span>
      </button>
    </aside>

    <main class="main" id="main"></main>
  </div>

  /* ============================================================
     ESTADO — fonte única de verdade
  ============================================================ */
  var AppState = null;
  var currentScreen = 'dashboard';
  var currentModuleId = null;
  var currentLessonId = null;
  var moduleFilter = 'todas';
  var professorAnswerOpen = null;   // <-- novo na v0.2

  function createDefaultState() {
    var now = new Date().toISOString();
    return {
      schemaVersion: SCHEMA_VERSION,
      appVersion: APP_VERSION,
      createdAt: now,
      updatedAt: now,
      settings: { theme: 'light' },
      modules: {},
      stats: {
        questoesRespondidas: 0,
        acertos: 0,
        erros: 0,
        flashcardsEstudados: 0,
        simuladosRealizados: 0,
        tempoEstudoMin: 0
      },
      lastScreen: 'dashboard'
    };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return createDefaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return createDefaultState();
      var base = createDefaultState();
      return {
        schemaVersion: SCHEMA_VERSION,
        appVersion: APP_VERSION,
        createdAt: parsed.createdAt || base.createdAt,
        updatedAt: parsed.updatedAt || base.updatedAt,
        settings: Object.assign({}, base.settings, parsed.settings || {}),
        modules: parsed.modules || {},
        stats: Object.assign({}, base.stats, parsed.stats || {}),
        lastScreen: parsed.lastScreen || 'dashboard'
      };
    } catch (e) {
      console.error('[ADMIN-DIR] Falha ao ler estado:', e);
      return createDefaultState();
    }
  }

  function saveState() {
    AppState.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState));
    } catch (e) {
      console.error('[ADMIN-DIR] Falha ao salvar estado:', e);
    }
  }

  function getModuleUserState(modId) {
    if (!AppState.modules[modId]) {
      AppState.modules[modId] = {
        status: 'nao_iniciado',
        aulasLidas: [],
        dominioEstimado: 0,
        ultimaAtividade: null
      };
    }
    if (!Array.isArray(AppState.modules[modId].aulasLidas)) {
      AppState.modules[modId].aulasLidas = [];
    }
    return AppState.modules[modId];
  }

  /* ============================================================
     HELPERS
  ============================================================ */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function getModule(modId) {
    for (var i = 0; i < MODULES.length; i++) {
      if (MODULES[i].id === modId) return MODULES[i];
    }
    return null;
  }
  function getLessonByModuleId(modId) {
    return LESSONS[modId] || null;
  }
  function getLessonById(lessonId) {
    for (var k in LESSONS) {
      if (LESSONS.hasOwnProperty(k) && LESSONS[k].id === lessonId) return LESSONS[k];
    }
    return null;
  }
  function formatDate(iso) {
    if (!iso) return '—';
    try {
      var d = new Date(iso);
      return d.toLocaleString('pt-BR');
    } catch (e) { return iso; }
  }

  /* ============================================================
     NAVEGAÇÃO
  ============================================================ */
  var VALID_SCREENS = ['dashboard', 'modulos', 'modulo-detalhe', 'licao', 'configuracoes', 'sobre'];

  function navigate(screen, opts) {
    opts = opts || {};
    if (VALID_SCREENS.indexOf(screen) === -1) screen = 'dashboard';
    currentScreen = screen;
    if (screen === 'modulo-detalhe') {
      currentModuleId = opts.moduleId || currentModuleId;
    }
    if (screen === 'licao') {
      currentLessonId = opts.lessonId || currentLessonId;
      if (currentLessonId) {
        var lesson = getLessonById(currentLessonId);
        if (lesson) currentModuleId = lesson.moduloId;
      }
    }
    AppState.lastScreen = screen;
    saveState();
    document.body.classList.remove('sidebar-open');
    professorAnswerOpen = null;
    render();
    var main = document.getElementById('main');
    if (main) main.scrollTop = 0;
  }

  /* ============================================================
     RENDER
  ============================================================ */
  function render() {
    renderSidebarActive();
    renderMain();
    var badge = document.getElementById('appVersionBadge');
    if (badge) badge.textContent = 'v' + APP_VERSION;
  }

  function renderSidebarActive() {
    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      var target = items[i].getAttribute('data-nav');
      var active = (target === currentScreen) ||
                   (currentScreen === 'modulo-detalhe' && target === 'modulos') ||
                   (currentScreen === 'licao' && target === 'modulos');
      items[i].classList.toggle('active', active);
    }
  }

  function renderMain() {
    var main = document.getElementById('main');
    if (!main) return;
    var html = '';
    switch (currentScreen) {
      case 'dashboard':      html = renderDashboard(); break;
      case 'modulos':        html = renderModules(); break;
      case 'modulo-detalhe': html = renderModuleDetail(); break;
      case 'licao':          html = renderLesson(); break;
      case 'configuracoes':  html = renderSettings(); break;
      case 'sobre':          html = renderAbout(); break;
      default:               html = renderDashboard();
    }
    main.innerHTML = html;
  }

  /* -------- Dashboard -------- */
  function renderDashboard() {
    var stats = AppState.stats;
    var taxa = stats.questoesRespondidas > 0
      ? Math.round((stats.acertos / stats.questoesRespondidas) * 100)
      : 0;

    var totalModulos = MODULES.length;
    var emEstudo = 0, concluidos = 0;
    for (var i = 0; i < MODULES.length; i++) {
      var st = getModuleUserState(MODULES[i].id);
      if (st.status === 'em_estudo') emEstudo++;
      if (st.status === 'concluido') concluidos++;
    }

    // Sugestão "O que estudar hoje?" — prioriza módulos de alta prioridade
    // que possuem aula cadastrada e ainda não foram concluídos.
    var sugestoes = [];
    for (var j = 0; j < MODULES.length && sugestoes.length < 3; j++) {
      var m = MODULES[j];
      if (m.prioridade !== 'alta') continue;
      if (!getLessonByModuleId(m.id)) continue;
      var ms = getModuleUserState(m.id);
      if (ms.status === 'concluido') continue;
      sugestoes.push(m);
    }
    if (sugestoes.length === 0) {
      for (var k = 0; k < MODULES.length && sugestoes.length < 3; k++) {
        if (getLessonByModuleId(MODULES[k].id)) sugestoes.push(MODULES[k]);
      }
    }

    var html = '';
    html += '<h1 class="page-title">Dashboard</h1>';
    html += '<p class="page-subtitle">Visão geral do seu progresso. Dados salvos localmente no navegador.</p>';

    html += '<div class="cards-grid">';
    html += statCard('Questões respondidas', stats.questoesRespondidas, 'Disponível nas próximas fases');
    html += statCard('Taxa de acerto', taxa + '%', 'Aguardando banco de questões');
    html += statCard('Módulos em estudo', emEstudo + ' / ' + totalModulos, concluidos + ' concluído(s)');
    html += statCard('Aulas disponíveis', Object.keys(LESSONS).length, 'Fase 2 — ' + MODULES.length + ' módulos catalogados');
    html += '</div>';

    html += '<h2 class="section-title">O que estudar hoje?</h2>';
    if (sugestoes.length === 0) {
      html += '<div class="notice"><strong>Sem sugestões ainda.</strong> Nenhuma aula cadastrada.</div>';
    } else {
      html += '<div class="module-list">';
      for (var s = 0; s < sugestoes.length; s++) {
        html += moduleCardHtml(sugestoes[s]);
      }
      html += '</div>';
    }

    html += '<h2 class="section-title">Aviso desta versão</h2>';
    html += '<div class="notice">' +
            '<strong>Fase 2 — Conteúdo pedagógico (parcial).</strong> ' +
            'Foram adicionadas 4 aulas de alta prioridade: ' +
            'ADM-01, ADM-02, AP-02 e DA-02. ' +
            'As demais aulas serão incluídas em entregas subsequentes, mediante aprovação. ' +
            'Questões, diagnóstico, flashcards, revisão e simulados permanecem previstos para as fases seguintes.' +
            '</div>';

    html += footerHtml();
    return html;
  }

  function statCard(label, value, hint) {
    return '<div class="stat-card">' +
      '<div class="stat-label">' + esc(label) + '</div>' +
      '<div class="stat-value">' + esc(value) + '</div>' +
      (hint ? '<div class="stat-hint">' + esc(hint) + '</div>' : '') +
    '</div>';
  }

  /* -------- Módulos -------- */
  function renderModules() {
    var areas = ['todas', 'ADM', 'AP', 'DA'];
    var pills = '';
    for (var i = 0; i < areas.length; i++) {
      var a = areas[i];
      var label = a === 'todas' ? 'Todos' : AREA_LABELS[a];
      var active = (moduleFilter === a) ? ' active' : '';
      pills += '<button class="filter-pill' + active + '" data-filter="' + a + '">' + esc(label) + '</button>';
    }

    var filtered = MODULES.filter(function (m) {
      return moduleFilter === 'todas' || m.area === moduleFilter;
    });

    var html = '';
    html += '<h1 class="page-title">Módulos</h1>';
    html += '<p class="page-subtitle">' + filtered.length + ' módulo(s) listado(s). IDs permanentes — o histórico do usuário é preservado mesmo quando o texto muda.</p>';
    html += '<div class="filters">' + pills + '</div>';

    if (filtered.length === 0) {
      html += '<div class="notice">Nenhum módulo nesta área.</div>';
    } else {
      html += '<div class="module-list">';
      for (var j = 0; j < filtered.length; j++) {
        html += moduleCardHtml(filtered[j]);
      }
      html += '</div>';
    }

    html += footerHtml();
    return html;
  }

  function moduleCardHtml(m) {
    var areaLabel = AREA_LABELS[m.area] || m.area;
    var pLabel = PRIORITY_LABELS[m.prioridade] || m.prioridade;
    var hasLesson = !!getLessonByModuleId(m.id);
    var badge = hasLesson ? '<span class="lesson-badge">Aula</span>' : '';
    return '<button class="module-card" data-action="open-module" data-module-id="' + esc(m.id) + '">' +
      '<span class="mod-id">' + esc(m.id) + '</span>' +
      '<span class="mod-info">' +
        '<span class="mod-title">' + esc(m.titulo) + '</span>' +
        '<span class="mod-area">' + esc(areaLabel) + '</span>' +
      '</span>' +
      '<span class="mod-badges">' +
        badge +
        '<span class="mod-priority priority-' + esc(m.prioridade) + '">' + esc(pLabel) + '</span>' +
      '</span>' +
    '</button>';
  }

  /* -------- Detalhe do módulo -------- */
  function renderModuleDetail() {
    var m = getModule(currentModuleId);
    if (!m) {
      return '<h1 class="page-title">Módulo não encontrado</h1>' +
             '<p class="page-subtitle">Volte à lista de módulos.</p>' +
             '<button class="btn" data-nav="modulos">← Voltar aos módulos</button>';
    }
    var st = getModuleUserState(m.id);
    var areaLabel = AREA_LABELS[m.area] || m.area;
    var pLabel = PRIORITY_LABELS[m.prioridade] || m.prioridade;
    var lesson = getLessonByModuleId(m.id);
    var lessonRead = lesson && (st.aulasLidas || []).indexOf(lesson.id) !== -1;

    var chips = '';
    for (var i = 0; i < m.subtopicos.length; i++) {
      chips += '<span class="subtopic-chip">' + esc(m.subtopicos[i]) + '</span>';
    }

    var html = '';
    html += '<button class="btn" data-nav="modulos" style="margin-bottom:16px;">← Voltar aos módulos</button>';
    html += '<h1 class="page-title">' + esc(m.id) + ' — ' + esc(m.titulo) + '</h1>';
    html += '<p class="page-subtitle">' + esc(areaLabel) + ' · Prioridade: ' + esc(pLabel) + '</p>';

    html += '<div class="info-list">';
    html += infoRow('Status', statusLabel(st.status));
    html += infoRow('Domínio estimado', Math.round((st.dominioEstimado || 0) * 100) + '%');
    html += infoRow('Última atividade', st.ultimaAtividade ? formatDate(st.ultimaAtividade) : '—');
    html += infoRow('Aulas lidas', (st.aulasLidas || []).length + (lesson ? ' / 1' : ' / 0'));
    html += '</div>';

    html += '<h2 class="section-title">Subtópicos</h2>';
    html += '<div class="subtopic-list">' + chips + '</div>';

    html += '<h2 class="section-title">Conteúdo pedagógico</h2>';
    if (lesson) {
      html += '<div class="lesson-block">';
      html += '<h3><span class="lb-icon">📘</span> Aula disponível: ' + esc(lesson.id) + '</h3>';
      html += '<p>' + esc(lesson.objetivo) + '</p>';
      html += '<div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">';
      html += '<button class="btn btn-primary" data-action="open-lesson" data-lesson-id="' + esc(lesson.id) + '">Estudar aula →</button>';
      html += lessonRead
        ? '<span class="lesson-read-indicator">✓ Lida</span>'
        : '<span class="lesson-read-indicator pending">Não lida</span>';
      html += '</div>';
      html += '</div>';
    } else {
      html += '<div class="notice"><strong>Em construção — Fase 2.</strong> ' +
              'Esta aula será adicionada em entrega subsequente da Fase 2, priorizando os módulos de maior prioridade.</div>';
    }

    html += footerHtml();
    return html;
  }

  function infoRow(key, value) {
    return '<div class="info-row">' +
      '<span class="info-key">' + esc(key) + '</span>' +
      '<span class="info-val">' + esc(value) + '</span>' +
    '</div>';
  }

  function statusLabel(s) {
    var map = {
      'nao_iniciado': 'Não iniciado',
      'em_estudo': 'Em estudo',
      'concluido': 'Concluído'
    };
    return map[s] || s || 'Não iniciado';
  }

  /* -------- Aula (NOVA v0.2) -------- */
  function renderLesson() {

  function renderProfessorBlock(lesson) {
    var mp = lesson.modoProfessor || {};
    var actions = [
      { key: 'explicarMaisSimples', label: 'Explique de forma mais simples' },
      { key: 'outroExemplo',        label: 'Mostre outro exemplo' },
      { key: 'compararConceitos',   label: 'Compare os conceitos' },
      { key: 'mostrarPegadinha',    label: 'Mostre uma pegadinha' },
      { key: 'comoApareceEmConcurso', label: 'Como aparece em concurso' },
      { key: 'fazerPergunta',       label: 'Faça uma pergunta sobre isso' }
    ];

    var html = '';
    html += '<div class="lesson-block">';
    html += '<h3><span class="lb-icon">🧑‍🏫</span> Modo professor (conteúdo programado)</h3>';
    html += '<p style="font-size:13px;color:var(--text-muted);">Escolha uma das ações abaixo. O conteúdo é previamente cadastrado — este app não usa IA externa.</p>';
    html += '<div class="professor-actions">';
    for (var i = 0; i < actions.length; i++) {
      var a = actions[i];
      var disabled = !mp[a.key];
      html += '<button class="btn btn-ghost" data-action="professor-answer" data-lesson-id="' + esc(lesson.id) + '" data-key="' + esc(a.key) + '"' + (disabled ? ' disabled' : '') + '>' + esc(a.label) + '</button>';
    }
    html += '</div>';

    if (professorAnswerOpen && professorAnswerOpen.lessonId === lesson.id) {
      var key = professorAnswerOpen.key;
      var content = '';
      if (key === 'fazerPergunta' && mp.fazerPergunta) {
        content = 'Pergunta: ' + mp.fazerPergunta.pergunta + '\n\nResposta: ' + mp.fazerPergunta.resposta;
      } else {
        content = mp[key] || '';
      }
      html += '<div class="professor-answer"><strong>Resposta programada</strong>' + esc(content) + '</div>';
    }

    html += '</div>';
    return html;
  }

  /* -------- Configurações -------- */
  function renderSettings() {
    var totalModulos = MODULES.length;
    var modulosComEstado = 0;
    for (var i = 0; i < MODULES.length; i++) {
      if (AppState.modules[MODULES[i].id]) modulosComEstado++;
    }
    var totalAulas = Object.keys(LESSONS).length;

    var html = '';
    html += '<h1 class="page-title">Configurações</h1>';
    html += '<p class="page-subtitle">Preferências e gestão do progresso armazenado localmente.</p>';

    html += '<h2 class="section-title">Armazenamento</h2>';
    html += '<div class="info-list">';
    html += infoRow('Chave de armazenamento', STORAGE_KEY);
    html += infoRow('Versão do schema', SCHEMA_VERSION);
    html += infoRow('Módulos catalogados', totalModulos);
    html += infoRow('Aulas cadastradas', totalAulas);
    html += infoRow('Módulos com estado', modulosComEstado);
    html += infoRow('Criado em', formatDate(AppState.createdAt));
    html += infoRow('Atualizado em', formatDate(AppState.updatedAt));
    html += '</div>';

    html += '<h2 class="section-title">Zerar progresso</h2>';
    html += '<div class="notice">Isso apaga todo o estado do usuário (módulos, estatísticas e histórico). ' +
            'A ação é irreversível e exigirá confirmação.</div>';
    html += '<p style="margin-top:12px;">' +
            '<button class="btn btn-danger" data-action="reset-progress">Zerar progresso</button>' +
            '</p>';

    html += footerHtml();
    return html;
  }

  /* -------- Sobre -------- */
  function renderAbout() {
    var html = '';
    html += '<h1 class="page-title">Sobre</h1>';
    html += '<p class="page-subtitle">Informações do aplicativo e changelog.</p>';

    html += '<h2 class="section-title">Informações</h2>';
    html += '<div class="info-list">';
    html += infoRow('Aplicativo', 'Administração, Administração Pública e Direito Administrativo');
    html += infoRow('Público-alvo', 'Concursos de nível médio (Administrativo / Assistente / Técnico)');
    html += infoRow('Versão', 'ADMIN-DIR v' + APP_VERSION);
    html += infoRow('Fase', '2 — Conteúdo pedagógico (parcial)');
    html += infoRow('Schema de dados', 'v' + SCHEMA_VERSION);
    html += infoRow('Aulas cadastradas', Object.keys(LESSONS).length + ' / ' + MODULES.length + ' módulos');
    html += infoRow('Modo', 'Offline — sem servidor ou IA externa');
    html += '</div>';

    html += '<h2 class="section-title">Changelog</h2>';
    html += '<div class="info-list">';
    html += infoRow('v0.2 — Fase 2',
      '4 aulas de alta prioridade (ADM-01, ADM-02, AP-02, DA-02); tela de aula; modo professor programado; marcação de aula lida');
    html += infoRow('v0.1 — Fase 1',
      'Estrutura base, dashboard, módulos, persistência local, navegação');
    html += '</div>';

    html += '<h2 class="section-title">Próximas entregas</h2>';
    html += '<div class="notice">' +
            'Fase 2 (continuação): novas aulas para os módulos de alta prioridade restantes. · ' +
            'Fase 3: diagnóstico · Fase 4: motor de questões · Fase 5: banco de questões · ' +
            'Fase 6: flashcards · Fase 7: revisão espaçada · Fase 8: simulados · ' +
            'Fase 9: dashboard avançado · Fase 10: auditoria final.' +
            '</div>';

    html += footerHtml();
    return html;
  }

  function footerHtml() {
    return '<div class="app-footer">' +
      '<span>ADMIN-DIR v' + esc(APP_VERSION) + ' · Fase 2</span>' +
      '<span>Offline · dados salvos neste navegador</span>' +
    '</div>';
  }

  /* ============================================================
     AÇÕES
  ============================================================ */
  function openModule(modId) {
    if (!getModule(modId)) return;
    var st = getModuleUserState(modId);
    if (st.status === 'nao_iniciado') st.status = 'em_estudo';
    st.ultimaAtividade = new Date().toISOString();
    saveState();
    navigate('modulo-detalhe', { moduleId: modId });
  }

  function openLesson(lessonId) {
    var lesson = getLessonById(lessonId);
    if (!lesson) return;
    var st = getModuleUserState(lesson.moduloId);
    if (st.status === 'nao_iniciado') st.status = 'em_estudo';
    st.ultimaAtividade = new Date().toISOString();
    saveState();
    navigate('licao', { lessonId: lessonId });
  }

  function markLessonRead(lessonId) {
    var lesson = getLessonById(lessonId);
    if (!lesson) return;
    var st = getModuleUserState(lesson.moduloId);
    if (!Array.isArray(st.aulasLidas)) st.aulasLidas = [];
    if (st.aulasLidas.indexOf(lesson.id) === -1) {
      st.aulasLidas.push(lesson.id);
    }
    st.ultimaAtividade = new Date().toISOString();
    if (st.status === 'nao_iniciado') st.status = 'em_estudo';
    saveState();
    render();
  }

  function setModuleFilter(f) {
    if (['todas', 'ADM', 'AP', 'DA'].indexOf(f) === -1) return;
    moduleFilter = f;
    render();
  }

  function toggleSidebar() {
    document.body.classList.toggle('sidebar-open');
  }

  function showProfessorAnswer(lessonId, key) {
    if (professorAnswerOpen && professorAnswerOpen.lessonId === lessonId && professorAnswerOpen.key === key) {
      professorAnswerOpen = null;
    } else {
      professorAnswerOpen = { lessonId: lessonId, key: key };
    }
    render();
    // Restaura o scroll para o bloco de resposta, se possível
    var el = document.querySelector('.professor-answer');
    if (el && el.scrollIntoView) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function resetProgress() {
    var ok = window.confirm(
      'Zerar todo o progresso?\n\n' +
      'Esta ação apaga módulos, estatísticas e histórico salvos localmente. ' +
      'Não é possível desfazer.'
    );
    if (!ok) return;
    localStorage.removeItem(STORAGE_KEY);
    AppState = createDefaultState();
    saveState();
    currentScreen = 'dashboard';
    currentModuleId = null;
    currentLessonId = null;
    moduleFilter = 'todas';
    professorAnswerOpen = null;
    render();
    window.alert('Progresso zerado.');
  }

  /* ============================================================
     EVENTOS — delegação única
  ============================================================ */
  document.addEventListener('click', function (e) {
    var navEl = e.target.closest('[data-nav]');
    if (navEl) {
      e.preventDefault();
      navigate(navEl.getAttribute('data-nav'));
      return;
    }

    var filterEl = e.target.closest('[data-filter]');
    if (filterEl) {
      e.preventDefault();
      setModuleFilter(filterEl.getAttribute('data-filter'));
      return;
    }

    var actionEl = e.target.closest('[data-action]');
    if (actionEl) {
      var action = actionEl.getAttribute('data-action');
      if (action === 'toggle-sidebar') {
        e.preventDefault();
        toggleSidebar();
        return;
      }
      if (action === 'open-module') {
        e.preventDefault();
        openModule(actionEl.getAttribute('data-module-id'));
        return;
      }
      if (action === 'open-lesson') {
        e.preventDefault();
        openLesson(actionEl.getAttribute('data-lesson-id'));
        return;
      }
      if (action === 'mark-lesson-read') {
        e.preventDefault();
        markLessonRead(actionEl.getAttribute('data-lesson-id'));
        return;
      }
      if (action === 'professor-answer') {
        e.preventDefault();
        showProfessorAnswer(
          actionEl.getAttribute('data-lesson-id'),
          actionEl.getAttribute('data-key')
        );
        return;
      }
      if (action === 'reset-progress') {
        e.preventDefault();
        resetProgress();
        return;
      }
    }
  });

  /* ============================================================
     INICIALIZAÇÃO
  ============================================================ */
  function init() {
    AppState = loadState();
    currentScreen = 'dashboard';
    currentModuleId = null;
    currentLessonId = null;
    moduleFilter = 'todas';
    professorAnswerOpen = null;
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
